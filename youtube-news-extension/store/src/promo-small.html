<!doctype html>
<!-- Store small promo tile, 440x280. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Roboto"; font-weight: 400; src: url("../../fonts/roboto-latin-400.woff2") format("woff2"); }
  @font-face { font-family: "Roboto"; font-weight: 700; src: url("../../fonts/roboto-latin-700.woff2") format("woff2"); }
  html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 36px;
    box-sizing: border-box;
    background: radial-gradient(circle at 90% 10%, rgba(255, 0, 51, 0.4), transparent 60%), #0f0f0f;
    color: #fff;
    font-family: "Roboto", Arial, sans-serif;
  }
  .row { display: flex; align-items: center; gap: 16px; }
  img { width: 84px; height: 84px; margin: -10px; }
  h1 { margin: 0; font-size: 30px; line-height: 1.1; font-weight: 700; }
  p { margin: 22px 0 0; font-size: 18px; line-height: 1.4; opacity: 0.92; }
</style>
</head>
<body>
  <div class="row">
    <img src="icon.svg" alt="">
    <h1>News Button<br>for YouTube</h1>
  </div>
  <p>Gets you back to YouTube's News page,<br>and other countries' too.</p>
</body>
</html>
