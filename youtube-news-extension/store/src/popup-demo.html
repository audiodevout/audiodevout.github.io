<!doctype html>
<!-- The real popup with a fake chrome.* API, used inside screenshot.html. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../../popup.css">
  <style>#search:focus { outline: none; }</style>
</head>
<body>
  <input id="search" type="search" placeholder="Search countries" autocomplete="off">
  <div class="columns"><span>In sidebar</span></div>
  <ul id="list"></ul>
  <footer id="footer" hidden>
    <button id="open-all" type="button"></button>
  </footer>
  <script>
    const store = { sidebar: ["", "US", "IN", "NL"], starred: ["US", "IN", "NL"] };
    window.__sent = [];
    window.chrome = {
      storage: { sync: { get: async (d) => ({ ...d, ...store }), set: async (o) => Object.assign(store, o) } },
      runtime: { sendMessage: (m) => window.__sent.push(m) },
    };
    window.close = () => { window.__closed = true; };
  </script>
  <script src="../../countries.js"></script>
  <script src="../../popup.js"></script>
</body>
</html>
