  police: 'police',
  library: 'library',
  theatre: 'museum',
  arts_centre: 'museum',
  cinema: 'museum',
};

const OTHER_BUILDINGS =
  /^(garage|garages|carport|shed|roof|hut|cabin|barn|farm_auxiliary|greenhouse|parking|service|toilets|kiosk_roof|bunker|ruins|construction|stable|cowshed|silo|storage_tank|transformer_tower|container)$/;
const HOME_BUILDINGS = /^(house|detached|semidetached_house|terrace|bungalow|farm|cabin|static_caravan|houseboat)$/;
const FLAT_BUILDINGS = /^(apartments|residential|dormitory)$/;
const SHOP_BUILDINGS = /^(commercial|retail|supermarket|kiosk|shop)$/;
const WORK_BUILDINGS = /^(office|bank)$/;
const INDUSTRY_BUILDINGS = /^(industrial|warehouse|factory|manufacture|hangar|depot)$/;

function hashTags(id) {
  return mulberry32((id * 2654435761) >>> 0);
}

// Decides what a building is, how tall, and how it looks.
function osmBuilding(tags, id, area) {
  const r = hashTags(id);
  const b = tags.building ?? 'yes';
  let kind = 'other';
  let variant = null;
  let landmark = null;
  const amenityCivic = AMENITY_CIVIC[tags.amenity];
  if (CIVIC_BUILDINGS[b] || amenityCivic || tags.tourism === 'museum') {
    kind = 'civic';
    variant = CIVIC_BUILDINGS[b] ?? amenityCivic ?? 'museum';
  } else if (tags.shop || SHOP_BUILDINGS.test(b)) {
    kind = 'business';
    variant = area > 4000 ? 'mall' : 'shop';
  } else if (tags.tourism === 'hotel' || b === 'hotel') {
    kind = 'business';
    variant = 'hotel';
  } else if (tags.office || WORK_BUILDINGS.test(b)) {
    kind = 'business';
    variant = 'office';
  } else if (INDUSTRY_BUILDINGS.test(b)) {
    kind = 'business';
    variant = 'factory';
  } else if (HOME_BUILDINGS.test(b)) {
    kind = 'house';
  } else if (FLAT_BUILDINGS.test(b)) {
    kind = area < 140 ? 'house' : 'apartment';
  } else if (OTHER_BUILDINGS.test(b) || area < 30) {
    kind = 'other';
    variant = b === 'yes' ? null : b;
  } else {
    // Plain "building=yes": mostly homes, some offices and shops.
    const roll = r();
    if (area < 160) kind = 'house';
    else if (roll < 0.68) kind = 'apartment';
    else {
      kind = 'business';
      variant = roll < 0.86 ? 'office' : 'shop';
    }
  }

  let levels = Number.parseFloat(tags['building:levels']);
  let h = Number.parseFloat(tags.height);
  const roofLevels = Number.parseFloat(tags['roof:levels']) || 0;
  if (!Number.isFinite(h)) {
    if (!Number.isFinite(levels)) {
      if (kind === 'house') levels = area < 90 ? 1 + Math.floor(r() * 2) : 2;
      else if (kind === 'other') levels = 1;
      else if (kind === 'apartment') levels = 3 + Math.floor(r() * (area > 600 ? 5 : 3));
      else if (variant === 'factory') levels = 2;
      else if (kind === 'civic') levels = 3;
      else levels = 2 + Math.floor(r() * 4);
    }
    h = levels * 3.2 + roofLevels * 2 + (kind === 'other' ? -0.4 : 0.6);
  }
  if (!Number.isFinite(levels)) levels = Math.max(1, Math.round(h / 3.2));
  h = clamp(h, 2.4, 420);

  const shape = tags['roof:shape'];
  let roofShape = 'flat';
  if (shape === 'gabled' || shape === 'hipped' || shape === 'pitched' || shape === 'gambrel' || shape === 'mansard') roofShape = 'gable';
  else if (!shape && kind === 'house' && area < 260) roofShape = 'gable';
  if (shape === 'dome' || shape === 'onion') landmark = 'dome';

  if (variant === 'church') landmark = tags.religion === 'muslim' || b === 'mosque' ? 'mosque' : shape === 'dome' ? 'dome' : 'church';
  if (variant === 'stadium' || tags.leisure === 'stadium') landmark = 'stadium';
  if (tags.man_made === 'tower' || tags['tower:type'] === 'communication') landmark = 'tower';
  if (h > 75 && !landmark) landmark = 'skyscraper';

  let wall;
  if (kind === 'house') wall = pickFrom(r, WALL_COLORS);
  else if (kind === 'apartment') wall = pickFrom(r, [0xe8dcc0, 0xd8c8b0, 0xc8a888, 0xb87858, 0xe0d8d0, 0xa8a8a8, 0xd8b890]);
  else if (variant === 'office' || landmark === 'skyscraper') wall = pickFrom(r, [0x9aa8b8, 0xb8c0c8, 0x8898a8, 0xc8c0b0, 0xa0b0c0]);
  else if (variant === 'factory') wall = pickFrom(r, [0xb0b0a8, 0x9a9a92, 0xc0b8a0, 0x8a96a0]);
  else if (kind === 'civic') wall = pickFrom(r, [0xe8e0cc, 0xd8c8a8, 0xc8b8a0, 0xb8a890, 0xa8583a]);
  else if (kind === 'business') wall = pickFrom(r, [0xf0e8d8, 0xe8d0b0, 0xd8d8e0, 0xc8b8a8]);
  else wall = pickFrom(r, [0xb0a898, 0xa09888, 0xc0b8a8]);
  wall = cssColor(tags['building:colour'], wall);
  const roofDefault = roofShape === 'gable' ? pickFrom(r, ROOF_COLORS) : pickFrom(r, [0x8a8a8a, 0x7a7a7a, 0x9a9690, 0x6a6a70]);
  const roof = cssColor(tags['roof:colour'], roofDefault);

  const name = tags.name ?? null;
  return { kind, variant, landmark, h, levels, roofShape, wallColor: wall, roofColor: roof, name };
}

const AREA_KINDS = ['water', 'park', 'pitch', 'wood', 'parking', 'plaza', 'farm', 'sand'];
const AREA_STYLE = {
  water: { color: 0x3c6cc0, y: 0.02 },
  park: { color: 0x58b048, y: 0.025 },
  pitch: { color: 0x48a848, y: 0.03 },
  wood: { color: 0x2e7a34, y: 0.025 },
  parking: { color: 0x8a8a8a, y: 0.035 },
  plaza: { color: 0xc8c0b0, y: 0.035 },
  farm: { color: 0xb8b060, y: 0.022 },
  sand: { color: 0xe0d098, y: 0.022 },
};

function osmAreaKind(tags) {
  if (tags.building) return null;
  if (tags.natural === 'water' || tags.waterway === 'riverbank' || tags.landuse === 'reservoir' || tags.landuse === 'basin' || tags.waterway === 'dock')
    return 'water';
  if (tags.leisure === 'pitch' || tags.leisure === 'track' || tags.leisure === 'golf_course') return 'pitch';
  if (/^(park|garden|playground|dog_park|common|nature_reserve)$/.test(tags.leisure ?? '')) return 'park';
  if (/^(grass|recreation_ground|village_green|meadow|cemetery|allotments|greenfield|flowerbed)$/.test(tags.landuse ?? '')) return 'park';
  if (tags.landuse === 'forest' || tags.natural === 'wood' || tags.natural === 'scrub' || tags.landuse === 'orchard') return 'wood';
  if (tags.natural === 'grassland' || tags.natural === 'heath') return 'park';
  if (tags.amenity === 'parking' && tags.parking !== 'underground' && tags.parking !== 'multi-storey') return 'parking';
  if (tags.place === 'square' || (tags.highway === 'pedestrian' && tags.area === 'yes')) return 'plaza';
  if (tags.landuse === 'farmland' || tags.landuse === 'farmyard') return 'farm';
  if (tags.natural === 'beach' || tags.natural === 'sand') return 'sand';
  return null;
}

const WATERWAY_WIDTH = { river: 24, canal: 14, stream: 4, drain: 2.5, ditch: 2 };

// ----- geometry helpers ------------------------------------------------------------

// Liang-Barsky: the part of p->q inside the square, as [t0, t1].
function clipToSquare(p, q, H) {
  let t0 = 0;
  let t1 = 1;
  const dx = q.x - p.x;
  const dz = q.z - p.z;
  const tests = [
    [-dx, p.x + H],
    [dx, H - p.x],
    [-dz, p.z + H],
    [dz, H - p.z],
  ];
  for (const [pp, qq] of tests) {
    if (pp === 0) {
      if (qq < 0) return null;
    } else {
      const t = qq / pp;
      if (pp < 0) {
        if (t > t1) return null;
        if (t > t0) t0 = t;
      } else {
        if (t < t0) return null;
        if (t < t1) t1 = t;
      }
    }
  }
  return [t0, t1];
}

// Sutherland-Hodgman against the square.
function clipPolygonToSquare(poly, H) {
  let out = poly;
  const edges = [(p) => p.x >= -H, (p) => p.x <= H, (p) => p.z >= -H, (p) => p.z <= H];
  const cut = [(a, b) => (-H - a.x) / (b.x - a.x), (a, b) => (H - a.x) / (b.x - a.x), (a, b) => (-H - a.z) / (b.z - a.z), (a, b) => (H - a.z) / (b.z - a.z)];
  for (let e = 0; e < 4; e++) {
    const input = out;
    out = [];
    if (input.length === 0) break;
    for (let i = 0; i < input.length; i++) {
      const cur = input[i];
      const prev = input[(i + input.length - 1) % input.length];
      const inCur = edges[e](cur);
      const inPrev = edges[e](prev);
      if (inCur) {
        if (!inPrev) {
          const t = cut[e](prev, cur);
          out.push({ x: prev.x + (cur.x - prev.x) * t, z: prev.z + (cur.z - prev.z) * t });
        }
        out.push(cur);
      } else if (inPrev) {
        const t = cut[e](prev, cur);
        out.push({ x: prev.x + (cur.x - prev.x) * t, z: prev.z + (cur.z - prev.z) * t });
      }
    }
  }
  return out;
}

// Joins way pieces of a multipolygon into closed rings.
function assembleRings(lines) {
  const rings = [];
  const open = lines.filter((l) => l.length >= 2).map((l) => l.slice());
  const same = (a, b) => Math.abs(a.x - b.x) < 0.01 && Math.abs(a.z - b.z) < 0.01;
  while (open.length > 0) {
    let ring = open.pop();
    let grown = true;
    while (!same(ring[0], ring[ring.length - 1]) && grown) {
      grown = false;
      for (let i = 0; i < open.length; i++) {
        const l = open[i];
        const end = ring[ring.length - 1];
        if (same(l[0], end)) ring = ring.concat(l.slice(1));
        else if (same(l[l.length - 1], end)) ring = ring.concat(l.slice().reverse().slice(1));
        else continue;
        open.splice(i, 1);
        grown = true;
        break;
      }
    }
    if (ring.length >= 4 && same(ring[0], ring[ring.length - 1])) rings.push(ring.slice(0, -1));
  }
  return rings;
}

// Polygon for a ribbon along a polyline (rivers and canals).
function ribbonPolygon(pts, half) {
  const left = [];
  const right = [];
  for (let i = 0; i < pts.length; i++) {
    const a = pts[Math.max(0, i - 1)];
    const b = pts[Math.min(pts.length - 1, i + 1)];
    const { x: tx, z: tz } = normalize2D(b.x - a.x, b.z - a.z);
    left.push({ x: pts[i].x - tz * half, z: pts[i].z + tx * half });
    right.push({ x: pts[i].x + tz * half, z: pts[i].z - tx * half });
  }
  return left.concat(right.reverse());
}

// ----- conversion --------------------------------------------------------------------

function convertOsm(data, sel, { buildings: wantBuildings = true, rails: wantRails = true, nature = true } = {}) {
  const H = sel.size / 2;
  const mx = metersPerDegLon(sel.lat);
  const proj = (g) => ({ x: (g.lon - sel.lon) * mx, z: -(g.lat - sel.lat) * M_PER_DEG_LAT });
  const inside = (p, m = 0) => Math.abs(p.x) <= H - m && Math.abs(p.z) <= H - m;

  const nodes = new Map();
  const ways = [];
  const relations = [];
  for (const el of data.elements) {
    if (el.type === 'node') nodes.set(el.id, el);
    else if (el.type === 'way') ways.push(el);
    else if (el.type === 'relation') relations.push(el);
  }
  const wayPoints = (w) => {
    const out = [];
    const ids = w.nodes ?? [];
    const geom = w.geometry ?? [];
    const n = Math.max(ids.length, geom.length);
    for (let i = 0; i < n; i++) {
      const g = geom[i] ?? nodes.get(ids[i]);
      if (!g || g.lat === undefined) return null;
      out.push({ id: ids[i] ?? `g${w.id}:${i}`, ...proj(g) });
    }
    return out;
  };

  // --- road and rail graphs ---
  function buildGraph(items, kind) {
    const uses = new Map();
    for (const item of items) {
      item.pts.forEach((p, i) => {
        const extra = i === 0 || i === item.pts.length - 1 ? 2 : 1;
        uses.set(p.id, (uses.get(p.id) ?? 0) + extra);
      });
    }
    const graphNodes = new Map();
    const nodeAt = (id, p) => {
      if (!graphNodes.has(id)) graphNodes.set(id, { id, x: p.x, z: p.z, edge: false, pieces: [] });
      return graphNodes.get(id);
    };
    let edgeCount = 0;
    const pieces = [];
    for (const item of items) {
      // Split at shared nodes.
      let start = 0;
      for (let i = 1; i < item.pts.length; i++) {
        if (i === item.pts.length - 1 || uses.get(item.pts[i].id) >= 2) {
          pieces.push({ ...item, pts: item.pts.slice(start, i + 1) });
          start = i;
        }
      }
    }
    const segs = [];
    for (const piece of pieces) {
      const pts = piece.pts;
      let cur = null;
      const finish = (endId, p) => {
        cur.pts.push(p);
        cur.b = endId;
        segs.push(cur);
        cur = null;
      };
      for (let i = 0; i < pts.length - 1; i++) {
        const p = pts[i];
        const q = pts[i + 1];
        const clip = clipToSquare(p, q, H);
        if (!clip) continue;
        const [t0, t1] = clip;
        const P = { x: p.x + (q.x - p.x) * t0, z: p.z + (q.z - p.z) * t0 };
        const Q = { x: p.x + (q.x - p.x) * t1, z: p.z + (q.z - p.z) * t1 };
        if (!cur) {
          let startId;
          if (t0 === 0 && i === 0) startId = p.id;
          else {
            startId = `e${kind}${edgeCount++}`;
            nodeAt(startId, P).edge = true;
          }
          if (t0 === 0 && i === 0) nodeAt(startId, P);
          cur = { ...piece, a: startId, pts: [P] };
        } else if (t0 > 0) {
          cur.pts.push(P);
        }
        if (t1 < 1) {
          const id = `e${kind}${edgeCount++}`;
          nodeAt(id, Q).edge = true;
          finish(id, Q);
        } else if (i === pts.length - 2) {
          nodeAt(q.id, Q);
          finish(q.id, Q);
        } else {
          cur.pts.push(Q);
        }
      }
    }

    // Merge junction nodes that sit almost on top of each other.
    const parent = new Map();
    const find = (id) => {
      while (parent.has(id) && parent.get(id) !== id) id = parent.get(id);
      return id;
    };
    const cells = new Map();
    const cellKey = (x, z) => `${Math.floor(x / 8)},${Math.floor(z / 8)}`;
    for (const n of graphNodes.values()) {
      const cx = Math.floor(n.x / 8);
      const cz = Math.floor(n.z / 8);
      for (let dx = -1; dx <= 1; dx++) {
        for (let dz = -1; dz <= 1; dz++) {
          for (const other of cells.get(`${cx + dx},${cz + dz}`) ?? []) {
            if (n.edge !== other.edge) continue;
            if (Math.hypot(n.x - other.x, n.z - other.z) < OSM.mergeDistance) parent.set(find(n.id), find(other.id));
          }
        }
      }
      const key = cellKey(n.x, n.z);
      if (!cells.has(key)) cells.set(key, []);
      cells.get(key).push(n);
    }

    const out = [];
    for (const seg of segs) {
      seg.a = find(seg.a);
      seg.b = find(seg.b);
      const A = graphNodes.get(seg.a);
      const B = graphNodes.get(seg.b);
      seg.pts[0] = { x: A.x, z: A.z };
      seg.pts[seg.pts.length - 1] = { x: B.x, z: B.z };
      const len = polylineLength(seg.pts);
      if (seg.a === seg.b) {
        if (len < 12) continue;
        // A closed loop: split it in the middle.
        const mid = Math.floor(seg.pts.length / 2);
        if (mid < 1 || mid >= seg.pts.length - 1) continue;
        const id = `m${kind}${edgeCount++}`;
        const p = seg.pts[mid];
        graphNodes.set(id, { id, x: p.x, z: p.z, edge: false, pieces: [] });
        out.push({ ...seg, b: id, pts: seg.pts.slice(0, mid + 1) });
        out.push({ ...seg, a: id, pts: seg.pts.slice(mid) });
        continue;
      }
      if (len < 1.5) continue;
      out.push(seg);
    }
    for (const seg of out) {
      seg.pts = simplifyPolyline(seg.pts, 0.35);
      seg.length = polylineLength(seg.pts);
      graphNodes.get(seg.a).pieces.push(seg);
      graphNodes.get(seg.b).pieces.push(seg);
    }

    // Heights: bridges and tunnels long enough to bother with.
    for (const seg of out) {
      if (seg.bridge && seg.length >= 28) seg.elev = 6 * clamp(seg.layer || 1, 1, 3);
      else if (seg.tunnel && seg.length >= 40) seg.elev = kind === 'rail' && seg.typeKey === 'metro' ? -12 : -10;
      else seg.elev = null;
    }
    // A chain of bridge or tunnel pieces stays up (or down) between them.
    const usedNodes = new Map();
    for (const seg of out) {
      for (const id of [seg.a, seg.b]) usedNodes.set(id, graphNodes.get(id));
    }
    const graphOut = [];
    for (const n of usedNodes.values()) {
      const elevs = n.pieces.map((s) => s.elev);
      let y = 0;
      if (elevs.length > 0 && elevs.every((e) => e !== null && e > 0)) y = Math.min(...elevs);
      else if (elevs.length > 0 && elevs.every((e) => e !== null && e < 0)) y = Math.max(...elevs);
      else if (n.edge && elevs[0] !== null) y = elevs[0];
      n.y = y;
      graphOut.push({ id: n.id, x: n.x, z: n.z, y, edge: n.edge });
    }
    return { nodes: graphOut, segs: out, graphNodes };
  }

  const roadItems = [];
  const railItems = [];
  const islands = [];
  const areas = [];
  const trees = [];
  const pois = [];
  const stations = [];
  const places = [];
  const buildingWays = [];

  for (const el of nodes.values()) {
    const t = el.tags;
    if (!t) continue;
    if (t.place === 'city' || t.place === 'town') {
      places.push({ name: t.name, x: (el.lon - sel.lon) * mx, z: -(el.lat - sel.lat) * M_PER_DEG_LAT, rank: t.place === 'city' ? 2 : 1 });
      continue;
    }
    const p = proj(el);
    if (!inside(p)) continue;
    if (t.natural === 'tree' && nature) trees.push({ x: p.x, z: p.z, kind: /needle/.test(t.leaf_type ?? '') ? 'pine' : 'leaf' });
    if (t.railway === 'station' || t.railway === 'halt' || t.public_transport === 'station') {
      if (t.name) stations.push({ x: p.x, z: p.z, name: t.name, subway: t.station === 'subway' || t.subway === 'yes' });
    }
    if (t.railway === 'subway_entrance') stations.push({ x: p.x, z: p.z, name: t.name ?? null, entrance: true, subway: true });
    if (t.name && (t.shop || t.amenity || t.tourism || t.office)) pois.push({ x: p.x, z: p.z, tags: t });
  }

  for (const w of ways) {
    const t = w.tags ?? {};
    const pts = wayPoints(w);
    if (!pts || pts.length < 2) continue;
    const closed = pts.length >= 4 && pts[0].id === pts[pts.length - 1].id;
    if (t.highway && !(t.area === 'yes')) {
      let key = osmRoadType(t);
      if (key) {
        const dir = osmOneway(t);
        if (dir !== 0 && ONEWAY_NARROWER[key]) key = ONEWAY_NARROWER[key];
        const ordered = dir === -1 ? pts.slice().reverse() : pts;
        roadItems.push({
          pts: ordered,
          typeKey: key,
          oneway: dir !== 0,
          bridge: t.bridge && t.bridge !== 'no',
          tunnel: t.tunnel && t.tunnel !== 'no' && t.tunnel !== 'building_passage',
          layer: Math.abs(Number.parseInt(t.layer, 10) || 1),
          name: t.name ?? t.ref ?? null,
          color: key === 'highway' || key === 'freeway' ? 0xffff00 : 0xffffff,
        });
        if (closed && (t.junction === 'roundabout' || t.junction === 'circular')) {
          const ring = pts.slice(0, -1);
          const c = polygonCentroid(ring);
          let r = Infinity;
          for (const p of ring) r = Math.min(r, Math.hypot(p.x - c.x, p.z - c.z));
          r -= outerHalf(ROAD_TYPES[key]) + 0.5;
          if (r > 2 && inside(c, 10)) islands.push({ x: c.x, z: c.z, r });
        }
      }
    }
    if (t.railway && wantRails) {
      const key = osmRailType(t);
      if (key) {
        const underground = key === 'metro' && (t.tunnel === 'yes' || (Number.parseInt(t.layer, 10) || 0) < 0);
        railItems.push({
          pts,
          typeKey: key,
          oneway: false,
          bridge: t.bridge && t.bridge !== 'no',
          tunnel: underground || (t.tunnel && t.tunnel !== 'no'),
          layer: Math.abs(Number.parseInt(t.layer, 10) || 1),
          name: t.name ?? null,
          color: 0xffffff,
        });
      }
    }
    if (t.building && closed && wantBuildings) buildingWays.push({ id: w.id, tags: t, ring: pts.slice(0, -1) });
    if (nature) {
      const areaKind = closed ? osmAreaKind(t) : null;
      if (areaKind) areas.push({ kind: areaKind, ring: pts.slice(0, -1) });
      else if (t.waterway && WATERWAY_WIDTH[t.waterway] && !closed && t.tunnel !== 'culvert') {
        const width = Number.parseFloat(t.width) || WATERWAY_WIDTH[t.waterway];
        areas.push({ kind: 'water', ring: ribbonPolygon(pts, width / 2), line: true });
      }
    }
  }

  for (const rel of relations) {
    const t = rel.tags ?? {};
    const lines = [];
    for (const m of rel.members ?? []) {
      if (m.type !== 'way' || (m.role && m.role !== 'outer') || !m.geometry) continue;
      const pts = m.geometry.filter(Boolean).map(proj);
      if (pts.length >= 2) lines.push(pts);
    }
    if (lines.length === 0) continue;
    const rings = assembleRings(lines);
    if (t.building && wantBuildings) {
      for (const ring of rings) buildingWays.push({ id: rel.id, tags: t, ring });
    } else if (nature) {
      const kind = osmAreaKind(t);
      if (kind) for (const ring of rings) areas.push({ kind, ring });
    }
  }

  const roads = buildGraph(roadItems, 'road');
  const rails = buildGraph(railItems, 'rail');

  // --- buildings ---
  const buildings = [];
  const cellOf = (x, z) => `${Math.floor(x / 50)},${Math.floor(z / 50)}`;
  const grid = new Map();
  for (const bw of buildingWays) {
    let ring = bw.ring.map((p) => ({ x: p.x, z: p.z }));
    ring = simplifyPolyline(ring, 0.25);
    if (ring.length < 3) continue;
    const area = Math.abs(polygonArea(ring));
    if (area < 12 || area > 250000) continue;
    const c = polygonCentroid(ring);
    if (!inside(c, 3)) continue;
    if (ring.some((p) => !inside(p, -20))) continue;
    const info = osmBuilding(bw.tags, bw.id, area);
    const b = { footprint: ring, area, ...info, seed: bw.id % 1e9 };
    buildings.push(b);
  }
  if (buildings.length > OSM.maxBuildings) {
    // Keep the landmarks and named places; thin out sheds and tiny homes.
    buildings.sort((a, b) => (b.name || b.landmark ? 1e9 : b.area) - (a.name || a.landmark ? 1e9 : a.area));
    buildings.length = OSM.maxBuildings;
  }
  for (const b of buildings) {
    const bounds = pathBounds(b.footprint);
    b.bounds = bounds;
    for (let x = Math.floor(bounds.minX / 50); x <= Math.floor(bounds.maxX / 50); x++) {
      for (let z = Math.floor(bounds.minZ / 50); z <= Math.floor(bounds.maxZ / 50); z++) {
        const key = `${x},${z}`;
        if (!grid.has(key)) grid.set(key, []);
        grid.get(key).push(b);
      }
    }
  }
  // Shops and offices mapped as points name the building they sit in.
  for (const poi of pois) {
    const list = grid.get(cellOf(poi.x, poi.z)) ?? [];
    const b = list.find((cand) => pointInPolygon(poi.x, poi.z, cand.footprint));
    if (!b) continue;
    const t = poi.tags;
    if (!b.name) b.name = t.name;
    if (b.kind === 'other' || b.kind === 'house' || b.kind === 'apartment') {
      if (t.shop || (t.amenity && /restaurant|cafe|bar|pub|fast_food|bank|pharmacy|cinema/.test(t.amenity))) {
        b.kind = 'business';
        b.variant = b.area > 4000 ? 'mall' : 'shop';
      } else if (t.office) {
        b.kind = 'business';
        b.variant = 'office';
      } else if (AMENITY_CIVIC[t.amenity]) {
        b.kind = 'civic';
        b.variant = AMENITY_CIVIC[t.amenity];
      }
    }
  }
  for (const b of buildings) {
    delete b.bounds;
    if (b.kind === 'house' || b.kind === 'apartment' || b.kind === 'other') b.name = null;
  }

  // --- parks, water and trees ---
  const mapAreas = [];
  let treeBudget = 4000 - trees.length;
  const r = mulberry32(Math.floor(sel.lat * 1e4) ^ Math.floor(sel.lon * 1e4));
  for (const a of areas) {
    const clipped = clipPolygonToSquare(a.ring, H);
    if (clipped.length < 3) continue;
    const area = Math.abs(polygonArea(clipped));
    if (area < 20) continue;
    mapAreas.push({ kind: a.kind, ring: clipped });
    const density = a.kind === 'wood' ? 1 / 140 : a.kind === 'park' ? 1 / 500 : 0;
    if (!density) continue;
    const bb = pathBounds(clipped);
    let count = Math.min(treeBudget, Math.round(area * density));
    let tries = count * 4;
    while (count > 0 && tries-- > 0) {
      const x = bb.minX + r() * (bb.maxX - bb.minX);
      const z = bb.minZ + r() * (bb.maxZ - bb.minZ);
      if (!pointInPolygon(x, z, clipped)) continue;
      trees.push({ x, z, kind: a.kind === 'wood' && r() < 0.4 ? 'pine' : 'leaf' });
      count--;
      treeBudget--;
    }
  }
  // Water first, then everything sits on top of it.
  mapAreas.sort((a, b) => AREA_STYLE[a.kind].y - AREA_STYLE[b.kind].y);

  // --- other towns at the ends of the big roads ---
  const towns = pickTowns(roads, places, H);

  let name = null;
  return {
    sel,
    roads: { nodes: roads.nodes, segs: roads.segs },
    rails: { nodes: rails.nodes, segs: rails.segs },
    islands,
    buildings,
    areas: mapAreas,
    trees,
    stations,
    towns,
    name,
  };
}

const TOWN_RANK = { highway: 6, freeway: 5, boulevard: 4, large: 3, medium: 2, small: 1, alley: 0 };

function pickTowns(roads, places, H) {
  const candidates = [];
  for (const n of roads.nodes) {
    if (!n.edge || Math.abs(n.y) > 0.5) continue;
    const seg = roads.segs.find((s) => s.a === n.id || s.b === n.id);
    if (!seg || seg.elev) continue;
    const rank = TOWN_RANK[seg.typeKey] ?? 0;
    if (rank < 1) continue;
    candidates.push({ n, seg, rank });
  }
  candidates.sort((a, b) => b.rank - a.rank);
  // Big roads first; small ones only when there's nothing bigger.
  const big = candidates.filter((c) => c.rank >= 2).length;
  const chosen = [];
  for (const c of candidates) {
    if (chosen.length >= (c.rank >= 2 ? 8 : big >= 2 ? 0 : 3)) break;
    if (chosen.some((o) => Math.hypot(o.n.x - c.n.x, o.n.z - c.n.z) < 160)) continue;
    chosen.push(c);
  }
  const usedPlaces = new Set();
  const reach = WORLD.half + 280;
  return chosen.map((c, i) => {
    const { n } = c;
    const onX = Math.abs(Math.abs(n.x) - H) < Math.abs(Math.abs(n.z) - H);
    const from = onX ? { x: Math.sign(n.x) * reach, z: n.z } : { x: n.x, z: Math.sign(n.z) * reach };
    // Name it after the real town in that direction, if there is one.
    const bearing = Math.atan2(n.x, -n.z);
    let best = null;
    let bestScore = Infinity;
    for (const p of places) {
      if (!p.name || usedPlaces.has(p.name)) continue;
      const d = Math.hypot(p.x, p.z);
      if (d < H * 1.2) continue;
      const diff = Math.abs(angleDiff(Math.atan2(p.x, -p.z), bearing));
      if (diff > 0.7) continue;
      const score = diff * 3 + d / 30000 - p.rank * 0.3;
      if (score < bestScore) {
        bestScore = score;
        best = p;
      }
    }
    let name;
    let km;
    if (best) {
      usedPlaces.add(best.name);
      name = best.name;
      km = Math.max(1, Math.round(Math.hypot(best.x, best.z) / 1000));
    } else {
      name = TOWN_NAMES[i % TOWN_NAMES.length];
      km = 8 + ((i * 7) % 30);
    }
    const type = c.seg.oneway ? (c.rank >= 5 ? 'highway' : 'large') : c.seg.typeKey;
    return { name, km, color: TOWN_COLORS[i % TOWN_COLORS.length], type, paint: c.seg.color, from, to: { x: n.x, z: n.z } };
  });
}

// ---------------------------------------------------------------------------
// The map layer: parks, water and street-name signs from an import
// ---------------------------------------------------------------------------

function createMapLayer(scene, scenery) {
  const root = new THREE.Group();
  root.name = 'map-layer';
  scene.add(root);
  const material = respectHoles(createRetroMaterial({ vertexColors: true, polygonOffset: -1 }));
  const signAtlas = createSignAtlas(32);
  const postMaterial = createRetroMaterial({ vertexColors: true });
  let data = null;

  function clear() {
    for (const child of Array.from(root.children)) {
      root.remove(child);
      child.geometry.dispose();
    }
    signAtlas.reset();
    data = null;
  }

  function buildAreas(areas) {
    const builder = createMeshBuilder();
    for (const a of areas) {
      const style = AREA_STYLE[a.kind];
      if (!style) continue;
      const c = colorRGB(style.color);
      let ring = a.ring;
      if (polygonArea(ring) > 0) ring = ring.slice().reverse();
      let tris;
      try {
        tris = THREE.ShapeUtils.triangulateShape(
          ring.map((p) => new THREE.Vector2(p.x, p.z)),
          [],
        );
      } catch {
        continue;
      }
      for (const [i, j, k] of tris) {
        const A = ring[i];
        const B = ring[j];
        const C = ring[k];
        const cross = (B.x - A.x) * (C.z - A.z) - (B.z - A.z) * (C.x - A.x);
        const pts = cross < 0 ? [A, B, C] : [A, C, B];
        builder.tri(v3(pts[0].x, style.y, pts[0].z), v3(pts[1].x, style.y, pts[1].z), v3(pts[2].x, style.y, pts[2].z), UP, c, [0, 0], [0, 0], [0, 0]);
      }
    }
    if (builder.empty) return;
    const mesh = noShadow(new THREE.Mesh(builder.build(), material));
    mesh.renderOrder = -1;
    root.add(mesh);
  }

  // Green street-name blades on posts, at one end of each named street.
  function buildStreetSigns(network) {
    const seen = new Map();
    const geos = [];
    const posts = [];
    for (const seg of network.segments.values()) {
      if (!seg.name || seg.locked || seg.path.length < 40) continue;
      if (Math.abs(network.heightAt(seg, 0)) > 0.5) continue;
      // One sign per name per neighbourhood.
      const p = pathAt(seg.path, Math.min(seg.trimA + 4, seg.path.length / 2));
      const key = seg.name;
      const near = seen.get(key) ?? [];
      if (near.some((q) => Math.hypot(q.x - p.x, q.z - p.z) < 160)) continue;
      near.push(p);
      seen.set(key, near);
      const rect = signAtlas.add(seg.name, { bg: '#1e6b3a', fg: '#ffffff' });
      if (!rect) break;
      const off = outerHalf(seg.type) + 0.8;
      const x = p.x + p.tz * off;
      const z = p.z - p.tx * off;
      const yaw = Math.atan2(p.tz, -p.tx);
      geos.push(signGeometry(rect, x, 3.1, z, yaw, 0.7));
      posts.push(modelPart(box(0.14, 3.9, 0.14), 0x6a6a6a, { position: [x, 1.95, z] }));
    }
    if (geos.length) {
      root.add(noShadow(new THREE.Mesh(mergeGeometries(geos), signAtlas.material)));
      for (const g of geos) g.dispose();
    }
    if (posts.length) root.add(new THREE.Mesh(mergeModel(posts), postMaterial));
  }

  function build(mapData, network) {
    clear();
    data = mapData;
    buildAreas(mapData.areas ?? []);
    if (mapData.trees?.length) scenery.plantTrees(mapData.trees);
    buildStreetSigns(network);
  }

  function serialize() {
    if (!data) return null;
    const r1 = (v) => Math.round(v * 10) / 10;
    return {
      sel: data.sel,
      areas: data.areas.map((a) => {
        const flat = [AREA_KINDS.indexOf(a.kind)];
        for (const p of a.ring) flat.push(r1(p.x), r1(p.z));
        return flat;
      }),
      trees: data.trees.flatMap((t) => [r1(t.x), r1(t.z), t.kind === 'pine' ? 1 : 0]),
      stations: data.stations,
    };
  }

  function load(saved, network) {
    clear();
    if (!saved) return;
    const areas = (saved.areas ?? []).map((flat) => {
      const ring = [];
      for (let i = 1; i < flat.length; i += 2) ring.push({ x: flat[i], z: flat[i + 1] });
      return { kind: AREA_KINDS[flat[0]] ?? 'park', ring };
    });
    const trees = [];
    const t = saved.trees ?? [];
    for (let i = 0; i < t.length; i += 3) trees.push({ x: t[i], z: t[i + 1], kind: t[i + 2] ? 'pine' : 'leaf' });
    scenery.clearSquare(saved.sel ? saved.sel.size / 2 + 10 : WORLD.half);
    build({ sel: saved.sel, areas, trees, stations: saved.stations ?? [] }, network);
  }

  return {
    build,
    clear,
    serialize,
    load,
    refreshSigns(network) {
      if (!data) return;
      for (const child of Array.from(root.children)) {
        if (child.material === signAtlas.material || child.material === postMaterial) {
          root.remove(child);
          child.geometry.dispose();
        }
      }
      signAtlas.reset();
      buildStreetSigns(network);
    },
    get data() {
      return data;
    },
  };
}

// ---------------------------------------------------------------------------
// The Import Map window: a little slippy map with a selection square
// ---------------------------------------------------------------------------

// "52.37, 4.89", or a link like openstreetmap.org/#map=16/52.37/4.89 or Google Maps @52.37,4.89,15z.
function parseLocation(text) {
  let m = text.match(/#map=(\d+)\/(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)/);
  if (m) return { zoom: Math.min(18, Number(m[1])), lat: Number(m[2]), lon: Number(m[3]) };
  m = text.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);
  if (m) return { lat: Number(m[1]), lon: Number(m[2]) };
  m = text.match(/^\s*(-?\d+(?:\.\d+)?)\s*[,; ]\s*(-?\d+(?:\.\d+)?)\s*$/);
  if (m && Math.abs(Number(m[1])) <= 90 && Math.abs(Number(m[2])) <= 180) return { lat: Number(m[1]), lon: Number(m[2]) };
  return null;
}

async function fetchJson(url) {
  const response = await fetch(url, { headers: { Accept: 'application/json' } });
  if (!response.ok) throw new Error(`${new URL(url).host} said ${response.status}`);
  return response.json();
}

// Place search: Nominatim first, Photon if Nominatim refuses (it often
// turns away pages opened from disk, which send no Referer).
async function geocode(q) {
  const errors = [];
  try {
    const list = await fetchJson(`${OSM.nominatim}?format=json&limit=6&q=${encodeURIComponent(q)}`);
    if (Array.isArray(list) && list.length) return list.map((r) => ({ name: r.display_name, lat: Number(r.lat), lon: Number(r.lon) }));
  } catch (error) {
    errors.push(`Nominatim: ${error.message}`);
  }
  try {
    const data = await fetchJson(`${OSM.photon}?limit=6&q=${encodeURIComponent(q)}`);
    return (data.features ?? []).map((f) => {
      const p = f.properties ?? {};
      const name = [p.name, p.street, p.city, p.state, p.country].filter((v, i, all) => v && all.indexOf(v) === i).join(', ');
      return { name: name || q, lat: f.geometry.coordinates[1], lon: f.geometry.coordinates[0] };
    });
  } catch (error) {
    errors.push(`Photon: ${error.message}`);
  }
  if (errors.length === 2) throw new Error(errors.join('; '));
  return [];
}

function lonToPx(lon, z) {
  return ((lon + 180) / 360) * 256 * 2 ** z;
}

function latToPx(lat, z) {
  const r = (lat * Math.PI) / 180;
  return ((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2) * 256 * 2 ** z;
}

function pxToLon(x, z) {
  return (x / (256 * 2 ** z)) * 360 - 180;
}

function pxToLat(y, z) {
  const n = Math.PI - (2 * Math.PI * y) / (256 * 2 ** z);
  return (180 / Math.PI) * Math.atan(Math.sinh(n));
}

function metersPerPixel(lat, z) {
  return (156543.03392 * Math.cos((lat * Math.PI) / 180)) / 2 ** z;
}

function openOsmWindow({ onImport, initial = null }) {
  const view = { lat: initial?.lat ?? OSM.start.lat, lon: initial?.lon ?? OSM.start.lon, zoom: OSM.start.zoom };
  const sel = { lat: view.lat, lon: view.lon, size: initial?.size ?? OSM.start.size };
  let busy = false;

  const dialog = openDialog({
    id: 'osm-window',
    title: 'Import Map - OpenStreetMap',
    width: 560,
    body: `
      <div class="osm-search">
        <label for="osm-q">Find:</label>
        <input id="osm-q" class="win-input" type="text" placeholder="A place name, or coordinates like 52.373, 4.892" autocomplete="off">
        <button type="button" class="win-btn" data-osm="search">Search</button>
      </div>
      <div class="osm-results bevel-in" id="osm-results" hidden></div>
      <div class="osm-map bevel-in" id="osm-map">
        <div class="osm-tiles" id="osm-tiles"></div>
        <div class="osm-shade" id="osm-shade"></div>
        <div class="osm-sel" id="osm-sel">
          <span class="osm-sel-label" id="osm-sel-label"></span>
          <i data-h="nw"></i><i data-h="ne"></i><i data-h="sw"></i><i data-h="se"></i>
        </div>
        <div class="osm-zoom">
          <button type="button" class="win-btn" data-osm="in">+</button>
          <button type="button" class="win-btn" data-osm="out">-</button>
        </div>
        <div class="osm-credit">${OSM.attribution}</div>
      </div>
      <div class="osm-options">
        <label class="win-check"><input type="checkbox" id="osm-buildings" checked><span>Buildings</span></label>
        <label class="win-check"><input type="checkbox" id="osm-rails" checked><span>Railways and metro</span></label>
        <label class="win-check"><input type="checkbox" id="osm-nature" checked><span>Parks, water and trees</span></label>
        <label class="win-check"><input type="checkbox" id="osm-grow"><span>Keep growing</span></label>
      </div>
      <div class="osm-status bevel-in" id="osm-status">Drag the square over the area you want. Drag its corners to resize it.</div>
      <div class="dlg-buttons">
        <button type="button" class="win-btn" data-osm="file">Open File...</button>
        <span class="osm-spacer"></span>
        <button type="button" class="win-btn" data-osm="import"><u>I</u>mport</button>
        <button type="button" class="win-btn" data-osm="cancel">Cancel</button>
      </div>
      <input type="file" id="osm-file" accept=".osm,.xml,.json" hidden>`,
  });
  const el = dialog.el;
  const map = el.querySelector('#osm-map');
  const tilesEl = el.querySelector('#osm-tiles');
  const selEl = el.querySelector('#osm-sel');
  const shade = el.querySelector('#osm-shade');
  const label = el.querySelector('#osm-sel-label');
  const status = el.querySelector('#osm-status');
  const results = el.querySelector('#osm-results');
  const tiles = new Map();

  const setStatus = (text) => {
    status.textContent = text;
  };

  function size() {
    return { w: map.clientWidth, h: map.clientHeight };
  }

  function render() {
    const { w, h } = size();
    const z = view.zoom;
    const cx = lonToPx(view.lon, z);
    const cy = latToPx(view.lat, z);
    const x0 = cx - w / 2;
    const y0 = cy - h / 2;
    const n = 2 ** z;
    const keep = new Set();
    for (let ty = Math.floor(y0 / 256); ty <= Math.floor((y0 + h) / 256); ty++) {
      if (ty < 0 || ty >= n) continue;
      for (let tx = Math.floor(x0 / 256); tx <= Math.floor((x0 + w) / 256); tx++) {
        const wx = ((tx % n) + n) % n;
        const key = `${z}/${wx}/${ty}`;
        keep.add(key);
        let img = tiles.get(key);
        if (!img) {
          img = document.createElement('img');
          img.alt = '';
          img.draggable = false;
          img.onerror = () => {
            if (!img.dataset.fallback) {
              img.dataset.fallback = '1';
              img.src = OSM.tilesFallback.replace('{z}', z).replace('{x}', wx).replace('{y}', ty);
            } else img.style.visibility = 'hidden';
          };
          img.src = OSM.tiles
            .replace('{s}', 'abcd'[(wx + ty) % 4])
            .replace('{z}', z)
            .replace('{x}', wx)
            .replace('{y}', ty);
          tiles.set(key, img);
          tilesEl.appendChild(img);
        }
        img.style.left = `${Math.round(tx * 256 - x0)}px`;
        img.style.top = `${Math.round(ty * 256 - y0)}px`;
      }
    }
    for (const [key, img] of tiles) {
      if (!keep.has(key)) {
        img.remove();
        tiles.delete(key);
      }
    }
    // Selection square.
    const sx = lonToPx(sel.lon, z) - x0;
    const sy = latToPx(sel.lat, z) - y0;
    const side = sel.size / metersPerPixel(sel.lat, z);
    selEl.style.left = `${Math.round(sx - side / 2)}px`;
    selEl.style.top = `${Math.round(sy - side / 2)}px`;
    selEl.style.width = `${Math.round(side)}px`;
    selEl.style.height = `${Math.round(side)}px`;
    shade.style.clipPath = `polygon(0 0, 100% 0, 100% 100%, 0 100%, 0 0, ${sx - side / 2}px ${sy - side / 2}px, ${sx - side / 2}px ${sy + side / 2}px, ${sx + side / 2}px ${sy + side / 2}px, ${sx + side / 2}px ${sy - side / 2}px, ${sx - side / 2}px ${sy - side / 2}px)`;
    const km = (sel.size / 1000).toFixed(2);
    label.textContent = `${km} x ${km} km`;
  }

  function zoomBy(delta, ax, ay) {
    const z0 = view.zoom;
    const z1 = clamp(z0 + delta, 3, 18);
    if (z1 === z0) return;
    const { w, h } = size();
    const px = ax ?? w / 2;
    const py = ay ?? h / 2;
    // Keep the point under the cursor in place.
    const wx = lonToPx(view.lon, z0) - w / 2 + px;
    const wy = latToPx(view.lat, z0) - h / 2 + py;
    const lon = pxToLon(wx, z0);
    const lat = pxToLat(wy, z0);
    view.zoom = z1;
    view.lon = pxToLon(lonToPx(lon, z1) - px + w / 2, z1);
    view.lat = pxToLat(latToPx(lat, z1) - py + h / 2, z1);
    render();
  }

  // Dragging: the square moves, its corners resize it, the rest pans.
  let drag = null;
  map.addEventListener('pointerdown', (event) => {
    if (busy || event.button !== 0 || event.target.closest('.osm-zoom')) return;
    const rect = map.getBoundingClientRect();
    const handle = event.target.dataset?.h;
    const onSel = event.target === selEl || event.target.parentElement === selEl;
    drag = {
      mode: handle ? 'resize' : onSel ? 'move' : 'pan',
      handle,
      x: event.clientX,
      y: event.clientY,
      rect,
      view: { ...view },
      sel: { ...sel },
    };
    map.setPointerCapture(event.pointerId);
    event.preventDefault();
  });
  map.addEventListener('pointermove', (event) => {
    if (!drag) return;
    const z = view.zoom;
    const dx = event.clientX - drag.x;
    const dy = event.clientY - drag.y;
    if (drag.mode === 'pan') {
      view.lon = pxToLon(lonToPx(drag.view.lon, z) - dx, z);
      view.lat = pxToLat(latToPx(drag.view.lat, z) - dy, z);
    } else if (drag.mode === 'move') {
      sel.lon = pxToLon(lonToPx(drag.sel.lon, z) + dx, z);
      sel.lat = pxToLat(latToPx(drag.sel.lat, z) + dy, z);
    } else {
      // The opposite corner stays put; the square stays square.
      const mpp = metersPerPixel(drag.sel.lat, z);
      const half = drag.sel.size / mpp / 2;
      const sx = drag.handle.includes('e') ? 1 : -1;
      const sy = drag.handle.includes('s') ? 1 : -1;
      const cx = lonToPx(drag.sel.lon, z);
      const cy = latToPx(drag.sel.lat, z);
      const ox = cx - sx * half;
      const oy = cy - sy * half;
      const px = cx + sx * half + dx;
      const py = cy + sy * half + dy;
      let side = Math.max(sx * (px - ox), sy * (py - oy));
      side = clamp(side * mpp, OSM.minSize, OSM.maxSize) / mpp;
      sel.size = side * mpp;
      sel.lon = pxToLon(ox + (sx * side) / 2, z);
      sel.lat = pxToLat(oy + (sy * side) / 2, z);
    }
    render();
  });
  const endDrag = () => {
    drag = null;
  };
  map.addEventListener('pointerup', endDrag);
  map.addEventListener('pointercancel', endDrag);
  map.addEventListener(
    'wheel',
    (event) => {
      event.preventDefault();
      const rect = map.getBoundingClientRect();
      zoomBy(event.deltaY < 0 ? 1 : -1, event.clientX - rect.left, event.clientY - rect.top);
    },
    { passive: false },
  );

  function centerOn(lat, lon, zoom = null) {
    view.lat = lat;
    view.lon = lon;
    sel.lat = lat;
    sel.lon = lon;
    if (zoom !== null) view.zoom = zoom;
    // Fit the square comfortably in view.
    const { w, h } = size();
    while (view.zoom > 3 && sel.size / metersPerPixel(lat, view.zoom) > Math.min(w, h) * 0.8) view.zoom--;
    render();
  }

  async function search() {
    const q = el.querySelector('#osm-q').value.trim();
    if (!q || busy) return;
    results.hidden = true;
    // Coordinates or an openstreetmap.org link go straight there.
    const direct = parseLocation(q);
    if (direct) {
      centerOn(direct.lat, direct.lon, direct.zoom ?? 16);
      setStatus(`Moved to ${direct.lat.toFixed(5)}, ${direct.lon.toFixed(5)}. Drag the square to fine-tune.`);
      return;
    }
    setStatus(`Searching for "${q}"...`);
    let list;
    try {
      list = await geocode(q);
    } catch (error) {
      console.error('Road Paint search:', error);
      setStatus(`Search failed (${error.message}). You can paste coordinates like 52.373, 4.892 or an openstreetmap.org link instead.`);
      return;
    }
    if (list.length === 0) {
      setStatus('Nothing found. Try another name, or paste coordinates.');
      return;
    }
    results.innerHTML = list.map((r, i) => `<button type="button" data-result="${i}">${escapeHtml(r.name)}</button>`).join('');
    results.hidden = false;
    for (const button of results.querySelectorAll('[data-result]')) {
      button.addEventListener('click', () => {
        const r = list[Number(button.dataset.result)];
        results.hidden = true;
        centerOn(r.lat, r.lon, 16);
        setStatus(`${r.name.split(',').slice(0, 2).join(',')}. Drag the square to fine-tune.`);
      });
    }
    setStatus(`${list.length} places found. Pick one.`);
  }

  function options() {
    return {
      buildings: el.querySelector('#osm-buildings').checked,
      rails: el.querySelector('#osm-rails').checked,
      nature: el.querySelector('#osm-nature').checked,
      grow: el.querySelector('#osm-grow').checked,
    };
  }

  function setBusy(value) {
    busy = value;
    for (const button of el.querySelectorAll('button')) if (button.dataset.osm !== 'cancel') button.disabled = value;
    el.classList.toggle('osm-busy', value);
  }

  async function finish(data, area, placeName) {
    // Cancelled while downloading.
    if (!el.isConnected) return;
    setStatus('Building the city...');
    await new Promise((resolve) => setTimeout(resolve, 30));
    const opts = options();
    const result = convertOsm(data, area, opts);
    result.name = placeName;
    result.grow = opts.grow;
    const count = result.roads.segs.length + result.buildings.length;
    if (count === 0) {
      setStatus('No roads or buildings in that square. Try somewhere else.');
      setBusy(false);
      return;
    }
    setStatus(`Placing ${result.roads.segs.length} roads, ${result.rails.segs.length} tracks and ${result.buildings.length} buildings...`);
    await new Promise((resolve) => setTimeout(resolve, 30));
    try {
      onImport(result);
      dialog.close();
    } catch (error) {
      console.error(error);
      setStatus(`Import failed: ${error.message}`);
      setBusy(false);
    }
  }

  async function runImport() {
    if (busy) return;
    setBusy(true);
    try {
      const area = { ...sel };
      const data = await fetchOsm(area, setStatus);
      const q = el.querySelector('#osm-q').value.trim();
      await finish(data, area, q ? q.split(',')[0] : null);
    } catch (error) {
      setStatus(`Download failed (${error.message}). You can also load a .osm file saved from openstreetmap.org.`);
      setBusy(false);
    }
  }

  const fileInput = el.querySelector('#osm-file');
  fileInput.addEventListener('change', async () => {
    const file = fileInput.files?.[0];
    fileInput.value = '';
    if (!file) return;
    setBusy(true);
    try {
      setStatus(`Reading ${file.name}...`);
      const text = await file.text();
      let data;
      let area = null;
      if (text.trimStart().startsWith('{')) data = JSON.parse(text);
      else {
        data = parseOsmXml(text);
        if (data.center) area = { lat: data.center.lat, lon: data.center.lon, size: clamp(data.center.size, OSM.minSize, OSM.maxSize) };
      }
      area = area ?? dataSelection(data);
      if (!area) throw new Error('No map data in that file');
      await finish(data, area, file.name.replace(/\.[^.]+$/, ''));
    } catch (error) {
      setStatus(`Could not read that file: ${error.message}`);
      setBusy(false);
    }
  });

  el.addEventListener('click', (event) => {
    const action = event.target.closest('[data-osm]')?.dataset.osm;
    if (action === 'in') zoomBy(1);
    else if (action === 'out') zoomBy(-1);
    else if (action === 'search') search();
    else if (action === 'import') runImport();
    else if (action === 'file') fileInput.click();
    else if (action === 'cancel') dialog.close();
  });
  el.querySelector('#osm-q').addEventListener('keydown', (event) => {
    if (event.key === 'Enter') search();
  });

  render();
  centerOn(sel.lat, sel.lon);
  el.querySelector('#osm-q').focus();
  return { el, close: dialog.close, sel, view, render };
}
