<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#008080">
  <title>Road Paint 98</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <style>
:root {
  --win-face: #c0c0c0;
  --win-face-light: #dfdfdf;
  --win-hilite: #ffffff;
  --win-shadow: #808080;
  --win-dark: #000000;
  --win-title: #000080;
  --win-title-text: #ffffff;
  --win-text: #000000;
  --win-desktop: #008080;
  --statusbar-h: 22px;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  min-height: 100%;
  overflow: hidden;
  background: var(--win-desktop);
  font-family: 'MS Sans Serif', 'Tahoma', 'Segoe UI', sans-serif;
  font-size: 11px;
}

#game {
  position: fixed;
  display: block;
  touch-action: none;
  cursor: crosshair;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  background: #000;
}

#game[data-tool='hand'] {
  cursor: grab;
}

#game[data-tool='hand']:active {
  cursor: grabbing;
}

#game[data-tool='magnifier'] {
  cursor: zoom-in;
}

#game[data-tool='picker'],
#game[data-tool='fill'] {
  cursor: copy;
}

.bevel-out {
  border-top: 2px solid var(--win-hilite);
  border-left: 2px solid var(--win-hilite);
  border-right: 2px solid var(--win-dark);
  border-bottom: 2px solid var(--win-dark);
  box-shadow: inset 1px 1px 0 var(--win-face-light), inset -1px -1px 0 var(--win-shadow);
}

.bevel-in {
  border-top: 1px solid var(--win-shadow);
  border-left: 1px solid var(--win-shadow);
  border-right: 1px solid var(--win-hilite);
  border-bottom: 1px solid var(--win-hilite);
  box-shadow: inset 1px 1px 0 var(--win-dark), inset -1px -1px 0 var(--win-face-light);
}

.bevel-in-soft {
  border-top: 1px solid var(--win-shadow);
  border-left: 1px solid var(--win-shadow);
  border-right: 1px solid var(--win-hilite);
  border-bottom: 1px solid var(--win-hilite);
}

#error {
  position: fixed;
  left: max(10px, env(safe-area-inset-left));
  top: max(10px, env(safe-area-inset-top));
  z-index: 3000;
  max-width: min(420px, calc(100vw - 32px));
  padding: 8px 10px;
  background: var(--win-face);
  color: #800000;
  line-height: 1.3;
  border-top: 2px solid var(--win-hilite);
  border-left: 2px solid var(--win-hilite);
  border-right: 2px solid var(--win-dark);
  border-bottom: 2px solid var(--win-dark);
}

/* Windows */

.win-window {
  position: fixed;
  box-sizing: border-box;
  background: var(--win-face);
  color: var(--win-text);
  user-select: none;
  padding: 2px;
  border-top: 2px solid var(--win-face-light);
  border-left: 2px solid var(--win-face-light);
  border-right: 2px solid var(--win-dark);
  border-bottom: 2px solid var(--win-dark);
  box-shadow: inset 1px 1px 0 var(--win-hilite), inset -1px -1px 0 var(--win-shadow);
}

.win-window.win-dragging {
  z-index: 2500 !important;
}

#paint-panel {
  top: max(12px, env(safe-area-inset-top));
  right: max(12px, env(safe-area-inset-right));
  width: 248px;
  max-width: calc(100vw - 24px);
  max-height: calc(100vh - var(--statusbar-h) - 24px);
  max-height: calc(100dvh - var(--statusbar-h) - 24px);
  z-index: 10;
}

#paint-panel.paint-panel-minimized {
  top: auto !important;
  bottom: calc(var(--statusbar-h) + 8px);
  width: 200px;
}

#paint-panel.paint-panel-minimized .win-body,
#paint-panel.paint-panel-minimized .win-menubar {
  display: none;
}

#paint-panel.paint-panel-minimized .win-titlebar {
  cursor: pointer;
}

.win-titlebar {
  display: flex;
  align-items: center;
  gap: 4px;
  height: 18px;
  padding: 0 2px;
  background: linear-gradient(90deg, #000080, #1084d0);
  color: var(--win-title-text);
  cursor: move;
  touch-action: none;
}

.win-titlebar-icon {
  width: 14px;
  height: 14px;
  background: repeating-linear-gradient(45deg, #ff0000 0 3px, #ffff00 3px 6px);
  border: 1px solid #000;
  flex: 0 0 auto;
  box-sizing: border-box;
}

.win-titlebar-text {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.02em;
  white-space: nowrap;
}

.win-titlebar-buttons {
  display: flex;
  gap: 2px;
}

.win-tb-btn {
  width: 16px;
  height: 14px;
  padding: 0;
  font-size: 10px;
  font-weight: 700;
  line-height: 1;
  background: var(--win-face);
  color: #000;
  cursor: default;
  border-top: 1px solid var(--win-hilite);
  border-left: 1px solid var(--win-hilite);
  border-right: 1px solid var(--win-dark);
  border-bottom: 1px solid var(--win-dark);
}

.win-tb-btn:active {
  border-top: 1px solid var(--win-dark);
  border-left: 1px solid var(--win-dark);
  border-right: 1px solid var(--win-hilite);
  border-bottom: 1px solid var(--win-hilite);
}

#paint-panel.erasing .win-titlebar {
  background: linear-gradient(90deg, #800000, #d05050);
}

/* Menus */

.win-menubar {
  display: flex;
  gap: 0;
  padding: 1px 0;
}

.menu {
  position: relative;
}

.menu-label {
  padding: 2px 6px;
  border: 0;
  background: transparent;
  color: #000;
  font: inherit;
  cursor: default;
}

.menu.open .menu-label,
.menu-label:focus-visible {
  background: var(--win-title);
  color: #fff;
  outline: none;
}

.menu-list {
  display: none;
  position: absolute;
  left: 0;
  top: 100%;
  z-index: 50;
  min-width: 190px;
  padding: 2px;
  background: var(--win-face);
  border-top: 2px solid var(--win-face-light);
  border-left: 2px solid var(--win-face-light);
  border-right: 2px solid var(--win-dark);
  border-bottom: 2px solid var(--win-dark);
  box-shadow: inset -1px -1px 0 var(--win-shadow);
}

.menu.open .menu-list {
  display: block;
}

.menu-list button {
  display: flex;
  justify-content: space-between;
  gap: 18px;
  width: 100%;
  padding: 3px 8px 3px 18px;
  border: 0;
  background: transparent;
  color: #000;
  font: inherit;
  text-align: left;
  cursor: default;
  position: relative;
}

.menu-list button:hover,
.menu-list button:focus-visible {
  background: var(--win-title);
  color: #fff;
  outline: none;
}

.menu-list button.checked::before {
  content: '\2713';
  position: absolute;
  left: 5px;
}

.menu-sep {
  height: 0;
  margin: 3px 1px;
  border-top: 1px solid var(--win-shadow);
  border-bottom: 1px solid var(--win-hilite);
}

/* Paint window body */

.win-body {
  padding: 4px;
  box-sizing: border-box;
  max-height: calc(100vh - var(--statusbar-h) - 80px);
  max-height: calc(100dvh - var(--statusbar-h) - 80px);
  overflow-x: hidden;
  overflow-y: auto;
  overscroll-behavior: contain;
}

.paint-row {
  display: flex;
  gap: 6px;
  align-items: flex-start;
}

.toolbox {
  display: grid;
  grid-template-columns: repeat(2, 26px);
  gap: 0;
  padding: 1px;
}

.tool-btn {
  display: grid;
  place-items: center;
  width: 26px;
  height: 26px;
  padding: 0;
  background: var(--win-face);
  cursor: pointer;
  border-top: 1px solid var(--win-hilite);
  border-left: 1px solid var(--win-hilite);
  border-right: 1px solid var(--win-dark);
  border-bottom: 1px solid var(--win-dark);
  box-shadow: inset -1px -1px 0 var(--win-shadow);
}

.tool-btn img {
  width: 16px;
  height: 16px;
  image-rendering: pixelated;
  pointer-events: none;
}

.tool-btn.active {
  border-top: 1px solid var(--win-dark);
  border-left: 1px solid var(--win-dark);
  border-right: 1px solid var(--win-hilite);
  border-bottom: 1px solid var(--win-hilite);
  box-shadow: inset 1px 1px 0 var(--win-shadow);
  background: repeating-conic-gradient(#ffffff 0% 25%, #c0c0c0 0% 50%) 50% / 2px 2px;
}

.size-box {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 3px;
  background: var(--win-face);
}

.size-btn {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 1px;
  padding: 2px 6px;
  border: 0;
  background: transparent;
  font: inherit;
  color: #000;
  cursor: pointer;
  text-align: left;
}

.size-btn.active {
  background: var(--win-title);
  color: #fff;
}

.size-line {
  display: block;
  background: #555;
  border-top: 1px solid #222;
  border-bottom: 1px solid #222;
  background-image: repeating-linear-gradient(90deg, #ffff00 0 4px, transparent 4px 8px);
  background-size: 100% 1px;
  background-repeat: no-repeat;
  background-position: 0 50%;
}

.size-small {
  height: 5px;
}

.size-medium {
  height: 8px;
  border-top: 2px solid #c8c8c8;
  border-bottom: 2px solid #c8c8c8;
}

.size-large {
  height: 13px;
  border-top: 2px solid #c8c8c8;
  border-bottom: 2px solid #c8c8c8;
}

.size-alley {
  height: 3px;
  background-image: none;
}

.size-boulevard {
  height: 17px;
  border-top: 2px solid #c8c8c8;
  border-bottom: 2px solid #c8c8c8;
  background-color: #555;
  background-image: linear-gradient(transparent 42%, #3a7d3c 42% 58%, transparent 58%);
  background-size: 100% 100%;
}

.size-highway {
  height: 12px;
  border-top: 1px solid #fff;
  border-bottom: 1px solid #fff;
  background-image: repeating-linear-gradient(90deg, #ffffff 0 4px, transparent 4px 8px);
}

.size-rail,
.size-metro {
  height: 6px;
  background-color: #9a8c7c;
  border-top: 1px solid #c8c8c8;
  border-bottom: 1px solid #c8c8c8;
  background-image: repeating-linear-gradient(90deg, #5b3a1a 0 2px, transparent 2px 5px);
  background-size: auto;
}

.size-metro {
  background-image: repeating-linear-gradient(90deg, #2050c0 0 7px, transparent 7px 11px);
}

.size-label {
  font-size: 10px;
}

.brush-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  margin-top: 5px;
}

.win-btn.brush-toggle {
  min-width: 0;
  height: 21px;
  padding: 0 6px;
  font-size: 11px;
}

.win-btn.brush-toggle.active {
  border-top: 1px solid var(--win-dark);
  border-left: 1px solid var(--win-dark);
  border-right: 1px solid var(--win-hilite);
  border-bottom: 1px solid var(--win-hilite);
  box-shadow: inset 1px 1px 0 var(--win-shadow);
  background: repeating-conic-gradient(#ffffff 0% 25%, #c0c0c0 0% 50%) 50% / 2px 2px;
}

.brush-toggle:disabled {
  color: var(--win-shadow);
  text-shadow: 1px 1px 0 var(--win-hilite);
}

.height-ctl {
  display: inline-flex;
  align-items: center;
  gap: 2px;
}

.win-btn.height-btn {
  min-width: 0;
  width: 20px;
  height: 21px;
  padding: 0;
  font-size: 9px;
}

.height-val {
  min-width: 96px;
  padding: 2px 4px;
  background: #fff;
  font-size: 11px;
  text-align: center;
}

.colorbox {
  display: flex;
  gap: 4px;
  align-items: center;
  margin-top: 6px;
}

.color-current {
  position: relative;
  flex: 0 0 auto;
  width: 30px;
  height: 30px;
  background: var(--win-face);
  background-image: repeating-conic-gradient(#ffffff 0% 25%, #c0c0c0 0% 50%);
  background-size: 2px 2px;
}

.color-fg,
.color-bg {
  position: absolute;
  width: 14px;
  height: 14px;
  border-top: 1px solid var(--win-shadow);
  border-left: 1px solid var(--win-shadow);
  border-right: 1px solid var(--win-hilite);
  border-bottom: 1px solid var(--win-hilite);
  box-shadow: inset 1px 1px 0 #000;
}

.color-fg {
  left: 4px;
  top: 4px;
  z-index: 1;
}

.color-bg {
  right: 3px;
  bottom: 3px;
}

.swatches {
  flex: 1 1 auto;
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 0;
}

.swatch {
  width: 100%;
  aspect-ratio: 1;
  padding: 0;
  cursor: pointer;
  border-top: 1px solid var(--win-shadow);
  border-left: 1px solid var(--win-shadow);
  border-right: 1px solid var(--win-hilite);
  border-bottom: 1px solid var(--win-hilite);
  box-shadow: inset 1px 1px 0 #000;
}

.swatch.active {
  outline: 1px dotted #000;
  outline-offset: 1px;
  position: relative;
  z-index: 1;
}

.paint-hint {
  margin-top: 5px;
  color: #404040;
  font-size: 10px;
  line-height: 1.3;
}

.hidden-color {
  position: absolute;
  width: 0;
  height: 0;
  padding: 0;
  border: 0;
  opacity: 0;
  pointer-events: none;
}

/* Status bar */

#statusbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 20;
  display: flex;
  gap: 2px;
  height: var(--statusbar-h);
  padding: 2px;
  padding-bottom: max(2px, env(safe-area-inset-bottom));
  box-sizing: border-box;
  background: var(--win-face);
  border-top: 1px solid var(--win-hilite);
  user-select: none;
}

.sb-cell {
  display: flex;
  align-items: center;
  padding: 0 4px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  border-top: 1px solid var(--win-shadow);
  border-left: 1px solid var(--win-shadow);
  border-right: 1px solid var(--win-hilite);
  border-bottom: 1px solid var(--win-hilite);
}

.sb-help {
  flex: 1 1 auto;
  min-width: 0;
}

.sb-small {
  flex: 0 0 auto;
  min-width: 64px;
  justify-content: flex-end;
}

/* Tooltip */

#road-tip {
  position: fixed;
  z-index: 3000;
  padding: 1px 4px;
  background: #ffffe1;
  color: #000;
  border: 1px solid #000;
  pointer-events: none;
  white-space: nowrap;
}

/* Dialogs */

.win-dialog {
  z-index: 2000;
  max-width: calc(100vw - 16px);
}

.win-dialog .win-titlebar {
  height: 18px;
}

.win-dialog-body {
  padding: 8px;
}

.win-tabs {
  display: flex;
  gap: 0;
  margin-bottom: -1px;
}

.win-tab {
  padding: 3px 8px;
  background: var(--win-face);
  border-top: 1px solid var(--win-hilite);
  border-left: 1px solid var(--win-hilite);
  border-right: 1px solid var(--win-dark);
  border-top-left-radius: 3px;
  border-top-right-radius: 3px;
  color: #000;
}

.win-tab.active {
  position: relative;
  z-index: 1;
  padding-bottom: 5px;
  margin-top: -2px;
}

.win-tabpanel {
  padding: 8px;
  border-top: 1px solid var(--win-hilite);
  border-left: 1px solid var(--win-hilite);
  border-right: 1px solid var(--win-dark);
  border-bottom: 1px solid var(--win-dark);
}

.dp-monitor {
  width: 150px;
  margin: 2px auto 10px;
}

.dp-screen {
  position: relative;
  height: 86px;
  padding: 0;
  overflow: hidden;
  background: var(--win-desktop);
  border: 8px solid #d4d0c8;
  border-bottom-width: 12px;
  box-shadow: 1px 1px 0 #404040, inset 1px 1px 0 #404040;
}

.dp-screen::before {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 50%;
  background: linear-gradient(#3c78c8, #c4d8ec);
}

.dp-screen::after {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 50%;
  background: #4a8030;
}

.dp-screen-road {
  position: absolute;
  z-index: 1;
  left: 46%;
  bottom: 0;
  width: 18px;
  height: 50%;
  background: #555;
  transform: perspective(60px) rotateX(40deg);
  transform-origin: bottom;
}

.dp-stand {
  width: 50px;
  height: 8px;
  margin: 0 auto;
  background: #d4d0c8;
  border: 1px solid #404040;
  border-top: 0;
}

.dp-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.win-group {
  margin: 0 0 8px;
  padding: 4px 6px 6px;
  min-width: 0;
  border: 1px solid var(--win-shadow);
  border-right-color: var(--win-hilite);
  border-bottom-color: var(--win-hilite);
  box-shadow: 1px 1px 0 var(--win-hilite) inset, -1px -1px 0 var(--win-shadow) inset;
}

.win-group legend {
  padding: 0 3px;
}

.win-select {
  width: 100%;
  font: inherit;
  background: #fff;
  border-top: 1px solid var(--win-shadow);
  border-left: 1px solid var(--win-shadow);
  border-right: 1px solid var(--win-hilite);
  border-bottom: 1px solid var(--win-hilite);
  box-shadow: inset 1px 1px 0 #000;
  padding: 1px 2px;
}

.dp-colorbar {
  height: 12px;
  margin-top: 6px;
  border: 1px solid var(--win-shadow);
  background: linear-gradient(90deg, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff);
}

.dp-colorbar[data-mode='0'] {
  background: linear-gradient(90deg, #ff0000 0 16%, #ffff00 16% 33%, #00ff00 33% 50%, #00ffff 50% 66%, #0000ff 66% 83%, #ff00ff 83%);
}

.dp-colorbar[data-mode='1'] {
  background: repeating-linear-gradient(90deg, #ff0000 0 4px, #ff9900 4px 8px, #ffff00 8px 12px, #66ff00 12px 16px, #00ffcc 16px 20px, #0066ff 20px 24px, #cc00ff 24px 28px);
}

.dp-slider {
  display: flex;
  align-items: center;
  gap: 4px;
}

.dp-slider input {
  flex: 1 1 auto;
  min-width: 0;
}

.dp-res-label {
  margin-top: 4px;
  text-align: center;
}

.dp-checks {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px 8px;
}

.win-check {
  display: flex;
  align-items: center;
  gap: 4px;
}

.win-check input {
  margin: 0;
}

.dlg-buttons {
  display: flex;
  justify-content: flex-end;
  gap: 6px;
  margin-top: 8px;
}

.win-btn {
  min-width: 75px;
  height: 23px;
  padding: 0 8px;
  background: var(--win-face);
  color: #000;
  font: inherit;
  cursor: pointer;
  border-top: 1px solid var(--win-hilite);
  border-left: 1px solid var(--win-hilite);
  border-right: 1px solid var(--win-dark);
  border-bottom: 1px solid var(--win-dark);
  box-shadow: inset -1px -1px 0 var(--win-shadow), inset 1px 1px 0 var(--win-face-light);
}

.win-btn:active {
  border-top: 1px solid var(--win-dark);
  border-left: 1px solid var(--win-dark);
  border-right: 1px solid var(--win-hilite);
  border-bottom: 1px solid var(--win-hilite);
  box-shadow: inset 1px 1px 0 var(--win-shadow);
}

.win-btn:focus-visible {
  outline: 1px dotted #000;
  outline-offset: -4px;
}

input[type='range'] {
  -webkit-appearance: none;
  appearance: none;
  height: 18px;
  background: transparent;
  cursor: pointer;
  margin: 0;
}

input[type='range']::-webkit-slider-runnable-track {
  height: 4px;
  background: #808080;
  border-top: 1px solid var(--win-dark);
  border-left: 1px solid var(--win-dark);
  border-right: 1px solid var(--win-hilite);
  border-bottom: 1px solid var(--win-hilite);
}

input[type='range']::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 11px;
  height: 18px;
  margin-top: -8px;
  background: var(--win-face);
  border-top: 2px solid var(--win-hilite);
  border-left: 2px solid var(--win-hilite);
  border-right: 2px solid var(--win-dark);
  border-bottom: 2px solid var(--win-dark);
}

input[type='range']::-moz-range-track {
  height: 4px;
  background: #808080;
  border: 1px solid var(--win-dark);
}

input[type='range']::-moz-range-thumb {
  width: 9px;
  height: 16px;
  border-radius: 0;
  background: var(--win-face);
  border-top: 2px solid var(--win-hilite);
  border-left: 2px solid var(--win-hilite);
  border-right: 2px solid var(--win-dark);
  border-bottom: 2px solid var(--win-dark);
}

.help-body {

// ---------------------------------------------------------------------------
// Small helpers
// ---------------------------------------------------------------------------

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}

function distance2D(a, b) {
  return Math.hypot(a.x - b.x, a.z - b.z);
}

function polylineLength(points) {
  let length = 0;
  for (let i = 1; i < points.length; i++) {
    length += distance2D(points[i - 1], points[i]);
  }
  return length;
}

function normalize2D(x, z) {
  const length = Math.hypot(x, z);
  if (length < 1e-6) return { x: 0, z: 1 };
  return { x: x / length, z: z / length };
}

function angleDiff(a, b) {
  let d = b - a;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return d;
}

function mulberry32(seed) {
  let a = seed >>> 0;
  return function random() {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function toHex(color) {
  return `#${color.toString(16).padStart(6, '0')}`;
}

function isGrayish(hex) {
  const r = (hex >> 16) & 0xff;
  const g = (hex >> 8) & 0xff;
  const b = hex & 0xff;
  return Math.max(r, g, b) - Math.min(r, g, b) < 24;
}

function safeStorageGet(key) {
  try {
    return window.localStorage.getItem(key);
  } catch {
    return null;
  }
}

function safeStorageSet(key, value) {
  try {
    window.localStorage.setItem(key, value);
  } catch {
    // Private windows and blocked storage just lose persistence.
  }
}

// ---------------------------------------------------------------------------
// Centripetal Catmull-Rom (freehand pencil smoothing)
// ---------------------------------------------------------------------------

const DENSE_STEP = 0.25;

function getControlPoint(points, index) {
  if (index < 0) return points[0];
  if (index >= points.length) return points[points.length - 1];
  return points[index];
}

function knotInterval(a, b, alpha) {
  return Math.pow(Math.max(distance2D(a, b), 0.0001), alpha);
}

function lerpAtKnot(a, b, ta, tb, t) {
  const range = tb - ta;
  const f = range < 1e-6 ? 0 : (t - ta) / range;
  return { x: lerp(a.x, b.x, f), z: lerp(a.z, b.z, f) };
}

function evaluateCentripetalSegment(p0, p1, p2, p3, u, alpha) {
  const t0 = 0;
  const t1 = t0 + knotInterval(p0, p1, alpha);
  const t2 = t1 + knotInterval(p1, p2, alpha);
  const t3 = t2 + knotInterval(p2, p3, alpha);
  const t = t1 + u * (t2 - t1);

  const a1 = lerpAtKnot(p0, p1, t0, t1, t);
  const a2 = lerpAtKnot(p1, p2, t1, t2, t);
  const a3 = lerpAtKnot(p2, p3, t2, t3, t);
  const b1 = lerpAtKnot(a1, a2, t0, t2, t);
  const b2 = lerpAtKnot(a2, a3, t1, t3, t);

  return lerpAtKnot(b1, b2, t1, t2, t);
}

function smoothPolyline(points, alpha = ROAD.splineAlpha) {
  if (points.length < 3) return points.map((p) => ({ x: p.x, z: p.z }));

  const dense = [];
  for (let i = 0; i < points.length - 1; i++) {
    const p0 = getControlPoint(points, i - 1);
    const p1 = points[i];
    const p2 = points[i + 1];
    const p3 = getControlPoint(points, i + 2);
    const steps = Math.max(2, Math.ceil(distance2D(p1, p2) / DENSE_STEP));

    for (let s = 0; s <= steps; s++) {
      if (i > 0 && s === 0) continue;
      dense.push(evaluateCentripetalSegment(p0, p1, p2, p3, s / steps, alpha));
    }
  }
  return dense;
}

// Ramer-Douglas-Peucker keeps hand-drawn strokes from wobbling.
function simplifyPolyline(points, epsilon) {
  if (points.length < 3) return points.slice();

  const keep = new Uint8Array(points.length);
  keep[0] = 1;
  keep[points.length - 1] = 1;
  const stack = [[0, points.length - 1]];

  while (stack.length > 0) {
    const [start, end] = stack.pop();
    const a = points[start];
    const b = points[end];
    const dx = b.x - a.x;
    const dz = b.z - a.z;
    const len = Math.hypot(dx, dz) || 1e-6;

    let maxDist = 0;
    let index = -1;
    for (let i = start + 1; i < end; i++) {
      const p = points[i];
      const d = Math.abs((p.x - a.x) * dz - (p.z - a.z) * dx) / len;
      if (d > maxDist) {
        maxDist = d;
        index = i;
      }
    }

    if (maxDist > epsilon && index !== -1) {
      keep[index] = 1;
      stack.push([start, index], [index, end]);
    }
  }

  return points.filter((_, i) => keep[i]);
}

function quadraticBezierPoints(p0, p1, p2, spacing = 0.5) {
  const approx = distance2D(p0, p1) + distance2D(p1, p2);
  const steps = Math.max(4, Math.ceil(approx / spacing));
  const out = [];
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const u = 1 - t;
    out.push({
      x: u * u * p0.x + 2 * u * t * p1.x + t * t * p2.x,
      z: u * u * p0.z + 2 * u * t * p1.z + t * t * p2.z,
    });
  }
  return out;
}

function cubicBezierPoints(p0, p1, p2, p3, steps) {
  const out = [];
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const u = 1 - t;
    const a = u * u * u;
    const b = 3 * u * u * t;
    const c = 3 * u * t * t;
    const d = t * t * t;
    out.push({
      x: a * p0.x + b * p1.x + c * p2.x + d * p3.x,
      z: a * p0.z + b * p1.z + c * p2.z + d * p3.z,
    });
  }
  return out;
}

// ---------------------------------------------------------------------------
// Paths: arc-length sampled polylines with tangents
// ---------------------------------------------------------------------------

function resamplePolyline(points, spacing) {
  if (points.length < 2) return points.slice();
  const total = polylineLength(points);
  if (total < 1e-6) return [points[0], points[points.length - 1]];

  const count = Math.max(1, Math.round(total / spacing));
  const step = total / count;
  const out = [{ x: points[0].x, z: points[0].z }];

  let segIndex = 1;
  let segStart = 0;
  let segLen = distance2D(points[0], points[1]);

  for (let i = 1; i < count; i++) {
    const target = i * step;
    while (segStart + segLen < target && segIndex < points.length - 1) {
      segStart += segLen;
      segIndex++;
      segLen = distance2D(points[segIndex - 1], points[segIndex]);
    }
    const t = segLen < 1e-6 ? 0 : (target - segStart) / segLen;
    const a = points[segIndex - 1];
    const b = points[segIndex];
    out.push({ x: lerp(a.x, b.x, t), z: lerp(a.z, b.z, t) });
  }

  const last = points[points.length - 1];
  out.push({ x: last.x, z: last.z });
  return out;
}

function makePath(points, spacing = ROAD.pathSpacing) {
  const pts = resamplePolyline(points, spacing);
  const n = pts.length;
  const cum = new Float64Array(n);
  for (let i = 1; i < n; i++) cum[i] = cum[i - 1] + distance2D(pts[i - 1], pts[i]);

  for (let i = 0; i < n; i++) {
    const a = pts[Math.max(0, i - 1)];
    const b = pts[Math.min(n - 1, i + 1)];
    const t = normalize2D(b.x - a.x, b.z - a.z);
    pts[i].tx = t.x;
    pts[i].tz = t.z;
  }

  return { pts, cum, length: n > 0 ? cum[n - 1] : 0 };
}

function pathAt(path, s, out = {}) {
  const { pts, cum, length } = path;
  if (pts.length === 1) {
    out.x = pts[0].x;
    out.z = pts[0].z;
    out.tx = pts[0].tx ?? 0;
    out.tz = pts[0].tz ?? 1;
    return out;
  }

  const d = clamp(s, 0, length);
  let low = 0;
  let high = cum.length - 1;
  while (low < high - 1) {
    const mid = (low + high) >> 1;
    if (cum[mid] <= d) low = mid;
    else high = mid;
  }

  const a = pts[low];
  const b = pts[high];
  const span = cum[high] - cum[low];
  const t = span < 1e-9 ? 0 : (d - cum[low]) / span;
  const tan = normalize2D(lerp(a.tx, b.tx, t), lerp(a.tz, b.tz, t));
  out.x = lerp(a.x, b.x, t);
  out.z = lerp(a.z, b.z, t);
  out.tx = tan.x;
  out.tz = tan.z;
  return out;
}

// Points from s0 to s1, offset to the right of travel direction.
function pathRange(path, s0, s1, offset = 0, spacing = ROAD.pathSpacing) {
  const out = [];
  const span = s1 - s0;
  const count = Math.max(1, Math.ceil(Math.abs(span) / spacing));
  const tmp = {};
  const dir = span >= 0 ? 1 : -1;

  for (let i = 0; i <= count; i++) {
    const s = s0 + (span * i) / count;
    pathAt(path, s, tmp);
    const tx = tmp.tx * dir;
    const tz = tmp.tz * dir;
    out.push({
      x: tmp.x - tz * offset,
      z: tmp.z + tx * offset,
      tx,
      tz,
      s,
    });
  }
  return out;
}

function subPath(path, s0, s1) {
  const points = [];
  const tmp = {};
  pathAt(path, s0, tmp);
  points.push({ x: tmp.x, z: tmp.z });
  for (let i = 0; i < path.pts.length; i++) {
    const c = path.cum[i];
    if (c > s0 + 1e-6 && c < s1 - 1e-6) points.push({ x: path.pts[i].x, z: path.pts[i].z });
  }
  pathAt(path, s1, tmp);
  points.push({ x: tmp.x, z: tmp.z });
  return points;
}

function closestOnPath(path, x, z) {
  const { pts, cum } = path;
  let best = { dist: Infinity, s: 0, x: 0, z: 0 };
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1];
    const b = pts[i];
    const dx = b.x - a.x;
    const dz = b.z - a.z;
    const len2 = dx * dx + dz * dz;
    const t = len2 < 1e-9 ? 0 : clamp(((x - a.x) * dx + (z - a.z) * dz) / len2, 0, 1);
    const px = a.x + dx * t;
    const pz = a.z + dz * t;
    const d = Math.hypot(x - px, z - pz);
    if (d < best.dist) {
      best = { dist: d, s: cum[i - 1] + (cum[i] - cum[i - 1]) * t, x: px, z: pz };
    }
  }
  return best;
}

function pathBounds(pts, pad = 0) {
  let minX = Infinity;
  let minZ = Infinity;
  let maxX = -Infinity;
  let maxZ = -Infinity;
  for (const p of pts) {
    if (p.x < minX) minX = p.x;
    if (p.z < minZ) minZ = p.z;
    if (p.x > maxX) maxX = p.x;
    if (p.z > maxZ) maxZ = p.z;
  }
  return { minX: minX - pad, minZ: minZ - pad, maxX: maxX + pad, maxZ: maxZ + pad };
}

function boundsOverlap(a, b) {
  return a.minX <= b.maxX && a.maxX >= b.minX && a.minZ <= b.maxZ && a.maxZ >= b.minZ;
}

function segmentIntersect(a, b, c, d) {
  const rX = b.x - a.x;
  const rZ = b.z - a.z;
  const sX = d.x - c.x;
  const sZ = d.z - c.z;
  const denom = rX * sZ - rZ * sX;
  if (Math.abs(denom) < 1e-9) return null;
  const qpX = c.x - a.x;
  const qpZ = c.z - a.z;
  const t = (qpX * sZ - qpZ * sX) / denom;
  const u = (qpX * rZ - qpZ * rX) / denom;
  if (t < 0 || t > 1 || u < 0 || u > 1) return null;
  return { t, u };
}

function linesIntersect(p, dp, q, dq) {
  const denom = dp.x * dq.z - dp.z * dq.x;
  if (Math.abs(denom) < 1e-6) return null;
  const t = ((q.x - p.x) * dq.z - (q.z - p.z) * dq.x) / denom;
  return { x: p.x + dp.x * t, z: p.z + dp.z * t, t };
}

const RETRO_UNIFORMS = {

  uSkyAmb: { value: new THREE.Color(0.44, 0.49, 0.6) },
  uGroundAmb: { value: new THREE.Color(0.24, 0.23, 0.2) },
  uFogColor: { value: new THREE.Color(SKY.horizon) },

  uFogFar: { value: 1100 },
  uFogOn: { value: 1 },
  uNight: { value: 0 },

const BAYER_GLSL = /* glsl */ `
  float bayer4(vec2 p) {
    p = floor(p / uPixel);
    int x = int(mod(p.x, 4.0));
    int y = int(mod(p.y, 4.0));
    int i = x + y * 4;
    float m[16] = float[16](
      0.0, 8.0, 2.0, 10.0,
      12.0, 4.0, 14.0, 6.0,
      3.0, 11.0, 1.0, 9.0,
      15.0, 7.0, 13.0, 5.0
    );
    return (m[i] + 0.5) / 16.0;
  }
`;

const RETRO_VERTEX = /* glsl */ `
  uniform vec2 uSnap;
  uniform float uSnapOn;
  uniform vec3 uSunDir;
  uniform vec3 uSunColor;
  uniform vec3 uSkyAmb;
  uniform vec3 uGroundAmb;
  uniform float uFogNear;
  uniform float uFogFar;
  uniform float uFogOn;

  varying vec4 vCol;
  varying vec3 vLight;
  varying float vFog;
  varying vec2 vUv;
  varying vec3 vAffine;
  varying vec3 vWorld;
  varying float vNdotL;

  void main() {
    vec4 col = vec4(1.0);
    #if defined(USE_COLOR_ALPHA)
      col = color;
    #elif defined(USE_COLOR)
      col = vec4(color, 0.0);
    #endif
    #ifdef USE_INSTANCING_COLOR
      col.rgb = mix(col.rgb, instanceColor, col.a);
    #endif
    vCol = col;

    mat4 m = modelMatrix;
    #ifdef USE_INSTANCING
      m = m * instanceMatrix;
    #endif

    vec4 wp = m * vec4(position, 1.0);
    vec3 n = normalize(mat3(m) * normal);

    vWorld = wp.xyz;
    vNdotL = dot(n, uSunDir);
    #ifdef UNLIT
      vLight = vec3(1.0);
    #else
      float d = max(dot(n, uSunDir), 0.0);
      vLight = mix(uGroundAmb, uSkyAmb, n.y * 0.5 + 0.5) + uSunColor * d;
    #endif

    vec4 vp = viewMatrix * wp;
    vec4 cp = projectionMatrix * vp;

    #ifndef NO_SNAP
      if (uSnapOn > 0.5 && cp.w > 0.0) {
        cp.xy = floor(cp.xy / cp.w * uSnap + 0.5) / uSnap * cp.w;
      }
    #endif

    gl_Position = cp;
    vUv = uv;
    vAffine = vec3(uv * cp.w, cp.w);

    #ifdef NO_FOG
      vFog = 0.0;
    #else
      float dist = length(vp.xyz);
      vFog = uFogOn * clamp((dist - uFogNear) / (uFogFar - uFogNear), 0.0, 1.0);
    #endif
  }
`;

const RETRO_FRAGMENT = /* glsl */ `
  uniform vec3 uColor;
  uniform float uAffine;
  uniform float uAlpha;
  uniform vec3 uTint;
  uniform float uTintAmt;
  uniform vec3 uFogColor;
  uniform float uPixel;
  uniform float uShadowOn;
  uniform sampler2D uShadowMap;
  uniform mat4 uShadowMatrix;
  uniform float uBoil;
  uniform float uHatchScale;
  uniform float uNight;
  #ifdef USE_MAP
    uniform sampler2D uMap;
  #endif
  #ifdef ROAD_MASK
    uniform vec3 uPaint;
  #endif

  varying vec4 vCol;
  varying vec3 vLight;
  varying float vFog;
  varying vec2 vUv;
  varying vec3 vAffine;
  varying vec3 vWorld;
  varying float vNdotL;

  ${BAYER_GLSL}

  // Pencil cross-hatching for shadows. The pattern "boils" (redraws with
  // small offsets) a few times a second, like hand-drawn animation.
  vec3 hatchShadow(vec3 c) {
    float shadowed = 0.0;
    vec2 wob = vec2(sin(vWorld.z * 0.8 + uBoil * 7.1), cos(vWorld.x * 0.8 + uBoil * 5.3)) * 0.22;
    vec4 sp = uShadowMatrix * vec4(vWorld.x + wob.x, vWorld.y, vWorld.z + wob.y, 1.0);
    vec3 sc = sp.xyz / sp.w * 0.5 + 0.5;
    if (sc.x > 0.002 && sc.x < 0.998 && sc.y > 0.002 && sc.y < 0.998 && sc.z < 1.0) {
      float depth = texture2D(uShadowMap, sc.xy).r;
      shadowed = step(depth, sc.z - 0.0009);
      // Fade the shadow out toward the edge of the shadow map.
      vec2 edge = min(sc.xy, 1.0 - sc.xy);
      shadowed *= smoothstep(0.0, 0.06, min(edge.x, edge.y));
    }
    float form = smoothstep(0.08, -0.2, vNdotL);
    float shade = max(shadowed, form * 0.55);
    if (shade <= 0.0) return c;

    vec2 p = gl_FragCoord.xy / uHatchScale;
    float b = floor(uBoil);
    float wav = sin(p.y * 0.23 + b * 1.7) * 1.2 + sin(p.x * 0.11 + b * 2.3) * 0.9;
    float l1 = mod(p.x + p.y + wav + b * 1.3, 5.0);
    float l2 = mod(p.x - p.y + wav * 0.6 + b * 2.1, 6.0);
    float grain = fract(sin(dot(floor(p / 2.0) + b, vec2(12.9898, 78.233))) * 43758.5453);
    float ink = step(l1, 1.0 + grain * 0.6);
    ink = max(ink, step(l2, 0.9) * step(0.75, shade));

    vec3 paper = c * mix(1.0, 0.8, shade);
    vec3 graphite = c * 0.38 + vec3(0.05, 0.05, 0.08);
    return mix(paper, graphite, ink * shade * 0.9);
  }

  void main() {
    #ifdef PAINT_VERTEX
      // Batched roads carry their paint color per vertex.
      vec3 base = uColor;
      vec3 paintColor = vCol.rgb;
    #else
      vec3 base = uColor * vCol.rgb;
      vec3 paintColor = vec3(1.0);
      #ifdef ROAD_MASK
        paintColor = uPaint;
      #endif
    #endif

    #ifdef USE_MAP
      vec2 uv = mix(vUv, vAffine.xy / vAffine.z, uAffine);
      vec4 tex = texture2D(uMap, uv);
      #ifdef ROAD_MASK
        vec3 surface = vec3(tex.r);
        surface = mix(surface, vec3(0.92), tex.g);
        surface = mix(surface, paintColor, tex.b);
        base *= surface;
      #else
        #ifdef ALPHA_TEST
          if (tex.a < 0.5) discard;
        #endif
        base *= tex.rgb;
      #endif
    #endif

    if (uAlpha < 0.999 && uAlpha <= bayer4(gl_FragCoord.xy)) discard;

    vec3 c = base * vLight;
    #ifndef UNLIT
      if (uShadowOn > 0.5) c = hatchShadow(c);
    #endif
    #ifdef GLOW
      // Windows light up at night: texture alpha 0 or vertex alpha 0.5 is glass.
      #ifdef USE_MAP
        float glass = 1.0 - step(0.5, tex.a);
      #else
        float glass = 1.0 - step(0.1, abs(vCol.a - 0.5));
      #endif
      vec2 cell = floor(vWorld.xz / 3.0) + floor(vWorld.y / 3.2) * 17.0;
      float lit = step(0.42, fract(sin(dot(cell, vec2(12.9898, 78.233))) * 43758.5453));
      c = mix(c, vec3(1.0, 0.84, 0.46), glass * lit * uNight);
    #endif
    c = mix(c, uTint, uTintAmt);
    c = mix(c, uFogColor, vFog);
    gl_FragColor = vec4(c, 1.0);
  }
`;

const retroMaterials = new Set();

function createRetroMaterial({
  color = 0xffffff,
  map = null,
  vertexColors = false,
  roadMask = false,
  paintVertex = false,
  paint = 0xffff00,
  alphaTest = false,
  glow = false,
  unlit = false,
  fog = true,
  snap = true,
  side = THREE.FrontSide,
  alpha = 1,
  depthWrite = true,
  polygonOffset = 0,
} = {}) {
  const defines = {};
  if (map) defines.USE_MAP = '';
  if (roadMask) defines.ROAD_MASK = '';
  if (paintVertex) defines.PAINT_VERTEX = '';
  if (alphaTest) defines.ALPHA_TEST = '';
  if (glow) defines.GLOW = '';
  if (unlit) defines.UNLIT = '';
  if (!fog) defines.NO_FOG = '';
  if (!snap) defines.NO_SNAP = '';

  const material = new THREE.ShaderMaterial({
    defines,
    uniforms: {
      ...RETRO_UNIFORMS,
      uColor: { value: new THREE.Color(color) },
      uMap: { value: map },
      uPaint: { value: new THREE.Color(paint) },
      uAlpha: { value: alpha },
      uTint: { value: new THREE.Color(0xff0000) },
      uTintAmt: { value: 0 },
    },
    vertexShader: RETRO_VERTEX,
    fragmentShader: RETRO_FRAGMENT,
    vertexColors,
    side,
    depthWrite,
  });

  if (polygonOffset) {
    material.polygonOffset = true;
    material.polygonOffsetFactor = polygonOffset;
    material.polygonOffsetUnits = polygonOffset;
  }

  retroMaterials.add(material);
  const dispose = material.dispose.bind(material);
  material.dispose = () => {
    retroMaterials.delete(material);
    dispose();
  };
  return material;
}

// ---------------------------------------------------------------------------
// Palette pass: the whole frame is squeezed through a 1998 display mode.
// ---------------------------------------------------------------------------

function createPalettePass() {
  const paletteColors = PAINT_SWATCHES.map((s) => new THREE.Color(s.color));

  const material = new THREE.ShaderMaterial({
    uniforms: {
      tDiffuse: { value: null },
      uMode: { value: 1 },
      uDither: { value: 1 },
      uPixel: RETRO_UNIFORMS.uPixel,
      uPalette: { value: paletteColors },
    },
    vertexShader: /* glsl */ `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = vec4(position.xy, 0.0, 1.0);
      }
    `,
    fragmentShader: /* glsl */ `
      uniform sampler2D tDiffuse;
      uniform int uMode;
      uniform float uDither;
      uniform vec3 uPalette[16];
      uniform float uPixel;
      varying vec2 vUv;

      ${BAYER_GLSL}

      vec3 nearest16(vec3 c) {
        vec3 best = uPalette[0];
        float bestD = 1e9;
        for (int i = 0; i < 16; i++) {
          vec3 d = (c - uPalette[i]) * vec3(0.9, 1.2, 0.7);
          float dd = dot(d, d);
          if (dd < bestD) {
            bestD = dd;
            best = uPalette[i];
          }
        }
        return best;
      }

      void main() {
        vec3 c = texture2D(tDiffuse, vUv).rgb;
        float t = (bayer4(gl_FragCoord.xy) - 0.5) * uDither;

        if (uMode == 0) {
          c = nearest16(clamp(c + t * 0.42, 0.0, 1.0));
        } else if (uMode == 1) {
          c = floor(clamp(c, 0.0, 1.0) * 5.0 + 0.5 + t) / 5.0;
        } else if (uMode == 2) {
          vec3 levels = vec3(31.0, 63.0, 31.0);
          c = floor(clamp(c, 0.0, 1.0) * levels + 0.5 + t) / levels;
        }

        gl_FragColor = vec4(clamp(c, 0.0, 1.0), 1.0);
      }
    `,
    depthTest: false,
    depthWrite: false,
  });

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute(
    'position',
    new THREE.BufferAttribute(new Float32Array([-1, -1, 0, 3, -1, 0, -1, 3, 0]), 3)
  );
  geometry.setAttribute('uv', new THREE.BufferAttribute(new Float32Array([0, 0, 2, 0, 0, 2]), 2));

  const mesh = new THREE.Mesh(geometry, material);
  mesh.frustumCulled = false;
  const scene = new THREE.Scene();
  scene.add(mesh);
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

  return { scene, camera, material };
}

// ---------------------------------------------------------------------------
// Procedural textures (tiny, unfiltered, painted in code)
// ---------------------------------------------------------------------------

function makeCanvasTexture(width, height, paint, { repeat = true } = {}) {
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');
  const image = ctx.createImageData(width, height);
  paint(image.data, width, height);
  ctx.putImageData(image, 0, 0);

  const texture = new THREE.CanvasTexture(canvas);
  texture.magFilter = THREE.NearestFilter;
  texture.minFilter = THREE.NearestMipmapNearestFilter;
  texture.generateMipmaps = true;
  if (repeat) {
    texture.wrapS = THREE.RepeatWrapping;
    texture.wrapT = THREE.RepeatWrapping;
  }
  return texture;
}

function setPixel(data, width, x, y, r, g, b, a = 255) {
  const i = (y * width + x) * 4;
  data[i] = r;
  data[i + 1] = g;
  data[i + 2] = b;
  data[i + 3] = a;
}

// R = asphalt brightness, G = white paint, B = road paint (tinted per road).
// One-way textures are twice as long so each lane gets an arrow per tile.
function makeRoadTexture(type, oneway = false) {
  const rand = mulberry32(42 + type.roadHalf * 10 + (oneway ? 3 : 0));
  const W = 64;
  const H = oneway ? 128 : 64;
  const pxPerM = W / (type.roadHalf * 2);
  const centerPx = W / 2;
  const toPx = (meters) => Math.round(centerPx + meters * pxPerM);
  const lanes = type.lanesPerDir * 2;

  return makeCanvasTexture(W, H, (data) => {
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const noise = rand();
        let r = 84 + Math.floor(noise * 8);
        if (noise > 0.985) r = 104;
        if (noise < 0.015) r = 70;
        let g = 0;
        let b = 0;
        const edgeDark = type.sidewalk > 0 && (x <= 1 || x >= W - 2);
        if (edgeDark) r = 74;

        if (oneway) {
          // Dashed lane lines in the road's paint, solid white edges, arrows.
          const laneW = (type.roadHalf * 2 - 0.6) / lanes;
          const left = -type.roadHalf + 0.3;
          for (let i = 1; i < lanes; i++) {
            if (x === toPx(left + i * laneW) && y % 64 < 26) b = 255;
          }
          if (!type.sidewalk && (x === toPx(-type.roadHalf + 0.35) || x === toPx(type.roadHalf - 0.35))) g = 255;
          const headHalf = Math.max(1.5, laneW * pxPerM * 0.26);
          for (let i = 0; i < lanes; i++) {
            const cx = toPx(left + (i + 0.5) * laneW);
            const dx = Math.abs(x - cx);
            // Canvas rows run against travel (textures are flipped on upload).
            const head = y >= 46 && y < 58 && dx <= ((y - 46) / 11) * headHalf;
            const shaft = y >= 58 && y < 80 && dx <= 0;
            if (head || shaft) g = 255;
          }
        } else if (type.key === 'alley') {
          if (x <= 0 || x >= W - 1) r = 72;
        } else if (type.key === 'small') {
          const edgeL = toPx(-type.roadHalf + 0.35);
          const edgeR = toPx(type.roadHalf - 0.35);
          if (x === edgeL || x === edgeR) g = 255;
          if ((x === centerPx - 1 || x === centerPx) && y < 24) b = 255;
        } else if (type.key === 'medium') {
          if ((x === centerPx - 1 || x === centerPx) && y < 26) b = 255;
        } else if (type.key === 'highway' || type.key === 'freeway') {
          const l1 = toPx(-0.3);
          const l2 = toPx(0.3);
          if (x === l1 || x === l2) b = 255;
          for (let k = 1; k < type.lanesPerDir; k++) {
            const d = type.median + type.laneWidth * k;
            if ((x === toPx(-d) || x === toPx(d)) && y < 20) g = 255;
          }
          const e1 = toPx(-type.roadHalf + 0.5);
          const e2 = toPx(type.roadHalf - 0.5);
          if (x === e1 || x === e2) g = 255;
        } else {
          const l1 = toPx(-Math.max(0.35, type.median * 0.5));
          const l2 = toPx(Math.max(0.35, type.median * 0.5));
          if (x === l1 || x === l2) b = 255;
          for (let k = 1; k < type.lanesPerDir; k++) {
            const d = type.median + type.laneWidth * k;
            if ((x === toPx(-d) || x === toPx(d)) && y < 22) g = 255;
          }
        }

        setPixel(data, W, x, y, r, g, b);
      }
    }
  });
}

// Ballast, sleepers and two steel rails (plain colors, not a paint mask).
function makeRailTexture() {
  const rand = mulberry32(31);
  const W = 64;
  const H = 64;
  const pxPerM = W / (ROAD_TYPES.rail.roadHalf * 2);
  const center = W / 2;
  return makeCanvasTexture(W, H, (data) => {
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const n = rand();
        let c = [112 + n * 22, 106 + n * 18, 96 + n * 16];
        const m = (x - center) / pxPerM;
        const sleeper = Math.abs(m) < 1.3 && y % 11 < 4;
        if (sleeper) c = [86 + n * 10, 64 + n * 8, 44 + n * 6];
        const rail = Math.abs(Math.abs(m) - 0.72) < 0.09;
        if (rail) c = [196, 198, 204];
        if (Math.abs(Math.abs(m) - 0.72) < 0.16 && !rail) c = sleeper ? c : [92, 88, 84];
        setPixel(data, W, x, y, c[0] | 0, c[1] | 0, c[2] | 0);
      }
    }
  });
}

function makeGravelTexture() {
  const rand = mulberry32(17);
  return makeCanvasTexture(32, 32, (data, w, h) => {
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const n = rand();
        setPixel(data, w, x, y, (112 + n * 22) | 0, (106 + n * 18) | 0, (96 + n * 16) | 0);
      }
    }
  });
}

// Wall tile for imported buildings: plaster with one window. Alpha marks
// the glass so windows can light up at night.
function makeFacadeTexture() {
  return makeCanvasTexture(16, 16, (data, w, h) => {
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const glass = x >= 4 && x < 12 && y >= 4 && y < 12;
        const frame = (x === 3 || x === 12) && y >= 3 && y < 13;
        let c = 236 - ((x * 7 + y * 13) % 5) * 3;
        if (y === 0) c = 210;
        if (glass) setPixel(data, w, x, y, 70, 92, 128, 0);
        else if (frame) setPixel(data, w, x, y, 200, 200, 200, 255);
        else setPixel(data, w, x, y, c, c, c - 4, 255);
      }
    }
  });
}

function makeAsphaltTexture() {
  const rand = mulberry32(7);
  return makeCanvasTexture(32, 32, (data, w, h) => {
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const noise = rand();
        let r = 84 + Math.floor(noise * 8);
        if (noise > 0.985) r = 104;
        if (noise < 0.015) r = 70;
        setPixel(data, w, x, y, r, 0, 0);
      }
    }
  });
}

function makeGrassTexture() {
  const rand = mulberry32(11);
  const shades = [
    [78, 132, 52],
    [82, 138, 54],
    [74, 126, 50],
    [90, 144, 58],
    [68, 118, 46],
  ];
  return makeCanvasTexture(32, 32, (data, w, h) => {
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const n = rand();
        let shade = shades[n < 0.45 ? 0 : n < 0.75 ? 1 : n < 0.9 ? 2 : n < 0.97 ? 3 : 4];
        // Paint-style flower specks.
        if (rand() > 0.997) shade = rand() > 0.5 ? [200, 196, 90] : [210, 214, 200];
        setPixel(data, w, x, y, shade[0], shade[1], shade[2]);
      }
    }
  });
}

function makeConcreteTexture() {
  const rand = mulberry32(5);
  return makeCanvasTexture(16, 16, (data, w, h) => {
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        let v = 184 + Math.floor(rand() * 6);
        if (x === 0 || y === 0) v = 160;
        setPixel(data, w, x, y, v, v, v - 4);
      }
    }
  });
}

function makeZebraTexture() {
  return makeCanvasTexture(16, 4, (data, w, h) => {
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const on = x % 4 < 2;
        setPixel(data, w, x, y, 235, 235, 235, on ? 255 : 0);
      }
    }
  });
}

function makeBlobTexture() {
  const texture = makeCanvasTexture(16, 16, (data, w, h) => {
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const dx = (x + 0.5) / w - 0.5;
        const dy = (y + 0.5) / h - 0.5;
        const inside = dx * dx + dy * dy < 0.24;
        setPixel(data, w, x, y, 255, 255, 255, inside ? 255 : 0);
      }
    }
  }, { repeat: false });
  texture.generateMipmaps = false;
  texture.minFilter = THREE.NearestFilter;
  return texture;
}

// ---------------------------------------------------------------------------
// Low-poly model building: primitives are flattened to non-indexed faces so
// every polygon gets its own flat normal.
// ---------------------------------------------------------------------------

const _partMatrix = new THREE.Matrix4();
const _partQuat = new THREE.Quaternion();
const _partEuler = new THREE.Euler();

function modelPart(geometry, color, {
  position = [0, 0, 0],
  rotation = [0, 0, 0],
  scale = [1, 1, 1],
  paint = 0,
  edit = null,
} = {}) {
  let geo = geometry.index ? geometry.toNonIndexed() : geometry.clone();
  geometry.dispose();
  if (edit) edit(geo.getAttribute('position'));
  _partEuler.set(rotation[0], rotation[1], rotation[2]);
  _partQuat.setFromEuler(_partEuler);
  _partMatrix.compose(
    new THREE.Vector3(...position),
    _partQuat,
    new THREE.Vector3(...scale)
  );
  geo.applyMatrix4(_partMatrix);
  geo.computeVertexNormals();

  const c = new THREE.Color(color);
  const count = geo.getAttribute('position').count;
  const colors = new Float32Array(count * 4);
  for (let i = 0; i < count; i++) {
    colors[i * 4] = c.r;
    colors[i * 4 + 1] = c.g;
    colors[i * 4 + 2] = c.b;
    colors[i * 4 + 3] = paint;
  }
  return {
    position: geo.getAttribute('position').array,
    normal: geo.getAttribute('normal').array,
    color: colors,
  };
}

function mergeModel(parts) {
  let total = 0;
  for (const p of parts) total += p.position.length / 3;

  const position = new Float32Array(total * 3);
  const normal = new Float32Array(total * 3);
  const color = new Float32Array(total * 4);
  const uv = new Float32Array(total * 2);

  let offset = 0;
  for (const p of parts) {
    const n = p.position.length / 3;
    position.set(p.position, offset * 3);
    normal.set(p.normal, offset * 3);
    color.set(p.color, offset * 4);
    offset += n;
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(position, 3));
  geometry.setAttribute('normal', new THREE.BufferAttribute(normal, 3));
  geometry.setAttribute('color', new THREE.BufferAttribute(color, 4));
  geometry.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  geometry.computeBoundingSphere();
  return geometry;
}

function box(w, h, d) {
  return new THREE.BoxGeometry(w, h, d);
}

// A box whose top face is pulled in (car cabins, roofs).
function taperedBox(w, h, d, { topScaleX = 1, topFront = 0, topBack = 0 } = {}) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const pos = geo.getAttribute('position');
  for (let i = 0; i < pos.count; i++) {
    if (pos.getY(i) > 0) {
      pos.setX(i, pos.getX(i) * topScaleX);
      const z = pos.getZ(i);
      pos.setZ(i, z > 0 ? z - topFront : z + topBack);
    }
  }
  return geo;
}

// Triangles are flipped as needed so they face away from `center`.
function solidFromTriangles(triangles, center) {
  const positions = [];
  const a = new THREE.Vector3();
  const b = new THREE.Vector3();
  const c = new THREE.Vector3();
  const n = new THREE.Vector3();
  const mid = new THREE.Vector3();
  const centerV = new THREE.Vector3(...center);

  for (const [p0, p1, p2] of triangles) {
    a.set(...p0);
    b.set(...p1);
    c.set(...p2);
    n.subVectors(b, a).cross(c.clone().sub(a));
    mid.copy(a).add(b).add(c).multiplyScalar(1 / 3).sub(centerV);
    if (n.dot(mid) < 0) positions.push(...p0, ...p2, ...p1);
    else positions.push(...p0, ...p1, ...p2);
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(positions), 3));
  return geometry;
}

// Gable roof: ridge runs along x.
function prismRoof(length, depth, height) {
  const l = length / 2;
  const d = depth / 2;
  const A = [-l, 0, -d];
  const B = [-l, 0, d];
  const C = [-l, height, 0];
  const A2 = [l, 0, -d];
  const B2 = [l, 0, d];
  const C2 = [l, height, 0];
  return solidFromTriangles(
    [
      [A, B, C],
      [A2, B2, C2],
      [B, C, C2],
      [B, C2, B2],
      [A, C, C2],
      [A, C2, A2],
      [A, B, B2],
      [A, B2, A2],
    ],
    [0, height / 3, 0]
  );
}

// Depth-only pass for the sun's shadow map (handles instanced meshes too).
function createShadowDepthMaterial() {
  return new THREE.ShaderMaterial({
    vertexShader: /* glsl */ `
      void main() {
        mat4 m = modelMatrix;
        #ifdef USE_INSTANCING
          m = m * instanceMatrix;
        #endif
        gl_Position = projectionMatrix * viewMatrix * m * vec4(position, 1.0);
      }
    `,
    fragmentShader: /* glsl */ `
      void main() {
        gl_FragColor = vec4(1.0);
      }
    `,
    side: THREE.DoubleSide,
  });
}

// Layer 1 holds things that are drawn but never cast shadows.
const NO_SHADOW_LAYER = 1;

function noShadow(object) {
  object.layers.set(NO_SHADOW_LAYER);
  return object;
}

// Tiny event bus so game mechanics can hook in without touching each other.
function createEvents() {
  const listeners = new Map();
  return {
    on(name, fn) {
      if (!listeners.has(name)) listeners.set(name, new Set());
      listeners.get(name).add(fn);
      return () => listeners.get(name)?.delete(fn);
    },
    emit(name, payload) {
      const set = listeners.get(name);
      if (!set) return;
      for (const fn of Array.from(set)) {
        try {
          fn(payload);
        } catch (error) {
          console.error(`[events] ${name}`, error);
        }
      }
    },
  };
}

// Joins flat-shaded geometries that share the same attribute layout
// (position 3, normal 3, color 4, uv 2) into one.
function mergeGeometries(list) {
  let total = 0;
  for (const g of list) total += g.getAttribute('position').count;
  const position = new Float32Array(total * 3);
  const normal = new Float32Array(total * 3);
  const color = new Float32Array(total * 4);
  const uv = new Float32Array(total * 2);
  let offset = 0;
  for (const g of list) {
    const n = g.getAttribute('position').count;
    position.set(g.getAttribute('position').array, offset * 3);
    normal.set(g.getAttribute('normal').array, offset * 3);
    color.set(g.getAttribute('color').array, offset * 4);
    uv.set(g.getAttribute('uv').array, offset * 2);
    offset += n;
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(position, 3));
  geometry.setAttribute('normal', new THREE.BufferAttribute(normal, 3));
  geometry.setAttribute('color', new THREE.BufferAttribute(color, 4));
  geometry.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  geometry.computeBoundingSphere();
  return geometry;
}

// Groups many small static pieces into one mesh per map chunk and kind, so
// a whole imported city draws in a few hundred calls instead of thousands.
// `kindDef(name)` returns { material, cast, renderOrder } for a part kind.
function createChunkBatcher(parent, kindDef, size = 256) {
  const chunks = new Map();
  const dirty = new Set();

  function keyOf(x, z) {
    return `${Math.floor(x / size)},${Math.floor(z / size)}`;
  }

  function chunk(key) {
    let c = chunks.get(key);
    if (!c) {
      c = { owners: new Set(), meshes: [] };
      chunks.set(key, c);
    }
    return c;
  }

  function remove(owner) {
    if (!owner._chunk) return;
    chunks.get(owner._chunk)?.owners.delete(owner);
    dirty.add(owner._chunk);
    for (const part of owner._parts ?? []) part.geometry.dispose();
    owner._chunk = null;
    owner._parts = null;
  }

  function set(owner, parts, x, z) {
    remove(owner);
    if (!parts || parts.length === 0) return;
    const key = keyOf(x, z);
    owner._chunk = key;
    owner._parts = parts;
    chunk(key).owners.add(owner);
    dirty.add(key);
  }

  function touch(owner) {
    if (owner._chunk) dirty.add(owner._chunk);
  }

  function rebuild(key) {
    const c = chunks.get(key);
    if (!c) return;
    for (const mesh of c.meshes) {
      parent.remove(mesh);
      mesh.geometry.dispose();
    }
    c.meshes = [];
    const byKind = new Map();
    for (const owner of c.owners) {
      for (const part of owner._parts) {
        if (!byKind.has(part.kind)) byKind.set(part.kind, []);
        byKind.get(part.kind).push(part.geometry);
      }
    }
    for (const [kind, list] of byKind) {
      const def = kindDef(kind);
      const mesh = new THREE.Mesh(mergeGeometries(list), def.material);
      if (!def.cast) noShadow(mesh);
      mesh.renderOrder = def.renderOrder ?? 0;
      mesh.userData.kind = kind;
      parent.add(mesh);
      c.meshes.push(mesh);
    }
    if (c.owners.size === 0) chunks.delete(key);
  }

  function flush() {
    for (const key of dirty) rebuild(key);
    dirty.clear();
  }

  function clear() {
    for (const [key, c] of chunks) {
      for (const owner of c.owners) remove(owner);
      dirty.add(key);
    }
    flush();
  }

  return {
    set,
    remove,
    touch,
    flush,
    clear,
    get meshCount() {
      let n = 0;
      for (const c of chunks.values()) n += c.meshes.length;
      return n;
    },
  };
}

// Stencil helpers: tunnel cuttings punch holes in the ground.
function makeHoleMaterial() {
  const material = new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: false, side: THREE.DoubleSide });
  material.stencilWrite = true;
  material.stencilRef = 1;
  material.stencilFunc = THREE.AlwaysStencilFunc;
  material.stencilZPass = THREE.ReplaceStencilOp;
  return material;
}

function respectHoles(material) {
  material.stencilWrite = true;
  material.stencilRef = 1;
  material.stencilFunc = THREE.NotEqualStencilFunc;
  material.stencilFail = THREE.KeepStencilOp;
  material.stencilZFail = THREE.KeepStencilOp;
  material.stencilZPass = THREE.KeepStencilOp;
  return material;
}

function smooth01(t) {
  const x = clamp(t, 0, 1);
  return x * x * (3 - 2 * x);
}

// Height along a road of length L between end heights ya and yb. `mid` is
// the drawn height (bridges, tunnels); ramps are RAMP_RUN m per metre.
function profileHeight(L, ya, yb, mid, s) {
  if (mid === null || mid === undefined) return lerp(ya, yb, smooth01(L > 0 ? s / L : 0));
  const ra = Math.min(L / 2, Math.abs(mid - ya) * RAMP_RUN);
  const rb = Math.min(L / 2, Math.abs(mid - yb) * RAMP_RUN);
  if (s <= L / 2) return ra > 0 && s < ra ? lerp(ya, mid, smooth01(s / ra)) : mid;
  const t = L - s;
  return rb > 0 && t < rb ? lerp(yb, mid, smooth01(t / rb)) : mid;
}

// World: sky, ground, hills, clouds and scenery
// ---------------------------------------------------------------------------

const TEXTURES = {};

function initTextures() {
  TEXTURES.grass = makeGrassTexture();
  TEXTURES.asphalt = makeAsphaltTexture();
  TEXTURES.concrete = makeConcreteTexture();
  TEXTURES.zebra = makeZebraTexture();
  TEXTURES.blob = makeBlobTexture();
  TEXTURES.rail = makeRailTexture();
  TEXTURES.gravel = makeGravelTexture();
  TEXTURES.facade = makeFacadeTexture();
  TEXTURES.road = {};
  TEXTURES.roadOneway = {};
  for (const type of Object.values(ROAD_TYPES)) {
    if (type.kind !== 'road') continue;
    TEXTURES.road[type.key] = makeRoadTexture(type);
    TEXTURES.roadOneway[type.key] = makeRoadTexture(type, true);
  }
}

function buildSkyDome() {
  const geometry = new THREE.SphereGeometry(SKY.radius, 16, 10);
  const pos = geometry.getAttribute('position');
  const colors = new Float32Array(pos.count * 3);
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  const material = createRetroMaterial({
    vertexColors: true,
    unlit: true,
    fog: false,
    snap: false,
    side: THREE.BackSide,
    depthWrite: false,
  });

  const mesh = noShadow(new THREE.Mesh(geometry, material));
  mesh.renderOrder = -10;
  mesh.frustumCulled = false;

  function setColors(top, horizon) {
    const cTop = new THREE.Color(top);
    const cHorizon = new THREE.Color(horizon);
    const tmp = new THREE.Color();
    for (let i = 0; i < pos.count; i++) {
      const y = pos.getY(i) / SKY.radius;
      const t = clamp(y * 2.2, 0, 1);
      tmp.copy(cHorizon).lerp(cTop, Math.pow(t, 0.8));
      if (y < 0) tmp.copy(cHorizon);
      colors[i * 3] = tmp.r;
      colors[i * 3 + 1] = tmp.g;
      colors[i * 3 + 2] = tmp.b;
    }
    geometry.getAttribute('color').needsUpdate = true;
  }

  setColors(SKY.top, SKY.horizon);
  return { mesh, setColors };
}

function buildGround() {
  const extent = WORLD.groundExtent;
  const tiles = 160;
  const geometry = new THREE.PlaneGeometry(extent, extent, tiles, tiles);
  geometry.rotateX(-Math.PI / 2);
  const uv = geometry.getAttribute('uv');
  const repeat = extent / 10;
  for (let i = 0; i < uv.count; i++) {
    uv.setXY(i, uv.getX(i) * repeat, uv.getY(i) * repeat);
  }

  // Large meadow patches: lighter fields, darker hollows, dry spots.
  const pos = geometry.getAttribute('position');
  const colors = new Float32Array(pos.count * 3);
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const z = pos.getZ(i);
    const n =
      Math.sin(x * 0.011 + Math.sin(z * 0.007) * 2) * 0.5 +
      Math.sin(z * 0.013 + Math.cos(x * 0.009) * 2) * 0.5 +
      Math.sin((x + z) * 0.031) * 0.25;
    const dry = clamp(Math.sin(x * 0.004 - z * 0.006) * 1.6 - 0.9, 0, 1);
    const shade = 0.9 + n * 0.09;
    colors[i * 3] = shade + dry * 0.22;
    colors[i * 3 + 1] = shade + dry * 0.06;
    colors[i * 3 + 2] = shade - dry * 0.1;
  }
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  // Tunnel cuttings punch stencil holes through the meadow.
  const material = respectHoles(createRetroMaterial({ map: TEXTURES.grass, vertexColors: true }));
  const mesh = noShadow(new THREE.Mesh(geometry, material));
  mesh.name = 'ground';
  return mesh;
}

function buildPlayAreaBorder() {
  // A faint dotted fence line, like Paint's selection marquee, marks the
  // edge of the buildable area.
  const h = WORLD.half;
  const points = [];
  const step = 6;
  for (let x = -h; x < h; x += step) points.push([x, -h], [x, h]);
  for (let z = -h; z < h; z += step) points.push([-h, z], [h, z]);

  // Leave gaps where the highways to other towns cross the line.
  const parts = points.filter(([x, z]) => !nearHighway(x, z, ROAD_TYPES.highway.roadHalf + 3)).map(([x, z]) =>
    modelPart(box(0.4, 1.2, 0.4), 0x6b4f2a, { position: [x, 0.6, z] })
  );
  const mesh = new THREE.Mesh(mergeModel(parts), createRetroMaterial({ vertexColors: true }));
  return mesh;
}

// Scenery is instanced. Items under a new road are bulldozed, like Skylines.
function createScenery(scene) {
  const rand = mulberry32(WORLD.seed);
  const items = [];
  const groups = [];
  const blobs = [];

  const shadowMaterial = createRetroMaterial({
    color: 0x000000,
    map: TEXTURES.blob,
    alphaTest: true,
    alpha: 0.5,
    depthWrite: false,
    polygonOffset: -1,
  });
  const shadowGeometry = new THREE.PlaneGeometry(1, 1);
  shadowGeometry.rotateX(-Math.PI / 2);

  function addGroup(models, placements, { colored = false } = {}) {
    const byModel = models.map(() => []);
    for (const p of placements) byModel[p.model].push(p);

    models.forEach((model, index) => {
      const list = byModel[index];
      if (list.length === 0) return;

      const material = createRetroMaterial({ vertexColors: true });
      const mesh = new THREE.InstancedMesh(model.geometry, material, list.length);
      const shadow = new THREE.InstancedMesh(shadowGeometry, shadowMaterial, list.length);
      const m = new THREE.Matrix4();
      const q = new THREE.Quaternion();
      const color = new THREE.Color();

      list.forEach((p, i) => {
        q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), p.rot);
        m.compose(new THREE.Vector3(p.x, 0, p.z), q, new THREE.Vector3(p.scale, p.scale, p.scale));
        mesh.setMatrixAt(i, m);
        const matrix = m.clone();
        if (colored) {
          color.setHex(model.colors[Math.floor(rand() * model.colors.length)]);
          mesh.setColorAt(i, color);
        }
        const s = model.shadow * p.scale;
        m.compose(new THREE.Vector3(p.x + 0.8, 0.03, p.z + 0.6), q, new THREE.Vector3(s, 1, s));
        shadow.setMatrixAt(i, m);

        items.push({ x: p.x, z: p.z, r: model.radius * p.scale, mesh, shadow, index: i, alive: true, matrix, shadowMatrix: m.clone() });
      });

      if (colored && !mesh.instanceColor) mesh.setColorAt(0, new THREE.Color(0xffffff));
      mesh.instanceMatrix.needsUpdate = true;
      mesh.computeBoundingSphere();
      shadow.computeBoundingSphere();
      noShadow(shadow);
      blobs.push(shadow);
      scene.add(mesh, shadow);
      groups.push(mesh, shadow);
    });
  }

  function clearOf(x, z, r, list) {
    for (const p of list) {
      if (Math.hypot(p.x - x, p.z - z) < r + p.r) return false;
    }
    return true;
  }

  // Villages and farms beyond the fence; the city itself grows inside it.
  const buildings = buildingModels();
  const buildingPlacements = [];
  const villageCount = 12;
  for (let v = 0; v < villageCount; v++) {
    const angle = (v / villageCount) * Math.PI * 2 + rand() * 0.5;
    const radius = WORLD.half * 1.15 + 60 + rand() * 200;
    const cx = Math.cos(angle) * radius;
    const cz = Math.sin(angle) * radius;
    const count = 4 + Math.floor(rand() * 9);
    const isTown = rand() > 0.55;

    for (let i = 0; i < count * 3 && buildingPlacements.length < 180; i++) {
      const a = rand() * Math.PI * 2;
      const d = 10 + rand() * 45;
      const x = cx + Math.cos(a) * d;
      const z = cz + Math.sin(a) * d;
      if (Math.max(Math.abs(x), Math.abs(z)) < WORLD.half + 14 || nearHighway(x, z, 18)) continue;
      let model;
      if (isTown) model = rand() < 0.3 ? 2 : rand() < 0.5 ? 3 : 0;
      else model = rand() < 0.15 ? 4 : rand() < 0.5 ? 1 : 0;
      const r = buildings[model].radius;
      if (!clearOf(x, z, r + 2, buildingPlacements)) continue;
      const rot = Math.round((Math.atan2(cz - z, cx - x) + Math.PI / 2) / (Math.PI / 2)) * (Math.PI / 2);
      buildingPlacements.push({ model, x, z, r, rot, scale: 1 });
      if (buildingPlacements.filter((b) => Math.hypot(b.x - cx, b.z - cz) < 60).length >= count) break;
    }
  }
  addGroup(buildings, buildingPlacements, { colored: true });

  // Forests and scattered trees.
  const trees = treeModels();
  const treePlacements = [];
  const forestCount = Math.round(16 * (WORLD.half / 450) ** 2);
  for (let f = 0; f < forestCount; f++) {
    const cx = (rand() * 2 - 1) * (WORLD.half - 30);
    const cz = (rand() * 2 - 1) * (WORLD.half - 30);
    if (Math.hypot(cx, cz) < 90) continue;
    const size = 18 + rand() * 40;
    const count = 15 + Math.floor(rand() * 40);
    const pineForest = rand() > 0.5;
    for (let i = 0; i < count; i++) {
      const a = rand() * Math.PI * 2;
      const d = Math.sqrt(rand()) * size;
      const x = cx + Math.cos(a) * d;
      const z = cz + Math.sin(a) * d;
      if (!clearOf(x, z, 3, buildingPlacements)) continue;
      treePlacements.push({
        model: pineForest ? (rand() < 0.85 ? 0 : 2) : rand() < 0.75 ? 1 : 2,
        x,
        z,
        r: 2,
        rot: rand() * Math.PI * 2,
        scale: 0.7 + rand() * 0.6,
      });
    }
  }
  for (let i = 0; i < Math.round(260 * (WORLD.half / 450) ** 2); i++) {
    const x = (rand() * 2 - 1) * WORLD.half * 1.6;
    const z = (rand() * 2 - 1) * WORLD.half * 1.6;
    if (Math.hypot(x, z) < 60) continue;
    if (!clearOf(x, z, 3, buildingPlacements) || nearHighway(x, z, 12)) continue;
    treePlacements.push({
      model: Math.floor(rand() * 3),
      x,
      z,
      r: 2,
      rot: rand() * Math.PI * 2,
      scale: 0.7 + rand() * 0.7,
    });
  }
  addGroup(trees, treePlacements);

  // Distant hills ring the horizon.
  const hills = new THREE.InstancedMesh(hillModel(), createRetroMaterial({ vertexColors: true }), 46);
  {
    const m = new THREE.Matrix4();
    const q = new THREE.Quaternion();
    const color = new THREE.Color();
    const hillColors = [0x4c7c3c, 0x5a8a44, 0x40703a, 0x6a8a50, 0x7a7a6a];
    for (let i = 0; i < 46; i++) {
      const a = (i / 46) * Math.PI * 2 + rand() * 0.1;
      const height = 30 + rand() * 70;
      const width = 140 + rand() * 160;
      // Keep every hill clear of the buildable area and the town villages.
      const r = WORLD.half * 1.42 + width + 120 + rand() * 200;
      q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), rand() * Math.PI);
      m.compose(
        new THREE.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r),
        q,
        new THREE.Vector3(width, height, width * (0.7 + rand() * 0.5))
      );
      hills.setMatrixAt(i, m);
      hills.setColorAt(i, color.setHex(hillColors[i % hillColors.length]));
    }
    hills.computeBoundingSphere();
  }
  scene.add(noShadow(hills));

  // Blocky clouds drift overhead.
  const cloudCount = 22;
  const clouds = new THREE.InstancedMesh(
    cloudModel(),
    createRetroMaterial({ vertexColors: true, unlit: true }),
    cloudCount
  );
  const cloudState = [];
  for (let i = 0; i < cloudCount; i++) {
    cloudState.push({
      x: (rand() * 2 - 1) * WORLD.half * 2.4,
      z: (rand() * 2 - 1) * WORLD.half * 2.4,
      y: 140 + rand() * 90,
      s: 1 + rand() * 1.6,
      rot: rand() * Math.PI,
    });
  }
  clouds.frustumCulled = false;
  scene.add(noShadow(clouds));

  const _m = new THREE.Matrix4();
  const _q = new THREE.Quaternion();
  const _p = new THREE.Vector3();
  const _s = new THREE.Vector3();
  const up = new THREE.Vector3(0, 1, 0);

  function update(dt) {
    for (let i = 0; i < cloudCount; i++) {
      const c = cloudState[i];
      c.x += dt * 4;
      if (c.x > WORLD.half * 2.6) c.x = -WORLD.half * 2.6;
      _q.setFromAxisAngle(up, c.rot);
      _m.compose(_p.set(c.x, c.y, c.z), _q, _s.set(c.s, c.s * 0.8, c.s));
      clouds.setMatrixAt(i, _m);
    }
    clouds.instanceMatrix.needsUpdate = true;
  }

  const hidden = new THREE.Matrix4().makeScale(0, 0, 0);

  // Bulldoze scenery that a road path runs through.
  function clearAlongPath(pts, halfWidth) {
    const bounds = pathBounds(pts, halfWidth + 20);
    const touched = new Set();
    for (const item of items) {
      if (!item.alive) continue;
      if (item.x < bounds.minX || item.x > bounds.maxX || item.z < bounds.minZ || item.z > bounds.maxZ) continue;
      const limit = halfWidth + item.r * 0.8;
      for (let i = 0; i < pts.length; i += 1) {
        if (Math.hypot(pts[i].x - item.x, pts[i].z - item.z) < limit) {
          hideItem(item, touched);
          break;
        }
      }
    }
    for (const mesh of touched) mesh.instanceMatrix.needsUpdate = true;
    return touched.size > 0;
  }

  function setBlobsVisible(visible) {
    for (const mesh of blobs) mesh.visible = visible;
  }

  function hideItem(item, touched) {
    item.alive = false;
    item.mesh.setMatrixAt(item.index, hidden);
    item.shadow.setMatrixAt(item.index, hidden);
    touched.add(item.mesh);
    touched.add(item.shadow);
  }

  // Map imports replace the generated countryside inside a square.
  function clearSquare(half) {
    const touched = new Set();
    for (const item of items) {
      if (item.alive && Math.abs(item.x) < half && Math.abs(item.z) < half) hideItem(item, touched);
    }
    for (const mesh of touched) mesh.instanceMatrix.needsUpdate = true;
  }

  function clearDisc(x, z, r) {
    const touched = new Set();
    for (const item of items) {
      if (item.alive && Math.hypot(item.x - x, item.z - z) < r + item.r * 0.6) hideItem(item, touched);
    }
    for (const mesh of touched) mesh.instanceMatrix.needsUpdate = true;
  }

  // Trees from map data, kept apart so a fresh import can drop them.
  let planted = [];
  function plantTrees(points) {
    const before = groups.length;
    const list = points.map((p) => ({
      model: p.kind === 'pine' ? 0 : rand() < 0.8 ? 1 : 2,
      x: p.x,
      z: p.z,
      r: 2,
      rot: rand() * Math.PI * 2,
      scale: 0.6 + rand() * 0.6,
    }));
    addGroup(trees, list);
    planted.push(...groups.slice(before));
  }

  function removePlanted() {
    for (const mesh of planted) {
      scene.remove(mesh);
      const i = groups.indexOf(mesh);
      if (i !== -1) groups.splice(i, 1);
      const b = blobs.indexOf(mesh);
      if (b !== -1) blobs.splice(b, 1);
    }
    const gone = new Set(planted);
    for (let i = items.length - 1; i >= 0; i--) if (gone.has(items[i].mesh)) items.splice(i, 1);
    planted = [];
  }

  // Brings back every generated tree and building (new city / reload).
  function restore() {
    removePlanted();
    const touched = new Set();
    for (const item of items) {
      if (item.alive) continue;
      item.alive = true;
      item.mesh.setMatrixAt(item.index, item.matrix);
      item.shadow.setMatrixAt(item.index, item.shadowMatrix);
      touched.add(item.mesh);
      touched.add(item.shadow);
    }
    for (const mesh of touched) mesh.instanceMatrix.needsUpdate = true;
  }

  return {
    update,
    clearAlongPath,
    clearSquare,
    clearDisc,
    plantTrees,
    restore,
    setBlobsVisible,
    shadowMaterial,
    shadowGeometry,
  };
}

// ---------------------------------------------------------------------------
// Road network: nodes and segments (Cities: Skylines style graph). The same
// code runs the railway network; `kind` decides which one a type joins.
// ---------------------------------------------------------------------------

function laneOffset(type, k) {
  return type.median + (k + 0.5) * type.laneWidth;
}

function outerHalf(type) {
  return type.roadHalf + type.sidewalk;
}

// Two-way roads run lanesPerDir each way; one-way roads run all of their
// lanes from a to b, spread across the whole carriageway.
function laneCount(seg) {
  return seg.oneway ? seg.type.lanesPerDir * 2 : seg.type.lanesPerDir;
}

function segLaneOffset(seg, k) {
  if (!seg.oneway) return laneOffset(seg.type, k);
  const lanes = seg.type.lanesPerDir * 2;
  const width = (seg.type.roadHalf * 2 - 0.6) / lanes;
  return -seg.type.roadHalf + 0.3 + (k + 0.5) * width;
}

// Tunnels deeper than the portal are drawn as a dashed line on the ground,
// so tools aim at the ground there instead of the hidden road.
function visibleHeight(h) {
  return h <= -TUNNEL_CLEARANCE + 0.01 ? 0 : h;
}

// Keeps the drawn height only on pieces that reach the level part of a
// bridge or tunnel; ramp pieces blend between their end heights instead.
function pieceElev(L, ya, yb, mid, s0, s1) {
  if (mid === null || mid === undefined) return null;
  if (s0 <= 0.01 && s1 >= L - 0.01) return mid;
  const f0 = Math.min(L / 2, Math.abs(mid - ya) * RAMP_RUN);
  const f1 = L - Math.min(L / 2, Math.abs(mid - yb) * RAMP_RUN);
  if (f1 - f0 < 0.5) return null;
  return s1 > f0 + 0.25 && s0 < f1 - 0.25 ? mid : null;
}

function rayAtY(ray, y) {
  const d = ray.direction;
  if (Math.abs(d.y) < 1e-6) return null;
  const t = (y - ray.origin.y) / d.y;
  if (t < 0) return null;
  return { x: ray.origin.x + d.x * t, z: ray.origin.z + d.z * t };
}

// Collects flat-shaded triangles. `c` is a gray level or an [r, g, b] color.
function createMeshBuilder() {
  const pos = [];
  const nor = [];
  const col = [];
  const uv = [];

  function vertex(p, n, c, t) {
    pos.push(p.x, p.y, p.z);
    nor.push(n.x, n.y, n.z);
    if (typeof c === 'number') col.push(c, c, c, 0);
    else col.push(c[0], c[1], c[2], 0);
    uv.push(t[0], t[1]);
  }

  return {
    tri(p0, p1, p2, n, c, t0, t1, t2) {
      vertex(p0, n, c, t0);
      vertex(p1, n, c, t1);
      vertex(p2, n, c, t2);
    },
    quad(p0, p1, p2, p3, n, c, t0 = [0, 0], t1 = [1, 0], t2 = [1, 1], t3 = [0, 1]) {
      this.tri(p0, p1, p2, n, c, t0, t1, t2);
      this.tri(p0, p2, p3, n, c, t0, t2, t3);
    },
    get empty() {
      return pos.length === 0;
    },
    build() {
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pos), 3));
      geometry.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(nor), 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(col), 4));
      geometry.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(uv), 2));
      geometry.computeBoundingSphere();
      return geometry;
    },
  };
}

const UP = { x: 0, y: 1, z: 0 };
const DOWN = { x: 0, y: -1, z: 0 };

function v3(x, y, z) {
  return { x, y, z };
}

// Point `o` metres to the right of a path sample, at height y.
function sidePoint(p, o, y) {
  return v3(p.x - p.tz * o, y, p.z + p.tx * o);
}

function colorRGB(hex) {
  const c = new THREE.Color(hex);
  return [c.r, c.g, c.b];
}

// Upright box (pillars, buffer stops, portal lips) turned to face `dir`.
function addBox(builder, cx, cz, y0, y1, halfAcross, halfAlong, dir, c = 0.9) {
  const ax = -dir.z;
  const az = dir.x;
  const corner = (u, v, y) => v3(cx + ax * u + dir.x * v, y, cz + az * u + dir.z * v);
  const faces = [
    [[-1, -1], [1, -1], { x: -dir.x, y: 0, z: -dir.z }],
    [[1, -1], [1, 1], { x: ax, y: 0, z: az }],
    [[1, 1], [-1, 1], { x: dir.x, y: 0, z: dir.z }],
    [[-1, 1], [-1, -1], { x: -ax, y: 0, z: -az }],
  ];
  for (const [p, q, n] of faces) {
    const w = halfAcross * Math.abs(p[0] - q[0]) + halfAlong * Math.abs(p[1] - q[1]);
    builder.quad(
      corner(p[0] * halfAcross, p[1] * halfAlong, y0),
      corner(q[0] * halfAcross, q[1] * halfAlong, y0),
      corner(q[0] * halfAcross, q[1] * halfAlong, y1),
      corner(p[0] * halfAcross, p[1] * halfAlong, y1),
      n,
      c * 0.86,
      [0, 0],
      [w, 0],
      [w, (y1 - y0) / 2],
      [0, (y1 - y0) / 2]
    );
  }
  builder.quad(
    corner(-halfAcross, -halfAlong, y1),
    corner(halfAcross, -halfAlong, y1),
    corner(halfAcross, halfAlong, y1),
    corner(-halfAcross, halfAlong, y1),
    UP,
    c,
    [0, 0],
    [halfAcross, 0],
    [halfAcross, halfAlong],
    [0, halfAlong]
  );
}

// Builds a curb + sidewalk strip along `line` (curb edge), offset by
// `outward` normals (unit, pointing away from the road). Line points may
// carry a height `h` for bridges and cuttings.
function addSidewalkStrip(builder, line, outward, width, vStart = 0) {
  let v = vStart;

  for (let i = 1; i < line.length; i++) {
    const a = line[i - 1];
    const b = line[i];
    const na = outward[i - 1];
    const nb = outward[i];
    const ha = a.h ?? 0;
    const hb = b.h ?? 0;
    const step = Math.hypot(b.x - a.x, b.z - a.z);
    const v0 = v / 2;
    const v1 = (v + step) / 2;
    v += step;

    const ai = v3(a.x, WORLD.curbY + ha, a.z);
    const bi = v3(b.x, WORLD.curbY + hb, b.z);
    const ao = v3(a.x + na.x * width, ai.y, a.z + na.z * width);
    const bo = v3(b.x + nb.x * width, bi.y, b.z + nb.z * width);
    const u1 = width / 2;
    builder.quad(ai, bi, bo, ao, UP, 1, [0, v0], [0, v1], [u1, v1], [u1, v0]);

    // Curb face toward the road.
    const faceN = { x: -(na.x + nb.x) / 2, y: 0, z: -(na.z + nb.z) / 2 };
    builder.quad(
      v3(a.x, WORLD.roadY + ha, a.z),
      v3(b.x, WORLD.roadY + hb, b.z),
      bi,
      ai,
      faceN,
      0.72,
      [0, v0],
      [0, v1],
      [0.1, v1],
      [0.1, v0]
    );

    // Outer face down to the grass (or the underside of a deck).
    const bottom = (h) => (h > 0.3 ? h - 1 : h);
    const outN = { x: (na.x + nb.x) / 2, y: 0, z: (na.z + nb.z) / 2 };
    builder.quad(
      ao,
      bo,
      v3(bo.x, bottom(hb), bo.z),
      v3(ao.x, bottom(ha), ao.z),
      outN,
      0.72,
      [0, v0],
      [0, v1],
      [0.1, v1],
      [0.1, v0]
    );
  }
  return v;
}

// Materials for each batched part kind, shared by every network.
const ROAD_PART_KINDS = new Map();

function roadPartKind(kind) {
  let def = ROAD_PART_KINDS.get(kind);
  if (def) return def;
  const [group, key, flag] = kind.split(':');
  if (group === 'surf') {
    const type = ROAD_TYPES[key];
    if (type.kind === 'rail') {
      def = { material: createRetroMaterial({ map: TEXTURES.rail, side: THREE.DoubleSide, polygonOffset: -4 }) };
    } else {
      const map = flag ? TEXTURES.roadOneway[key] : TEXTURES.road[key];
      def = {
        material: createRetroMaterial({
          map,
          roadMask: true,
          paintVertex: true,
          vertexColors: true,
          side: THREE.DoubleSide,
          polygonOffset: -2,
        }),
      };
    }
  } else if (group === 'asphalt') {
    def = { material: createRetroMaterial({ map: TEXTURES.asphalt, roadMask: true, side: THREE.DoubleSide, polygonOffset: -1 }) };
  } else if (group === 'walk') {
    def = { material: createRetroMaterial({ map: TEXTURES.concrete, vertexColors: true, side: THREE.DoubleSide }) };
  } else if (group === 'zebra') {
    def = {
      material: createRetroMaterial({ map: TEXTURES.zebra, alphaTest: true, side: THREE.DoubleSide, polygonOffset: -3 }),
    };
  } else if (group === 'struct') {
    def = { material: createRetroMaterial({ map: TEXTURES.concrete, vertexColors: true, side: THREE.DoubleSide }), cast: true };
  } else if (group === 'bank') {
    def = { material: createRetroMaterial({ map: TEXTURES.grass, vertexColors: true, side: THREE.DoubleSide }), cast: true };
