  } else if (group === 'grass') {
    def = { material: createRetroMaterial({ map: TEXTURES.grass, vertexColors: true, side: THREE.DoubleSide, polygonOffset: -2 }) };
  } else if (group === 'ballast') {
    def = { material: createRetroMaterial({ map: TEXTURES.gravel, side: THREE.DoubleSide, polygonOffset: -1 }) };
  } else if (group === 'hole') {
    def = { material: makeHoleMaterial(), renderOrder: -10 };
  } else if (group === 'mouth') {
    def = { material: createRetroMaterial({ color: 0x080808, unlit: true, side: THREE.DoubleSide }) };
  } else if (group === 'under') {
    def = {
      material: createRetroMaterial({ vertexColors: true, unlit: true, alpha: 0.6, side: THREE.DoubleSide, polygonOffset: -1 }),
    };
  } else {
    throw new Error(`unknown road part ${kind}`);
  }
  ROAD_PART_KINDS.set(kind, def);
  return def;
}

function createRoadNetwork(scene, { scenery, kind = 'road' }) {
  const nodes = new Map();
  const segments = new Map();
  const islands = new Map();
  const isRail = kind === 'rail';
  let nextNodeId = 1;
  let nextSegId = 1;
  let nextIslandId = 1;
  let version = 0;
  let lastCreated = [];
  const hooks = {
    segmentRemoved: () => {},
    segmentsReshaped: () => {},
  };

  const root = new THREE.Group();
  root.name = isRail ? 'rails' : 'roads';
  scene.add(root);
  const batcher = createChunkBatcher(root, roadPartKind, 256);

  const highlight = {
    material: createRetroMaterial({
      color: 0xff0000,
      unlit: true,
      alpha: 0.5,
      side: THREE.DoubleSide,
      depthWrite: false,
      polygonOffset: -8,
    }),
    mesh: null,
    key: '',
  };

  // ----- graph primitives -------------------------------------------------

  function createNode(x, z, flags = {}) {
    const node = { id: nextNodeId++, x, z, y: 0, segs: new Set(), outside: false, ...flags };
    nodes.set(node.id, node);
    return node;
  }

  function createSegment(aId, bId, points, type, color, { locked = false, oneway = false, elev = null, name = null } = {}) {
    const a = nodes.get(aId);
    const b = nodes.get(bId);
    const pts = points.map((p) => ({ x: p.x, z: p.z }));

    if (distance2D(pts[0], a) > 0.05) {
      if (distance2D(pts[0], a) < 0.6) pts[0] = { x: a.x, z: a.z };
      else pts.unshift({ x: a.x, z: a.z });
    }
    const last = pts.length - 1;
    if (distance2D(pts[last], b) > 0.05) {
      if (distance2D(pts[last], b) < 0.6) pts[last] = { x: b.x, z: b.z };
      else pts.push({ x: b.x, z: b.z });
    }
    pts[0] = { x: a.x, z: a.z };
    pts[pts.length - 1] = { x: b.x, z: b.z };

    const path = makePath(pts);
    const seg = {
      id: nextSegId++,
      a: aId,
      b: bId,
      type,
      color,
      oneway: !!oneway,
      elev: elev === undefined ? null : elev,
      path,
      bounds: pathBounds(path.pts, outerHalf(type) + 1),
      trimA: 0,
      trimB: 0,
      locked,
      name: name || null,
      version: 0,
    };
    segments.set(seg.id, seg);
    a.segs.add(seg.id);
    b.segs.add(seg.id);
    return seg;
  }

  function heightAt(seg, s) {
    const a = nodes.get(seg.a);
    const b = nodes.get(seg.b);
    return profileHeight(seg.path.length, a ? a.y : 0, b ? b.y : 0, seg.elev, s);
  }

  function deleteSegmentRaw(seg) {
    nodes.get(seg.a)?.segs.delete(seg.id);
    nodes.get(seg.b)?.segs.delete(seg.id);
    batcher.remove(seg);
    segments.delete(seg.id);
    if (highlight.segId === seg.id) setHighlight(null);
    hooks.segmentRemoved(seg);
  }

  function deleteNodeIfOrphan(nodeId) {
    const node = nodes.get(nodeId);
    if (!node || node.segs.size > 0) return false;
    batcher.remove(node);
    nodes.delete(nodeId);
    return true;
  }

  function splitSegment(seg, s) {
    const point = pathAt(seg.path, s);
    const L = seg.path.length;
    const ya = nodes.get(seg.a).y;
    const yb = nodes.get(seg.b).y;
    const node = createNode(point.x, point.z, { y: heightAt(seg, s) });
    const leftPts = subPath(seg.path, 0, s);
    const rightPts = subPath(seg.path, s, L);
    const opts = { locked: seg.locked, oneway: seg.oneway, name: seg.name };
    const left = createSegment(seg.a, node.id, leftPts, seg.type, seg.color, {
      ...opts,
      elev: pieceElev(L, ya, yb, seg.elev, 0, s),
    });
    const right = createSegment(node.id, seg.b, rightPts, seg.type, seg.color, {
      ...opts,
      elev: pieceElev(L, ya, yb, seg.elev, s, L),
    });
    deleteSegmentRaw(seg);
    return { node, left, right };
  }

  // ----- node geometry -----------------------------------------------------

  function nodeEnds(node) {
    const ends = [];
    const tmp = {};
    for (const segId of node.segs) {
      const seg = segments.get(segId);
      if (!seg) continue;
      const probe = Math.min(2, seg.path.length * 0.3);
      if (seg.a === node.id) {
        pathAt(seg.path, probe, tmp);
        ends.push({ seg, atStart: true, dir: { x: tmp.tx, z: tmp.tz } });
      }
      if (seg.b === node.id) {
        pathAt(seg.path, seg.path.length - probe, tmp);
        ends.push({ seg, atStart: false, dir: { x: -tmp.tx, z: -tmp.tz } });
      }
    }
    for (const end of ends) end.angle = Math.atan2(end.dir.z, end.dir.x);
    ends.sort((p, q) => p.angle - q.angle);
    return ends;
  }

  function setTrim(end, value) {
    if (end.atStart) end.seg.trimA = value;
    else end.seg.trimB = value;
  }

  function getTrim(end) {
    return end.atStart ? end.seg.trimA : end.seg.trimB;
  }

  function computeTrims(node) {
    const ends = nodeEnds(node);
    const n = ends.length;
    if (n === 0) return;

    // Tracks run straight through their nodes; switches just overlap.
    if (isRail) {
      for (const e of ends) setTrim(e, 0);
      return;
    }

    if (n === 1) {
      setTrim(ends[0], ends[0].seg.type.roadHalf * 1.125);
    } else {
      const TAU = Math.PI * 2;
      const needFor = (gap, h1, h2) => (gap >= Math.PI - 1e-3 ? 0 : Math.max(h1, h2) / Math.tan(gap / 2));

      for (let i = 0; i < n; i++) {
        const e = ends[i];
        const prev = ends[(i - 1 + n) % n];
        const next = ends[(i + 1) % n];
        const gapNext = ((next.angle - e.angle) % TAU + TAU) % TAU || TAU;
        const gapPrev = ((e.angle - prev.angle) % TAU + TAU) % TAU || TAU;
        const h = outerHalf(e.seg.type);
        const need = Math.max(
          needFor(gapNext, h, outerHalf(next.seg.type)),
          needFor(gapPrev, h, outerHalf(prev.seg.type))
        );
        // Wider mouths give the corner curves room to round off.
        let trim = n >= 3 ? Math.max(need + 3, e.seg.type.roadHalf + 2.5) : need * 1.6 + 0.5;
        trim = Math.min(trim, 34);
        setTrim(e, trim);
      }
    }

    for (const end of ends) {
      const limit = end.seg.path.length * (end.seg.a === end.seg.b ? 0.24 : 0.45);
      if (getTrim(end) > limit) setTrim(end, limit);
    }
  }

  function part(list, kindName, builder) {
    if (!builder.empty) list.push({ kind: kindName, geometry: builder.build() });
  }

  function buildSegmentParts(seg) {
    seg.version++;
    const { type } = seg;
    const hw = type.roadHalf;
    const W = outerHalf(type);
    let s0 = seg.trimA;
    let s1 = seg.path.length - seg.trimB;
    if (s1 - s0 < 0.2) {
      const mid = (s0 + s1) / 2;
      s0 = mid - 0.1;
      s1 = mid + 0.1;
    }

    const center = pathRange(seg.path, s0, s1, 0);
    for (const p of center) p.h = heightAt(seg, p.s);
    const deep = (h) => h <= -TUNNEL_CLEARANCE;
    const paint = colorRGB(seg.color);

    const surf = createMeshBuilder();
    const walk = createMeshBuilder();
    const struct = createMeshBuilder();
    const bank = createMeshBuilder();
    const hole = createMeshBuilder();
    const mouth = createMeshBuilder();
    const under = createMeshBuilder();
    const deckTop = (h) => (type.sidewalk > 0 ? WORLD.curbY : WORLD.roadY) + h;

    let lastClass = null;
    for (let i = 1; i < center.length; i++) {
      const a = center[i - 1];
      const b = center[i];
      const hm = (a.h + b.h) / 2;
      const cls = hm >= 3.5 ? 'deck' : hm > 0.3 ? 'bank' : hm < -TUNNEL_CLEARANCE ? 'deep' : hm < -0.3 ? 'trench' : 'grade';

      if (cls === 'deep') {
        // Dashed guide on the ground above tunnels and metro lines.
        if (Math.floor(a.s / 4) % 2 === 0) {
          const w = isRail ? 0.7 : 1;
          under.quad(
            sidePoint(a, -w, 0.03),
            sidePoint(b, -w, 0.03),
            sidePoint(b, w, 0.03),
            sidePoint(a, w, 0.03),
            UP,
            paint
          );
        }
      } else {
        const ya = WORLD.roadY + a.h;
        const yb = WORLD.roadY + b.h;
        // One-way tiles are twice as long (an arrow every other dash).
        const tile = type.texLength * (seg.oneway && !isRail ? 2 : 1);
        const va = a.s / tile;
        const vb = b.s / tile;
        surf.quad(
          sidePoint(a, -hw, ya),
          sidePoint(b, -hw, yb),
          sidePoint(b, hw, yb),
          sidePoint(a, hw, ya),
          UP,
          paint,
          [0, va],
          [0, vb],
          [1, vb],
          [1, va]
        );
      }

      for (const sd of [-1, 1]) {
        const out = { x: -a.tz * sd, y: 0, z: a.tx * sd };
        if (cls === 'bank') {
          const ta = deckTop(a.h);
          const tb = deckTop(b.h);
          const ra = W + a.h * 1.5;
          const rb = W + b.h * 1.5;
          bank.quad(
            sidePoint(a, W * sd, ta),
            sidePoint(b, W * sd, tb),
            sidePoint(b, rb * sd, 0),
            sidePoint(a, ra * sd, 0),
            { x: out.x * 0.55, y: 0.83, z: out.z * 0.55 },
            0.92,
            [0, a.s / 4],
            [0, b.s / 4],
            [rb / 4, b.s / 4],
            [ra / 4, a.s / 4]
          );
        } else if (cls === 'deck') {
          const ta = deckTop(a.h);
          const tb = deckTop(b.h);
          const span = [
            [0, a.s / 2],
            [0, b.s / 2],
            [0.5, b.s / 2],
            [0.5, a.s / 2],
          ];
          struct.quad(sidePoint(a, W * sd, ta), sidePoint(b, W * sd, tb), sidePoint(b, W * sd, b.h - 1), sidePoint(a, W * sd, a.h - 1), out, 0.8, ...span);
          if (!isRail || hm > 6) {
            struct.quad(
              sidePoint(a, W * sd, ta),
              sidePoint(b, W * sd, tb),
              sidePoint(b, W * sd, tb + 0.9),
              sidePoint(a, W * sd, ta + 0.9),
              out,
              0.95,
              ...span
            );
          }
        } else if (cls === 'trench') {
          struct.quad(
            sidePoint(a, W * sd, a.h - 0.2),
            sidePoint(b, W * sd, b.h - 0.2),
            sidePoint(b, W * sd, 0.05),
            sidePoint(a, W * sd, 0.05),
            { x: -out.x, y: 0, z: -out.z },
            0.74,
            [0, a.s / 2],
            [0, b.s / 2],
            [2, b.s / 2],
            [2, a.s / 2]
          );
          struct.quad(
            sidePoint(a, W * sd, 0.07),
            sidePoint(b, W * sd, 0.07),
            sidePoint(b, (W + 0.5) * sd, 0.07),
            sidePoint(a, (W + 0.5) * sd, 0.07),
            UP,
            1,
            [0, a.s / 2],
            [0, b.s / 2],
            [0.25, b.s / 2],
            [0.25, a.s / 2]
          );
        }
      }

      if (cls === 'deck') {
        struct.quad(sidePoint(a, -W, a.h - 1), sidePoint(b, -W, b.h - 1), sidePoint(b, W, b.h - 1), sidePoint(a, W, a.h - 1), DOWN, 0.6);
        // Pillars every 24 m once there is room underneath.
        if (Math.floor(a.s / 24) !== Math.floor(b.s / 24) && b.h >= 4) {
          const dir = { x: b.tx, z: b.tz };
          if (W > 6) {
            for (const sd of [-1, 1]) {
              const p = sidePoint(b, W * 0.55 * sd, 0);
              addBox(struct, p.x, p.z, 0, b.h - 1, 0.8, 0.8, dir);
            }
          } else {
            addBox(struct, b.x, b.z, 0, b.h - 1, Math.min(W * 0.6, 2.6), 0.75, dir);
          }
        }
      }
      if (cls === 'trench') {
        hole.quad(sidePoint(a, -W, 0.02), sidePoint(b, -W, 0.02), sidePoint(b, W, 0.02), sidePoint(a, W, 0.02), UP, 1);
      }

      // Portal where a cutting dives under the ground.
      if (lastClass && ((lastClass === 'trench' && cls === 'deep') || (lastClass === 'deep' && cls === 'trench'))) {
        const p = a;
        const yRoad = WORLD.roadY + p.h;
        mouth.quad(sidePoint(p, -W, yRoad), sidePoint(p, W, yRoad), sidePoint(p, W, 0.06), sidePoint(p, -W, 0.06), { x: p.tx, y: 0, z: p.tz }, 1);
        const away = cls === 'deep' ? 1 : -1;
        const dir = { x: p.tx, z: p.tz };
        addBox(struct, p.x + p.tx * 0.5 * away, p.z + p.tz * 0.5 * away, -0.2, 0.9, W + 0.7, 0.5, dir, 0.84);
      }
      // Abutment where an embankment meets a deck.
      if (lastClass && ((lastClass === 'bank' && cls === 'deck') || (lastClass === 'deck' && cls === 'bank'))) {
        const p = a;
        struct.quad(sidePoint(p, -W, 0), sidePoint(p, W, 0), sidePoint(p, W, deckTop(p.h)), sidePoint(p, -W, deckTop(p.h)), { x: p.tx, y: 0, z: p.tz }, 0.78);
      }
      lastClass = cls;
    }

    if (type.sidewalk > 0) {
      const visible = center.filter((p) => !deep(p.h));
      if (visible.length > 1) {
        for (const sd of [-1, 1]) {
          const line = visible.map((p) => ({ x: p.x - p.tz * hw * sd, z: p.z + p.tx * hw * sd, h: p.h }));
          const outward = visible.map((p) => ({ x: -p.tz * sd, z: p.tx * sd }));
          addSidewalkStrip(walk, line, outward, type.sidewalk);
        }
      }
    }

    const parts = [];
    part(parts, `surf:${type.key}${seg.oneway && !isRail ? ':ow' : ''}`, surf);
    part(parts, 'walk', walk);
    part(parts, 'struct', struct);
    part(parts, 'bank', bank);
    part(parts, 'hole', hole);
    part(parts, 'mouth', mouth);
    part(parts, 'under', under);
    const mid = pathAt(seg.path, seg.path.length / 2);
    batcher.set(seg, parts, mid.x, mid.z);
  }

  function buildNodeParts(node) {
    const parts = [];
    const done = () => batcher.set(node, parts, node.x, node.z);
    if (node.outside) return done();
    const ends = nodeEnds(node);
    const n = ends.length;
    if (n === 0) return done();
    const y0 = node.y;
    if (y0 <= -TUNNEL_CLEARANCE) return done();

    if (isRail) {
      const ballast = createMeshBuilder();
      let r = 0;
      for (const e of ends) r = Math.max(r, e.seg.type.roadHalf + 0.3);
      const y = WORLD.roadY + y0 - 0.01;
      const steps = 12;
      for (let i = 0; i < steps; i++) {
        const a0 = (i / steps) * Math.PI * 2;
        const a1 = ((i + 1) / steps) * Math.PI * 2;
        const p = v3(node.x + Math.cos(a0) * r, y, node.z + Math.sin(a0) * r);
        const q = v3(node.x + Math.cos(a1) * r, y, node.z + Math.sin(a1) * r);
        ballast.tri(v3(node.x, y, node.z), q, p, UP, 1, [0, 0], [q.x / 4, q.z / 4], [p.x / 4, p.z / 4]);
      }
      part(parts, 'ballast', ballast);
      if (n === 1) {
        // Buffer stop at the end of the line.
        const struct = createMeshBuilder();
        const e = ends[0];
        addBox(struct, node.x - e.dir.x * 0.6, node.z - e.dir.z * 0.6, y + 0.01, y + 1.2, 1.4, 0.35, e.dir, 0.7);
        part(parts, 'struct', struct);
      }
      if (y0 >= 4) {
        const struct = createMeshBuilder();
        addBox(struct, node.x, node.z, 0, y0 - 1, 1.4, 0.8, ends[0].dir);
        part(parts, 'struct', struct);
      }
      return done();
    }

    const tmp = {};
    for (const e of ends) {
      const s = e.atStart ? e.seg.trimA : e.seg.path.length - e.seg.trimB;
      pathAt(e.seg.path, s, tmp);
      const dir = e.atStart ? { x: tmp.tx, z: tmp.tz } : { x: -tmp.tx, z: -tmp.tz };
      const r = { x: -dir.z, z: dir.x };
      const hw = e.seg.type.roadHalf;
      e.P = { x: tmp.x, z: tmp.z };
      e.edgeDir = dir;
      e.r = r;
      e.L = { x: tmp.x - r.x * hw, z: tmp.z - r.z * hw };
      e.R = { x: tmp.x + r.x * hw, z: tmp.z + r.z * hw };
      e.hw = hw;
    }

    const polygon = [];
    const corners = [];
    const center = { x: node.x, z: node.z };

    if (n === 1) {
      const e = ends[0];
      const radius = Math.max(distance2D(e.R, center), e.hw * 1.2);
      const aR = Math.atan2(e.R.z - center.z, e.R.x - center.x);
      let aL = Math.atan2(e.L.z - center.z, e.L.x - center.x);
      while (aL <= aR) aL += Math.PI * 2;
      const arc = [];
      const steps = 14;
      for (let i = 0; i <= steps; i++) {
        const a = lerp(aR, aL, i / steps);
        arc.push({ x: center.x + Math.cos(a) * radius, z: center.z + Math.sin(a) * radius });
      }
      polygon.push(e.L, ...arc);
      corners.push({ curve: arc, sidewalk: e.seg.type.sidewalk });
    } else {
      let maxTrim = 0;
      for (const e of ends) maxTrim = Math.max(maxTrim, getTrim(e) + e.hw);

      for (let i = 0; i < n; i++) {
        const e = ends[i];
        const next = ends[(i + 1) % n];
        polygon.push(e.L, e.R);

        const hit = linesIntersect(e.R, e.edgeDir, next.L, next.edgeDir);
        let control;
        if (hit && hit.t <= 0.5 && distance2D(hit, center) < maxTrim * 2.5) {
          control = hit;
        } else {
          control = { x: (e.R.x + next.L.x) / 2, z: (e.R.z + next.L.z) / 2 };
        }
        const curve = quadraticBezierPoints(e.R, control, next.L, 1.2);
        for (let k = 1; k < curve.length - 1; k++) polygon.push(curve[k]);
        corners.push({
          curve,
          sidewalk: Math.max(e.seg.type.sidewalk, next.seg.type.sidewalk),
        });
      }
    }

    // Asphalt fan.
    const asphalt = createMeshBuilder();
    const y = WORLD.roadY + y0;
    const c3 = v3(center.x, y, center.z);
    const tuv = (p) => [p.x / 8, p.z / 8];
    for (let i = 0; i < polygon.length; i++) {
      const a = polygon[i];
      const b = polygon[(i + 1) % polygon.length];
      asphalt.tri(c3, v3(a.x, y, a.z), v3(b.x, y, b.z), UP, 1, tuv(center), tuv(a), tuv(b));
    }
    part(parts, 'asphalt', asphalt);

    // Sidewalk corners, and the outline of the whole junction.
    const walk = createMeshBuilder();
    const outline = [];
    for (const corner of corners) {
      const { curve } = corner;
      const outward = curve.map((p, i) => {
        const a = curve[Math.max(0, i - 1)];
        const b = curve[Math.min(curve.length - 1, i + 1)];
        const t = normalize2D(b.x - a.x, b.z - a.z);
        let nx = -t.z;
        let nz = t.x;
        const mid = curve[Math.floor(curve.length / 2)];
        const awayX = p.x - center.x + (mid.x - center.x) * 0.25;
        const awayZ = p.z - center.z + (mid.z - center.z) * 0.25;
        if (nx * awayX + nz * awayZ < 0) {
          nx = -nx;
          nz = -nz;
        }
        return { x: nx, z: nz };
      });
      const w = corner.sidewalk;
      outline.push(curve.map((p, i) => ({ x: p.x + outward[i].x * w, z: p.z + outward[i].z * w, nx: outward[i].x, nz: outward[i].z })));
      if (!w) continue;
      addSidewalkStrip(
        walk,
        curve.map((p) => ({ x: p.x, z: p.z, h: y0 })),
        outward,
        w
      );
    }
    part(parts, 'walk', walk);

    // Zebra crossings on every arm of a real junction.
    if (n >= 3 && Math.abs(y0) < 0.5) {
      const zebra = createMeshBuilder();
      const ym = WORLD.markY + y0;
      for (const e of ends) {
        const free = e.seg.path.length - e.seg.trimA - e.seg.trimB;
        if (free < 6 || e.seg.oneway) continue;
        const depth = 2.6;
        const w = e.hw * 0.92;
        const P0 = { x: e.P.x + e.edgeDir.x * 0.4, z: e.P.z + e.edgeDir.z * 0.4 };
        const P1 = { x: P0.x + e.edgeDir.x * depth, z: P0.z + e.edgeDir.z * depth };
        const uMax = (w * 2) / 4;
        zebra.quad(
          v3(P0.x - e.r.x * w, ym, P0.z - e.r.z * w),
          v3(P0.x + e.r.x * w, ym, P0.z + e.r.z * w),
          v3(P1.x + e.r.x * w, ym, P1.z + e.r.z * w),
          v3(P1.x - e.r.x * w, ym, P1.z - e.r.z * w),
          UP,
          1,
          [0, 0],
          [uMax, 0],
          [uMax, 1],
          [0, 1]
        );
      }
      part(parts, 'zebra', zebra);
    }

    // Raised junctions get a skirt and a pillar; sunken ones a pit.
    if (y0 > 0.3 || (y0 < -0.3 && y0 > -TUNNEL_CLEARANCE)) {
      const struct = createMeshBuilder();
      const ring = outline.flat();
      const top = WORLD.curbY + y0;
      const bottom = y0 > 0.3 ? (y0 >= 3.5 ? y0 - 1 : 0) : y0 - 0.2;
      const wallTop = y0 > 0.3 ? top : 0.05;
      for (const curve of outline) {
        for (let i = 1; i < curve.length; i++) {
          const a = curve[i - 1];
          const b = curve[i];
          const nrm = y0 > 0.3 ? { x: a.nx, y: 0, z: a.nz } : { x: -a.nx, y: 0, z: -a.nz };
          struct.quad(v3(a.x, bottom, a.z), v3(b.x, bottom, b.z), v3(b.x, wallTop, b.z), v3(a.x, wallTop, a.z), nrm, 0.78);
        }
      }
      if (y0 >= 3.5 && ring.length > 2) {
        for (let i = 0; i < ring.length; i++) {
          const a = ring[i];
          const b = ring[(i + 1) % ring.length];
          struct.tri(v3(center.x, bottom, center.z), v3(b.x, bottom, b.z), v3(a.x, bottom, a.z), DOWN, 0.6, [0, 0], [1, 0], [0, 1]);
        }
        if (y0 >= 4) addBox(struct, center.x, center.z, 0, y0 - 1, 1.6, 1.6, ends[0].edgeDir);
      }
      part(parts, 'struct', struct);
      if (y0 < -0.3) {
        const hole = createMeshBuilder();
        const pit = ring.length > 2 ? ring : polygon;
        for (let i = 0; i < pit.length; i++) {
          const a = pit[i];
          const b = pit[(i + 1) % pit.length];
          hole.tri(v3(center.x, 0.02, center.z), v3(a.x, 0.02, a.z), v3(b.x, 0.02, b.z), UP, 1, [0, 0], [0, 0], [0, 0]);
        }
        part(parts, 'hole', hole);
      }
    }
    return done();
  }

  function buildIslandParts(island) {
    const parts = [];
    const grass = createMeshBuilder();
    const walk = createMeshBuilder();
    const steps = 28;
    const y = WORLD.curbY + 0.04;
    const ring = [];
    for (let i = 0; i <= steps; i++) {
      const a = (i / steps) * Math.PI * 2;
      ring.push({ x: island.x + Math.cos(a) * island.r, z: island.z + Math.sin(a) * island.r, nx: Math.cos(a), nz: Math.sin(a) });
    }
    for (let i = 1; i < ring.length; i++) {
      const a = ring[i - 1];
      const b = ring[i];
      grass.tri(v3(island.x, y, island.z), v3(b.x, y, b.z), v3(a.x, y, a.z), UP, 1, [island.x / 4, island.z / 4], [b.x / 4, b.z / 4], [a.x / 4, a.z / 4]);
      walk.quad(v3(a.x, WORLD.roadY, a.z), v3(b.x, WORLD.roadY, b.z), v3(b.x, y, b.z), v3(a.x, y, a.z), { x: a.nx, y: 0, z: a.nz }, 0.8);
    }
    part(parts, 'grass', grass);
    part(parts, 'walk', walk);
    batcher.set(island, parts, island.x, island.z);
  }

  function rebuildAround(nodeIds) {
    const nodeSet = new Set();
    for (const id of nodeIds) if (nodes.has(id)) nodeSet.add(id);

    for (const id of nodeSet) computeTrims(nodes.get(id));

    const segSet = new Set();
    for (const id of nodeSet) {
      for (const segId of nodes.get(id).segs) segSet.add(segId);
    }
    for (const segId of segSet) buildSegmentParts(segments.get(segId));
    for (const id of nodeSet) buildNodeParts(nodes.get(id));
    batcher.flush();

    version++;
    hooks.segmentsReshaped(segSet);
  }

  function pruneIslands() {
    for (const island of Array.from(islands.values())) {
      const near = pathBounds([island], island.r + 2);
      let kept = false;
      for (const seg of segments.values()) {
        if (!boundsOverlap(near, seg.bounds)) continue;
        const hit = closestOnPath(seg.path, island.x, island.z);
        if (hit.dist < island.r + outerHalf(seg.type) + 2) {
          kept = true;
          break;
        }
      }
      if (!kept) {
        batcher.remove(island);
        islands.delete(island.id);
      }
    }
    batcher.flush();
  }

  // ----- queries -----------------------------------------------------------

  // Coarse grid of segments, rebuilt lazily after edits (big imported maps).
  const GRID = 64;
  let grid = null;
  let gridVersion = -1;

  function segsNear(minX, minZ, maxX, maxZ) {
    if (!grid || gridVersion !== version) {
      grid = new Map();
      gridVersion = version;
      for (const seg of segments.values()) {
        const b = seg.bounds;
        for (let cx = Math.floor(b.minX / GRID); cx <= Math.floor(b.maxX / GRID); cx++) {
          for (let cz = Math.floor(b.minZ / GRID); cz <= Math.floor(b.maxZ / GRID); cz++) {
            const key = `${cx},${cz}`;
            let list = grid.get(key);
            if (!list) grid.set(key, (list = []));
            list.push(seg);
          }
        }
      }
    }
    const out = new Set();
    for (let cx = Math.floor(minX / GRID); cx <= Math.floor(maxX / GRID); cx++) {
      for (let cz = Math.floor(minZ / GRID); cz <= Math.floor(maxZ / GRID); cz++) {
        for (const seg of grid.get(`${cx},${cz}`) ?? []) if (segments.has(seg.id)) out.add(seg);
      }
    }
    return out;
  }

  function findSnap(x, z, radius, { excludeNode = null } = {}) {
    let bestNode = null;
    let bestNodeDist = Infinity;
    for (const node of nodes.values()) {
      if (node.id === excludeNode || node.outside) continue;
      let r = radius;
      for (const segId of node.segs) {
        const seg = segments.get(segId);
        if (seg) r = Math.max(r, seg.type.roadHalf + 1.5);
      }
      const d = Math.hypot(node.x - x, node.z - z);
      if (d < r && d < bestNodeDist) {
        bestNode = node;
        bestNodeDist = d;
      }
    }
    if (bestNode) return { kind: 'node', node: bestNode, x: bestNode.x, z: bestNode.z, y: bestNode.y };

    let best = null;
    const probe = { minX: x, maxX: x, minZ: z, maxZ: z };
    for (const seg of segments.values()) {
      if (!boundsOverlap(probe, seg.bounds)) continue;
      const hit = closestOnPath(seg.path, x, z);
      const limit = Math.max(radius, seg.type.roadHalf + 1);
      if (hit.dist < limit && (!best || hit.dist < best.dist)) best = { seg, ...hit };
    }
    return best ? segSnap(best, excludeNode) : { kind: 'free', x, z, y: 0 };
  }

  function segSnap(best, excludeNode) {
    const { seg } = best;
    if (best.s <= Math.max(ROAD.nodeSnapAlong, seg.trimA + 1)) {
      const node = nodes.get(seg.a);
      if (node.id !== excludeNode) return { kind: 'node', node, x: node.x, z: node.z, y: node.y };
    }
    if (seg.path.length - best.s <= Math.max(ROAD.nodeSnapAlong, seg.trimB + 1)) {
      const node = nodes.get(seg.b);
      if (node.id !== excludeNode) return { kind: 'node', node, x: node.x, z: node.z, y: node.y };
    }
    return { kind: 'seg', seg, s: best.s, x: best.x, z: best.z, y: heightAt(seg, best.s) };
  }

  // Closest road under a camera ray, looking at each road at its own height.
  function rayHit(ray, seg) {
    let p = rayAtY(ray, WORLD.roadY);
    if (!p) return null;
    let hit = closestOnPath(seg.path, p.x, p.z);
    for (let i = 0; i < 2; i++) {
      const h = visibleHeight(heightAt(seg, hit.s));
      p = rayAtY(ray, WORLD.roadY + h);
      if (!p) return null;
      hit = closestOnPath(seg.path, p.x, p.z);
    }
    return hit;
  }

  function rayProbe(ray) {
    const lo = rayAtY(ray, -2);
    const hi = rayAtY(ray, 24) ?? lo;
    if (!lo) return null;
    return {
      minX: Math.min(lo.x, hi.x),
      maxX: Math.max(lo.x, hi.x),
      minZ: Math.min(lo.z, hi.z),
      maxZ: Math.max(lo.z, hi.z),
    };
  }

  function findSnapRay(ray, brushY, radius, { excludeNode = null } = {}) {
    let bestNode = null;
    let bestNodeDist = Infinity;
    for (const node of nodes.values()) {
      if (node.id === excludeNode || node.outside) continue;
      const p = rayAtY(ray, WORLD.roadY + visibleHeight(node.y));
      if (!p) continue;
      let r = radius;
      for (const segId of node.segs) {
        const seg = segments.get(segId);
        if (seg) r = Math.max(r, seg.type.roadHalf + 1.5);
      }
      const d = Math.hypot(node.x - p.x, node.z - p.z);
      if (d < r && d < bestNodeDist) {
        bestNode = node;
        bestNodeDist = d;
      }
    }
    if (bestNode) return { kind: 'node', node: bestNode, x: bestNode.x, z: bestNode.z, y: bestNode.y };

    const probe = rayProbe(ray);
    let best = null;
    if (probe) {
      for (const seg of segments.values()) {
        if (!boundsOverlap(probe, seg.bounds)) continue;
        const hit = rayHit(ray, seg);
        if (!hit) continue;
        const limit = Math.max(radius, seg.type.roadHalf + 1);
        if (hit.dist < limit && (!best || hit.dist < best.dist)) best = { seg, ...hit };
      }
    }
    if (best) return segSnap(best, excludeNode);
    const p = rayAtY(ray, WORLD.roadY + visibleHeight(brushY)) ?? { x: 0, z: 0 };
    return { kind: 'free', x: p.x, z: p.z, y: brushY };
  }

  function pickSegment(x, z) {
    let best = null;
    const probe = { minX: x, maxX: x, minZ: z, maxZ: z };
    for (const seg of segments.values()) {
      if (!boundsOverlap(probe, seg.bounds)) continue;
      const hit = closestOnPath(seg.path, x, z);
      if (hit.dist <= outerHalf(seg.type) + 0.5 && (!best || hit.dist < best.dist)) {
        best = { seg, dist: hit.dist };
      }
    }
    return best ? best.seg : null;
  }

  function pickSegmentRay(ray) {
    const probe = rayProbe(ray);
    if (!probe) return null;
    let best = null;
    for (const seg of segments.values()) {
      if (!boundsOverlap(probe, seg.bounds)) continue;
      const hit = rayHit(ray, seg);
      if (!hit) continue;
      if (hit.dist <= outerHalf(seg.type) + 0.5 && (!best || hit.dist < best.dist)) best = { seg, dist: hit.dist, s: hit.s };
    }
    return best;
  }

  // Reference direction for angle snapping when starting from a road.
  function snapDirection(snap) {
    if (snap.kind === 'seg') {
      const p = pathAt(snap.seg.path, snap.s);
      return Math.atan2(p.tz, p.tx);
    }
    if (snap.kind === 'node') {
      const ends = nodeEnds(snap.node);
      if (ends.length > 0) return ends[0].angle;
    }
    return 0;
  }

  // ----- building ----------------------------------------------------------

  function segmentExistsBetween(aId, bId, length) {
    const node = nodes.get(aId);
    if (!node) return false;
    for (const segId of node.segs) {
      const seg = segments.get(segId);
      const joins = (seg.a === aId && seg.b === bId) || (seg.a === bId && seg.b === aId);
      if (joins && Math.abs(seg.path.length - length) < length * 0.15 + 2) return true;
    }
    return false;
  }

  function snapHeight(snap, fallback) {
    if (snap?.kind === 'node' && nodes.has(snap.node.id)) return snap.node.y;
    if (snap?.kind === 'seg' && segments.has(snap.seg.id)) return heightAt(snap.seg, snap.s);
    return fallback;
  }

  // Lays a new road along `rawPoints`, joining roads it crosses at about the
  // same height. `elev` is the drawn height (null = follow the ground).
  function insertRoad(rawPoints, { type, color, startSnap, endSnap, oneway = false, elev = null, closed = false }) {
    lastCreated = [];
    const path = makePath(rawPoints);
    if (path.length < ROAD.minLength) return 0;
    const { pts, cum } = path;
    const L = path.length;
    const yStart = snapHeight(startSnap, elev ?? 0);
    const yEnd = closed ? yStart : snapHeight(endSnap, elev ?? 0);
    const heightNew = (s) => profileHeight(L, yStart, yEnd, elev, s);
    const records = [];

    const snapRecord = (sN, snap) => {
      if (snap?.kind === 'node' && nodes.has(snap.node.id)) return { sN, kind: 'node', nodeId: snap.node.id };
      if (snap?.kind === 'seg' && segments.has(snap.seg.id)) return { sN, kind: 'seg', seg: snap.seg, sS: snap.s };
      return { sN, kind: 'free' };
    };
    records.push(snapRecord(0, startSnap));
    records.push(closed ? { sN: L, kind: 'closing' } : snapRecord(L, endSnap));

    // Crossings with existing roads at about the same height.
    const newBounds = pathBounds(pts, 1);
    for (const seg of segments.values()) {
      if (!boundsOverlap(newBounds, seg.bounds)) continue;
      const other = seg.path;
      const hits = [];
      for (let i = 1; i < pts.length; i++) {
        const a = pts[i - 1];
        const b = pts[i];
        const eMinX = Math.min(a.x, b.x);
        const eMaxX = Math.max(a.x, b.x);
        const eMinZ = Math.min(a.z, b.z);
        const eMaxZ = Math.max(a.z, b.z);
        if (eMaxX < seg.bounds.minX || eMinX > seg.bounds.maxX || eMaxZ < seg.bounds.minZ || eMinZ > seg.bounds.maxZ) continue;
        for (let j = 1; j < other.pts.length; j++) {
          const c = other.pts[j - 1];
          const d = other.pts[j];
          if (Math.max(c.x, d.x) < eMinX || Math.min(c.x, d.x) > eMaxX) continue;
          if (Math.max(c.z, d.z) < eMinZ || Math.min(c.z, d.z) > eMaxZ) continue;
          const hit = segmentIntersect(a, b, c, d);
          if (!hit) continue;
          const sN = cum[i - 1] + (cum[i] - cum[i - 1]) * hit.t;
          const sS = other.cum[j - 1] + (other.cum[j] - other.cum[j - 1]) * hit.u;
          if (Math.abs(heightNew(sN) - heightAt(seg, sS)) > 2.5) continue;
          if (hits.some((h) => Math.abs(h.sS - sS) < ROAD.mergeDistance)) continue;
          hits.push({ sN, kind: 'seg', seg, sS });
        }
      }
      records.push(...hits);
    }

    records.sort((p, q) => p.sN - q.sN);
    const priority = { closing: 4, node: 3, seg: 2, free: 1 };
    const merged = [];
    for (const rec of records) {
      const last = merged[merged.length - 1];
      if (last && rec.sN - last.sN < ROAD.mergeDistance) {
        if (priority[rec.kind] > priority[last.kind]) merged[merged.length - 1] = rec;
        continue;
      }
      merged.push(rec);
    }
    if (merged.length < 2) return 0;

    const affected = new Set();

    // Split existing segments at crossings (furthest first so params stay valid).
    const bySeg = new Map();
    for (const rec of merged) {
      if (rec.kind !== 'seg') continue;
      if (!bySeg.has(rec.seg.id)) bySeg.set(rec.seg.id, []);
      bySeg.get(rec.seg.id).push(rec);
    }
    for (const list of bySeg.values()) {
      list.sort((p, q) => q.sS - p.sS);
      let current = list[0].seg;
      for (const rec of list) {
        const nearA = rec.sS <= Math.max(ROAD.nodeSnapAlong, current.trimA + 1);
        const nearB = current.path.length - rec.sS <= Math.max(ROAD.nodeSnapAlong, current.trimB + 1);
        if (nearA) {
          rec.nodeId = current.a;
        } else if (nearB) {
          rec.nodeId = current.b;
        } else {
          const { node, left, right } = splitSegment(current, rec.sS);
          rec.nodeId = node.id;
          affected.add(node.id);
          affected.add(right.b);
          current = left;
        }
        affected.add(current.a);
        affected.add(current.b);
      }
    }

    for (const rec of merged) {
      if (rec.kind === 'free') {
        const p = pathAt(path, rec.sN);
        rec.nodeId = createNode(p.x, p.z, { y: heightNew(rec.sN) }).id;
      }
      if (rec.kind === 'closing') rec.nodeId = merged[0].nodeId;
      affected.add(rec.nodeId);
    }

    for (let i = 0; i < merged.length - 1; i++) {
      const A = merged[i];
      const B = merged[i + 1];
      const length = B.sN - A.sN;
      if (A.nodeId === B.nodeId && length < 20) continue;
      if (length < 1.5) continue;
      if (segmentExistsBetween(A.nodeId, B.nodeId, length)) continue;
      const piece = subPath(path, A.sN, B.sN);
      const seg = createSegment(A.nodeId, B.nodeId, piece, type, color, {
        oneway,
        elev: pieceElev(L, yStart, yEnd, elev, A.sN, B.sN),
      });
      lastCreated.push(seg);
    }

    for (const id of Array.from(affected)) {
      if (deleteNodeIfOrphan(id)) affected.delete(id);
    }

    if (lastCreated.length > 0) {
      scenery.clearAlongPath(pts, outerHalf(type) + 1);
      for (const rec of merged) {
        const node = nodes.get(rec.nodeId);
        if (node) scenery.clearAlongPath([node], outerHalf(type) * 1.6 + 1);
      }
    }
    rebuildAround(affected);
    return lastCreated.length;
  }

  function removeSegment(seg, { force = false } = {}) {
    if (!segments.has(seg.id) || (seg.locked && !force)) return;
    const { a, b } = seg;
    deleteSegmentRaw(seg);
    deleteNodeIfOrphan(a);
    deleteNodeIfOrphan(b);
    rebuildAround([a, b]);
    if (islands.size > 0) pruneIslands();
  }

  // Swaps a road for the current brush in place. Using the same brush on a
  // one-way road flips its direction.
  function replaceSegment(seg, { type = seg.type, color = seg.color, oneway = seg.oneway, elev = seg.elev } = {}) {
    if (!segments.has(seg.id) || seg.locked) return null;
    const same = type === seg.type && oneway === seg.oneway && (elev ?? null) === (seg.elev ?? null) && color === seg.color;
    let { a, b } = seg;
    const pts = seg.path.pts.map((p) => ({ x: p.x, z: p.z }));
    if (same) {
      if (!seg.oneway) return null;
      [a, b] = [b, a];
      pts.reverse();
    }
    deleteSegmentRaw(seg);
    const fresh = createSegment(a, b, pts, type, color, { oneway, elev, name: seg.name });
    for (const id of [a, b]) {
      const node = nodes.get(id);
      if (node.segs.size === 1 && elev !== null && elev !== undefined) node.y = elev;
    }
    scenery.clearAlongPath(fresh.path.pts, outerHalf(type) + 1);
    rebuildAround([a, b]);
    return fresh;
  }

  // Drops a one-way ring at (cx, cz) and removes the roads inside it.
  function addRoundabout(cx, cz, { type, color, radius = null }) {
    const R = radius ?? outerHalf(type) * 1.4 + 10;
    const steps = 64;
    const ring = [];
    for (let i = 0; i <= steps; i++) {
      const a = (i / steps) * Math.PI * 2;
      ring.push({ x: cx + Math.cos(a) * R, z: cz - Math.sin(a) * R });
    }
    const created = insertRoad(ring, { type, color, oneway: true, closed: true });
    if (!created) return 0;
    const ringIds = new Set(lastCreated.map((s) => s.id));
    const touched = new Set();
    for (const s of lastCreated) {
      touched.add(s.a);
      touched.add(s.b);
    }
    for (const seg of Array.from(segments.values())) {
      if (seg.locked || ringIds.has(seg.id)) continue;
      const mid = pathAt(seg.path, seg.path.length / 2);
      if (Math.hypot(mid.x - cx, mid.z - cz) >= R - 0.5) continue;
      touched.add(seg.a);
      touched.add(seg.b);
      deleteSegmentRaw(seg);
    }
    for (const id of Array.from(touched)) if (deleteNodeIfOrphan(id)) touched.delete(id);
    const island = { id: nextIslandId++, x: cx, z: cz, r: Math.max(2, R - type.roadHalf - 0.3) };
    islands.set(island.id, island);
    buildIslandParts(island);
    scenery.clearAlongPath([{ x: cx, z: cz }], R + outerHalf(type) + 1);
    rebuildAround(touched);
    return created;
  }

  function repaintSegment(seg, color) {
    if (!segments.has(seg.id)) return;
    seg.color = color;
    buildSegmentParts(seg);
    batcher.flush();
    highlight.key = '';
  }

  // Translucent overlay that follows the hovered road at its height.
  function setHighlight(seg, color = 0xff0000) {
    if (!seg || !segments.has(seg.id)) {
      if (highlight.mesh) highlight.mesh.visible = false;
      highlight.segId = null;
      return;
    }
    const key = `${seg.id}:${seg.version}`;
    highlight.material.uniforms.uColor.value.setHex(color);
    highlight.segId = seg.id;
    if (highlight.key === key && highlight.mesh) {
      highlight.mesh.visible = true;
      return;
    }
    highlight.key = key;
    if (highlight.mesh) {
      scene.remove(highlight.mesh);
      highlight.mesh.geometry.dispose();
    }
    const W = outerHalf(seg.type) + 0.3;
    const center = pathRange(seg.path, 0, seg.path.length, 0, 2);
    const builder = createMeshBuilder();
    for (let i = 1; i < center.length; i++) {
      const a = center[i - 1];
      const b = center[i];
      const ya = WORLD.curbY + 0.15 + visibleHeight(heightAt(seg, a.s));
      const yb = WORLD.curbY + 0.15 + visibleHeight(heightAt(seg, b.s));
      builder.quad(sidePoint(a, -W, ya), sidePoint(b, -W, yb), sidePoint(b, W, yb), sidePoint(a, W, ya), UP, 1);
    }
    highlight.mesh = noShadow(new THREE.Mesh(builder.build(), highlight.material));
    highlight.mesh.renderOrder = 6;
    scene.add(highlight.mesh);
  }

  function clear({ keepLocked = true } = {}) {
    const touched = new Set();
    for (const seg of Array.from(segments.values())) {
      if (keepLocked && seg.locked) continue;
      touched.add(seg.a);
      touched.add(seg.b);
      deleteSegmentRaw(seg);
    }
    for (const id of Array.from(nodes.keys())) deleteNodeIfOrphan(id);
    for (const island of islands.values()) batcher.remove(island);
    islands.clear();
    rebuildAround(touched);
  }

  function nodeNear(x, z, radius = 0.6) {
    for (const node of nodes.values()) {
      if (Math.hypot(node.x - x, node.z - z) <= radius) return node;
    }
    return null;
  }

  // ----- persistence -------------------------------------------------------

  // Locked roads (outside highways) are rebuilt by the game, not saved.
  function serialize() {
    const round = (v) => Math.round(v * 100) / 100;
    const saved = Array.from(segments.values()).filter((s) => !s.locked);
    const used = new Set();
    for (const s of saved) {
      used.add(s.a);
      used.add(s.b);
    }
    return {
      v: 2,
      nodes: Array.from(nodes.values())
        .filter((n) => used.has(n.id))
        .map((n) => [n.id, round(n.x), round(n.z), round(n.y)]),
      segs: saved.map((s) => {
        const flat = [];
        for (const p of simplifyPolyline(s.path.pts, 0.04)) flat.push(round(p.x), round(p.z));
        return s.name ? [s.a, s.b, s.type.key, s.color, flat, s.oneway ? 1 : 0, s.elev, s.name] : [s.a, s.b, s.type.key, s.color, flat, s.oneway ? 1 : 0, s.elev];
      }),
      islands: Array.from(islands.values()).map((i) => [round(i.x), round(i.z), round(i.r)]),
    };
  }

  function load(data) {
    clear();
    if (!data || (data.v !== 1 && data.v !== 2)) return;
    importGraph(
      {
        nodes: data.nodes.map(([id, x, z, y]) => ({ id, x, z, y: y ?? 0 })),
        segs: data.segs.map(([a, b, typeKey, color, flat, oneway, elev, name]) => {
          const pts = [];
          for (let i = 0; i < flat.length; i += 2) pts.push({ x: flat[i], z: flat[i + 1] });
          return { a, b, type: ROAD_TYPES[typeKey] ?? ROAD_TYPES.medium, color, pts, oneway: !!oneway, elev: elev ?? null, name: name ?? null };
        }),
        islands: (data.islands ?? []).map(([x, z, r]) => ({ x, z, r })),
      },
      { reuseNodes: true }
    );
  }

  // Bulk build (saves, map imports): no crossing checks, one rebuild.
  function importGraph(data, { reuseNodes = false, clearScenery = true } = {}) {
    const idMap = new Map();
    for (const n of data.nodes) {
      const existing = reuseNodes ? nodeNear(n.x, n.z) : null;
      idMap.set(n.id, (existing ?? createNode(n.x, n.z, { y: n.y ?? 0 })).id);
    }
    const created = [];
    for (const s of data.segs) {
      if (!idMap.has(s.a) || !idMap.has(s.b) || s.pts.length < 2) continue;
      if (s.type.kind !== kind) continue;
      const seg = createSegment(idMap.get(s.a), idMap.get(s.b), s.pts, s.type, s.color, {
        oneway: s.oneway,
        elev: s.elev ?? null,
        locked: !!s.locked,
        name: s.name ?? null,
      });
      created.push(seg);
      if (clearScenery) scenery.clearAlongPath(seg.path.pts, outerHalf(s.type) + 1);
    }
    for (const i of data.islands ?? []) {
      const island = { id: nextIslandId++, x: i.x, z: i.z, r: i.r };
      islands.set(island.id, island);
      buildIslandParts(island);
    }
    for (const id of Array.from(nodes.keys())) deleteNodeIfOrphan(id);
    rebuildAround(Array.from(nodes.keys()));
    return { idMap, created };
  }

  function totalLength() {
    let total = 0;
    for (const seg of segments.values()) if (!seg.locked) total += seg.path.length;
    return total;
  }

  // Builds a protected road (used for outside connections).
  function addLockedRoad(points, type, color, { outsideStart = false, oneway = false } = {}) {
    const first = points[0];
    const last = points[points.length - 1];
    const a = nodeNear(first.x, first.z) ?? createNode(first.x, first.z, { outside: outsideStart });
    const b = nodeNear(last.x, last.z) ?? createNode(last.x, last.z);
    const seg = createSegment(a.id, b.id, points, type, color, { locked: true, oneway });
    scenery.clearAlongPath(seg.path.pts, outerHalf(type) + 2);
    rebuildAround([a.id, b.id]);
    return { seg, outsideNode: a, innerNode: b };
  }

  // Closest point on a road a building can drive onto (ground level only).
  function nearestAccess(x, z, maxDist, { allowLocked = false } = {}) {
    let best = null;
    const probe = { minX: x - maxDist, maxX: x + maxDist, minZ: z - maxDist, maxZ: z + maxDist };
    for (const seg of segsNear(probe.minX, probe.minZ, probe.maxX, probe.maxZ)) {
      if (seg.locked && !allowLocked) continue;
      if (!boundsOverlap(probe, seg.bounds)) continue;
      const lo = seg.trimA + 3;
      const hi = seg.path.length - seg.trimB - 3;
      if (hi <= lo) continue;
      const hit = closestOnPath(seg.path, x, z);
      const s = clamp(hit.s, lo, hi);
      if (Math.abs(heightAt(seg, s)) > 1.5) continue;
      const p = pathAt(seg.path, s);
      const dist = Math.hypot(p.x - x, p.z - z);
      if (dist <= maxDist && (!best || dist < best.dist)) best = { seg, s, x: p.x, z: p.z, tx: p.tx, tz: p.tz, dist };
    }
    return best;
  }

  // Shortest route through the graph between two points on roads, obeying
  // one-way streets. Returns { startDir, steps: [{ segId, dir }] } where
  // steps[last] is the destination road, or null if unreachable.
  function findRoute(fromSegId, fromS, toSegId, toS, { startDir: forced = 0 } = {}) {
    const from = segments.get(fromSegId);
    const to = segments.get(toSegId);
    if (!from || !to) return null;
    const allowFwd = forced !== -1;
    const allowBack = forced !== 1 && !from.oneway;

    if (fromSegId === toSegId) {
      if (toS >= fromS && allowFwd) return { startDir: 1, steps: [], cost: toS - fromS };
      if (toS < fromS && allowBack) return { startDir: -1, steps: [], cost: fromS - toS };
    }

    const dist = new Map();
    const prev = new Map();
    const heap = [];
    const heapPush = (item) => {
      heap.push(item);
      let i = heap.length - 1;
      while (i > 0) {
        const p = (i - 1) >> 1;
        if (heap[p].cost <= heap[i].cost) break;
        [heap[p], heap[i]] = [heap[i], heap[p]];
        i = p;
      }
    };
    const heapPop = () => {
      const top = heap[0];
      const last = heap.pop();
      if (heap.length > 0) {
        heap[0] = last;
        let i = 0;
        for (;;) {
          const l = i * 2 + 1;
          const r = l + 1;
          let m = i;
          if (l < heap.length && heap[l].cost < heap[m].cost) m = l;
          if (r < heap.length && heap[r].cost < heap[m].cost) m = r;
          if (m === i) break;
          [heap[m], heap[i]] = [heap[i], heap[m]];
          i = m;
        }
      }
      return top;
    };
    const push = (nodeId, cost, info) => {
      if (cost >= (dist.get(nodeId) ?? Infinity)) return;
      dist.set(nodeId, cost);
      prev.set(nodeId, info);
      heapPush({ nodeId, cost });
    };

    if (allowFwd) push(from.b, from.path.length - fromS, { start: 1 });
    if (allowBack) push(from.a, fromS, { start: -1 });

    let best = null;
    while (heap.length > 0) {
      const { nodeId, cost } = heapPop();
      if (cost > (dist.get(nodeId) ?? Infinity)) continue;
      if (best && cost >= best.cost) break;

      if (to.a === nodeId) {
        const total = cost + toS;
        if (!best || total < best.cost) best = { cost: total, nodeId, dir: 1 };
      }
      if (to.b === nodeId && !to.oneway) {
        const total = cost + (to.path.length - toS);
        if (!best || total < best.cost) best = { cost: total, nodeId, dir: -1 };
      }

      const node = nodes.get(nodeId);
      if (!node) continue;
      for (const segId of node.segs) {
        const seg = segments.get(segId);
        if (!seg || segId === toSegId) continue;
        if (seg.a === nodeId) push(seg.b, cost + seg.path.length, { nodeId, segId, dir: 1 });
        if (seg.b === nodeId && !seg.oneway) push(seg.a, cost + seg.path.length, { nodeId, segId, dir: -1 });
      }
    }
    if (!best) return null;

    const steps = [{ segId: toSegId, dir: best.dir }];
    let cursor = best.nodeId;
    let startDir = 1;
    for (let guard = 0; guard < 100000; guard++) {
      const info = prev.get(cursor);
      if (!info) return null;
      if (info.start) {
        startDir = info.start;
        break;
      }
      steps.unshift({ segId: info.segId, dir: info.dir });
      cursor = info.nodeId;
    }
    return { startDir, steps, cost: best.cost };
  }

  return {
    kind,
    nodes,
    segments,
    islands,
    hooks,
    get version() {
      return version;
    },
    get lastCreated() {
      return lastCreated;
    },
    get meshCount() {
      return batcher.meshCount;
    },
    heightAt,
    segsNear,
    addLockedRoad,
    nearestAccess,
    nodeNear,
    findRoute,
    nodeEnds,
    findSnap,
    findSnapRay,
    pickSegment,
    pickSegmentRay,
    snapDirection,
    insertRoad,
    removeSegment,
    replaceSegment,
    addRoundabout,
    repaintSegment,
    setHighlight,
    clear,
    serialize,
    load,
    importGraph,
    totalLength,
  };
}

// Ghost road shown while drawing. `heightFn(s)` gives the planned height.
function createRoadPreview(scene) {
  const material = createRetroMaterial({
    map: TEXTURES.asphalt,
    roadMask: true,
    side: THREE.DoubleSide,
    alpha: 0.6,
    polygonOffset: -6,
    depthWrite: false,
  });
  material.uniforms.uTint.value.setHex(0x3a7cff);
  material.uniforms.uTintAmt.value = 0.45;
  const legMaterial = createRetroMaterial({ color: 0x3a7cff, unlit: true, alpha: 0.5, depthWrite: false });

  let mesh = null;
  let legs = null;
  const markerMaterial = createRetroMaterial({ color: 0xffffff, unlit: true, side: THREE.DoubleSide, polygonOffset: -8 });
  const markers = [];
  for (let i = 0; i < 2; i++) {
    const ring = noShadow(new THREE.Mesh(new THREE.RingGeometry(1.4, 2, 12), markerMaterial));
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = WORLD.markY + 0.05;
    ring.visible = false;
    scene.add(ring);
    markers.push(ring);
  }

  function clearMesh() {
    for (const m of [mesh, legs]) {
      if (!m) continue;
      scene.remove(m);
      m.geometry.dispose();
    }
    mesh = null;
    legs = null;
  }

  function show(points, type, valid, heightFn = null) {
    clearMesh();
    if (!points || points.length < 2) return;
    const path = makePath(points);
    if (path.length < 0.5) return;
    const center = pathRange(path, 0, path.length, 0);
    const builder = createMeshBuilder();
    const legBuilder = createMeshBuilder();
    const hw = type.roadHalf;
    const hOf = (s) => visibleHeight(heightFn ? heightFn(s, path.length) : 0);
    for (let i = 1; i < center.length; i++) {
      const a = center[i - 1];
      const b = center[i];
      const ya = WORLD.roadY + 0.12 + hOf(a.s);
      const yb = WORLD.roadY + 0.12 + hOf(b.s);
      builder.quad(
        sidePoint(a, -hw, ya),
        sidePoint(b, -hw, yb),
        sidePoint(b, hw, yb),
        sidePoint(a, hw, ya),
        UP,
        1,
        [0, a.s / 8],
        [0, b.s / 8],
        [1, b.s / 8],
        [1, a.s / 8]
      );
      // Height posts so raised roads read clearly while drawing.
      if (Math.floor(a.s / 12) !== Math.floor(b.s / 12) && Math.abs(yb) > 1) {
        addBox(legBuilder, b.x, b.z, Math.min(0, yb), Math.max(0, yb), 0.25, 0.25, { x: b.tx, z: b.tz });
      }
    }
    material.uniforms.uTint.value.setHex(valid ? 0x3a7cff : 0xff2020);
    legMaterial.uniforms.uColor.value.setHex(valid ? 0x3a7cff : 0xff2020);
    mesh = noShadow(new THREE.Mesh(builder.build(), material));
    mesh.renderOrder = 5;
    scene.add(mesh);
    if (!legBuilder.empty) {
      legs = noShadow(new THREE.Mesh(legBuilder.build(), legMaterial));
      scene.add(legs);
    }
  }

  function showMarkers(list) {
    markers.forEach((ring, i) => {
      const snap = list[i];
      if (!snap || snap.kind === 'free') {
        ring.visible = false;
        return;
      }
      ring.visible = true;
      ring.position.x = snap.x;
      ring.position.z = snap.z;
      ring.position.y = WORLD.markY + 0.05 + visibleHeight(snap.y ?? 0);
      markerMaterial.uniforms.uColor.value.setHex(snap.kind === 'node' ? 0x00ff00 : 0x00ffff);
    });
  }

  function hide() {
    clearMesh();
    showMarkers([]);
  }

  return { show, showMarkers, hide };
}

// ---------------------------------------------------------------------------
// Traffic: low-poly cars that route through the road graph
// ---------------------------------------------------------------------------

const TRAFFIC = {
  wanderMetersPerCar: 160,
  maxWanderers: 30,
  maxCars: 480,
  spawnInterval: 0.2,
  minGap: 1.6,
  brake: 7,
  accel: 5,
  decel: 16,
  turnSpeed: 6.5,
  stopDistance: 16,
  forceAfter: 9,
  giveUpAfter: 28,
};

const CAR_COLORS = [0xff0000, 0x0000ff, 0xffff00, 0x00ff00, 0xff00ff, 0x00ffff, 0xffffff, 0x800000, 0x000080, 0x008080, 0xc0c0c0];

// Vehicle catalogue. `weight` > 0 means it can show up as random traffic.
const VEHICLE_TYPES = {
  hatch: { weight: 0.34 },
  sedan: { weight: 0.34 },
  van: { weight: 0.2 },
  truck: { weight: 0.12 },
  police: { weight: 0, color: 0xf4f4f4 },
  fire: { weight: 0, color: 0xd81818 },
  ambulance: { weight: 0, color: 0xf8f8f8 },
  bus: { weight: 0, color: 0xf0c020 },
};

function carModels() {
  const dark = 0x262626;
  const glass = 0x22324a;
  const tyre = 0x141414;
  const head = 0xfff4c0;
  const tail = 0xd01010;

  const wheels = (x, y, zs, size = [0.28, 0.62, 0.62]) =>
    zs.flatMap((z) => [-x, x].map((wx) => modelPart(box(...size), tyre, { position: [wx, y, z] })));
  const lights = (xs, y, zFront, zBack) => [
    ...xs.map((x) => modelPart(box(0.4, 0.18, 0.06), head, { position: [x, y, zFront] })),
    ...xs.map((x) => modelPart(box(0.36, 0.16, 0.06), tail, { position: [x, y + 0.04, zBack] })),
  ];

  const sedanParts = () => [
    modelPart(box(1.8, 0.3, 4.6), dark, { position: [0, 0.38, 0] }),
    modelPart(box(1.76, 0.55, 4.5), 0xffffff, { position: [0, 0.7, 0], paint: 1 }),
    modelPart(taperedBox(1.62, 0.52, 2.4, { topScaleX: 0.86, topFront: 0.6, topBack: 0.5 }), glass, { position: [0, 1.235, -0.15] }),
    modelPart(box(1.4, 0.1, 1.32), 0xffffff, { position: [0, 1.545, -0.2], paint: 1 }),
    ...lights([-0.58, 0.58], 0.76, 2.26, -2.26),
    ...wheels(0.82, 0.31, [-1.45, 1.45]),
  ];

  const vanParts = () => [
    modelPart(box(1.86, 0.3, 4.95), dark, { position: [0, 0.42, 0] }),
    modelPart(box(1.9, 1.5, 4.9), 0xffffff, { position: [0, 1.15, 0], paint: 1 }),
    modelPart(box(1.92, 0.55, 3.4), glass, { position: [0, 1.5, 0.5] }),
    modelPart(box(1.7, 0.6, 0.04), glass, { position: [0, 1.45, 2.46] }),
    ...lights([-0.62, 0.62], 0.85, 2.46, -2.46),
    ...wheels(0.86, 0.34, [-1.6, 1.6], [0.3, 0.68, 0.68]),
  ];

  const hatch = mergeModel([
    modelPart(box(1.74, 0.3, 3.9), dark, { position: [0, 0.38, 0] }),
    modelPart(box(1.7, 0.55, 3.8), 0xffffff, { position: [0, 0.72, 0], paint: 1 }),
    modelPart(taperedBox(1.6, 0.55, 2.3, { topScaleX: 0.88, topFront: 0.55, topBack: 0.15 }), glass, { position: [0, 1.27, -0.35] }),
    modelPart(box(1.44, 0.1, 1.62), 0xffffff, { position: [0, 1.595, -0.55], paint: 1 }),
    ...lights([-0.55, 0.55], 0.78, 1.91, -1.91),
    ...wheels(0.8, 0.31, [-1.2, 1.2]),
  ]);

  const sedan = mergeModel(sedanParts());
  const van = mergeModel(vanParts());

  const truck = mergeModel([
    modelPart(box(2.0, 0.4, 7.2), dark, { position: [0, 0.55, 0] }),
    modelPart(box(2.2, 1.9, 1.8), 0xffffff, { position: [0, 1.55, 2.6], paint: 1 }),
    modelPart(box(2.0, 0.7, 0.04), glass, { position: [0, 1.95, 3.51] }),
    modelPart(box(2.22, 0.6, 0.9), glass, { position: [0, 1.95, 2.8] }),
    modelPart(box(2.3, 2.6, 5.0), 0xe6e6e6, { position: [0, 1.95, -0.95] }),
    ...lights([-0.75, 0.75], 0.95, 3.52, -3.46),
    ...wheels(1.0, 0.45, [2.6, -1.4, -2.6], [0.34, 0.9, 0.9]),
  ]);

  const police = mergeModel([
    ...sedanParts(),
    modelPart(box(1.78, 0.2, 1.6), 0x101040, { position: [0, 0.72, 0.4] }),
    modelPart(box(0.5, 0.16, 0.3), 0x2040ff, { position: [-0.3, 1.68, -0.2] }),
    modelPart(box(0.5, 0.16, 0.3), 0xff2020, { position: [0.3, 1.68, -0.2] }),
  ]);

  const ambulance = mergeModel([
    ...vanParts(),
    modelPart(box(1.94, 0.3, 4.8), 0xe02020, { position: [0, 0.95, 0] }),
    modelPart(box(0.9, 0.16, 0.3), 0xff3030, { position: [0, 1.98, 1.6] }),
  ]);

  const fire = mergeModel([
    modelPart(box(2.1, 0.4, 7.6), dark, { position: [0, 0.55, 0] }),
    modelPart(box(2.3, 2.3, 7.4), 0xffffff, { position: [0, 1.9, 0], paint: 1 }),
    modelPart(box(2.1, 0.8, 0.04), glass, { position: [0, 2.3, 3.71] }),
    modelPart(box(2.32, 0.7, 1.2), glass, { position: [0, 2.3, 2.9] }),
    modelPart(box(0.5, 0.25, 6.2), 0xd8d8d8, { position: [0.4, 3.2, -0.6] }),
    modelPart(box(0.5, 0.25, 6.2), 0xd8d8d8, { position: [-0.4, 3.2, -0.6] }),
    modelPart(box(1.2, 0.16, 0.3), 0xff3030, { position: [0, 3.12, 3.2] }),
    ...lights([-0.8, 0.8], 0.95, 3.72, -3.72),
    ...wheels(1.05, 0.45, [2.6, -1.6, -2.8], [0.34, 0.9, 0.9]),
  ]);

  const busParts = [
    modelPart(box(2.3, 0.4, 10), dark, { position: [0, 0.55, 0] }),
    modelPart(box(2.4, 2.6, 10), 0xffffff, { position: [0, 2.0, 0], paint: 1 }),
    modelPart(box(2.42, 0.8, 8.4), glass, { position: [0, 2.4, -0.4] }),
    modelPart(box(2.2, 1.0, 0.04), glass, { position: [0, 2.3, 5.01] }),
    modelPart(box(2.3, 0.12, 9.6), 0xe8e8e8, { position: [0, 3.36, 0] }),
    ...lights([-0.8, 0.8], 0.95, 5.02, -5.02),
    ...wheels(1.1, 0.45, [3.4, -3.2], [0.34, 0.9, 0.9]),
  ];
  const bus = mergeModel(busParts);

  return {
    hatch: { geometry: hatch, length: 3.9, width: 1.74 },
    sedan: { geometry: sedan, length: 4.6, width: 1.8 },
    van: { geometry: van, length: 4.95, width: 1.9 },
    truck: { geometry: truck, length: 7.2, width: 2.3 },
    police: { geometry: police, length: 4.6, width: 1.8 },
    fire: { geometry: fire, length: 7.6, width: 2.3 },
    ambulance: { geometry: ambulance, length: 4.95, width: 1.94 },
    bus: { geometry: bus, length: 10, width: 2.4 },
  };
}

function createTraffic(scene, network, scenery, events) {
  const models = carModels();
  const modelKeys = Object.keys(models);
  const capacity = TRAFFIC.maxCars + 40;
  const rand = mulberry32(77);

  const meshes = {};
  for (const key of modelKeys) {
    const mesh = new THREE.InstancedMesh(models[key].geometry, createRetroMaterial({ vertexColors: true }), capacity);
    mesh.count = 0;
    mesh.frustumCulled = false;
    const white = new THREE.Color(0xffffff);
    for (let i = 0; i < capacity; i++) mesh.setColorAt(i, white);
    scene.add(mesh);
    meshes[key] = mesh;
  }

  const shadows = noShadow(new THREE.InstancedMesh(scenery.shadowGeometry, scenery.shadowMaterial, capacity));
  shadows.count = 0;
  shadows.frustumCulled = false;
  scene.add(shadows);

  const laneCache = new Map();
  const laneCars = new Map();
  const nodeStates = new Map();
  const cars = new Set();
  let nextCarId = 1;
  let spawnTimer = 0;
  let clock = 0;
  let wanderers = 0;
  const hooks = { honk: () => {} };

  // ----- lanes ---------------------------------------------------------------

  function laneKey(segId, dir, k) {
    return `${segId}:${dir}:${k}`;
  }

  function getLane(segId, dir, k) {
    const seg = network.segments.get(segId);
    if (!seg || (seg.oneway && dir < 0)) return null;
    const lanes = laneCount(seg);
    const kk = Math.min(k, lanes - 1);
    const key = laneKey(segId, dir, kk);
    const cached = laneCache.get(key);
    if (cached && cached.version === seg.version) return cached;

    const off = segLaneOffset(seg, kk);
    let s0 = seg.trimA;
    let s1 = seg.path.length - seg.trimB;
    if (s1 - s0 < 0.4) {
      const mid = (s0 + s1) / 2;
      s0 = mid - 0.2;
      s1 = mid + 0.2;
    }
    const pts = dir > 0 ? pathRange(seg.path, s0, s1, off, 1.5) : pathRange(seg.path, s1, s0, off, 1.5);
    const cum = new Float64Array(pts.length);
    for (let i = 1; i < pts.length; i++) cum[i] = cum[i - 1] + distance2D(pts[i - 1], pts[i]);

    const lane = {
      key,
      segId,
      dir,
      k: kk,
      pts,
      cum,
      length: cum[cum.length - 1],
      sStart: dir > 0 ? s0 : s1,
      version: seg.version,
      fromNode: dir > 0 ? seg.a : seg.b,
      toNode: dir > 0 ? seg.b : seg.a,
      speed: seg.type.speed,
      // Height along the lane (bridges, ramps, tunnels).
      yAt: (ls) => network.heightAt(seg, clamp((dir > 0 ? s0 : s1) + dir * ls, 0, seg.path.length)),
    };
    laneCache.set(key, lane);
    if (!laneCars.has(key)) laneCars.set(key, []);
    return lane;
  }

  function laneSFromPath(lane, s) {
    return clamp((s - lane.sStart) * lane.dir, 0, lane.length);
  }

  function carsOn(key) {
    let list = laneCars.get(key);
    if (!list) {
      list = [];
      laneCars.set(key, list);
    }
    return list;
  }

  function nodeState(nodeId) {
    let state = nodeStates.get(nodeId);
    if (!state) {
      state = { occupants: new Set(), waiting: new Map() };
      nodeStates.set(nodeId, state);
    }
    return state;
  }

  // ----- cars ----------------------------------------------------------------

  function removeCar(car, reason = 'removed') {
    if (!cars.has(car)) return;
    cars.delete(car);
    if (car.kind === 'wander') wanderers--;
    if (car.mode === 'lane') {
      const list = laneCars.get(laneKey(car.segId, car.dir, car.k));
      if (list) {
        const i = list.indexOf(car);
        if (i !== -1) list.splice(i, 1);
      }
    }
    for (const state of nodeStates.values()) {
      state.occupants.delete(car);
      state.waiting.delete(car);
    }
    if (car.trip && !car.arrived) events.emit('trip:aborted', { car, trip: car.trip, reason });
  }

  function pickModel() {
    let r = rand();
    for (const key of modelKeys) {
      r -= VEHICLE_TYPES[key].weight;
      if (r <= 0 && VEHICLE_TYPES[key].weight > 0) return key;
    }
    return 'sedan';
  }

  function laneHasRoom(lane, s, len, margin = 4) {
    for (const other of carsOn(lane.key)) {
      if (Math.abs(other.s - s) < (other.len + len) / 2 + margin) return false;
    }
    return true;
  }

  function makeCar(fields) {
    const lane = fields.lane;
    const p = pathAt(lane, fields.s);
    const car = {
      id: nextCarId++,
      model: fields.model,
      len: models[fields.model].length,
      color: new THREE.Color(fields.color),
      kind: fields.kind,
      segId: lane.segId,
      dir: lane.dir,
      k: lane.k,
      s: fields.s,
      speed: 0,
      mode: 'lane',
      conn: null,
      cs: 0,
      node: null,
      fromKey: null,
      next: null,
      granted: false,
      route: fields.route ?? null,
      routeIndex: 0,
      routeVersion: network.version,
      target: fields.target ?? null,
      trip: fields.trip ?? null,
      arrived: false,
      x: p.x,
      y: lane.yAt(fields.s),
      z: p.z,
      yaw: Math.atan2(p.tx, p.tz),
      grow: 0,
      dying: false,
      age: 0,
    };
    cars.add(car);
    carsOn(lane.key).push(car);
    if (car.kind === 'wander') wanderers++;
    return car;
  }

  function spawnWanderer() {
    let total = 0;
    for (const seg of network.segments.values()) if (!seg.locked) total += seg.path.length;
    if (total <= 0) return;

    let pick = rand() * total;
    let chosen = null;
    for (const seg of network.segments.values()) {
      if (seg.locked) continue;
      pick -= seg.path.length;
      if (pick <= 0) {
        chosen = seg;
        break;
      }
    }
    if (!chosen) return;

    const dir = chosen.oneway || rand() < 0.5 ? 1 : -1;
    const lane = getLane(chosen.id, dir, Math.floor(rand() * laneCount(chosen)));
    if (!lane || lane.length < 10) return;
    const model = pickModel();
    const s = 3 + rand() * (lane.length - 6);
    if (!laneHasRoom(lane, s, models[model].length, 6)) return;
    const base = chosen.color;
    const color = isGrayish(base) ? CAR_COLORS[Math.floor(rand() * CAR_COLORS.length)] : base;
    makeCar({ lane, s, model, color, kind: 'wander' });
  }

  // Start a purposeful trip. `from`/`to` are { segId, s } road positions;
  // `target` re-resolves the destination when the road graph changes.
  function spawnTrip({ from, to, target, color, model, trip }) {
    if (cars.size >= TRAFFIC.maxCars) return null;
    const route = network.findRoute(from.segId, from.s, to.segId, to.s);
    if (!route) return null;
    const seg = network.segments.get(from.segId);
    const k = Math.floor(rand() * laneCount(seg));
    const lane = getLane(from.segId, route.startDir, k);
    if (!lane || lane.length < 4) return null;
    const m = model ?? pickModel();
    const s = clamp(laneSFromPath(lane, from.s), 1, Math.max(1, lane.length - 1));
    if (!laneHasRoom(lane, s, models[m].length)) return null;
    const car = makeCar({
      lane,
      s,
      model: m,
      color,
      kind: 'trip',
      route: route.steps,
      target: target ?? (() => to),
      trip,
    });
    car.dest = { segId: to.segId, s: to.s };
    events.emit('trip:started', { car, trip });
    return car;
  }

  function chooseNext(car, lane) {
    if (car.route) {
      const step = car.route[car.routeIndex];
      if (!step) return null;
      const seg = network.segments.get(step.segId);
      if (!seg) return null;
      const lanes = laneCount(seg);
      return { segId: step.segId, dir: step.dir, k: lanes > 1 ? Math.floor(rand() * lanes) : 0, stepIndex: car.routeIndex };
    }
    const node = network.nodes.get(lane.toNode);
    if (!node) return null;
    const options = [];
    for (const segId of node.segs) {
      const seg = network.segments.get(segId);
      if (!seg || seg.locked) continue;
      if (seg.a === node.id) options.push({ segId, dir: 1, lanes: laneCount(seg) });
      if (seg.b === node.id && !seg.oneway) options.push({ segId, dir: -1, lanes: laneCount(seg) });
    }
    const forward = options.filter((o) => !(o.segId === car.segId && o.dir === -car.dir));
    const pool = forward.length > 0 ? forward : options;
    if (pool.length === 0) return null;
    const choice = pool[Math.floor(rand() * pool.length)];
    const k = choice.lanes > 1 ? Math.floor(rand() * choice.lanes) : 0;
    return { segId: choice.segId, dir: choice.dir, k };
  }

  function reroute(car) {
    car.routeVersion = network.version;
    if (!car.route) return;
    const dest = car.target?.();
    const lane = getLane(car.segId, car.dir, car.k);
    if (!dest || !lane) {
      car.dying = true;
      return;
    }
    const pathS = lane.sStart + lane.dir * car.s;
    const route = network.findRoute(car.segId, pathS, dest.segId, dest.s, { startDir: car.dir });
    if (!route) {
      car.dying = true;
      return;
    }
    car.route = route.steps;
    car.routeIndex = 0;
    car.dest = { segId: dest.segId, s: dest.s };
    car.next = null;
    car.granted = false;
  }

  function lastCarGap(lane) {
    let min = Infinity;
    for (const other of carsOn(lane.key)) {
      const back = other.s - other.len / 2;
      if (back < min) min = back;
    }
    return min;
  }

  function canEnter(car, lane) {
    const node = network.nodes.get(lane.toNode);
    if (!node || !car.next) return false;
    const target = getLane(car.next.segId, car.next.dir, car.next.k);
    if (!target) {
      car.next = null;
      return false;
    }

    const state = nodeState(node.id);
    if (!state.waiting.has(car)) state.waiting.set(car, clock);
    const waited = clock - state.waiting.get(car);

    let heading = 0;
    for (const occ of state.occupants) {
      if (occ.next && occ.next.segId === target.segId && occ.next.dir === target.dir) heading++;
    }
    if (lastCarGap(target) < car.len + 3 || heading >= 2) {
      if (waited > TRAFFIC.giveUpAfter) car.dying = true;
      return false;
    }

    const degree = network.nodeEnds(node).length;
    if (degree <= 2) return true;

    if (waited > TRAFFIC.forceAfter) {
      hooks.honk(car.x, car.z);
      return true;
    }

    const myStart = state.waiting.get(car);
    if (state.occupants.size === 0) {
      for (const [other, start] of state.waiting) {
        if (other !== car && cars.has(other) && start < myStart - 0.01) return false;
      }
      return true;
    }

    for (const occ of state.occupants) {
      if (occ.fromKey !== lane.key) return false;
    }
    for (const [other, start] of state.waiting) {
      if (other !== car && cars.has(other) && clock - start > 2.5) return false;
    }
    return true;
  }

  function makeConnector(fromLane, toLane) {
    const a = fromLane.pts[fromLane.pts.length - 1];
    const b = toLane.pts[0];
    const d = distance2D(a, b);
    if (d < 0.05) {
      const conn = makePath([{ x: a.x, z: a.z }, { x: b.x + 0.01, z: b.z }], 0.5);
      const y = toLane.yAt(0);
      conn.yAt = () => y;
      return conn;
    }
    const dot = a.tx * b.tx + a.tz * b.tz;
    const L = dot < -0.6 ? Math.max(d * 0.95, 7) : d * 0.42 + 0.4;
    const c1 = { x: a.x + a.tx * L, z: a.z + a.tz * L };
    const c2 = { x: b.x - b.tx * L, z: b.z - b.tz * L };
    const steps = Math.max(6, Math.ceil((d + L) / 1.2));
    const conn = makePath(cubicBezierPoints(a, c1, c2, b, steps), 0.75);
    conn.straight = dot > 0.92;
    const y0 = fromLane.yAt(fromLane.length);
    const y1 = toLane.yAt(0);
    conn.yAt = (cs) => lerp(y0, y1, conn.length > 0 ? cs / conn.length : 1);
    return conn;
  }

  function approach(car, desired, dt) {
    if (desired > car.speed) car.speed = Math.min(desired, car.speed + TRAFFIC.accel * dt);
    else car.speed = Math.max(desired, car.speed - TRAFFIC.decel * dt);
  }

  function desiredSpeed(vmax, gap) {
    if (gap <= TRAFFIC.minGap) return 0;
    return Math.min(vmax, Math.sqrt(2 * TRAFFIC.brake * (gap - TRAFFIC.minGap)));
  }

  const _p = {};

  function arrive(car) {
    if (car.arrived) return;
    car.arrived = true;
    car.dying = true;
    events.emit('trip:completed', { car, trip: car.trip });
  }

  function updateLaneCar(car, dt) {
    const lane = getLane(car.segId, car.dir, car.k);
    if (!lane) {
      removeCar(car, 'road-removed');
      return;
    }
    if (car.route && car.routeVersion !== network.version) reroute(car);

    const atDestLane = car.route && car.routeIndex >= car.route.length && car.dest && car.dest.segId === car.segId;
    if (!car.next && !atDestLane) {
      car.next = chooseNext(car, lane);
      car.granted = false;
    }

    const list = carsOn(lane.key);
    let leader = null;
    let gap = Infinity;
    for (const other of list) {
      if (other === car || other.s <= car.s) continue;
      const g = other.s - car.s - (other.len + car.len) / 2;
      if (g < gap) {
        gap = g;
        leader = other;
      }
    }

    const remain = lane.length - car.s;
    if (atDestLane) {
      const stopAt = laneSFromPath(lane, car.dest.s);
      gap = Math.min(gap, stopAt - car.s + 1.5);
      if (car.s >= stopAt - 1.5 || (car.speed < 0.3 && stopAt - car.s < 5)) arrive(car);
    } else if (!leader) {
      if (!car.granted && remain < TRAFFIC.stopDistance) {
        car.granted = canEnter(car, lane);
        if (car.granted) nodeState(lane.toNode).waiting.delete(car);
      }
      if (!car.granted) {
        gap = remain - car.len / 2 - 0.5;
      } else {
        const target = car.next && getLane(car.next.segId, car.next.dir, car.next.k);
        gap = target ? remain + 6 + lastCarGap(target) - car.len / 2 : remain;
      }
    }

    approach(car, desiredSpeed(lane.speed, gap), dt);
    car.s += car.speed * dt;
    if (leader) car.s = Math.min(car.s, leader.s - (leader.len + car.len) / 2 - 0.4);

    if (car.s >= lane.length) {
      const target = !atDestLane && car.granted && car.next ? getLane(car.next.segId, car.next.dir, car.next.k) : null;
      if (!target) {
        car.s = lane.length;
        car.speed = 0;
        car.granted = false;
        if (atDestLane) arrive(car);
      } else {
        const overflow = car.s - lane.length;
        const i = list.indexOf(car);
        if (i !== -1) list.splice(i, 1);
        car.mode = 'turn';
        car.conn = makeConnector(lane, target);
        car.cs = Math.min(overflow, car.conn.length);
        car.node = lane.toNode;
        car.fromKey = lane.key;
        nodeState(lane.toNode).occupants.add(car);
        updatePose(car, car.conn, car.cs, dt);
        return;
      }
    }

    updatePose(car, lane, car.s, dt);
  }

  function updateTurnCar(car, dt) {
    const target = car.next ? getLane(car.next.segId, car.next.dir, car.next.k) : null;
    if (!target) {
      removeCar(car, 'road-removed');
      return;
    }
    const state = nodeState(car.node);
    let gap = car.conn.length - car.cs + lastCarGap(target) - car.len / 2;
    for (const other of state.occupants) {
      if (other === car || !other.next) continue;
      if (other.next.segId !== car.next.segId || other.next.dir !== car.next.dir) continue;
      if (other.fromKey === car.fromKey && other.cs > car.cs) {
        gap = Math.min(gap, other.cs - car.cs - (other.len + car.len) / 2);
      }
    }

    const vmax = car.conn.straight ? target.speed : TRAFFIC.turnSpeed;
    approach(car, desiredSpeed(vmax, gap), dt);
    car.cs += car.speed * dt;

    if (car.cs >= car.conn.length) {
      state.occupants.delete(car);
      car.mode = 'lane';
      car.segId = target.segId;
      car.dir = target.dir;
      car.k = target.k;
      car.s = Math.min(car.cs - car.conn.length, target.length);
      if (car.route && car.next.stepIndex !== undefined) car.routeIndex = car.next.stepIndex + 1;
      car.conn = null;
      car.next = null;
      car.granted = false;
      car.node = null;
      carsOn(target.key).push(car);
      updatePose(car, target, car.s, dt);
      return;
    }

    updatePose(car, car.conn, car.cs, dt);
  }

  function updatePose(car, path, s, dt) {
    pathAt(path, s, _p);
    car.x = _p.x;
    car.z = _p.z;
    if (path.yAt) car.y = path.yAt(s);
    const yaw = Math.atan2(_p.tx, _p.tz);
    car.yaw += angleDiff(car.yaw, yaw) * Math.min(1, dt * 14);
  }

  // ----- network hooks ---------------------------------------------------------

  network.hooks.segmentRemoved = (seg) => {
    for (const car of Array.from(cars)) {
      if (car.mode === 'lane' && car.segId === seg.id) removeCar(car, 'road-removed');
      else if (car.next && car.next.segId === seg.id) {
        if (car.mode === 'turn') removeCar(car, 'road-removed');
        else {
          car.next = null;
          car.granted = false;
        }
      }
    }
    for (const key of Array.from(laneCache.keys())) {
      if (key.startsWith(`${seg.id}:`)) {
        laneCache.delete(key);
        laneCars.delete(key);
      }
    }
  };

  network.hooks.segmentsReshaped = (segIds) => {
    for (const car of cars) {
      if (car.mode !== 'lane' || !segIds.has(car.segId)) continue;
      const old = laneCache.get(laneKey(car.segId, car.dir, car.k));
      const param = old ? old.sStart + old.dir * car.s : null;
      const lane = getLane(car.segId, car.dir, car.k);
      if (!lane) continue;
      if (param !== null) car.s = clamp((param - lane.sStart) * lane.dir, 0, lane.length);
    }
    for (const state of nodeStates.values()) state.waiting.clear();
    for (const car of cars) {
      if (car.mode === 'lane') car.granted = false;
    }
  };

  // ----- simulation step (fixed tick) ---------------------------------------------

  function step(dt) {
    clock += dt;
    let laneTotal = 0;
    for (const seg of network.segments.values()) {
      if (!seg.locked) laneTotal += seg.path.length * seg.type.lanesPerDir * 2;
    }
    const target = Math.min(TRAFFIC.maxWanderers, Math.floor(laneTotal / TRAFFIC.wanderMetersPerCar));

    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnTimer = TRAFFIC.spawnInterval;
      if (wanderers < target && cars.size < TRAFFIC.maxCars) spawnWanderer();
      else if (wanderers > target * 1.15 + 2) {
        for (const car of cars) {
          if (car.kind === 'wander' && !car.dying) {
            car.dying = true;
            break;
          }
        }
      }
    }

    for (const car of Array.from(cars)) {
      if (!cars.has(car)) continue;
      car.age += dt;
      if (car.dying) {
        car.grow -= dt * 3;
        if (car.grow <= 0) {
          removeCar(car, car.arrived ? 'arrived' : 'gave-up');
          continue;
        }
        if (car.arrived) {
          car.speed = Math.max(0, car.speed - TRAFFIC.decel * dt);
          continue;
        }
      } else if (car.grow < 1) {
        car.grow = Math.min(1, car.grow + dt * 3);
      }
      if (car.kind === 'trip' && car.age > 240) car.dying = true;
      if (car.mode === 'lane') updateLaneCar(car, dt);
      else updateTurnCar(car, dt);
    }
  }

  // ----- rendering -----------------------------------------------------------------

  const _m = new THREE.Matrix4();
  const _q = new THREE.Quaternion();
  const _v = new THREE.Vector3();
  const _s = new THREE.Vector3();
  const up = new THREE.Vector3(0, 1, 0);
  const counts = {};

  function render() {
    for (const key of modelKeys) counts[key] = 0;
    let shadowCount = 0;
    for (const car of cars) {
      const mesh = meshes[car.model];
      const index = counts[car.model]++;
      if (index >= capacity) continue;
      const g = clamp(car.grow, 0, 1);
      _q.setFromAxisAngle(up, car.yaw);
      _m.compose(_v.set(car.x, WORLD.roadY + car.y, car.z), _q, _s.set(g, g, g));
      mesh.setMatrixAt(index, _m);
      mesh.setColorAt(index, car.color);

      const model = models[car.model];
      _m.compose(_v.set(car.x, WORLD.roadY + car.y + 0.03, car.z), _q, _s.set(model.width * 1.35 * g, 1, model.length * 1.12 * g));
      shadows.setMatrixAt(shadowCount++, _m);
    }

    for (const key of modelKeys) {
      const mesh = meshes[key];
      mesh.count = Math.min(counts[key], capacity);
      mesh.instanceMatrix.needsUpdate = true;
      if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
    }
    shadows.count = shadowCount;
    shadows.instanceMatrix.needsUpdate = true;
  }

  function recolorSegment(segId, hex) {
    const color = isGrayish(hex) ? null : new THREE.Color(hex);
    for (const car of cars) {
      if (car.kind === 'wander' && car.mode === 'lane' && car.segId === segId && color) car.color.copy(color);
    }
  }

  function clear() {
    for (const car of Array.from(cars)) removeCar(car, 'cleared');
    laneCache.clear();
    laneCars.clear();
    nodeStates.clear();
    wanderers = 0;
  }

  return {
    step,
    render,
    clear,
    recolorSegment,
    spawnTrip,
    hooks,
    setBlobsVisible(visible) {
      shadows.visible = visible;
    },
    get count() {
      return cars.size;
    },
    get cars() {
      return cars;
    },
    get tripCount() {
      return cars.size - wanderers;
    },
  };
}
