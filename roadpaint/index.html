function distanceToSegment(x, z, a, b) {
  const dx = b.x - a.x;
  const dz = b.z - a.z;
  const len2 = dx * dx + dz * dz;
  const t = len2 < 1e-9 ? 0 : clamp(((x - a.x) * dx + (z - a.z) * dz) / len2, 0, 1);
  return Math.hypot(x - (a.x + dx * t), z - (a.z + dz * t));
}

function nearHighway(x, z, margin) {
  return townLines.some((town) => distanceToSegment(x, z, town.from, town.to) < margin);
}

// Footprint corners of a rotated rectangle (front of a building is local +z).
function rectCorners(x, z, rot, w, d, pad = 0) {
  const c = Math.cos(rot);
  const s = Math.sin(rot);
  const hw = w / 2 + pad;
  const hd = d / 2 + pad;
  return [
    [-1, -1],
    [1, -1],
    [1, 1],
    [-1, 1],
  ].map(([i, j]) => ({ x: x + c * hw * i + s * hd * j, z: z - s * hw * i + c * hd * j }));
}

function rectsOverlap(a, b) {
  for (const rect of [a, b]) {
    for (let i = 0; i < rect.length; i++) {
      const p = rect[i];
      const q = rect[(i + 1) % rect.length];
      const ax = -(q.z - p.z);
      const az = q.x - p.x;
      let minA = Infinity;
      let maxA = -Infinity;
      let minB = Infinity;
      let maxB = -Infinity;
      for (const c of a) {
        const v = c.x * ax + c.z * az;
        minA = Math.min(minA, v);
        maxA = Math.max(maxA, v);
      }
      for (const c of b) {
        const v = c.x * ax + c.z * az;
        minB = Math.min(minB, v);
        maxB = Math.max(maxB, v);
      }
      if (maxA < minB || maxB < minA) return false;
    }
  }
  return true;
}

function pointInPolygon(x, z, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const a = poly[i];
    const b = poly[j];
    if (a.z > z !== b.z > z && x < ((b.x - a.x) * (z - a.z)) / (b.z - a.z) + a.x) inside = !inside;
  }
  return inside;
}

function polygonArea(poly) {
  let area = 0;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) area += (poly[j].x + poly[i].x) * (poly[j].z - poly[i].z);
  return area / 2;
}

function polygonCentroid(poly) {
  let x = 0;
  let z = 0;
  let a = 0;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const f = poly[j].x * poly[i].z - poly[i].x * poly[j].z;
    x += (poly[j].x + poly[i].x) * f;
    z += (poly[j].z + poly[i].z) * f;
    a += f;
  }
  if (Math.abs(a) < 1e-6) {
    const n = poly.length;
    return { x: poly.reduce((s, p) => s + p.x, 0) / n, z: poly.reduce((s, p) => s + p.z, 0) / n };
  }
  return { x: x / (3 * a), z: z / (3 * a) };
}

// Orientation of the longest edge, so footprints get a sensible "front".
function dominantAngle(poly) {
  let best = 0;
  let angle = 0;
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i];
    const b = poly[(i + 1) % poly.length];
    const len = Math.hypot(b.x - a.x, b.z - a.z);
    if (len > best) {
      best = len;
      angle = Math.atan2(b.x - a.x, b.z - a.z);
    }
  }
  return angle;
}

function houseParts(r, roof) {
  const wall = pickFrom(r, WALL_COLORS);
  const w = 6 + r() * 3;
  const d = 5.5 + r() * 2;
  const floors = r() < 0.35 ? 2 : 1;
  const h = floors * 2.8;
  const roofH = 2 + r() * 1.3;
  const parts = [modelPart(box(w, h, d), wall, { position: [0, h / 2, 0] })];

  if (r() < 0.6) {
    parts.push(modelPart(prismRoof(w + 0.8, d + 0.8, roofH), roof, { position: [0, h, 0] }));
  } else {
    const rd = d + 0.8;
    parts.push(
      modelPart(taperedBox(w + 0.8, roofH, rd, { topScaleX: 0.45, topFront: rd * 0.45, topBack: rd * 0.45 }), roof, {
        position: [0, h + roofH / 2, 0],
      }),
    );
  }

  const doorX = (r() - 0.5) * (w - 3);
  parts.push(modelPart(box(1.1, 2.1, 0.15), 0x5a3a22, { position: [doorX, 1.05, d / 2 + 0.05] }));
  for (let f = 0; f < floors; f++) {
    const y = 1.55 + f * 2.8;
    for (const x of [-w * 0.3, w * 0.3]) {
      if (f === 0 && Math.abs(x - doorX) < 1.4) continue;
      parts.push(modelPart(box(1.1, 0.95, 0.12), GLASS, { position: [x, y, d / 2 + 0.04] }));
    }
    parts.push(modelPart(box(1.1, 0.95, 0.12), GLASS, { position: [0, y, -d / 2 - 0.04] }));
    for (const side of [-1, 1]) {
      parts.push(modelPart(box(0.12, 0.95, 1.1), GLASS, { position: [side * (w / 2 + 0.04), y, 0] }));
    }
  }
  if (r() < 0.45) {
    parts.push(modelPart(box(0.7, roofH + 0.8, 0.7), 0x8a4a3a, { position: [w * 0.28, h + (roofH + 0.8) / 2, -d * 0.15] }));
  }
  if (r() < 0.3) {
    const ww = 3.6;
    const wd = d * 0.7;
    const side = r() < 0.5 ? -1 : 1;

  }
  return parts;

// Marks glass so the night shader can light the windows.
function markGlass(geometry) {
  const color = geometry.getAttribute('color');
  const g = new THREE.Color(GLASS);
  for (let i = 0; i < color.count; i++) {
    const near = Math.abs(color.getX(i) - g.r) + Math.abs(color.getY(i) - g.g) + Math.abs(color.getZ(i) - g.b) < 0.02;
    color.setW(i, near ? 0.5 : 1);
  }
  return geometry;
}

// Builds the mesh for a building record. Same seed, same building.
function makeBuildingGeometry(record) {
  const r = mulberry32(record.seed);
  const accent = record.color >= 0 ? GROUP_COLORS[record.color].color : pickFrom(r, GROUP_COLORS).color;
  let parts;
  if (record.kind === 'house') parts = houseParts(r, accent);
  else if (record.kind === 'apartment') parts = apartmentParts(r, accent);
  else if (record.kind === 'business' && !CIVIC_TYPES[record.variant]) {
    if (record.variant === 'office') parts = officeParts(r, accent);
    else if (record.variant === 'factory') parts = factoryParts(r, accent);
    else parts = shopParts(r, accent);
  } else if (['townhall', 'police', 'fire', 'school', 'hospital'].includes(record.variant)) parts = civicParts(record.variant);
  else parts = landmarkParts(record.variant, r);

  const geometry = markGlass(mergeModel(parts));
  geometry.computeBoundingBox();
  const bb = geometry.boundingBox;
  geometry.translate(-(bb.min.x + bb.max.x) / 2, 0, -(bb.min.z + bb.max.z) / 2);
  geometry.computeBoundingSphere();
  return { geometry, w: bb.max.x - bb.min.x, d: bb.max.z - bb.min.z, h: bb.max.y };
}

// World-space copy of a local model placed at (x, z) facing `rot`.
function placeGeometry(geometry, x, z, rot, y = 0) {
  const g = geometry.clone();
  g.applyMatrix4(new THREE.Matrix4().makeRotationY(rot).setPosition(x, y, z));
  return g;
}

// ---------------------------------------------------------------------------
// Imported buildings: real footprints pushed up to their real height
// ---------------------------------------------------------------------------

function footprintRoof(builder, poly, h, color) {
  const contour = poly.map((p) => new THREE.Vector2(p.x, p.z));
  const tris = THREE.ShapeUtils.triangulateShape(contour, []);
  for (const [i, j, k] of tris) {
    const a = poly[i];
    const b = poly[j];
    const c = poly[k];
    // Face up regardless of the triangulation's winding.
    const cross = (b.x - a.x) * (c.z - a.z) - (b.z - a.z) * (c.x - a.x);
    const pts = cross < 0 ? [a, b, c] : [a, c, b];
    builder.tri(v3(pts[0].x, h, pts[0].z), v3(pts[1].x, h, pts[1].z), v3(pts[2].x, h, pts[2].z), UP, color, [0, 0], [0, 0], [0, 0]);
  }
}

// Gable roof over a (roughly) rectangular footprint.
function gableRoof(builder, poly, h, rise, color) {
  const e = [0, 1, 2, 3].map((i) => Math.hypot(poly[(i + 1) % 4].x - poly[i].x, poly[(i + 1) % 4].z - poly[i].z));
  const k = e[0] + e[2] >= e[1] + e[3] ? 1 : 0;
  // Short edges are k and k+2; the ridge joins their midpoints.
  const mid = (i) => ({ x: (poly[i].x + poly[(i + 1) % 4].x) / 2, z: (poly[i].z + poly[(i + 1) % 4].z) / 2 });
  const m1 = mid(k);
  const m2 = mid((k + 2) % 4);
  const r1 = v3(m1.x, h + rise, m1.z);
  const r2 = v3(m2.x, h + rise, m2.z);
  const P = poly.map((p) => v3(p.x, h, p.z));
  const n = (a, b, c) => {
    const ux = b.x - a.x;
    const uy = b.y - a.y;
    const uz = b.z - a.z;
    const vx = c.x - a.x;
    const vy = c.y - a.y;
    const vz = c.z - a.z;
    let nx = uy * vz - uz * vy;
    let ny = uz * vx - ux * vz;
    let nz = ux * vy - uy * vx;
    if (ny < 0) {
      nx = -nx;
      ny = -ny;
      nz = -nz;
    }
    const l = Math.hypot(nx, ny, nz) || 1;
    return { x: nx / l, y: ny / l, z: nz / l };
  };
  const a = k;
  const b = (k + 1) % 4;
  const c = (k + 2) % 4;
  const d = (k + 3) % 4;
  // Slopes: edge b-c with ridge, edge d-a with ridge.
  builder.quad(P[b], P[c], r2, r1, n(P[b], P[c], r2), color);
  builder.quad(P[d], P[a], r1, r2, n(P[d], P[a], r1), color);
  // Gable ends.
  builder.tri(P[a], P[b], r1, n(P[a], P[b], r1), color, [0, 0], [0, 0], [0, 0]);
  builder.tri(P[c], P[d], r2, n(P[c], P[d], r2), color, [0, 0], [0, 0], [0, 0]);
}

function makeFootprintParts(b) {
  let poly = b.footprint;
  if (polygonArea(poly) < 0) poly = poly.slice().reverse();
  const h = b.h;
  const walls = createMeshBuilder();
  const roof = createMeshBuilder();
  const wall = colorRGB(b.wallColor);
  const roofColor = colorRGB(b.roofColor);
  const style = b.landmark;

  let u = 0;
  const base = 0;
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i];
    const c = poly[(i + 1) % poly.length];
    const dx = c.x - a.x;
    const dz = c.z - a.z;
    const len = Math.hypot(dx, dz);
    if (len < 0.05) continue;
    const nrm = { x: dz / len, y: 0, z: -dx / len };
    const u1 = u + len / 4;
    walls.quad(v3(a.x, base, a.z), v3(c.x, base, c.z), v3(c.x, h, c.z), v3(a.x, h, a.z), nrm, wall, [u, 0], [u1, 0], [u1, h / 3.2], [u, h / 3.2]);
    u = u1;
  }

  const rect = poly.length === 4 && Math.abs(Math.abs(polygonArea(poly)) - b.w * b.d) < b.w * b.d * 0.12;
  if (style === 'stadium') {
    // Stands slope down to a pitch inside the outline.
    const c = { x: b.x, z: b.z };
    const inner = poly.map((p) => ({ x: c.x + (p.x - c.x) * 0.66, z: c.z + (p.z - c.z) * 0.66 }));
    const stand = colorRGB(0x8a94a8);
    for (let i = 0; i < poly.length; i++) {
      const j = (i + 1) % poly.length;
      roof.quad(v3(poly[i].x, h, poly[i].z), v3(poly[j].x, h, poly[j].z), v3(inner[j].x, 2, inner[j].z), v3(inner[i].x, 2, inner[i].z), UP, stand);
      roof.quad(v3(inner[i].x, 2, inner[i].z), v3(inner[j].x, 2, inner[j].z), v3(inner[j].x, 0.2, inner[j].z), v3(inner[i].x, 0.2, inner[i].z), UP, 0.5);
    }
    footprintRoof(roof, inner, 0.35, colorRGB(0x3a9a3a));
  } else if (b.roofShape === 'gable' && rect) {
    gableRoof(roof, poly, h, Math.min(b.w, b.d) * 0.45, roofColor);
  } else {
    footprintRoof(roof, poly, h, roofColor);
  }

  // Landmark trims on top of the real outline.
  const extras = [];
  const r = mulberry32(b.seed);
  const add = (geo, color, position, extra = {}) => extras.push(modelPart(geo, color, { position, ...extra }));
  if (style === 'church') {
    const s = Math.min(b.w, b.d) * 0.22 + 2;
    const fx = Math.sin(b.rot) * b.d * 0.38;
    const fz = Math.cos(b.rot) * b.d * 0.38;
    add(box(s, h * 0.9 + 6, s), b.wallColor, [b.x + fx, (h * 0.9 + 6) / 2, b.z + fz]);
    add(taperedBox(s + 0.4, s * 2.2, s + 0.4, { topScaleX: 0.05, topFront: s / 2, topBack: s / 2 }), 0x5a6a6a, [b.x + fx, h * 0.9 + 6 + s * 1.1, b.z + fz]);
  } else if (style === 'mosque') {
    const s = Math.min(b.w, b.d) * 0.32 + 2;
    add(new THREE.SphereGeometry(s, 10, 6, 0, Math.PI * 2, 0, Math.PI / 2), 0x5aa08a, [b.x, h, b.z]);
    const mx = b.x + Math.cos(b.rot) * b.w * 0.45;
    const mz = b.z - Math.sin(b.rot) * b.w * 0.45;
    add(new THREE.CylinderGeometry(0.9, 1.1, h + 18, 8), b.wallColor, [mx, (h + 18) / 2, mz]);
    add(new THREE.ConeGeometry(1.2, 3, 8), 0x5aa08a, [mx, h + 19.5, mz]);
  } else if (style === 'tower') {
    add(new THREE.CylinderGeometry(0.4, 0.4, 14, 6), 0xd0d0d0, [b.x, h + 7, b.z]);
    add(box(0.8, 0.8, 0.8), 0xff2020, [b.x, h + 14.4, b.z]);
  } else if (style === 'skyscraper') {
    add(box(b.w * 0.5, 5, b.d * 0.5), 0xc8ccd0, [b.x, h + 2.5, b.z], { rotation: [0, b.rot, 0] });
    add(box(0.4, 12, 0.4), 0xd0d0d0, [b.x, h + 11, b.z]);
  } else if (style === 'dome') {
    const s = Math.min(b.w, b.d) * 0.35 + 1;
    add(new THREE.SphereGeometry(s, 10, 6, 0, Math.PI * 2, 0, Math.PI / 2), 0x6a9a8a, [b.x, h, b.z]);
  } else if (b.area > 900 && b.roofShape !== 'gable') {
    // Rooftop plant on big flat roofs.
    const n = 1 + Math.floor(r() * 3);
    for (let i = 0; i < n; i++) {
      const ox = (r() - 0.5) * b.w * 0.4;
      const oz = (r() - 0.5) * b.d * 0.4;
      const c = Math.cos(b.rot);
      const s = Math.sin(b.rot);
      add(box(2 + r() * 3, 1.4 + r(), 2 + r() * 2), 0xa8a8a8, [b.x + c * ox + s * oz, h + 0.8, b.z - s * ox + c * oz], { rotation: [0, b.rot, 0] });
    }
  }

  const parts = [];
  if (!walls.empty) parts.push({ kind: 'facade', geometry: walls.build() });
  const roofGeo = roof.empty ? null : roof.build();
  const model = extras.length ? markGlass(mergeModel(extras)) : null;
  const list = [roofGeo, model].filter(Boolean);
  if (list.length) parts.push({ kind: 'model', geometry: list.length === 1 ? list[0] : mergeGeometries(list) });
  return parts;
}

function signTexture(lines, { bg = '#1e6b3a', fg = '#ffffff' } = {}) {
  const canvas = document.createElement('canvas');
  canvas.width = 128;
  canvas.height = 48;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, 128, 48);
  ctx.strokeStyle = fg;
  ctx.lineWidth = 2;
  ctx.strokeRect(3, 3, 122, 42);
  ctx.fillStyle = fg;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 13px Tahoma, Verdana, sans-serif';
  ctx.fillText(lines[0], 64, 18);
  ctx.font = '11px Tahoma, Verdana, sans-serif';
  ctx.fillText(lines[1] ?? '', 64, 33);
  const texture = new THREE.CanvasTexture(canvas);
  texture.magFilter = THREE.NearestFilter;
  texture.minFilter = THREE.NearestFilter;
  texture.generateMipmaps = false;
  return texture;
}

function buildTownSign(town) {
  const group = new THREE.Group();
  const dx = town.to.x - town.from.x;
  const dz = town.to.z - town.from.z;
  const len = Math.hypot(dx, dz);
  const ix = dx / len;
  const iz = dz / len;
  const side = ROAD_TYPES.highway.roadHalf + 3.5;
  const x = town.to.x - ix * 24 + -iz * side;
  const z = town.to.z - iz * 24 + ix * side;

  const posts = new THREE.Mesh(
    mergeModel([
      modelPart(box(0.3, 5.6, 0.3), 0x8a8a8a, { position: [-3.4, 2.8, 0] }),
      modelPart(box(0.3, 5.6, 0.3), 0x8a8a8a, { position: [3.4, 2.8, 0] }),
      modelPart(box(9.2, 3.6, 0.12), 0x1e6b3a, { position: [0, 4.2, 0] }),
    ]),
    createRetroMaterial({ vertexColors: true }),
  );
  group.add(posts);

  const front = new THREE.Mesh(new THREE.PlaneGeometry(9, 3.4), createRetroMaterial({ map: signTexture([town.name, `${town.km} km`]), unlit: true }));
  front.position.set(0, 4.2, 0.07);
  const back = new THREE.Mesh(new THREE.PlaneGeometry(9, 3.4), createRetroMaterial({ map: signTexture(['Welcome to', 'Road Paint City']), unlit: true }));
  back.position.set(0, 4.2, -0.07);
  back.rotation.y = Math.PI;
  group.add(noShadow(front), noShadow(back));

  group.position.set(x, 0, z);
  group.rotation.y = Math.atan2(ix, iz);
  return group;
}

// Clock: the game starts at 07:00 on day 1.
function hoursAt(time) {
  return CITY.startHour + (time / CITY.dayLength) * 24;
}

function timeAtHours(hours) {
  return ((hours - CITY.startHour) / 24) * CITY.dayLength;
}

function hourOf(time) {
  return ((hoursAt(time) % 24) + 24) % 24;
}

function formatClock(time) {
  const h = hourOf(time);
  const hh = Math.floor(h);
  const mm = Math.floor((h - hh) * 60);
  return `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
}

// Name plates for shops, landmarks and streets, drawn into one atlas.
function createSignAtlas(rows = 64) {
  const atlas = {
    cellW: 256,
    cellH: 32,
    cols: 8,
    rows,
    canvas: null,
    texture: null,
    next: 0,
    init() {
      if (this.canvas) return;
      this.canvas = document.createElement('canvas');
      this.canvas.width = this.cellW * this.cols;
      this.canvas.height = this.cellH * this.rows;
      this.texture = new THREE.CanvasTexture(this.canvas);
      this.texture.magFilter = THREE.NearestFilter;
      this.texture.minFilter = THREE.NearestFilter;
      this.texture.generateMipmaps = false;
      this.texture.flipY = false;
    },
    reset() {
      this.init();
      this.next = 0;
      this.canvas.getContext('2d').clearRect(0, 0, this.canvas.width, this.canvas.height);
    },
    // Draws one plate and returns its uv rectangle (or null when full).
    add(text, { bg = '#ffffff', fg = '#000000' } = {}) {
      this.init();
      if (this.next >= this.cols * this.rows) return null;
      const i = this.next++;
      const cx = (i % this.cols) * this.cellW;
      const cy = Math.floor(i / this.cols) * this.cellH;
      const ctx = this.canvas.getContext('2d');
      ctx.fillStyle = bg;
      ctx.fillRect(cx, cy, this.cellW, this.cellH);
      ctx.strokeStyle = fg;
      ctx.lineWidth = 2;
      ctx.strokeRect(cx + 2, cy + 2, this.cellW - 4, this.cellH - 4);
      ctx.fillStyle = fg;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      let size = 18;
      ctx.font = `bold ${size}px Tahoma, Verdana, sans-serif`;
      while (size > 10 && ctx.measureText(text).width > this.cellW - 14) {
        size--;
        ctx.font = `bold ${size}px Tahoma, Verdana, sans-serif`;
      }
      ctx.fillText(text, cx + this.cellW / 2, cy + this.cellH / 2 + 1, this.cellW - 12);
      this.texture.needsUpdate = true;
      const W = this.canvas.width;
      const H = this.canvas.height;
      const width = Math.min(this.cellW - 8, ctx.measureText(text).width + 24);
      const pad = (this.cellW - width) / 2;
      return {
        u0: (cx + pad) / W,
        u1: (cx + this.cellW - pad) / W,
        v0: (cy + 1) / H,
        v1: (cy + this.cellH - 1) / H,
        aspect: width / this.cellH,
      };
    },
  };
  atlas.init();
  atlas.material = createRetroMaterial({ map: atlas.texture, unlit: true, polygonOffset: -2 });
  return atlas;
}

const CITY_PART_KINDS = new Map();

function cityPartKind(kind) {
  let def = CITY_PART_KINDS.get(kind);
  if (!def) {
    if (kind === 'facade') def = { material: createRetroMaterial({ map: TEXTURES.facade, vertexColors: true, glow: true }), cast: true };
    else def = { material: createRetroMaterial({ vertexColors: true, glow: true }), cast: true };
    CITY_PART_KINDS.set(kind, def);
  }
  return def;
}

// A flat sign quad (both sides) facing `yaw`, in world space.
function signGeometry(rect, x, y, z, yaw, height) {
  const builder = createMeshBuilder();
  const w = height * rect.aspect;
  const ax = Math.cos(yaw) * (w / 2);
  const az = -Math.sin(yaw) * (w / 2);
  const n = { x: Math.sin(yaw), y: 0, z: Math.cos(yaw) };
  const p0 = v3(x - ax, y, z - az);
  const p1 = v3(x + ax, y, z + az);
  const p2 = v3(x + ax, y + height, z + az);
  const p3 = v3(x - ax, y + height, z - az);
  builder.quad(p0, p1, p2, p3, n, 1, [rect.u0, rect.v1], [rect.u1, rect.v1], [rect.u1, rect.v0], [rect.u0, rect.v0]);
  const back = { x: -n.x, y: 0, z: -n.z };
  const o = 0.06;
  const q = (p) => v3(p.x - n.x * o, p.y, p.z - n.z * o);
  builder.quad(q(p1), q(p0), q(p3), q(p2), back, 1, [rect.u0, rect.v1], [rect.u1, rect.v1], [rect.u1, rect.v0], [rect.u0, rect.v0]);
  return builder.build();
}

// Binary min-heap of timed events.
function createTimeline() {
  const heap = [];
  function push(item) {
    heap.push(item);
    let i = heap.length - 1;
    while (i > 0) {
      const p = (i - 1) >> 1;
      if (heap[p].t <= heap[i].t) break;
      [heap[p], heap[i]] = [heap[i], heap[p]];
      i = p;
    }
  }
  function pop() {
    const top = heap[0];
    const last = heap.pop();
    if (heap.length > 0) {
      heap[0] = last;
      let i = 0;
      for (;;) {
        const l = i * 2 + 1;
        const r = l + 1;
        let m = i;
        if (l < heap.length && heap[l].t < heap[m].t) m = l;
        if (r < heap.length && heap[r].t < heap[m].t) m = r;
        if (m === i) break;
        [heap[m], heap[i]] = [heap[i], heap[m]];
        i = m;
      }
    }
    return top;
  }
  return {
    push,
    pop,
    peek: () => heap[0],
    get size() {
      return heap.length;
    },
    // Keeps only items passing the filter (rebuilds the heap).
    filter(keep) {
      const kept = heap.filter(keep);
      heap.length = 0;
      for (const item of kept) push(item);
    },
    clear() {
      heap.length = 0;
    },
  };
}

// Picks from a list by weight with a prebuilt cumulative table.
function weightedTable(list, weightOf) {
  const items = [];
  const cum = [];
  let total = 0;
  for (const item of list) {
    const w = weightOf(item);
    if (!(w > 0)) continue;
    total += w;
    items.push(item);
    cum.push(total);
  }
  return {
    total,
    pick(rand) {
      if (items.length === 0) return null;
      const x = rand() * total;
      let lo = 0;
      let hi = cum.length - 1;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (cum[mid] < x) lo = mid + 1;
        else hi = mid;
      }
      return items[lo];
    },
  };
}

function isHome(b) {
  return b.kind === 'house' || b.kind === 'apartment';
}

function createCity({ scene, network, rails = null, traffic, scenery, events }) {
  const rand = mulberry32(Date.now() & 0xffff);
  const buildings = new Map();
  let nextId = 1;

  const root = new THREE.Group();
  root.name = 'city';
  scene.add(root);
  const batcher = createChunkBatcher(root, cityPartKind, 192);
  const popMaterial = cityPartKind('model').material;
  const signRoot = new THREE.Group();
  root.add(signRoot);
  const signAtlas = createSignAtlas();

  const nets = rails ? [network, rails] : [network];
  const seen = new Map();
  let seenVersion = -1;
  let seenRailVersion = -1;
  let components = new Map();
  let compCache = null;
  const timeline = createTimeline();

  const state = freshState();

  function freshState() {
    return {
      time: 0,
      milestone: 0,
      colors: 0,
      spawnTimer: 1,
      spawning: true,
      pendingCivic: [],
      stats: { trips: 0, inbound: 0, outbound: 0 },
      day: -1,
      planDirty: false,
      plannedAt: -999,
      scale: 1,
      people: { onRoad: 0, atWork: 0, shopping: 0, errands: 0, visiting: 0, outOfTown: 0, inCommuters: 0 },
      today: { trips: 0, failed: 0 },
      history: [],
      sampleAt: 0,
      mapName: null,
    };
  }

  // ----- spatial grid --------------------------------------------------------

  const CELL = 64;
  const grid = new Map();

  function cellRange(bounds, fn) {
    const x0 = Math.floor(bounds.minX / CELL);
    const x1 = Math.floor(bounds.maxX / CELL);
    const z0 = Math.floor(bounds.minZ / CELL);
    const z1 = Math.floor(bounds.maxZ / CELL);
    for (let cx = x0; cx <= x1; cx++) for (let cz = z0; cz <= z1; cz++) fn(`${cx},${cz}`);
  }

  function gridAdd(b) {
    cellRange(b.bounds, (key) => {
      let set = grid.get(key);
      if (!set) grid.set(key, (set = new Set()));
      set.add(b);
    });
  }

  function gridRemove(b) {
    cellRange(b.bounds, (key) => {
      const set = grid.get(key);
      if (!set) return;
      set.delete(b);
      if (set.size === 0) grid.delete(key);
    });
  }

  function buildingsNear(minX, minZ, maxX, maxZ) {
    const out = new Set();
    cellRange({ minX, minZ, maxX, maxZ }, (key) => {
      const set = grid.get(key);
      if (set) for (const b of set) out.add(b);
    });
    return out;
  }

  // ----- outside connections ------------------------------------------------

  let towns = [];
  let townSigns = [];

  function setTowns(defs) {
    for (const town of towns) {
      const node = network.nodes.get(town.nodeId);
      if (node) {
        for (const segId of Array.from(node.segs)) {
          const seg = network.segments.get(segId);
          if (seg?.locked) network.removeSegment(seg, { force: true });
        }
      }
    }
    for (const sign of townSigns) scene.remove(sign);
    townSigns = [];
    townLines = defs;
    towns = defs.map((def, index) => {
      const type = ROAD_TYPES[def.type] ?? ROAD_TYPES.highway;
      const built = network.addLockedRoad([def.from, def.to], type, def.paint ?? 0xffff00, { outsideStart: true });
      const sign = buildTownSign(def);
      scene.add(sign);
      townSigns.push(sign);
      return { ...def, color: def.color ?? 0xffffff, index, nodeId: built.outsideNode.id, comp: null };
    });
    seenVersion = -1;
    events.emit('towns:changed', towns);
  }

  function townEnd(town, distance) {
    const node = network.nodes.get(town.nodeId);
    if (!node || node.segs.size === 0) return null;
    const seg = network.segments.get(node.segs.values().next().value);
    if (!seg) return null;
    return { segId: seg.id, s: seg.a === node.id ? distance : seg.path.length - distance };
  }

  // ----- markers: warnings, demand pins and driveways --------------------------

  const markerCap = CITY.maxBuildings + 8;
  const warnings = noShadow(new THREE.InstancedMesh(new THREE.OctahedronGeometry(1.3, 0), createRetroMaterial({ color: 0xffd400, unlit: true }), markerCap));
  warnings.frustumCulled = false;
  warnings.count = 0;

  const pinGeometry = mergeModel([
    modelPart(new THREE.ConeGeometry(0.45, 1.4, 5), 0xffffff, { position: [0, 0.7, 0], rotation: [Math.PI, 0, 0], paint: 1 }),
    modelPart(new THREE.IcosahedronGeometry(0.75, 0), 0xffffff, { position: [0, 1.75, 0], paint: 1 }),
  ]);
  const pins = noShadow(new THREE.InstancedMesh(pinGeometry, createRetroMaterial({ vertexColors: true }), markerCap * 2));
  pins.frustumCulled = false;
  pins.count = 0;
  pins.setColorAt(0, new THREE.Color(0xffffff));

  const drivewayGeometry = new THREE.BoxGeometry(1, 1, 1);
  drivewayGeometry.translate(0, 0.5, 0);
  const driveways = noShadow(
    new THREE.InstancedMesh(drivewayGeometry, createRetroMaterial({ map: TEXTURES.concrete, color: 0xd0ccc0, polygonOffset: -1 }), markerCap),
  );
  driveways.frustumCulled = false;
  driveways.count = 0;
  root.add(warnings, pins, driveways);

  // ----- placement -------------------------------------------------------------

  function footprintPoints(x, z, rot, w, d, pad) {
    const corners = rectCorners(x, z, rot, w, d, pad);
    const pts = [{ x, z }, ...corners];
    for (let i = 0; i < 4; i++) {
      const a = corners[i];
      const b = corners[(i + 1) % 4];
      pts.push({ x: (a.x + b.x) / 2, z: (a.z + b.z) / 2 });
    }
    return pts;
  }

  function overlapsRoad(x, z, rot, w, d, pad) {
    const pts = footprintPoints(x, z, rot, w, d, Math.max(0, pad));
    const reach = Math.hypot(w, d) / 2 + Math.max(0, pad) + 40;
    for (const net of nets) {
      for (const seg of net.segsNear(x - reach, z - reach, x + reach, z + reach)) {
        const limit = outerHalf(seg.type) + pad;
        for (const p of pts) {
          const hit = closestOnPath(seg.path, p.x, p.z);
          // Deep tunnels leave the ground above them free to build on.
          if (hit.dist < limit && net.heightAt(seg, hit.s) > -4) return true;
        }
      }
    }
    return false;
  }

  function nearJunction(x, z, radius) {
    const reach = radius + 60;
    const checked = new Set();
    for (const seg of network.segsNear(x - reach, z - reach, x + reach, z + reach)) {
      for (const id of [seg.a, seg.b]) {
        if (checked.has(id)) continue;
        checked.add(id);
        const node = network.nodes.get(id);
        if (!node || node.segs.size === 2) continue;
        let half = 0;
        for (const segId of node.segs) {
          const s = network.segments.get(segId);
          if (s) half = Math.max(half, outerHalf(s.type));
        }
        if (Math.hypot(node.x - x, node.z - z) < half * 1.7 + radius) return true;
      }
    }
    return false;
  }

  function fits(x, z, rot, w, d) {
    const limit = WORLD.half - 8;
    const rect = rectCorners(x, z, rot, w, d, 1.5);
    for (const c of rect) if (Math.abs(c.x) > limit || Math.abs(c.z) > limit) return false;
    const radius = Math.hypot(w, d) / 2;
    for (const b of buildingsNear(x - radius - 2, z - radius - 2, x + radius + 2, z + radius + 2)) {
      if (Math.hypot(b.x - x, b.z - z) > radius + b.radius + 3) continue;
      if (rectsOverlap(rect, b.poly)) return false;
    }
    if (overlapsRoad(x, z, rot, w, d, 1.2)) return false;
    if (nearJunction(x, z, radius * 0.6)) return false;
    return true;
  }

  function roadsNear(center, radius) {
    return Array.from(network.segsNear(center.x - radius, center.z - radius, center.x + radius, center.z + radius)).filter(
      (seg) => !seg.locked && Math.abs(network.heightAt(seg, seg.path.length / 2)) < 1.5,
    );
  }

  function findSpot(size, center, radius, nearRoad) {
    const candidates = nearRoad ? roadsNear(center, radius) : [];
    for (let attempt = 0; attempt < 36; attempt++) {
      let x;
      let z;
      let rot;
      if (candidates.length > 0) {
        const seg = pickFrom(rand, candidates);
        const lo = seg.trimA + size.w / 2 + 2;
        const hi = seg.path.length - seg.trimB - size.w / 2 - 2;
        if (hi <= lo) continue;
        const p = pathAt(seg.path, lo + rand() * (hi - lo));
        const side = rand() < 0.5 ? -1 : 1;
        const nx = p.tz * side;
        const nz = -p.tx * side;
        const off = outerHalf(seg.type) + 1.6 + rand() * 2.5 + size.d / 2;
        x = p.x + nx * off;
        z = p.z + nz * off;
        rot = Math.atan2(-nx, -nz);
        if (Math.hypot(x - center.x, z - center.z) > radius * 1.25) continue;
      } else {
        const a = rand() * Math.PI * 2;
        const dist = Math.sqrt(rand()) * radius;
        x = center.x + Math.cos(a) * dist;
        z = center.z + Math.sin(a) * dist;
        const access = network.nearestAccess(x, z, 45);
        rot = access ? Math.atan2(access.x - x, access.z - z) : Math.floor(rand() * 4) * (Math.PI / 2);
      }
      if (fits(x, z, rot, size.w, size.d)) return { x, z, rot };
    }
    return null;
  }

  // ----- buildings ---------------------------------------------------------------

  function jobsFor(b) {
    const r = mulberry32(b.seed + 11);
    if (b.footprint) {
      const floor = b.area * Math.max(1, b.levels);
      if (b.kind === 'business') return Math.max(3, Math.round(floor / (b.variant === 'factory' ? 60 : 30)));
      if (b.kind === 'civic') return Math.max(4, Math.min(CIVIC_TYPES[b.variant]?.jobs * 3 || 400, Math.round(floor / 40)));
      if (b.kind === 'other') return Math.round(floor / 120);
      return 0;
    }
    if (b.kind === 'business') {
      const range = BUSINESS_JOBS[b.variant];
      if (range) return Math.round(lerp(range[0], range[1], r()));
      return CIVIC_TYPES[b.variant]?.jobs ?? 8;
    }
    if (b.kind === 'civic') return CIVIC_TYPES[b.variant]?.jobs ?? 10;
    return 0;
  }

  function residentsFor(b, record) {
    if (!isHome(b)) return 0;
    if (record.residents !== undefined) return record.residents;
    if (b.footprint) {
      const floor = b.area * Math.max(1, b.levels);
      return Math.max(1, Math.round(floor / (b.kind === 'house' ? 50 : 35)));
    }
    const [lo, hi] = BUILDING_KINDS[b.kind].residents;
    return lo + Math.floor(mulberry32(record.seed + 7)() * (hi - lo + 1));
  }

  function boundsOf(poly) {
    let minX = Infinity;
    let minZ = Infinity;
    let maxX = -Infinity;
    let maxZ = -Infinity;
    for (const p of poly) {
      minX = Math.min(minX, p.x);
      maxX = Math.max(maxX, p.x);
      minZ = Math.min(minZ, p.z);
      maxZ = Math.max(maxZ, p.z);
    }
    return { minX, minZ, maxX, maxZ };
  }

  function addBuilding(record, { animate = true } = {}) {
    const b = {
      ...record,
      id: nextId++,
      access: null,
      drive: null,
      demand: record.demand ?? 0,
      grow: animate ? 0 : 1,
      mesh: null,
      geometry: null,
      away: 0,
      inside: 0,
      spawned: !record.footprint,
    };
    if (record.footprint) {
      // Imported outline: real shape, real height.
      const poly = record.footprint;
      const c = polygonCentroid(poly);
      b.x = c.x;
      b.z = c.z;
      b.rot = record.rot ?? dominantAngle(poly);
      const cs = Math.cos(b.rot);
      const sn = Math.sin(b.rot);
      let minU = Infinity;
      let maxU = -Infinity;
      let minV = Infinity;
      let maxV = -Infinity;
      let radius = 0;
      for (const p of poly) {
        const dx = p.x - c.x;
        const dz = p.z - c.z;
        const u = dx * cs - dz * sn;
        const v = dx * sn + dz * cs;
        minU = Math.min(minU, u);
        maxU = Math.max(maxU, u);
        minV = Math.min(minV, v);
        maxV = Math.max(maxV, v);
        radius = Math.max(radius, Math.hypot(dx, dz));
      }
      b.w = maxU - minU;
      b.d = maxV - minV;
      b.area = Math.abs(polygonArea(poly));
      b.radius = radius;
      b.levels = record.levels ?? Math.max(1, Math.round(record.h / 3.2));
      b.poly = poly;
    } else {
      const model = makeBuildingGeometry(record);
      b.geometry = model.geometry;
      b.w = model.w;
      b.d = model.d;
      b.h = model.h;
      b.radius = Math.hypot(model.w, model.d) / 2;
      b.area = b.w * b.d;
      b.levels = Math.max(1, Math.round(b.h / 3.2));
      b.poly = rectCorners(b.x, b.z, b.rot, b.w, b.d);
    }
    b.bounds = boundsOf(b.poly);
    b.residents = residentsFor(b, record);
    b.jobs = record.jobs ?? jobsFor(b);
    buildings.set(b.id, b);
    gridAdd(b);
    if (b.spawned) scenery.clearAlongPath([{ x: b.x, z: b.z }], b.radius);
    if (animate && b.geometry) {
      b.mesh = new THREE.Mesh(b.geometry, popMaterial);
      b.mesh.position.set(b.x, 0, b.z);
      b.mesh.rotation.y = b.rot;
      b.mesh.scale.set(1, 0.001, 1);
      root.add(b.mesh);
    } else {
      settle(b);
    }
    computeAccess(b);
    state.planDirty = true;
    return b;
  }

  // Moves a building into the chunk batches.
  function settle(b) {
    if (b.mesh) {
      root.remove(b.mesh);
      b.mesh = null;
    }
    if (b.footprint) batcher.set(b, makeFootprintParts(b), b.x, b.z);
    else {
      batcher.set(b, [{ kind: 'model', geometry: placeGeometry(b.geometry, b.x, b.z, b.rot) }], b.x, b.z);
      b.geometry.dispose();
      b.geometry = null;
    }
  }

  function removeBuilding(b) {
    if (!buildings.has(b.id)) return;
    buildings.delete(b.id);
    gridRemove(b);
    if (b.mesh) root.remove(b.mesh);
    b.geometry?.dispose();
    batcher.remove(b);
    state.planDirty = true;
  }

  function spawn(kind, variant, color, center, radius, nearRoad) {
    const seed = Math.floor(rand() * 1e9);
    const record = { kind, variant, color, seed };
    const model = makeBuildingGeometry(record);
    model.geometry.dispose();
    const spot = findSpot(model, center, radius, nearRoad);
    if (!spot) return null;
    const b = addBuilding({ ...record, x: spot.x, z: spot.z, rot: spot.rot });
    events.emit('building:spawned', b);
    return b;
  }

  function randomBuildingCenter(filter) {
    const list = Array.from(buildings.values()).filter(filter);
    if (list.length === 0) return null;
    const b = pickFrom(rand, list);
    return { x: b.x, z: b.z };
  }

  function cityCenter() {
    return randomBuildingCenter(() => true) ?? { x: 0, z: 0 };
  }

  function countBy(color) {
    let houses = 0;
    let shops = 0;
    for (const b of buildings.values()) {
      if (b.color !== color) continue;
      if (b.kind === 'business') shops++;
      else if (isHome(b)) houses++;
    }
    return { houses, shops };
  }

  function spawnedCount() {
    let n = 0;
    for (const b of buildings.values()) if (b.spawned) n++;
    return n;
  }

  function trySpawn() {
    if (spawnedCount() >= CITY.maxBuildings) return;

    if (state.pendingCivic.length > 0) {
      const type = state.pendingCivic[0];
      const kind = CIVIC_TYPES[type].kind ?? 'civic';
      const b =
        spawn(kind, type, -1, cityCenter(), 140, true) ?? spawn(kind, type, -1, { x: 0, z: 0 }, 300, true) ?? spawn(kind, type, -1, cityCenter(), 260, false);
      if (b) {
        state.pendingCivic.shift();
        events.emit('notify', { title: `${CIVIC_TYPES[type].name} opened`, text: 'Your town is growing up. Connect it to the roads.' });
      }
      return;
    }

    // A neighbourhood without enough businesses gets one first.
    for (let c = 0; c < state.colors; c++) {
      const { houses, shops } = countBy(c);
      if (shops === 0 || houses >= shops * CITY.housesPerBusiness) {
        const center = shops === 0 ? cityCenter() : (randomBuildingCenter((b) => b.color === c) ?? cityCenter());
        const variant = pickFrom(rand, BUILDING_KINDS.business.variants);
        const radius = shops === 0 ? 90 + rand() * 90 : 70;
        const b = spawn('business', variant, c, center, radius, true) ?? spawn('business', variant, c, center, radius * 1.8, false);
        if (b || shops === 0) return;
      }
    }

    // Otherwise a home, near shops of its color.
    const options = [];
    for (let c = 0; c < state.colors; c++) {
      const { houses, shops } = countBy(c);
      if (shops > 0) options.push({ c, weight: 1 / (1 + houses) });
    }
    if (options.length === 0) return;
    let pick = rand() * options.reduce((sum, o) => sum + o.weight, 0);
    let color = options[0].c;
    for (const o of options) {
      pick -= o.weight;
      if (pick <= 0) {
        color = o.c;
        break;
      }
    }
    const center = randomBuildingCenter((b) => b.color === color) ?? cityCenter();
    const kind = population() >= CITY.apartmentsFrom && rand() < 0.25 ? 'apartment' : 'house';
    const nearRoad = rand() > CITY.frontierChance;
    spawn(kind, null, color, center, 30 + rand() * 60, nearRoad);
  }

  function population() {
    let total = 0;
    for (const b of buildings.values()) total += b.residents;
    return total;
  }

  function checkMilestones(silent) {
    const pop = population();
    while (state.milestone < MILESTONES.length && MILESTONES[state.milestone].pop <= pop) {
      const m = MILESTONES[state.milestone++];
      if (m.color !== undefined) {
        state.colors = Math.max(state.colors, m.color + 1);
        if (!silent && m.pop > 0) {
          events.emit('notify', {
            title: `New neighbourhood: ${GROUP_COLORS[m.color].name}`,
            text: `Population ${pop}. ${GROUP_COLORS[m.color].name} homes and businesses are moving in.`,
          });
        }
      }
      if (m.civic && state.spawning) state.pendingCivic.push(m.civic);
      events.emit('milestone', m);
    }
  }

  // ----- access to roads -----------------------------------------------------------

  function refreshComponents() {
    components = new Map();
    compCache = null;
    let id = 0;
    for (const start of network.nodes.values()) {
      if (components.has(start.id)) continue;
      id++;
      const stack = [start.id];
      components.set(start.id, id);
      while (stack.length > 0) {
        const node = network.nodes.get(stack.pop());
        for (const segId of node.segs) {
          const seg = network.segments.get(segId);
          if (!seg) continue;
          for (const other of [seg.a, seg.b]) {
            if (!components.has(other)) {
              components.set(other, id);
              stack.push(other);
            }
          }
        }
      }
    }
    for (const town of towns) {
      town.comp = network.nodes.has(town.nodeId) ? components.get(town.nodeId) : null;
    }
  }

  function computeAccess(b) {
    const had = !!b.access;
    let doorX = b.x;
    let doorZ = b.z;
    let range = CITY.accessRange;
    if (b.spawned) {
      doorX += Math.sin(b.rot) * (b.d / 2);
      doorZ += Math.cos(b.rot) * (b.d / 2);
    } else {
      range += b.radius * 0.6;
    }
    const hit = network.nearestAccess(doorX, doorZ, range);
    if (!hit) {
      b.access = null;
      b.drive = null;
      if (had) state.planDirty = true;
      return;
    }
    b.access = { segId: hit.seg.id, s: hit.s, comp: components.get(hit.seg.a) ?? 0 };
    b.drive = null;
    if (b.spawned) {
      const dx = hit.x - doorX;
      const dz = hit.z - doorZ;
      const dist = Math.hypot(dx, dz);
      const length = dist - outerHalf(hit.seg.type) + 0.6;
      if (length > 0.6) b.drive = { x: doorX + (dx / dist) * (length / 2), z: doorZ + (dz / dist) * (length / 2), yaw: Math.atan2(dx, dz), length };
    }
    if (!had) state.planDirty = true;
  }

  // Does a new road or rail run through this building?
  function cutsThrough(net, seg, b) {
    const half = outerHalf(seg.type) - 0.3;
    const hit = closestOnPath(seg.path, b.x, b.z);
    if (hit.dist > half + b.radius) return false;
    const L = seg.path.length;
    for (let s = 0; s <= L; s += 1.5) {
      const p = pathAt(seg.path, Math.min(s, L));
      if (Math.hypot(p.x - b.x, p.z - b.z) > half + b.radius) continue;
      const h = net.heightAt(seg, Math.min(s, L));
      // Bridges pass over low roofs; deep tunnels pass under everything.
      if (h > b.h + 1 || h < -4) continue;
      if (pointInPolygon(p.x, p.z, b.poly)) return true;
      for (let i = 0; i < b.poly.length; i++) {
        if (distanceToSegment(p.x, p.z, b.poly[i], b.poly[(i + 1) % b.poly.length]) < half * 0.85) return true;
      }
    }
    return false;
  }

  function maxSegId(net) {
    let max = 0;
    for (const id of net.segments.keys()) max = Math.max(max, id);
    return max;
  }

  // Imported maps arrive with roads already in place: don't bulldoze for them.
  function markNetworkSeen() {
    for (const net of nets) seen.set(net, maxSegId(net));
  }

  function onNetworkChanged() {
    seenVersion = network.version;
    seenRailVersion = rails ? rails.version : -1;
    refreshComponents();
    const fresh = [];
    for (const net of nets) {
      const last = seen.get(net) ?? 0;
      for (const seg of net.segments.values()) if (seg.id > last && !seg.locked) fresh.push({ net, seg });
      seen.set(net, maxSegId(net));
    }
    // A road drawn straight through a building bulldozes it.
    for (const { net, seg } of fresh) {
      const bb = seg.bounds;
      for (const b of buildingsNear(bb.minX, bb.minZ, bb.maxX, bb.maxZ)) {
        if (!buildings.has(b.id) || !cutsThrough(net, seg, b)) continue;
        removeBuilding(b);
        events.emit('building:demolished', b);
      }
    }
    // Refresh road access where it may have changed.
    const near = new Set();
    for (const { net, seg } of fresh) {
      if (net !== network) continue;
      const bb = seg.bounds;
      const pad = CITY.accessRange + 40;
      for (const b of buildingsNear(bb.minX - pad, bb.minZ - pad, bb.maxX + pad, bb.maxZ + pad)) near.add(b);
    }
    for (const b of buildings.values()) {
      if (near.has(b) || !b.access || !network.segments.has(b.access.segId) || network.segments.get(b.access.segId).version !== b.accessVersion) {
        computeAccess(b);
        if (b.access) b.accessVersion = network.segments.get(b.access.segId).version;
      } else {
        const seg = network.segments.get(b.access.segId);
        b.access.comp = components.get(seg.a) ?? 0;
      }
    }
    state.planDirty = true;
  }

  // ----- jobs ---------------------------------------------------------------------------

  // Matches workers to jobs inside each connected road network. Spare jobs
  // pull commuters in from other towns; spare workers drive out to them.
  function assignJobs() {
    const comps = new Map();
    const compOf = (id) => {
      let c = comps.get(id);
      if (!c) comps.set(id, (c = { workers: 0, jobs: 0, homes: [], work: [], shops: [], civic: [], towns: [] }));
      return c;
    };
    for (const b of buildings.values()) {
      b.workers = Math.round(b.residents * CITY.workShare);
      b.workLocal = 0;
      b.workOut = 0;
      b.filledLocal = 0;
      b.filledTown = 0;
      if (!b.access) continue;
      const c = compOf(b.access.comp);
      if (isHome(b)) {
        c.workers += b.workers;
        c.homes.push(b);
      }
      if (b.jobs > 0) {
        c.jobs += b.jobs;
        c.work.push(b);
      }
      if (b.kind === 'business') c.shops.push(b);
      if (b.kind === 'civic') c.civic.push(b);
    }
    for (const town of towns) if (town.comp) compOf(town.comp).towns.push(town);
    for (const c of comps.values()) {
      const local = Math.min(c.workers, c.jobs);
      const fw = c.workers > 0 ? local / c.workers : 0;
      const fj = c.jobs > 0 ? local / c.jobs : 0;
      const hasTown = c.towns.length > 0;
      c.outCommuters = 0;
      c.inCommuters = 0;
      for (const h of c.homes) {
        h.workLocal = h.workers * fw;
        h.workOut = hasTown ? h.workers * (1 - fw) * 0.8 : 0;
        c.outCommuters += h.workOut;
      }
      for (const w of c.work) {
        w.filledLocal = w.jobs * fj;
        w.filledTown = hasTown ? w.jobs * (1 - fj) * 0.7 : 0;
        c.inCommuters += w.filledTown;
      }
      c.workTable = weightedTable(c.work, (w) => w.filledLocal);
      c.townWorkTable = weightedTable(c.work, (w) => w.filledTown);
      c.shopTable = weightedTable(c.shops, (s) => 2 + s.jobs);
      c.civicTable = weightedTable(c.civic, (s) => 1 + s.jobs);
      c.homeTable = weightedTable(c.homes, (h) => h.residents);
      const byColor = new Map();
      for (const s of c.shops) {
        if (s.color < 0) continue;
        if (!byColor.has(s.color)) byColor.set(s.color, []);
        byColor.get(s.color).push(s);
      }
      c.colorShops = new Map(Array.from(byColor, ([k, list]) => [k, weightedTable(list, (s) => 2 + s.jobs)]));
    }
    compCache = comps;
    return comps;
  }

  // ----- daily plans ----------------------------------------------------------------------

  const ref = (b) => ({ b: b.id });
  const townRef = (t) => ({ town: t.index });

  // Plans every planned car trip for a day. Big cities are sampled: one car
  // stands for `scale` trips so the roads stay drivable.
  function planDay(day, { fromTime = state.time, fresh = false } = {}) {
    timeline.filter((e) => e.trip.phase !== 'go');
    state.plannedAt = state.time;
    state.planDirty = false;
    const comps = assignJobs();
    const dayStart = timeAtHours(day * 24);
    const at = (h) => dayStart + timeAtHours(h + CITY.startHour);
    const uniform = (a, b) => a + rand() * (b - a);
    const peak = (a, b) => a + ((rand() + rand() + rand()) / 3) * (b - a);
    const ppc = CITY.peoplePerCar;

    // Pass 1: how many cars would a full day take?
    let raw = 0;
    for (const c of comps.values()) {
      for (const h of c.homes) raw += (h.workLocal + h.workOut) / ppc + (h.residents * 0.65) / ppc;
      raw += c.inCommuters / ppc;
      raw += c.towns.length * (8 + c.jobs * 0.02) + c.shops.length * 0.4 + c.civic.length * 3;
    }
    const scale = Math.max(1, raw / CITY.tripsPerDay);
    state.scale = scale;
    const people = ppc * scale;
    const count = (n) => {
      const x = n / scale;
      return Math.floor(x) + (rand() < x - Math.floor(x) ? 1 : 0);
    };

    const queue = (t, trip) => {
      if (t < fromTime) return false;
      timeline.push({ t, trip, tries: 0 });
      return true;
    };
    const atWorkNow = (trip, backAt) => {
      // Joining mid-morning: people already at work only need to come home.
      const p = trip.people;
      const dest = trip.to.b !== undefined ? buildings.get(trip.to.b) : null;
      if (trip.from.b !== undefined) {
        const home = buildings.get(trip.from.b);
        if (home) home.away += p;
      }
      if (dest) dest.inside += p;
      if (trip.to.town !== undefined) state.people.outOfTown += p;
      else state.people.atWork += p;
      if (trip.from.town !== undefined) state.people.inCommuters += p;
      timeline.push({ t: backAt, trip: backTrip(trip), tries: 0 });
    };

    for (const c of comps.values()) {
      // Commutes to work in town and out of town.
      for (const h of c.homes) {
        const color = h.color >= 0 ? GROUP_COLORS[h.color].color : null;
        for (let i = count(h.workLocal / ppc); i > 0; i--) {
          const w = c.workTable.pick(rand);
          if (!w || w === h) continue;
          const t = at(peak(6, 9.5));
          const back = at(peak(16, 19));
          const trip = { kind: 'work', phase: 'go', from: ref(h), to: ref(w), people, color, backAt: back };
          if (!queue(t, trip) && fresh && back > fromTime) atWorkNow(trip, back);
        }
        for (let i = count(h.workOut / ppc); i > 0 && c.towns.length > 0; i--) {
          const town = pickFrom(rand, c.towns);
          const t = at(peak(5.5, 9));
          const back = at(peak(16.5, 19.5));
          const trip = { kind: 'commute', phase: 'go', from: ref(h), to: townRef(town), people, color, backAt: back };
          if (!queue(t, trip) && fresh && back > fromTime) atWorkNow(trip, back);
        }
        // Shopping and errands.
        for (let i = count((h.residents * 0.5) / ppc); i > 0; i--) {
          const table = (h.color >= 0 && c.colorShops.get(h.color)) || c.shopTable;
          const s = table.pick(rand);
          if (!s) break;
          const hour = uniform(9, 20);
          queue(at(hour), { kind: 'shop', phase: 'go', from: ref(h), to: ref(s), people, color, backAt: at(hour + uniform(0.5, 2.5)) });
        }
        for (let i = count((h.residents * 0.15) / ppc); i > 0; i--) {
          const s = c.civicTable.pick(rand);
          if (!s) break;
          const hour = uniform(9, 17);
          queue(at(hour), { kind: 'errand', phase: 'go', from: ref(h), to: ref(s), people, color, backAt: at(hour + uniform(0.5, 2)) });
        }
      }
      if (c.towns.length > 0) {
        // Commuters from other towns.
        for (let i = count(c.inCommuters / ppc); i > 0; i--) {
          const w = c.townWorkTable.pick(rand);
          if (!w) break;
          const town = pickFrom(rand, c.towns);
          const t = at(peak(6, 9.5));
          const back = at(peak(16, 19));
          const trip = { kind: 'work', phase: 'go', from: townRef(town), to: ref(w), people, color: town.color, backAt: back };
          if (!queue(t, trip) && fresh && back > fromTime) atWorkNow(trip, back);
        }
        for (const town of c.towns) {
          // Visitors, deliveries and through traffic.
          for (let i = count(4 + c.jobs * 0.01); i > 0; i--) {
            const s = c.shopTable.pick(rand) ?? c.civicTable.pick(rand);
            if (!s) break;
            const hour = uniform(9, 21);
            queue(at(hour), { kind: 'visit', phase: 'go', from: townRef(town), to: ref(s), people, color: town.color, backAt: at(hour + uniform(1, 3)) });
          }
          const others = c.towns.filter((t) => t !== town);
          for (let i = count(others.length ? 4 : 0); i > 0; i--) {
            const other = pickFrom(rand, others);
            queue(at(uniform(5, 23)), { kind: 'through', phase: 'go', from: townRef(town), to: townRef(other), people, color: town.color, backAt: null });
          }
        }
        for (const s of c.shops) {
          for (let i = count(0.4); i > 0; i--) {
            const town = pickFrom(rand, c.towns);
            const hour = uniform(5, 15);
            queue(at(hour), {
              kind: 'delivery',
              phase: 'go',
              from: townRef(town),
              to: ref(s),
              people: 0,
              color: town.color,
              model: 'truck',
              backAt: at(hour + uniform(0.3, 0.8)),
            });
          }
        }
      }
      // Police, fire, ambulances and buses out on calls.
      for (const s of c.civic) {
        const vehicle = CIVIC_TYPES[s.variant]?.vehicle;
        if (!vehicle) continue;
        for (let i = count(3); i > 0; i--) {
          const h = c.homeTable.pick(rand);
          if (!h) break;
          const hour = uniform(7, 21);
          queue(at(hour), {
            kind: 'service',
            phase: 'go',
            from: ref(s),
            to: ref(h),
            people: 0,
            color: VEHICLE_TYPES[vehicle].color,
            model: vehicle,
            backAt: at(hour + uniform(0.2, 0.5)),
          });
        }
      }
    }
  }

  function backTrip(trip) {
    return { ...trip, phase: 'back', from: trip.to, to: trip.from, backAt: null };
  }

  function refAccess(r, distance) {
    if (r.town !== undefined) {
      const town = towns[r.town];
      return town ? townEnd(town, distance) : null;
    }
    const b = buildings.get(r.b);
    return b && b.access ? b.access : null;
  }

  function refTarget(r) {
    if (r.town !== undefined) return () => (towns[r.town] ? townEnd(towns[r.town], 6) : null);
    return () => {
      const b = buildings.get(r.b);
      return b && b.access ? b.access : null;
    };
  }

  // Bookkeeping as people leave...
  function departed(trip) {
    const p = trip.people;
    state.people.onRoad += p;
    const from = trip.from.b !== undefined ? buildings.get(trip.from.b) : null;
    if (trip.phase === 'go') {
      if (from && isHome(from)) from.away += p;
      return;
    }
    if (from) from.inside = Math.max(0, from.inside - p);
    const tally = tallyOf(trip);
    if (tally) state.people[tally] = Math.max(0, state.people[tally] - p);
    if (trip.kind === 'work' && trip.to.town !== undefined) state.people.inCommuters = Math.max(0, state.people.inCommuters - p);
  }

  function tallyOf(trip) {
    if (trip.kind === 'work') return 'atWork';
    if (trip.kind === 'commute') return 'outOfTown';
    if (trip.kind === 'shop') return 'shopping';
    if (trip.kind === 'errand') return 'errands';
    if (trip.kind === 'visit') return 'visiting';
    return null;
  }

  // ...and as they arrive.
  function arrived(trip) {
    const p = trip.people;
    state.people.onRoad = Math.max(0, state.people.onRoad - p);
    state.stats.trips++;
    state.today.trips++;
    if (trip.from.town !== undefined && trip.phase === 'go') state.stats.inbound++;
    if (trip.to.town !== undefined) state.stats.outbound++;
    const dest = trip.to.b !== undefined ? buildings.get(trip.to.b) : null;
    if (trip.phase === 'back') {
      if (dest && isHome(dest)) dest.away = Math.max(0, dest.away - p);
      return;
    }
    if (dest) {
      dest.inside += p;
      if (dest.kind === 'business' && (trip.kind === 'shop' || trip.kind === 'visit')) dest.demand = Math.max(0, dest.demand - 1);
    }
    const tally = tallyOf(trip);
    if (tally) state.people[tally] += p;
    if (trip.kind === 'work' && trip.from.town !== undefined) state.people.inCommuters += p;
    if (trip.backAt !== null && trip.backAt !== undefined) {
      timeline.push({ t: Math.max(state.time + 2, trip.backAt), trip: backTrip(trip), tries: 0 });
    }
  }

  function launch(event) {
    const { trip } = event;
    const from = refAccess(trip.from, 10);
    const target = refTarget(trip.to);
    const to = target();
    if (!from || !to) {
      // Workplaces knocked down still send everyone home.
      if (trip.phase === 'back') {
        departed(trip);
        arrived(trip);
      }
      return;
    }
    const car = traffic.spawnTrip({ from, to, target, color: trip.color ?? undefined, model: trip.model, trip });
    if (car) {
      departed(trip);
      return;
    }
    if (++event.tries < 4) {
      event.t = state.time + 2 + rand() * 6;
      timeline.push(event);
      return;
    }
    // Couldn't get onto the road: they made it there some other way.
    state.today.failed++;
    departed(trip);
    arrived(trip);
  }

  events.on('trip:completed', ({ trip }) => {
    if (trip?.phase) arrived(trip);
  });

  events.on('trip:aborted', ({ trip }) => {
    if (trip?.phase) arrived(trip);
  });

  // ----- simulation step -------------------------------------------------------------

  function lerpBy(range, t) {
    return lerp(range[0], range[1], clamp(t, 0, 1));
  }

  function dayOf(time) {
    return Math.floor(hoursAt(time) / 24);
  }

  function sample() {
    const p = state.people;
    state.history.push({
      t: state.time,
      population: population(),
      onRoad: Math.round(p.onRoad),
      atWork: Math.round(p.atWork),
      shopping: Math.round(p.shopping + p.errands + p.visiting),
      cars: traffic.count ?? 0,
    });
    if (state.history.length > CITY.historyLength) state.history.shift();
  }

  function step(dt) {
    if (network.version !== seenVersion || (rails && rails.version !== seenRailVersion)) onNetworkChanged();
    state.time += dt;

    const day = dayOf(state.time);
    if (day !== state.day) {
      const first = state.day < 0;
      state.day = day;
      state.today = { trips: 0, failed: 0 };
      if (!first) events.emit('day', day + 1);
      planDay(day, { fresh: first });
    } else if (state.planDirty && state.time - state.plannedAt > 12) {
      planDay(day);
    }

    while (timeline.size > 0 && timeline.peek().t <= state.time) launch(timeline.pop());

    if (state.time >= state.sampleAt) {
      state.sampleAt = state.time + CITY.dayLength / 96;
      sample();
    }

    if (state.spawning) {
      state.spawnTimer -= dt;
      if (state.spawnTimer <= 0) {
        state.spawnTimer = lerpBy(CITY.spawnEvery, spawnedCount() / CITY.spawnRampBuildings) * (0.7 + rand() * 0.6);
        trySpawn();
        checkMilestones(false);
      }
    }

    for (const b of buildings.values()) {
      if (b.kind === 'business' && b.spawned && b.access) b.demand = Math.min(CITY.maxDemand, b.demand + CITY.demandRate * dt);
    }
  }

  // ----- name plates -----------------------------------------------------------------

  function rebuildSigns() {
    for (const child of Array.from(signRoot.children)) {
      signRoot.remove(child);
      child.geometry.dispose();
    }
    signAtlas.reset();
    const named = Array.from(buildings.values()).filter((b) => b.name && (b.kind === 'business' || b.kind === 'civic' || b.landmark));
    named.sort((a, b) => b.area - a.area);
    const geos = [];
    for (const b of named) {
      const isCivic = b.kind === 'civic';
      const rect = signAtlas.add(b.name, isCivic ? { bg: '#1e3a8a', fg: '#ffffff' } : { bg: '#fff8d8', fg: '#202020' });
      if (!rect) break;
      // Face the road the building uses, on the wall nearest to it.
      let yaw = b.rot;
      let x = b.x;
      let z = b.z;
      if (b.access) {
        const seg = network.segments.get(b.access.segId);
        if (seg) {
          const p = pathAt(seg.path, b.access.s);
          yaw = Math.atan2(p.x - b.x, p.z - b.z);
        }
      }
      // Walk from the middle toward the road until we leave the outline.
      const fx = Math.sin(yaw);
      const fz = Math.cos(yaw);
      let d = 0;
      while (d < b.radius + 1 && pointInPolygon(b.x + fx * d, b.z + fz * d, b.poly)) d += 0.5;
      x = b.x + fx * (d + 0.25);
      z = b.z + fz * (d + 0.25);
      const height = clamp(Math.sqrt(b.area) / 14, 1.1, 2.6);
      const y = Math.min(Math.max(b.h - height - 0.6, 0.4), 3.4);
      geos.push(signGeometry(rect, x, y, z, yaw, height));
    }
    if (geos.length === 0) return;
    const mesh = noShadow(new THREE.Mesh(mergeGeometries(geos), signAtlas.material));
    for (const g of geos) g.dispose();
    signRoot.add(mesh);
  }

  // ----- rendering -----------------------------------------------------------------

  const _m = new THREE.Matrix4();
  const _q = new THREE.Quaternion();
  const _v = new THREE.Vector3();
  const _s = new THREE.Vector3();
  const _c = new THREE.Color();
  const up = new THREE.Vector3(0, 1, 0);

  // Animations run on real time so they stay smooth at any game speed.
  function update(dt, time) {
    for (const b of buildings.values()) {
      if (!b.mesh) continue;
      b.grow = Math.min(1, b.grow + dt * 1.8);
      const t = b.grow;
      const y = t < 1 ? 1 - Math.pow(1 - t, 3) + Math.sin(t * Math.PI) * 0.18 : 1;
      b.mesh.scale.set(1, Math.max(0.001, y), 1);
      if (t >= 1) settle(b);
    }
    batcher.flush();

    let w = 0;
    let p = 0;
    let d = 0;
    for (const b of buildings.values()) {
      if (!b.spawned) continue;
      if (!b.access && w < markerCap) {
        const bob = Math.sin(time * 3 + b.id) * 0.5;
        _q.setFromAxisAngle(up, time * 2 + b.id);
        _m.compose(_v.set(b.x, b.h * b.grow + 4 + bob, b.z), _q, _s.set(1, 1.3, 1));
        warnings.setMatrixAt(w++, _m);
      }
      if (b.kind === 'business' && b.color >= 0) {
        const shown = Math.floor(b.demand);
        _c.setHex(GROUP_COLORS[b.color].color);
        for (let i = 0; i < shown && p < markerCap * 2; i++) {
          const offset = (i - (shown - 1) / 2) * 1.9;
          _q.setFromAxisAngle(up, b.rot);
          _m.compose(_v.set(b.x + Math.cos(b.rot) * offset, b.h + 1.2, b.z - Math.sin(b.rot) * offset), _q, _s.set(1, 1, 1));
          pins.setMatrixAt(p, _m);
          pins.setColorAt(p++, _c);
        }
      }
      if (b.drive && d < markerCap) {
        _q.setFromAxisAngle(up, b.drive.yaw);
        _m.compose(_v.set(b.drive.x, 0, b.drive.z), _q, _s.set(2.6, 0.075, b.drive.length));
        driveways.setMatrixAt(d++, _m);
      }
    }
    warnings.count = w;
    pins.count = p;
    driveways.count = d;
    warnings.instanceMatrix.needsUpdate = true;
    pins.instanceMatrix.needsUpdate = true;
    if (pins.instanceColor) pins.instanceColor.needsUpdate = true;
    driveways.instanceMatrix.needsUpdate = true;
  }

  // ----- persistence ---------------------------------------------------------------------

  function serialize() {
    const round = (v) => Math.round(v * 100) / 100;
    const r1 = (v) => Math.round(v * 10) / 10;
    return {
      buildings: Array.from(buildings.values()).map((b) => {
        if (b.footprint) {
          const f = [];
          for (const p of b.footprint) f.push(r1(p.x), r1(p.z));
          return {
            k: b.kind,
            v: b.variant ?? undefined,
            s: b.seed,
            f,
            h: r1(b.h),
            lv: b.levels,
            wc: b.wallColor,
            rc: b.roofColor,
            rs: b.roofShape ?? undefined,
            lm: b.landmark ?? undefined,
            nm: b.name ?? undefined,
            n: b.residents || undefined,
            j: b.jobs || undefined,
          };
        }
        return {
          k: b.kind,
          v: b.variant ?? undefined,
          c: b.color,
          s: b.seed,
          x: round(b.x),
          z: round(b.z),
          r: round(b.rot),
          n: b.residents || undefined,
          dm: b.kind === 'business' ? round(b.demand) : undefined,
        };
      }),
      towns: towns.map((t) => ({ name: t.name, color: t.color, km: t.km, type: t.type, paint: t.paint, from: t.from, to: t.to })),
      state: {
        time: round(state.time),
        milestone: state.milestone,
        colors: state.colors,
        spawning: state.spawning,
        mapName: state.mapName,
        pendingCivic: state.pendingCivic,
        stats: state.stats,
      },
    };
  }

  function recordFrom(rec) {
    if (rec.f) {
      const footprint = [];
      for (let i = 0; i < rec.f.length; i += 2) footprint.push({ x: rec.f[i], z: rec.f[i + 1] });
      return {
        kind: rec.k,
        variant: rec.v ?? null,
        color: -1,
        seed: rec.s ?? 1,
        footprint,
        h: rec.h,
        levels: rec.lv,
        wallColor: rec.wc ?? 0xe8e0d0,
        roofColor: rec.rc ?? 0x8a8a8a,
        roofShape: rec.rs ?? 'flat',
        landmark: rec.lm ?? null,
        name: rec.nm ?? null,
        residents: rec.n,
        jobs: rec.j,
      };
    }
    return { kind: rec.k, variant: rec.v ?? null, color: rec.c, seed: rec.s, x: rec.x, z: rec.z, rot: rec.r, residents: rec.n, demand: rec.dm };
  }

  function clearBuildings() {
    for (const b of Array.from(buildings.values())) removeBuilding(b);
    batcher.flush();
    rebuildSigns();
  }

  function resetPeople() {
    timeline.clear();
    state.day = -1;
    state.people = { onRoad: 0, atWork: 0, shopping: 0, errands: 0, visiting: 0, outOfTown: 0, inCommuters: 0 };
    for (const b of buildings.values()) {
      b.away = 0;
      b.inside = 0;
    }
  }

  function reset({ keepTowns = false } = {}) {
    clearBuildings();
    Object.assign(state, freshState());
    timeline.clear();
    if (!keepTowns && townLines !== OUTSIDE_TOWNS) setTowns(OUTSIDE_TOWNS);
    seenVersion = -1;
    markNetworkSeen();
    checkMilestones(true);
  }

  function load(data) {
    reset({ keepTowns: true });
    if (!data || !Array.isArray(data.buildings)) {
      if (townLines !== OUTSIDE_TOWNS) setTowns(OUTSIDE_TOWNS);
      return;
    }
    setTowns(Array.isArray(data.towns) && data.towns.length ? data.towns : OUTSIDE_TOWNS);
    refreshComponents();
    markNetworkSeen();
    for (const rec of data.buildings) {
      if (!BUILDING_KINDS[rec.k]) continue;
      addBuilding(recordFrom(rec), { animate: false });
    }
    if (data.state) {
      state.time = data.state.time ?? 0;
      state.milestone = data.state.milestone ?? 0;
      state.colors = data.state.colors ?? 0;
      state.spawning = data.state.spawning ?? true;
      state.mapName = data.state.mapName ?? null;
      state.pendingCivic = Array.isArray(data.state.pendingCivic) ? data.state.pendingCivic.filter((t) => CIVIC_TYPES[t]) : [];
      state.stats = { trips: 0, inbound: 0, outbound: 0, ...(data.state.stats ?? {}) };
    }
    resetPeople();
    checkMilestones(true);
    batcher.flush();
    rebuildSigns();
  }

  // Replaces the whole city with one read from a real map.
  function importMap({ buildings: list = [], towns: townDefs = null, spawning = false, name = null } = {}) {
    clearBuildings();
    Object.assign(state, freshState());
    state.spawning = spawning;
    state.mapName = name;
    timeline.clear();
    if (townDefs) setTowns(townDefs);
    refreshComponents();
    markNetworkSeen();
    let dropped = 0;
    for (const record of list) {
      const b = addBuilding({ color: -1, seed: Math.floor(rand() * 1e9), ...record }, { animate: false });
      // Our roads run wider than real ones: drop what they would cut through.
      const bb = b.bounds;
      let hit = false;
      for (const net of nets) {
        for (const seg of net.segsNear(bb.minX, bb.minZ, bb.maxX, bb.maxZ)) {
          if (cutsThrough(net, seg, b)) {
            hit = true;
            break;
          }
        }
        if (hit) break;
      }
      if (hit) {
        removeBuilding(b);
        dropped++;
      }
    }
    state.importDropped = dropped;
    // Milestones only unlock colors here; landmarks come from the map.
    state.pendingCivic = [];
    checkMilestones(true);
    state.pendingCivic = [];
    batcher.flush();
    seenVersion = -1;
    onNetworkChanged();
    rebuildSigns();
  }

  function stats() {
    let houses = 0;
    let businesses = 0;
    let civic = 0;
    let other = 0;
    let unconnected = 0;
    let unreachable = 0;
    let jobs = 0;
    let workers = 0;
    let away = 0;
    let pop = 0;
    for (const b of buildings.values()) {
      if (b.kind === 'business') businesses++;
      else if (b.kind === 'civic') civic++;
      else if (isHome(b)) houses++;
      else other++;
      if (!b.access && b.spawned) unconnected++;
      else if (!b.access && (isHome(b) || b.jobs > 0)) unreachable++;
      jobs += b.jobs;
      pop += b.residents;
      if (isHome(b)) {
        workers += Math.round(b.residents * CITY.workShare);
        away += Math.min(b.away, b.residents);
      }
    }
    let employed = 0;
    let commutersOut = 0;
    let commutersIn = 0;
    if (compCache) {
      for (const c of compCache.values()) {
        employed += Math.min(c.workers, c.jobs) + (c.outCommuters ?? 0);
        commutersOut += c.outCommuters ?? 0;
        commutersIn += c.inCommuters ?? 0;
      }
    }
    const p = state.people;
    return {
      population: pop,
      buildings: buildings.size,
      houses,
      businesses,
      civic,
      other,
      unconnected,
      unreachable,
      jobs,
      workers,
      employed: Math.round(employed),
      unemployed: Math.max(0, Math.round(workers - employed)),
      commutersIn: Math.round(commutersIn),
      commutersOut: Math.round(commutersOut),
      atHome: Math.max(0, Math.round(pop - away)),
      onRoad: Math.round(p.onRoad),
      atWork: Math.round(p.atWork),
      shopping: Math.round(p.shopping),
      errands: Math.round(p.errands),
      visiting: Math.round(p.visiting),
      outOfTown: Math.round(p.outOfTown),
      scale: state.scale,
      queued: timeline.size,
      tripsToday: state.today.trips,
      day: dayOf(state.time) + 1,
      clock: formatClock(state.time),
      hour: hourOf(state.time),
      ...state.stats,
    };
  }

  // Hit-test: the building under a ground point.
  function buildingAt(x, z) {
    for (const b of buildingsNear(x, z, x, z)) {
      if (Math.hypot(b.x - x, b.z - z) > b.radius) continue;
      if (pointInPolygon(x, z, b.poly)) return b;
    }
    return null;
  }

  // Hit-test along a camera ray, so tall buildings can be picked by their walls.
  function buildingOnRay(ray) {
    if (Math.abs(ray.direction.y) < 1e-4) return null;
    let best = null;
    const tGround = -ray.origin.y / ray.direction.y;
    const maxT = tGround > 0 ? tGround : 4000;
    const stepLen = 2;
    for (let t = Math.max(0, (ray.origin.y - 400) / -ray.direction.y); t <= maxT; t += stepLen) {
      const y = ray.origin.y + ray.direction.y * t;
      if (y > 400) continue;
      const x = ray.origin.x + ray.direction.x * t;
      const z = ray.origin.z + ray.direction.z * t;
      const b = buildingAt(x, z);
      if (b && y <= b.h + 0.5) {
        best = b;
        break;
      }
    }
    return best;
  }

  function title(b) {
    if (b.name) return b.name;
    if (b.kind === 'civic' || CIVIC_TYPES[b.variant]) return CIVIC_TYPES[b.variant]?.name ?? 'Civic Building';
    const group = b.color >= 0 ? `${GROUP_COLORS[b.color].name} ` : '';
    if (b.kind === 'business') return group + ({ shop: 'Shop', office: 'Offices', factory: 'Factory', hotel: 'Hotel' }[b.variant] ?? 'Business');
    if (b.kind === 'house') return `${group}House`;
    if (b.kind === 'apartment') return `${group}Apartments`;
    return b.variant ? b.variant.charAt(0).toUpperCase() + b.variant.slice(1).replace(/_/g, ' ') : 'Building';
  }

  // One-line summary for tooltips.
  function describe(b) {
    const name = title(b);
    if (!b.access && (b.spawned || isHome(b) || b.jobs > 0)) return `${name} (needs a road)`;
    if (isHome(b)) return `${name} - ${b.residents} residents`;
    if (b.kind === 'business' && b.spawned) return `${name} - ${Math.floor(b.demand)} waiting for visitors`;
    if (b.jobs > 0) return `${name} - ${b.jobs} jobs`;
    return name;
  }

  // Rows for the Properties dialog.
  function details(b) {
    const rows = [['Name', title(b)]];
    const kindLabel = b.kind === 'civic' ? 'Civic' : (BUILDING_KINDS[b.kind]?.label ?? 'Building');
    rows.push(['Type', b.landmark ? `${kindLabel} (landmark)` : kindLabel]);
    if (b.color >= 0) rows.push(['Neighbourhood', GROUP_COLORS[b.color].name]);
    rows.push(['Size', `${Math.round(b.w)} x ${Math.round(b.d)} m, ${Math.round(b.h)} m tall`]);
    rows.push(['Floors', String(b.levels)]);
    if (isHome(b)) {
      const home = Math.max(0, Math.round(b.residents - Math.min(b.away, b.residents)));
      rows.push(['Residents', String(b.residents)]);
      rows.push(['At home now', String(home)]);
      rows.push(['Workers', `${Math.round(b.workLocal ?? 0)} in town, ${Math.round(b.workOut ?? 0)} commute out`]);
    }
    if (b.jobs > 0) {
      rows.push(['Jobs', String(b.jobs)]);
      rows.push(['Filled', `${Math.round((b.filledLocal ?? 0) + (b.filledTown ?? 0))} (${Math.round(b.filledTown ?? 0)} from other towns)`]);
      rows.push(['People inside', String(Math.round(b.inside))]);
    }
    if (b.kind === 'business' && b.spawned) rows.push(['Waiting for', `${Math.floor(b.demand)} visitors`]);
    rows.push(['Road access', b.access ? 'Connected' : 'Needs a road']);
    rows.push(['Source', b.spawned ? 'Grew here' : 'Imported map']);
    return rows;
  }

  const TRIP_TEXT = {
    work: 'Driving to work',
    commute: 'Commuting',
    shop: 'Going shopping',
    errand: 'Running an errand',
    visit: 'Visiting',
    through: 'Passing through',
    delivery: 'Delivering goods',
    service: 'On a call',
  };

  function placeName(r) {
    if (!r) return '?';
    if (r.town !== undefined) return towns[r.town]?.name ?? 'another town';
    const b = buildings.get(r.b);
    return b ? title(b) : 'a demolished building';
  }

  // Text for the vehicle card.
  function describeTrip(trip) {
    if (!trip || !trip.phase) return { what: 'Just driving around', from: null, to: null };
    const what = trip.phase === 'back' ? (trip.to.town !== undefined ? 'Heading home' : 'Going home') : (TRIP_TEXT[trip.kind] ?? 'Driving');
    return {
      what,
      from: placeName(trip.from),
      to: placeName(trip.to),
      people: trip.people ? Math.max(1, Math.round(trip.people)) : 0,
    };
  }

  // Gets a fresh city going without waiting for the spawn timer.
  function seed(count) {
    if (network.version !== seenVersion) onNetworkChanged();
    for (let i = 0; i < count; i++) trySpawn();
  }

  setTowns(OUTSIDE_TOWNS);
  reset();

  return {
    step,
    seed,
    update,
    serialize,
    load,
    reset,
    stats,
    importMap,
    markNetworkSeen,
    setTowns,
    buildingAt,
    buildingOnRay,
    buildingsNear,
    describe,
    details,
    title,
    describeTrip,
    get towns() {
      return towns;
    },
    get state() {
      return state;
    },
    get buildings() {
      return buildings;
    },
    get hour() {
      return hourOf(state.time);
    },
    get clock() {
      return formatClock(state.time);
    },
    get spawning() {
      return state.spawning;
    },
    set spawning(v) {
      state.spawning = !!v;
    },
    get history() {
      return state.history;
    },
  };
}
// ---------------------------------------------------------------------------
// Trains: railway and metro trains shuttling between stations
// ---------------------------------------------------------------------------

const TRAINS = {
  metersPerTrain: 900,
  maxTrains: 14,
  dwell: 9,
  reverseWait: 6,
  blockedGiveUp: 14,
  accel: 1.4,
  brake: 2.2,
};

const TRAIN_KINDS = {
  rail: { cars: ['loco', 'coach', 'coach', 'coach'], gap: 0.8, speed: 24 },
  metro: { cars: ['metroHead', 'metro', 'metro', 'metroHead'], gap: 0.6, speed: 17 },
};

const STATION_NAMES = [
  'Central',
  'North',
  'South',
  'East',
  'West',
  'Park',
  'Market',
  'Harbor',
  'Riverside',
  'Old Town',
  'Airport',
  'University',
  'Stadium',
  'Hill',
  'Garden',
  'Bridge',
];

function trainModels() {
  const p = (geo, color, position, extra = {}) => modelPart(geo, color, { position, ...extra });
  const windows = (len, y, color = GLASS) => {
    const out = [];
    for (let z = -len / 2 + 2; z <= len / 2 - 2; z += 2.2) {
      out.push(p(box(0.05, 0.9, 1.4), color, [1.52, y, z]));
      out.push(p(box(0.05, 0.9, 1.4), color, [-1.52, y, z]));
    }
    return out;
  };
  const bogies = (len) => [p(box(2.4, 0.7, 2.6), 0x2a2a2a, [0, 0.55, len / 2 - 2.6]), p(box(2.4, 0.7, 2.6), 0x2a2a2a, [0, 0.55, -len / 2 + 2.6])];
  const loco = [
    p(box(3, 3.4, 15), 0xc81e1e, [0, 2.6, 0]),
    p(box(3.05, 0.5, 15.05), 0xf0c020, [0, 1.4, 0]),
    p(box(2.6, 0.5, 13), 0x5a5a5a, [0, 4.5, -0.5]),
    p(box(3.06, 1, 1.8), GLASS, [0, 3.3, 6.4]),
    p(box(2.2, 1, 0.06), GLASS, [0, 3.3, 7.52]),
    ...bogies(15),
  ];
  const coach = [
    p(box(3, 3.3, 17), 0xe8e0c8, [0, 2.55, 0]),
    p(box(3.05, 0.6, 17.05), 0xc81e1e, [0, 1.3, 0]),
    p(box(2.7, 0.3, 16.6), 0x6a6a6a, [0, 4.35, 0]),
    ...windows(17, 2.9),
    ...bogies(17),
  ];
  const metro = [
    p(box(2.9, 3, 13), 0xd0d4d8, [0, 2.3, 0]),
    p(box(2.95, 0.5, 13.05), 0x2050c0, [0, 1.6, 0]),
    p(box(2.6, 0.25, 12.6), 0x9a9a9a, [0, 3.9, 0]),
    ...windows(13, 2.6),
    ...bogies(13),
  ];
  const metroHead = [...metro.slice(0, 3).map((part) => ({ ...part })), p(box(2.4, 1.1, 0.06), GLASS, [0, 2.7, 6.52]), ...windows(13, 2.6), ...bogies(13)];
  const make = (parts, length) => ({ geometry: markGlass(mergeModel(parts)), length });
  return {
    loco: make(loco, 15),
    coach: make(coach, 17),
    metro: make(metro, 13),
    metroHead: make(metroHead, 13),
  };
}

function createTrains(scene, rails, events) {
  const rand = mulberry32(4242);
  const models = trainModels();
  const material = createRetroMaterial({ vertexColors: true, glow: true });
  const meshes = {};
  const cap = 80;
  for (const [key, model] of Object.entries(models)) {
    const mesh = new THREE.InstancedMesh(model.geometry, material, cap);
    mesh.frustumCulled = false;
    mesh.count = 0;
    meshes[key] = mesh;
    scene.add(mesh);
  }
  const stationRoot = new THREE.Group();
  scene.add(stationRoot);
  const atlas = createSignAtlas(16);
  const stationMaterial = createRetroMaterial({ vertexColors: true });

  const trains = [];
  const reserved = new Map();
  let stations = [];
  let mapStations = [];
  let seenVersion = -1;
  let nextTrainId = 1;

  const segLen = (id) => rails.segments.get(id)?.path.length ?? 0;

  // Position on a step ({ segId, dir }) at distance s in travel direction.
  function pointOn(step, s, out = {}) {
    const seg = rails.segments.get(step.segId);
    const L = seg.path.length;
    const along = step.dir === 1 ? s : L - s;
    const p = pathAt(seg.path, clamp(along, 0, L), out);
    out.y = rails.heightAt(seg, clamp(along, 0, L));
    if (step.dir === -1) {
      out.tx = -out.tx;
      out.tz = -out.tz;
    }
    return p;
  }

  // Walks back from the head by `d` metres through the steps behind it.
  function behind(train, d) {
    let i = train.steps.length - 1;
    let s = train.s - d;
    while (s < 0 && i > 0) {
      i--;
      s += segLen(train.steps[i].segId);
    }
    return { index: i, s: Math.max(0, s) };
  }

  function lengthOf(kind) {
    const def = TRAIN_KINDS[kind];
    return def.cars.reduce((sum, key) => sum + models[key].length + def.gap, 0);
  }

  function release(train) {
    for (const [segId, owner] of reserved) if (owner === train) reserved.delete(segId);
  }

  function reserveSteps(train) {
    release(train);
    const tail = behind(train, train.length);
    for (let i = tail.index; i < train.steps.length; i++) reserved.set(train.steps[i].segId, train);
    // Keep the history short.
    if (tail.index > 0) train.steps.splice(0, tail.index);
  }

  function nodeAhead(step) {
    const seg = rails.segments.get(step.segId);
    return rails.nodes.get(step.dir === 1 ? seg.b : seg.a);
  }

  // The next piece of track: the one that turns least.
  function chooseNext(train) {
    const step = train.steps[train.steps.length - 1];
    const node = nodeAhead(step);
    if (!node) return null;
    const here = pointOn(step, segLen(step.segId));
    let best = null;
    let bestTurn = Infinity;
    for (const segId of node.segs) {
      if (segId === step.segId) continue;
      const seg = rails.segments.get(segId);
      if (!seg) continue;
      const dir = seg.a === node.id ? 1 : -1;
      const p = pointOn({ segId, dir }, 0.5);
      const turn = Math.abs(angleDiff(Math.atan2(here.tx, here.tz), Math.atan2(p.tx, p.tz)));
      if (turn < 1.1 && turn < bestTurn) {
        bestTurn = turn;
        best = { segId, dir };
      }
    }
    return best;
  }

  function reverse(train) {
    const tail = behind(train, train.length);
    const steps = train.steps
      .slice(tail.index)
      .reverse()
      .map((st) => ({ segId: st.segId, dir: -st.dir }));
    // The old tail is the new head.
    train.steps = steps;
    train.s = segLen(steps[steps.length - 1].segId) - tail.s;
    train.speed = 0;
    train.wait = 0;
    train.blocked = 0;
    train.lastStation = null;
    reserveSteps(train);
  }

  // ----- stations -------------------------------------------------------------

  function attachStation(def) {
    let best = null;
    for (const seg of rails.segsNear(def.x - 60, def.z - 60, def.x + 60, def.z + 60)) {
