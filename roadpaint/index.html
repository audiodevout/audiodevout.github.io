      const hit = closestOnPath(seg.path, def.x, def.z);
      if (hit.dist < 60 && (!best || hit.dist < best.dist)) best = { seg, s: hit.s, dist: hit.dist };
    }
    return best;
  }

  function rebuildStations() {
    stations = [];
    const used = new Set();
    let n = 0;
    for (const def of mapStations) {
      if (def.entrance) continue;
      const hit = attachStation(def);
      if (!hit) continue;
      stations.push({ name: def.name, segId: hit.seg.id, s: hit.s, subway: hit.seg.type.key === 'metro' });
      used.add(hit.seg.id);
    }
    // Tracks you draw get a station at each end and along long runs.
    for (const seg of rails.segments.values()) {
      const L = seg.path.length;
      if (L < 60) continue;
      const near = stations.some((st) => st.segId === seg.id);
      if (near) continue;
      const ends = [seg.a, seg.b].filter((id) => rails.nodes.get(id)?.segs.size === 1);
      const spots = [];
      for (const id of ends) spots.push(id === seg.a ? 35 : L - 35);
      if (L > 700) spots.push(L / 2);
      for (const s of spots) {
        if (mapStations.length > 0 && !ends.length) continue;
        stations.push({ name: `${STATION_NAMES[n++ % STATION_NAMES.length]}`, segId: seg.id, s, subway: seg.type.key === 'metro' });
      }
    }
    buildStationModels();
  }

  function buildStationModels() {
    for (const child of Array.from(stationRoot.children)) {
      stationRoot.remove(child);
      child.geometry.dispose();
    }
    atlas.reset();
    const parts = [];
    const signs = [];
    for (const st of stations) {
      const seg = rails.segments.get(st.segId);
      if (!seg) continue;
      const p = pathAt(seg.path, st.s);
      const y = rails.heightAt(seg, st.s);
      const yaw = Math.atan2(p.tx, p.tz);
      const side = outerHalf(seg.type) + 2.3;
      const nx = p.tz;
      const nz = -p.tx;
      const rot = [0, yaw, 0];
      if (y < -2) {
        // Underground: an entrance kiosk on the street above.
        const x = p.x + nx * (side + 4);
        const z = p.z + nz * (side + 4);
        parts.push(modelPart(box(4, 3, 3), 0x2050c0, { position: [x, 1.5, z], rotation: rot }));
        parts.push(modelPart(box(4.4, 0.3, 3.4), 0xd8d8d8, { position: [x, 3.15, z], rotation: rot }));
        parts.push(modelPart(box(1.2, 1.2, 1.2), 0xffffff, { position: [x, 4, z], rotation: rot }));
      } else {
        const x = p.x + nx * side;
        const z = p.z + nz * side;
        const base = Math.max(0, y);
        parts.push(modelPart(box(4, 1 + base, 64), 0xb8b0a0, { position: [x, (1 + base) / 2, z], rotation: rot }));
        parts.push(modelPart(box(3.2, 0.25, 40), 0x5a6a7a, { position: [x, base + 4.4, z], rotation: rot }));
        for (const o of [-16, 0, 16]) {
          parts.push(modelPart(box(0.3, 3.4, 0.3), 0x6a6a6a, { position: [x + p.tx * o, base + 2.7, z + p.tz * o], rotation: rot }));
        }
        if (base < 0.5) {
          const bx = p.x + nx * (side + 7);
          const bz = p.z + nz * (side + 7);
          parts.push(modelPart(box(10, 5, 8), 0xd8c8a8, { position: [bx, 2.5, bz], rotation: rot }));
          parts.push(modelPart(prismRoof(10.6, 8.6, 2.2), 0x6a4a3a, { position: [bx, 5, bz], rotation: [0, yaw + Math.PI / 2, 0] }));
        }
      }
      const rect = atlas.add(st.name, { bg: '#1e3a8a', fg: '#ffffff' });
      if (rect) {
        const sx = p.x + nx * (side + 2.1);
        const sz = p.z + nz * (side + 2.1);
        signs.push(signGeometry(rect, sx, Math.max(0, y) + (y < -2 ? 4.8 : 3.4), sz, Math.atan2(nx, nz), 1));
      }
    }
    if (parts.length) stationRoot.add(new THREE.Mesh(mergeModel(parts), stationMaterial));
    if (signs.length) {
      stationRoot.add(noShadow(new THREE.Mesh(mergeGeometries(signs), atlas.material)));
      for (const g of signs) g.dispose();
    }
  }

  // ----- trains ---------------------------------------------------------------------

  function components() {
    const seen = new Set();
    const comps = [];
    for (const seg of rails.segments.values()) {
      if (seen.has(seg.id)) continue;
      const comp = { segs: [], length: 0, metro: 0 };
      const stack = [seg.id];
      seen.add(seg.id);
      while (stack.length) {
        const s = rails.segments.get(stack.pop());
        comp.segs.push(s);
        comp.length += s.path.length;
        if (s.type.key === 'metro') comp.metro += s.path.length;
        for (const nid of [s.a, s.b]) {
          for (const other of rails.nodes.get(nid)?.segs ?? []) {
            if (!seen.has(other)) {
              seen.add(other);
              stack.push(other);
            }
          }
        }
      }
      comps.push(comp);
    }
    return comps;
  }

  function spawnTrain(comp) {
    const kind = comp.metro > comp.length / 2 ? 'metro' : 'rail';
    const length = lengthOf(kind);
    for (let attempt = 0; attempt < 12; attempt++) {
      const seg = pickFrom(rand, comp.segs);
      if (reserved.has(seg.id) || seg.path.length < length + 4) continue;
      const train = {
        id: nextTrainId++,
        kind,
        length,
        steps: [{ segId: seg.id, dir: rand() < 0.5 ? 1 : -1 }],
        s: length + 1,
        speed: 0,
        wait: 2 + rand() * 4,
        blocked: 0,
        lastStation: null,
        comp,
      };
      trains.push(train);
      reserveSteps(train);
      return train;
    }
    return null;
  }

  function onNetworkChanged() {
    seenVersion = rails.version;
    // Trains on track that's gone are lifted off.
    for (let i = trains.length - 1; i >= 0; i--) {
      const t = trains[i];
      if (t.steps.some((st) => !rails.segments.has(st.segId))) {
        release(t);
        trains.splice(i, 1);
      }
    }
    rebuildStations();
    const comps = components();
    let budget = TRAINS.maxTrains - trains.length;
    for (const comp of comps) {
      const want = comp.length < 150 ? 0 : Math.min(6, 1 + Math.floor(comp.length / TRAINS.metersPerTrain));
      const have = trains.filter((t) => comp.segs.some((s) => s.id === t.steps[t.steps.length - 1].segId)).length;
      for (let i = have; i < want && budget > 0; i++, budget--) spawnTrain(comp);
    }
  }

  function stationAhead(train, step, from, to) {
    let best = null;
    for (const st of stations) {
      if (st.segId !== step.segId || st === train.lastStation) continue;
      const L = segLen(step.segId);
      const pos = (step.dir === 1 ? st.s : L - st.s) + train.length / 2;
      if (pos > from - 0.5 && pos <= to && (!best || pos < best.pos)) best = { st, pos };
    }
    return best;
  }

  function stepTrain(train, dt) {
    if (train.wait > 0) {
      train.wait -= dt;
      if (train.wait <= 0 && train.reverseAfterWait) {
        train.reverseAfterWait = false;
        reverse(train);
      }
      return;
    }
    const def = TRAIN_KINDS[train.kind];
    const step = train.steps[train.steps.length - 1];
    const L = segLen(step.segId);
    const brakeDist = (train.speed * train.speed) / (2 * TRAINS.brake) + 2;

    // Stop for a station platform coming up.
    let limit = Infinity;
    const st = stationAhead(train, step, train.s, train.s + brakeDist + 20);
    if (st) limit = st.pos - train.s;
    // End of this piece: is there track (and is it free)?
    if (L - train.s < brakeDist + 2) {
      const next = chooseNext(train);
      if (!next) limit = Math.min(limit, L - train.s);
      else if (reserved.has(next.segId) && reserved.get(next.segId) !== train) {
        limit = Math.min(limit, L - train.s - 1);
        train.waitingFor = next;
      }
    }

    const target = limit < brakeDist ? 0 : def.speed;
    if (train.speed < target) train.speed = Math.min(target, train.speed + TRAINS.accel * dt);
    else train.speed = Math.max(target, train.speed - TRAINS.brake * 2 * dt);
    let move = Math.min(train.speed * dt, Math.max(0, limit));
    if (limit < 0.3 && train.speed < 0.5) {
      train.speed = 0;
      move = 0;
      if (st && st.pos - train.s < 0.6) {
        train.lastStation = st.st;
        train.wait = TRAINS.dwell;
        events.emit('train:stopped', { train, station: st.st });
        return;
      }
      if (L - train.s < 2) {
        const next = chooseNext(train);
        if (!next) {
          train.wait = TRAINS.reverseWait;
          train.reverseAfterWait = true;
          return;
        }
        train.blocked += dt;
        if (train.blocked > TRAINS.blockedGiveUp) reverse(train);
        return;
      }
    }
    train.s += move;
    while (train.s >= segLen(train.steps[train.steps.length - 1].segId)) {
      const cur = train.steps[train.steps.length - 1];
      const next = chooseNext(train);
      if (!next || (reserved.has(next.segId) && reserved.get(next.segId) !== train)) {
        train.s = segLen(cur.segId);
        break;
      }
      train.s -= segLen(cur.segId);
      train.steps.push(next);
      train.blocked = 0;
      reserveSteps(train);
    }
    if (move > 0) reserveSteps(train);
  }

  function step(dt) {
    if (rails.version !== seenVersion) onNetworkChanged();
    for (const train of trains) stepTrain(train, dt);
  }

  const _m = new THREE.Matrix4();
  const _q = new THREE.Quaternion();
  const _v = new THREE.Vector3();
  const _one = new THREE.Vector3(1, 1, 1);
  const up = new THREE.Vector3(0, 1, 0);
  const counts = {};
  const pa = {};
  const pb = {};

  function locate(train, d, out) {
    const at = behind(train, d);
    return pointOn(train.steps[at.index], at.s, out);
  }

  function render() {
    for (const key of Object.keys(meshes)) counts[key] = 0;
    for (const train of trains) {
      const def = TRAIN_KINDS[train.kind];
      let d = 0;
      def.cars.forEach((key, i) => {
        const len = models[key].length;
        locate(train, d + 1, pa);
        locate(train, d + len - 1, pb);
        d += len + def.gap;
        const mesh = meshes[key];
        if (counts[key] >= cap) return;
        let yaw = Math.atan2(pa.x - pb.x, pa.z - pb.z);
        // The last metro car faces backwards.
        if (i === def.cars.length - 1 && key === 'metroHead') yaw += Math.PI;
        _q.setFromAxisAngle(up, yaw);
        _v.set((pa.x + pb.x) / 2, WORLD.roadY + 0.1 + (pa.y + pb.y) / 2, (pa.z + pb.z) / 2);
        _m.compose(_v, _q, _one);
        mesh.setMatrixAt(counts[key]++, _m);
      });
    }
    for (const [key, mesh] of Object.entries(meshes)) {
      mesh.count = counts[key];
      mesh.instanceMatrix.needsUpdate = true;
    }
  }

  function reset(defs = null) {
    for (const t of trains) release(t);
    trains.length = 0;
    reserved.clear();
    if (defs) mapStations = defs;
    seenVersion = -1;
  }

  return {
    step,
    render,
    reset,
    get trains() {
      return trains;
    },
    get stations() {
      return stations;
    },
    get mapStations() {
      return mapStations;
    },
  };
}

// ---------------------------------------------------------------------------
// Camera rig: orbit around a ground target (pan, rotate, tilt, zoom)
// ---------------------------------------------------------------------------

function createCameraRig(camera) {
  const state = { ...CAMERA.start };
  const goal = { ...CAMERA.start };
  const target = new THREE.Vector3();
  // Following a car: the camera orbits it (or chases it from behind).
  let follow = null;
  let chase = false;
  let lift = 0;

  function clampGoal() {
    const reach = follow ? WORLD.half + 400 : WORLD.half;
    goal.x = clamp(goal.x, -reach, reach);
    goal.z = clamp(goal.z, -reach, reach);
    goal.dist = clamp(goal.dist, follow ? 8 : CAMERA.minDist, CAMERA.maxDist);
    goal.pitch = clamp(goal.pitch, CAMERA.minPitch, CAMERA.maxPitch);
  }

  function place() {
    const cp = Math.cos(state.pitch);
    target.set(state.x, lift, state.z);
    camera.position.set(
      state.x + state.dist * cp * Math.sin(state.yaw),
      lift + state.dist * Math.sin(state.pitch),
      state.z + state.dist * cp * Math.cos(state.yaw)
    );
    camera.lookAt(target);
  }

  function update(dt) {
    const k = 1 - Math.exp(-dt * 10);
    const t = follow?.();
    if (follow && !t) letGo();
    if (t) {
      goal.x = t.x;
      goal.z = t.z;
      if (chase) goal.yaw = t.yaw + Math.PI;
      const kf = 1 - Math.exp(-dt * 14);
      state.x = lerp(state.x, goal.x, kf);
      state.z = lerp(state.z, goal.z, kf);
      lift = lerp(lift, t.y, kf);
      if (chase) state.yaw += angleDiff(state.yaw, goal.yaw) * (1 - Math.exp(-dt * 4));
    } else {
      lift = lerp(lift, 0, k);
    }
    state.x = lerp(state.x, goal.x, k);
    state.z = lerp(state.z, goal.z, k);
    state.dist = lerp(state.dist, goal.dist, k);
    state.pitch = lerp(state.pitch, goal.pitch, k);
    state.yaw += angleDiff(state.yaw, goal.yaw) * k;
    place();
  }

  // Screen-relative pan in world meters.
  // Moving the map by hand lets go of a followed car.
  const hooks = {};
  function letGo() {
    if (!follow) return;
    follow = null;
    chase = false;
    hooks.unfollow?.();
  }

  function pan(right, forward) {
    letGo();
    const sin = Math.sin(state.yaw);
    const cos = Math.cos(state.yaw);
    goal.x += cos * right - sin * forward;
    goal.z += -sin * right - cos * forward;
    clampGoal();
  }

  // Grab-style pan: applied instantly so the ground sticks to the cursor.
  function shift(dx, dz) {
    letGo();
    goal.x += dx;
    goal.z += dz;
    clampGoal();
    state.x = goal.x;
    state.z = goal.z;
    place();
  }

  function rotate(dYaw, dPitch) {
    goal.yaw += dYaw;
    goal.pitch += dPitch;
    clampGoal();
  }

  function zoom(factor, anchor) {
    const before = goal.dist;
    goal.dist *= factor;
    clampGoal();
    const applied = goal.dist / before;
    if (anchor && applied < 1) {
      goal.x += (anchor.x - goal.x) * (1 - applied) * 0.9;
      goal.z += (anchor.z - goal.z) * (1 - applied) * 0.9;
      clampGoal();
    }
  }

  function reset() {
    Object.assign(goal, CAMERA.start);
  }

  function setFollow(fn, { chase: c = false } = {}) {
    follow = fn;
    chase = !!fn && c;
    if (chase) {
      goal.dist = 26;
      goal.pitch = 0.3;
    } else if (fn && goal.dist > 160) {
      goal.dist = 90;
    }
    clampGoal();
  }

  place();
  return {
    state,
    goal,
    update,
    pan,
    shift,
    rotate,
    zoom,
    reset,
    setFollow,
    hooks,
    get following() {
      return !!follow;
    },
    get chase() {
      return chase;
    },
  };
}

// ---------------------------------------------------------------------------
// Pointer + keyboard input
// ---------------------------------------------------------------------------

function createInput({ canvas, camera, rig, getTool, onCancel, onShortcut }) {
  const raycaster = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  const hit = new THREE.Vector3();
  const pointers = new Map();
  const keys = new Set();
  let drag = null;
  let gesture = null;
  let lastGround = null;

  function groundAt(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    ndc.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    ndc.y = -((clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(ndc, camera);
    if (!raycaster.ray.intersectPlane(plane, hit)) return null;
    // Tools that work with raised roads also get the camera ray.
    return { x: hit.x, z: hit.z, ray: raycaster.ray.clone() };
  }

  function insideCanvas(event) {
    const rect = canvas.getBoundingClientRect();
    return (
      event.clientX >= rect.left &&
      event.clientX <= rect.right &&
      event.clientY >= rect.top &&
      event.clientY <= rect.bottom
    );
  }

  function startGesture() {
    const [a, b] = Array.from(pointers.values());
    gesture = {
      dist: Math.hypot(a.x - b.x, a.y - b.y),
      angle: Math.atan2(b.y - a.y, b.x - a.x),
      mid: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 },
    };
    gesture.ground = groundAt(gesture.mid.x, gesture.mid.y);
  }

  function onPointerDown(event) {
    if (!insideCanvas(event)) return;
    event.preventDefault();
    canvas.setPointerCapture(event.pointerId);
    pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });

    if (pointers.size === 2) {
      if (drag?.kind === 'tool') getTool().cancel?.();
      drag = null;
      startGesture();
      return;
    }
    if (pointers.size > 2) return;

    const ground = groundAt(event.clientX, event.clientY);
    const tool = getTool();

    if (event.button === 1 || (event.button === 0 && event.altKey)) {
      drag = { kind: 'rotate', x: event.clientX, y: event.clientY };
    } else if (event.button === 2) {
      drag = { kind: 'pan', ground, x: event.clientX, y: event.clientY, moved: false };
    } else if (event.button === 0) {
      if (tool.pans) {
        drag = { kind: 'pan', ground, x: event.clientX, y: event.clientY, moved: false, left: true };
      } else {
        drag = { kind: 'tool' };
        if (ground) tool.down?.(ground, event);
      }
    }
  }

  function onPointerMove(event) {
    const tracked = pointers.get(event.pointerId);
    if (tracked) {
      tracked.x = event.clientX;
      tracked.y = event.clientY;
    }

    if (gesture && pointers.size === 2) {
      const [a, b] = Array.from(pointers.values());
      const dist = Math.hypot(a.x - b.x, a.y - b.y);
      const angle = Math.atan2(b.y - a.y, b.x - a.x);
      const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      if (gesture.dist > 0 && dist > 0) rig.zoom(gesture.dist / dist);
      rig.rotate(-angleDiff(gesture.angle, angle), (mid.y - gesture.mid.y) * -0.004);
      const ground = groundAt(mid.x, mid.y);
      if (ground && gesture.ground) rig.shift(gesture.ground.x - ground.x, gesture.ground.z - ground.z);
      gesture.dist = dist;
      gesture.angle = angle;
      gesture.mid = mid;
      gesture.ground = groundAt(mid.x, mid.y);
      return;
    }

    if (drag?.kind === 'rotate') {
      rig.rotate(-(event.clientX - drag.x) * 0.006, (event.clientY - drag.y) * 0.004);
      drag.x = event.clientX;
      drag.y = event.clientY;
      return;
    }

    if (drag?.kind === 'pan') {
      if (Math.hypot(event.clientX - drag.x, event.clientY - drag.y) > 4) drag.moved = true;
      const ground = groundAt(event.clientX, event.clientY);
      if (ground && drag.ground) rig.shift(drag.ground.x - ground.x, drag.ground.z - ground.z);
      drag.ground = groundAt(event.clientX, event.clientY);
      return;
    }

    if (!insideCanvas(event) && !drag) {
      getTool().leave?.();
      lastGround = null;
      return;
    }

    const ground = groundAt(event.clientX, event.clientY);
    lastGround = ground;
    if (ground) getTool().move?.(ground, event, drag?.kind === 'tool');
  }

  function onPointerUp(event) {
    if (!pointers.has(event.pointerId)) return;
    pointers.delete(event.pointerId);
    if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);

    if (gesture) {
      if (pointers.size < 2) gesture = null;
      return;
    }

    const ground = groundAt(event.clientX, event.clientY);
    if (drag?.kind === 'tool') {
      if (ground) getTool().up?.(ground, event);
    } else if (drag?.kind === 'pan' && !drag.moved && !drag.left) {
      getTool().rightClick?.(ground, event);
    }
    drag = null;
  }

  function onPointerCancel(event) {
    pointers.delete(event.pointerId);
    if (drag?.kind === 'tool') getTool().cancel?.();
    drag = null;
    gesture = null;
  }

  function onWheel(event) {
    if (!insideCanvas(event)) return;
    event.preventDefault();
    const factor = Math.exp(clamp(event.deltaY, -200, 200) * 0.0016);
    rig.zoom(factor, groundAt(event.clientX, event.clientY));
  }

  function isTyping(event) {
    const el = event.target;
    return el && (el.tagName === 'INPUT' || el.tagName === 'SELECT' || el.tagName === 'TEXTAREA');
  }

  function onKeyDown(event) {
    if (isTyping(event)) return;
    const key = event.key.toLowerCase();

    if (event.ctrlKey || event.metaKey) {
      if (onShortcut(`ctrl+${key}`, event)) event.preventDefault();
      return;
    }
    if (key === 'escape') {
      onCancel();
      return;
    }
    if (onShortcut(key, event)) {
      event.preventDefault();
      return;
    }
    keys.add(key);
  }

  function onKeyUp(event) {
    keys.delete(event.key.toLowerCase());
  }

  function update(dt) {
    const speed = rig.state.dist * 1.1 * dt;
    let right = 0;
    let forward = 0;
    if (keys.has('w') || keys.has('arrowup')) forward += speed;
    if (keys.has('s') || keys.has('arrowdown')) forward -= speed;
    if (keys.has('d') || keys.has('arrowright')) right += speed;
    if (keys.has('a') || keys.has('arrowleft')) right -= speed;
    if (right || forward) rig.pan(right, forward);
    if (keys.has('q')) rig.rotate(dt * 1.6, 0);
    if (keys.has('e')) rig.rotate(-dt * 1.6, 0);
    if (keys.has('r')) rig.rotate(0, dt * 0.9);
    if (keys.has('f')) rig.rotate(0, -dt * 0.9);
    if (keys.has('=') || keys.has('+')) rig.zoom(1 - dt * 1.5);
    if (keys.has('-') || keys.has('_')) rig.zoom(1 + dt * 1.5);
  }

  canvas.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);
  window.addEventListener('pointercancel', onPointerCancel);
  canvas.addEventListener('wheel', onWheel, { passive: false });
  canvas.addEventListener('contextmenu', (event) => event.preventDefault());
  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('keyup', onKeyUp);
  window.addEventListener('blur', () => keys.clear());

  return {
    update,
    get ground() {
      return lastGround;
    },
  };
}

// ---------------------------------------------------------------------------
// Paint tools mapped onto road building
// ---------------------------------------------------------------------------

function insidePlayArea(points) {
  return points.every((p) => Math.abs(p.x) <= WORLD.half && Math.abs(p.z) <= WORLD.half);
}

function heightLabel(h) {
  if (h > 0) return `bridge +${h} m`;
  if (h < 0) return `tunnel ${h} m`;
  return 'ground';
}

function createTools({ networks, preview, traffic, rig, brush, sound, onCommit, onStatus, onPickColor, onInspect, tooltip }) {
  const brushType = () => ROAD_TYPES[brush.size];
  const net = () => networks[brushType().kind];
  const netOf = (seg) => networks[seg.type.kind];
  const elev = () => (brush.height === 0 ? null : brush.height);
  const oneway = () => brush.oneway && brushType().kind === 'road';
  const snapRadius = () => 3 + rig.state.dist * 0.012;
  const snapAt = (p, options) =>
    p.ray ? net().findSnapRay(p.ray, brush.height, snapRadius(), options) : net().findSnap(p.x, p.z, snapRadius(), options);
  const ANGLE_STEP = Math.PI / 12;

  // Where the cursor meets the plane at the brush height.
  function cursor(p) {
    if (!p.ray) return { x: p.x, z: p.z };
    return rayAtY(p.ray, WORLD.roadY + visibleHeight(brush.height)) ?? { x: p.x, z: p.z };
  }

  function angleSnapped(start, p) {
    const dx = p.x - start.x;
    const dz = p.z - start.z;
    const length = Math.hypot(dx, dz);
    if (length < 0.5) return { x: p.x, z: p.z };
    const ref = start.kind === 'free' ? 0 : net().snapDirection(start);
    const angle = Math.atan2(dz, dx);
    const rel = angleDiff(ref, angle);
    const snapped = Math.round(rel / ANGLE_STEP) * ANGLE_STEP;
    if (Math.abs(rel - snapped) > 0.07) return { x: p.x, z: p.z };
    const a = ref + snapped;
    return { x: start.x + Math.cos(a) * length, z: start.z + Math.sin(a) * length };
  }

  function endPoint(start, p) {
    const snap = snapAt(p, { excludeNode: start.kind === 'node' ? start.node.id : null });
    if (snap.kind !== 'free') return snap;
    const q = angleSnapped(start, snap);
    return { kind: 'free', x: q.x, z: q.z, y: brush.height };
  }

  // Planned height along the stroke, the same way the network will build it.
  function heightFn(start, end) {
    const y0 = start?.y ?? brush.height;
    const y1 = end?.y ?? brush.height;
    const mid = elev();
    return (s, L) => profileHeight(L, y0, y1, mid, s);
  }

  function showPreview(points, valid, start, end) {
    preview.show(points, brushType(), valid, heightFn(start, end));
    const length = polylineLength(points);
    const extra = [];
    if (brush.height !== 0) extra.push(heightLabel(brush.height));
    if (oneway()) extra.push('one-way');
    tooltip.show(`${Math.round(length)} m${extra.length ? ` · ${extra.join(' · ')}` : ''}${valid ? '' : ' - too short'}`);
  }

  function isValid(points) {
    return polylineLength(points) >= ROAD.minLength && insidePlayArea(points);
  }

  function build(points, startSnap, endSnap) {
    if (!isValid(points)) {
      sound.error();
      return 0;
    }
    const created = net().insertRoad(points, {
      type: brushType(),
      color: brush.color,
      startSnap,
      endSnap,
      oneway: oneway(),
      elev: elev(),
    });
    if (created > 0) {
      sound.place();
      onCommit();
    } else {
      sound.error();
    }
    return created;
  }

  function reSnapEnd(end) {
    const snap = net().findSnap(end.x, end.z, 0.5);
    return snap.kind === 'free' ? { kind: 'free', x: end.x, z: end.z, y: end.y ?? brush.height } : snap;
  }

  // ----- Line: click, click, click… (chained like Skylines)
  const line = {
    id: 'line',
    hint: 'Line: click to start a road, click again to build. Right-click or Esc to stop.',
    start: null,
    end: null,
    move(p) {
      if (!this.start) {
        preview.showMarkers([snapAt(p)]);
        return;
      }
      this.end = endPoint(this.start, p);
      const points = [this.start, this.end];
      showPreview(points, isValid(points), this.start, this.end);
      preview.showMarkers([this.start, this.end]);
    },
    down(p) {
      if (!this.start) {
        this.start = snapAt(p);
        sound.click();
        return;
      }
      const end = this.end ?? endPoint(this.start, p);
      if (build([this.start, end], this.start, end) > 0) {
        this.start = reSnapEnd(end);
        this.end = null;
        preview.hide();
        preview.showMarkers([this.start]);
      }
    },
    rightClick() {
      this.cancel();
    },
    cancel() {
      this.start = null;
      this.end = null;
      preview.hide();
      tooltip.hide();
    },
    leave() {
      if (!this.start) preview.hide();
    },
  };

  // ----- Curve: start, bend point, end.
  const curve = {
    id: 'curve',
    hint: 'Curve: click a start, click to bend, click to build. Right-click or Esc to stop.',
    start: null,
    control: null,
    end: null,
    move(p) {
      if (!this.start) {
        preview.showMarkers([snapAt(p)]);
        return;
      }
      if (!this.control) {
        const q = angleSnapped(this.start, cursor(p));
        const points = [this.start, q];
        showPreview(points, true, this.start, null);
        preview.showMarkers([this.start]);
        return;
      }
      this.end = snapAt(p, { excludeNode: this.start.kind === 'node' ? this.start.node.id : null });
      const points = quadraticBezierPoints(this.start, this.control, this.end);
      showPreview(points, isValid(points), this.start, this.end);
      preview.showMarkers([this.start, this.end]);
    },
    down(p) {
      if (!this.start) {
        this.start = snapAt(p);
        sound.click();
        return;
      }
      if (!this.control) {
        this.control = angleSnapped(this.start, cursor(p));
        sound.click();
        return;
      }
      const end = this.end ?? snapAt(p);
      const points = quadraticBezierPoints(this.start, this.control, end);
      if (build(points, this.start, end) > 0) {
        this.start = reSnapEnd(end);
        this.control = null;
        this.end = null;
        preview.hide();
        preview.showMarkers([this.start]);
      }
    },
    rightClick() {
      this.cancel();
    },
    cancel() {
      this.start = null;
      this.control = null;
      this.end = null;
      preview.hide();
      tooltip.hide();
    },
    leave() {
      if (!this.start) preview.hide();
    },
  };

  // ----- Pencil: freehand road.
  const pencil = {
    id: 'pencil',
    hint: 'Pencil: drag to draw a freehand road.',
    drawing: false,
    points: [],
    startSnap: null,
    shaped() {
      const simple = simplifyPolyline(this.points, 0.9);
      return smoothPolyline(simple);
    },
    down(p) {
      this.drawing = true;
      this.startSnap = snapAt(p);
      this.points = [{ x: this.startSnap.x, z: this.startSnap.z }];
    },
    move(p, event, pressed) {
      if (!this.drawing || !pressed) {
        preview.showMarkers([snapAt(p)]);
        return;
      }
      const q = cursor(p);
      const last = this.points[this.points.length - 1];
      if (distance2D(last, q) >= ROAD.minPointDistance) this.points.push(q);
      const pts = this.points.concat([q]);
      const endSnap = snapAt(p);
      showPreview(pts, isValid(pts), this.startSnap, endSnap);
      preview.showMarkers([this.startSnap, endSnap]);
    },
    up(p) {
      if (!this.drawing) return;
      this.drawing = false;
      const q = cursor(p);
      const last = this.points[this.points.length - 1];
      if (distance2D(last, q) > 0.3) this.points.push(q);
      const endSnap = snapAt(p, {
        excludeNode: this.startSnap.kind === 'node' ? this.startSnap.node.id : null,
      });
      if (endSnap.kind !== 'free') this.points[this.points.length - 1] = { x: endSnap.x, z: endSnap.z };
      const points = this.points.length > 2 ? this.shaped() : this.points;
      if (points.length >= 2) build(points, this.startSnap, endSnap);
      this.cancel();
    },
    cancel() {
      this.drawing = false;
      this.points = [];
      preview.hide();
      tooltip.hide();
    },
    leave() {
      if (!this.drawing) preview.hide();
    },
  };

  // Road under the cursor on either network, looked up at its own height.
  function pickAny(p) {
    let best = null;
    for (const n of Object.values(networks)) {
      let hit = null;
      if (p.ray) hit = n.pickSegmentRay(p.ray);
      else {
        const seg = n.pickSegment(p.x, p.z);
        if (seg) hit = { seg, dist: 0 };
      }
      if (hit && (!best || hit.dist < best.dist)) best = hit;
    }
    return best ? best.seg : null;
  }

  function highlight(seg, color) {
    for (const n of Object.values(networks)) n.setHighlight(seg && netOf(seg) === n ? seg : null, color);
  }

  // Hover-a-road tools.
  // Highways to other towns are protected from the eraser and fill.
  function hoverTool(id, hint, tint, onClick, dragApply = false, skipLocked = false) {
    const pick = (p) => {
      const seg = pickAny(p);
      return seg && skipLocked && seg.locked ? null : seg;
    };
    return {
      id,
      hint,
      hovered: null,
      move(p, event, pressed) {
        const seg = pick(p);
        this.hovered = seg;
        highlight(seg, typeof tint === 'function' ? tint() : tint);
        if (dragApply && pressed && seg) onClick(seg);
      },
      down(p) {
        const seg = pick(p);
        if (seg) onClick(seg);
      },
      cancel() {
        highlight(null);
      },
      leave() {
        highlight(null);
      },
    };
  }

  const eraser = hoverTool(
    'eraser',
    'Eraser: click or drag over roads and tracks to bulldoze them.',
    0xff0000,
    (seg) => {
      netOf(seg).removeSegment(seg);
      sound.bulldoze();
      onCommit();
    },
    true,
    true
  );

  const fill = hoverTool(
    'fill',
    'Fill With Color: click a road to repaint its lines and its cars.',
    () => brush.color,
    (seg) => {
      if (seg.color === brush.color) return;
      netOf(seg).repaintSegment(seg, brush.color);
      if (seg.type.kind === 'road') traffic.recolorSegment(seg.id, brush.color);
      sound.paint();
      onCommit();
    },
    false,
    true
  );

  const picker = hoverTool('picker', 'Pick Color: click a road to pick up its paint.', 0xffffff, (seg) => {
    onPickColor(seg.color);
    sound.click();
  });

  const replace = hoverTool(
    'replace',
    'Replace: click a road to swap it for the current brush (size, paint, one-way, height). Click a one-way road again to flip it.',
    0x3a7cff,
    (seg) => {
      const type = brushType();
      if (type.kind !== seg.type.kind) {
        sound.error();
        onStatus(type.kind === 'rail' ? 'Replace: pick a road size to replace roads.' : 'Replace: pick Railway or Metro to replace tracks.');
        return;
      }
      const fresh = netOf(seg).replaceSegment(seg, { type, color: brush.color, oneway: oneway(), elev: elev() });
      if (fresh) {
        sound.place();
        onCommit();
      } else {
        sound.error();
      }
    },
    false,
    true
  );

  // ----- Roundabout: drop a one-way ring on a junction or anywhere.
  const roundabout = {
    id: 'roundabout',
    hint: 'Roundabout: click a junction (or anywhere) to build a roundabout with the current road size and paint.',
    center: null,
    ring(c) {
      const type = brushType();
      const R = outerHalf(type) * 1.4 + 10;
      const pts = [];
      for (let i = 0; i <= 48; i++) {
        const a = (i / 48) * Math.PI * 2;
        pts.push({ x: c.x + Math.cos(a) * R, z: c.z - Math.sin(a) * R });
      }
      return pts;
    },
    move(p) {
      if (brushType().kind !== 'road') {
        tooltip.show('Pick a road size for roundabouts');
        preview.hide();
        return;
      }
      const snap = networks.road.findSnapRay(p.ray, 0, snapRadius());
      this.center = snap;
      const pts = this.ring(snap);
      preview.show(pts, brushType(), insidePlayArea(pts));
      preview.showMarkers([snap]);
      tooltip.show(snap.kind === 'node' ? 'Roundabout on this junction' : 'Roundabout');
    },
    down(p) {
      if (brushType().kind !== 'road') {
        sound.error();
        return;
      }
      const c = this.center ?? networks.road.findSnapRay(p.ray, 0, snapRadius());
      if (!insidePlayArea(this.ring(c))) {
        sound.error();
        return;
      }
      const created = networks.road.addRoundabout(c.x, c.z, { type: brushType(), color: brush.color });
      if (created > 0) {
        sound.place();
        onCommit();
      } else {
        sound.error();
      }
      preview.hide();
    },
    cancel() {
      preview.hide();
      tooltip.hide();
    },
    leave() {
      preview.hide();
      tooltip.hide();
    },
  };

  // ----- Inspect: "What's this?" for cars, buildings and roads.
  const inspect = {
    id: 'inspect',
    hint: "What's This?: click a car to follow it, or a building or road for its details.",
    move(p) {
      onInspect?.(p, 'hover');
    },
    down(p) {
      onInspect?.(p, 'click');
    },
    cancel() {
      onInspect?.(null, 'leave');
    },
    leave() {
      onInspect?.(null, 'leave');
    },
  };

  const hand = {
    id: 'hand',
    hint: 'Hand: drag to move around the map.',
    pans: true,
  };

  const magnifier = {
    id: 'magnifier',
    hint: 'Magnifier: click to zoom in, right-click to zoom out.',
    down(p) {
      rig.zoom(0.55, p);
      sound.click();
    },
    rightClick(p) {
      rig.zoom(1.8, p);
      sound.click();
    },
  };

  const tools = { pencil, line, curve, roundabout, replace, eraser, fill, picker, inspect, hand, magnifier };
  let current = tools.line;

  return {
    tools,
    pickAny,
    get current() {
      return current;
    },
    set(id) {
      if (!tools[id] || current === tools[id]) return;
      current.cancel?.();
      preview.hide();
      tooltip.hide();
      highlight(null);
      current = tools[id];
      onStatus(current.hint);
    },
    cancel() {
      current.cancel?.();
    },
  };
}

// ---------------------------------------------------------------------------
// Sound: tiny synthesized blips, nothing to download
// ---------------------------------------------------------------------------

function createSound() {
  let ctx = null;
  let master = null;
  let enabled = true;
  let unlocked = false;

  // Browsers only allow audio after the first click or key press.
  function ensure() {
    if (!enabled || !unlocked) return null;
    try {
      if (!ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return null;
        ctx = new AudioCtx();
        master = ctx.createGain();
        master.gain.value = 0.16;
        master.connect(ctx.destination);
      }
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    } catch {
      return null;
    }
  }

  function tone(freq, duration, { type = 'square', delay = 0, volume = 1, slide = 0 } = {}) {
    const audio = ensure();
    if (!audio) return;
    const t = audio.currentTime + delay;
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t + duration);
    gain.gain.setValueAtTime(volume, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
    osc.connect(gain).connect(master);
    osc.start(t);
    osc.stop(t + duration + 0.02);
  }

  function noise(duration, { volume = 1, cutoff = 1200 } = {}) {
    const audio = ensure();
    if (!audio) return;
    const length = Math.floor(audio.sampleRate * duration);
    const buffer = audio.createBuffer(1, length, audio.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / length);
    const source = audio.createBufferSource();
    source.buffer = buffer;
    const filter = audio.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = cutoff;
    const gain = audio.createGain();
    gain.gain.value = volume;
    source.connect(filter).connect(gain).connect(master);
    source.start();
  }

  return {
    get enabled() {
      return enabled;
    },
    set enabled(value) {
      enabled = value;
    },
    click: () => tone(1400, 0.025, { volume: 0.5 }),
    place: () => {
      tone(523, 0.07, { volume: 0.7 });
      tone(784, 0.1, { delay: 0.06, volume: 0.7 });
    },
    bulldoze: () => {
      noise(0.3, { volume: 1.4, cutoff: 900 });
      tone(140, 0.25, { type: 'sawtooth', slide: 0.4, volume: 0.5 });
    },
    paint: () => {
      tone(660, 0.05, { type: 'triangle' });
      tone(990, 0.08, { type: 'triangle', delay: 0.05 });
    },
    error: () => tone(196, 0.16, { volume: 0.6 }),
    pop: (volume = 1) => tone(880, 0.05, { type: 'triangle', volume: volume * 0.45, slide: 1.5 }),
    chime: () => {
      tone(659, 0.12, { type: 'triangle', volume: 0.6 });
      tone(880, 0.12, { type: 'triangle', delay: 0.1, volume: 0.6 });
      tone(1319, 0.22, { type: 'triangle', delay: 0.2, volume: 0.5 });
    },
    honk: (volume) => {
      tone(392, 0.16, { volume: volume * 0.5 });
      tone(466, 0.16, { volume: volume * 0.5 });
    },
    unlock: () => {
      unlocked = true;
      ensure();
    },
  };
}

function iconImage(draw) {
  const canvas = document.createElement('canvas');
  canvas.width = 16;
  canvas.height = 16;
  const ctx = canvas.getContext('2d');
  const px = (x, y, c) => {
    ctx.fillStyle = c;
    ctx.fillRect(x, y, 1, 1);
  };
  const rect = (x, y, w, h, c) => {
    ctx.fillStyle = c;
    ctx.fillRect(x, y, w, h);
  };
  const line = (x0, y0, x1, y1, c) => {
    let dx = Math.abs(x1 - x0);
    let dy = -Math.abs(y1 - y0);
    const sx = x0 < x1 ? 1 : -1;
    const sy = y0 < y1 ? 1 : -1;
    let err = dx + dy;
    for (;;) {
      px(x0, y0, c);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * err;
      if (e2 >= dy) {
        err += dy;
        x0 += sx;
      }
      if (e2 <= dx) {
        err += dx;
        y0 += sy;
      }
    }
  };
  draw({ px, rect, line });
  return canvas.toDataURL();
}

function makeDraggable(panel, handle) {
  let dragging = false;
  let startX = 0;
  let startY = 0;
  let startLeft = 0;
  let startTop = 0;
  const dockedPhoneQuery = window.matchMedia('(max-width: 640px) and (orientation: portrait)');
  const isPaintPanel = panel.id === 'paint-panel';

  function clampPosition(left, top) {
    const maxLeft = Math.max(0, window.innerWidth - panel.offsetWidth);
    const maxTop = Math.max(0, window.innerHeight - panel.offsetHeight);
    return { left: clamp(left, 0, maxLeft), top: clamp(top, 0, maxTop) };
  }

  function reflow() {
    if (isPaintPanel && dockedPhoneQuery.matches) {
      panel.style.removeProperty('left');
      panel.style.removeProperty('right');
      panel.style.removeProperty('top');
      return;
    }
    if (!panel.style.left) return;
    const rect = panel.getBoundingClientRect();
    const { left, top } = clampPosition(rect.left, rect.top);
    panel.style.left = `${left}px`;
    if (!panel.classList.contains('paint-panel-minimized')) panel.style.top = `${top}px`;
  }

  function onPointerDown(event) {
    if (event.button !== 0) return;
    if (event.target.closest('.win-titlebar-buttons')) return;
    if (panel.classList.contains('paint-panel-minimized')) return;
    if (isPaintPanel && dockedPhoneQuery.matches) return;
    event.preventDefault();
    const rect = panel.getBoundingClientRect();
    panel.style.right = 'auto';
    panel.style.left = `${rect.left}px`;
    panel.style.top = `${rect.top}px`;
    dragging = true;
    startX = event.clientX;
    startY = event.clientY;
    startLeft = rect.left;
    startTop = rect.top;
    panel.classList.add('win-dragging');
    handle.setPointerCapture(event.pointerId);
  }

  function onPointerMove(event) {
    if (!dragging) return;
    const { left, top } = clampPosition(startLeft + event.clientX - startX, startTop + event.clientY - startY);
    panel.style.left = `${left}px`;
    panel.style.top = `${top}px`;
  }

  function endDrag(event) {
    if (!dragging) return;
    dragging = false;
    panel.classList.remove('win-dragging');
    if (handle.hasPointerCapture(event.pointerId)) handle.releasePointerCapture(event.pointerId);
  }

  handle.addEventListener('pointerdown', onPointerDown);
  handle.addEventListener('pointermove', onPointerMove);
  handle.addEventListener('pointerup', endDrag);
  handle.addEventListener('pointercancel', endDrag);

  return { reflow, isDocked: () => isPaintPanel && dockedPhoneQuery.matches };
}

function openDialog({ id, title, body, width = 320, onClose }) {
  document.getElementById(id)?.remove();
  const dialog = document.createElement('div');
  dialog.className = 'win-window win-dialog';
  dialog.id = id;
  dialog.style.width = `${width}px`;
  dialog.innerHTML = `
    <div class="win-titlebar">
      <span class="win-titlebar-text">${title}</span>
      <span class="win-titlebar-buttons">
        <button type="button" class="win-tb-btn" data-close aria-label="Close">&#215;</button>
      </span>
    </div>
    <div class="win-dialog-body">${body}</div>
  `;
  document.body.appendChild(dialog);
  dialog.style.left = `${Math.max(8, (window.innerWidth - dialog.offsetWidth) / 2)}px`;
  dialog.style.top = `${Math.max(8, (window.innerHeight - dialog.offsetHeight) / 3)}px`;
  makeDraggable(dialog, dialog.querySelector('.win-titlebar'));

  const close = () => {
    dialog.remove();
    onClose?.();
  };
  dialog.querySelector('[data-close]').addEventListener('click', close);
  return { el: dialog, close };
}

function createTooltip() {
  const el = document.createElement('div');
  el.id = 'road-tip';
  el.hidden = true;
  document.body.appendChild(el);
  let x = 0;
  let y = 0;
  window.addEventListener('pointermove', (event) => {
    x = event.clientX;
    y = event.clientY;
    if (!el.hidden) place();
  });
  function place() {
    el.style.left = `${Math.min(window.innerWidth - el.offsetWidth - 4, x + 16)}px`;
    el.style.top = `${Math.min(window.innerHeight - el.offsetHeight - 4, y + 18)}px`;
  }
  return {
    show(text) {
      el.textContent = text;
      el.hidden = false;
      place();
    },
    hide() {
      el.hidden = true;
    },
  };
}

      onSky(swatch.color);
    });
    button.addEventListener('dblclick', () => {
      editing = { swatch, button };
      editor.value = toHex(swatch.color);
      editor.click();
    });
    swatch.button = button;
    swatchContainer.appendChild(button);
  }
  editor.addEventListener('input', () => {
    if (!editing) return;
    const color = parseInt(editor.value.slice(1), 16);
    editing.swatch.color = color;
    editing.button.style.background = editor.value;
    onColor(color);
  });

  function sync() {
    for (const el of toolbox.querySelectorAll('.tool-btn')) {
      el.classList.toggle('active', el.dataset.tool === brush.tool);
    }
    for (const el of sizeBox.querySelectorAll('.size-btn')) {
      el.classList.toggle('active', el.dataset.size === brush.size);
    }
    for (const s of swatches) s.button.classList.toggle('active', s.color === brush.color);
    const rail = ROAD_TYPES[brush.size].kind === 'rail';
    onewayBtn.classList.toggle('active', brush.oneway && !rail);
    onewayBtn.disabled = rail;
    heightVal.textContent = brush.height === 0 ? 'Ground' : brush.height > 0 ? `Bridge +${brush.height} m` : `Tunnel ${brush.height} m`;
    fg.style.background = toHex(brush.color);
    bg.style.background = toHex(sky.color);
    panel.classList.toggle('erasing', brush.tool === 'eraser');
  }

  function setChecks(checks) {
    for (const el of menubar.querySelectorAll('[data-check]')) {
      el.classList.toggle('checked', Boolean(checks[el.dataset.check]));
    }
  }

  sync();
  return { el: panel, sync, setChecks, reflow: drag.reflow };
}

function ledDigit(ch) {
  const on = LED_DIGITS[ch] ?? '';
  const polys = Object.entries(LED_SEGMENTS)
    .map(([key, pts]) => `<polygon points="${pts}" fill="${on.includes(key) ? '#ff0000' : '#3a0000'}"/>`)
    .join('');
  return `<svg viewBox="0 0 13 23" width="13" height="23" aria-hidden="true">${polys}</svg>`;
}

function ledText(value, digits) {
  const max = 10 ** digits - 1;
  const text = String(clamp(Math.round(value), 0, max)).padStart(digits, '0');
  return Array.from(text).map(ledDigit).join('');
}

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}

function statRows(rows) {

}

function fmt(n) {
  return Math.round(n).toLocaleString('en-US');

// Task Manager style history graph: green lines on a black grid.
function drawGraph(canvas, history, series, scroll) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = '#008040';
  ctx.lineWidth = 1;
  const cell = 12;
  const shift = scroll % cell;
  ctx.beginPath();
  for (let x = w - shift; x >= 0; x -= cell) {
    ctx.moveTo(Math.floor(x) + 0.5, 0);
    ctx.lineTo(Math.floor(x) + 0.5, h);
  }
  for (let y = h; y >= 0; y -= cell) {
    ctx.moveTo(0, Math.floor(y) + 0.5);
    ctx.lineTo(w, Math.floor(y) + 0.5);
  }
  ctx.stroke();
  if (history.length < 2) return;
  let max = 1;
  for (const s of series) for (const sample of history) max = Math.max(max, sample[s.key]);
  max *= 1.15;
  const stepX = w / (CITY.historyLength - 1);
  for (const s of series) {
    ctx.strokeStyle = s.color;
    ctx.beginPath();
    history.forEach((sample, i) => {
      const x = w - (history.length - 1 - i) * stepX;
      const y = h - 2 - (sample[s.key] / max) * (h - 4);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.stroke();
  }
  ctx.fillStyle = '#00ff00';
  ctx.font = '10px Tahoma, Verdana, sans-serif';
  ctx.fillText(fmt(max / 1.15), 3, 11);
}

    </div>`;
  document.body.appendChild(el);
  el.querySelector('[data-vc="stop"]').addEventListener('click', onStop);
  el.querySelector('[data-vc="next"]').addEventListener('click', onNext);
  el.querySelector('[data-vc="chase"]').addEventListener('click', onChase);
  return {
    el,
    show(car, info, chase) {
      el.hidden = false;
      const name = { truck: 'Truck', van: 'Van', police: 'Police car', fire: 'Fire engine', ambulance: 'Ambulance', bus: 'Bus' }[car.model] ?? 'Car';
      el.querySelector('#vc-title').textContent = `${name} #${car.id}`;
      el.querySelector('#vc-what').textContent = info.what;
      const rows = [];
      if (info.from) rows.push(['From', info.from]);
      if (info.to) rows.push(['To', info.to]);
      if (info.people) rows.push(['People', String(info.people)]);
      rows.push(['Speed', `${Math.round(Math.abs(car.speed) * 3.6)} km/h`]);
      el.querySelector('#vc-rows').innerHTML = statRows(rows);
      el.querySelector('[data-vc="chase"]').classList.toggle('pressed', chase);
    },
    hide() {
      el.hidden = true;
    },
  };
}

// Picks the car closest to a camera ray.
function carOnRay(cars, ray, radius = 2.6) {
  let best = null;
  let bestT = Infinity;
  const o = ray.origin;
  const d = ray.direction;
  for (const car of cars) {
    const px = car.x - o.x;
    const py = car.y + WORLD.roadY + 0.8 - o.y;
    const pz = car.z - o.z;
    const t = px * d.x + py * d.y + pz * d.z;
    if (t <= 0 || t > bestT) continue;
    const dx = px - d.x * t;
    const dy = py - d.y * t;
    const dz = pz - d.z * t;
    if (dx * dx + dy * dy + dz * dz < radius * radius) {
      best = car;
      bestT = t;
    }
  }
  return best;
}

function describeRoad(seg) {
  const parts = [seg.name || seg.type.name];
  if (seg.name) parts.push(seg.type.name.toLowerCase());
  if (seg.oneway) parts.push('one-way');
  const mid = seg.elev;
  if (mid !== null && mid !== undefined && Math.abs(mid) > 0.5) parts.push(mid > 0 ? `bridge ${Math.round(mid)} m` : `tunnel ${Math.round(-mid)} m down`);
  parts.push(`${Math.round(seg.path.length)} m`);
  return parts.join(', ');
}

function createInspector({ city, traffic, tooltip, pickRoad, onFollow }) {
  let props = null;
  return {
    handle(p, mode) {
      if (!p || mode === 'leave') {
        tooltip.hide();
        return;
      }
      const car = p.ray ? carOnRay(traffic.cars, p.ray) : null;
      const building = !car && p.ray ? city.buildingOnRay(p.ray) : !car ? city.buildingAt(p.x, p.z) : null;
      if (mode === 'click') {
        tooltip.hide();
        if (car) onFollow(car);
        else if (building) props = openBuildingProperties(city, building);
        return;
      }
      if (car) {
        const info = city.describeTrip(car.trip);
        tooltip.show(`${info.what}${info.to ? ` to ${info.to}` : ''}. Click to follow.`);
      } else if (building) {
        tooltip.show(`${city.describe(building)}. Click for details.`);
      } else {
        const seg = pickRoad(p);
        if (seg) tooltip.show(describeRoad(seg));
        else tooltip.hide();
      }
    },
    update() {
      props?.update();
    },
  };
}

// OpenStreetMap import: pick a square on a real map, download it, and turn
// its roads, railways, buildings, parks and water into a Road Paint city.
// ---------------------------------------------------------------------------

const OSM = {
  overpass: ['https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter', 'https://overpass.private.coffee/api/interpreter'],
  nominatim: 'https://nominatim.openstreetmap.org/search',
  photon: 'https://photon.komoot.io/api/',
  tiles: 'https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png?key=cb1_4qxv_1_69ef03ca1b6264055a0b5006',
  // Used if the keyed tiles fail to load.
  tilesFallback: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
  attribution: '© OpenStreetMap contributors © CARTO',
  start: { lat: 52.3731, lon: 4.8925, zoom: 14, size: 1200 },
  minSize: 200,
  maxSize: WORLD.half * 2 - 40,
  maxBuildings: 9000,
  mergeDistance: 4,
};

const M_PER_DEG_LAT = 110574;

function metersPerDegLon(lat) {
  return 111320 * Math.cos((lat * Math.PI) / 180);
}

function selectionBounds(sel, pad = 1) {
  const dLat = ((sel.size / 2) * pad) / M_PER_DEG_LAT;
  const dLon = ((sel.size / 2) * pad) / metersPerDegLon(sel.lat);
  return { south: sel.lat - dLat, north: sel.lat + dLat, west: sel.lon - dLon, east: sel.lon + dLon };
}

function overpassQuery(sel) {
  const b = selectionBounds(sel, 1.04);
  const box = `(${b.south.toFixed(6)},${b.west.toFixed(6)},${b.north.toFixed(6)},${b.east.toFixed(6)})`;
  const roads =
    'motorway|trunk|primary|secondary|tertiary|unclassified|residential|living_street|service|road|motorway_link|trunk_link|primary_link|secondary_link|tertiary_link';
  return `[out:json][timeout:120][maxsize:536870912];
(
  way["highway"~"^(${roads})$"]${box};
  way["railway"~"^(rail|subway|light_rail|narrow_gauge|monorail)$"]${box};
  way["building"]${box};
  relation["building"]${box};
  way["landuse"]${box};
  way["leisure"]${box};
  way["natural"]${box};
  way["waterway"]${box};
  way["amenity"="parking"]${box};
  way["place"="square"]${box};
  relation["type"="multipolygon"]["natural"]${box};
  relation["type"="multipolygon"]["landuse"]${box};
  relation["type"="multipolygon"]["leisure"]${box};
  relation["waterway"="riverbank"]${box};
  node["natural"="tree"]${box};
  node["name"]["shop"]${box};
  node["name"]["amenity"]${box};
  node["name"]["tourism"]${box};
  node["name"]["office"]${box};
  node["railway"~"^(station|halt|subway_entrance)$"]${box};
  node["public_transport"="station"]${box};
  node["place"~"^(city|town)$"](${(b.south - 0.4).toFixed(4)},${(b.west - 0.6).toFixed(4)},${(b.north + 0.4).toFixed(4)},${(b.east + 0.6).toFixed(4)});
);
out body geom qt;`;
}

// Overpass can take a while to prepare a big area. Ask the first server,
// bring in the next one if it stays quiet, and keep whichever answers.
async function fetchOsm(sel, onStatus) {
  const body = `data=${encodeURIComponent(overpassQuery(sel))}`;
  const started = performance.now();
  const seconds = () => Math.round((performance.now() - started) / 1000);
  const errors = [];
  const controllers = [];
  let progress = { host: null, bytes: 0, phase: 'waiting' };
  const timer = setInterval(() => {
    if (progress.phase === 'waiting') onStatus?.(`Waiting for ${progress.host} to gather the map data... ${seconds()} s (big or busy areas can take a minute)`);
    else onStatus?.(`Downloading from ${progress.host}: ${(progress.bytes / 1048576).toFixed(1)} MB... ${seconds()} s`);
  }, 500);

  async function attempt(url) {
    const host = new URL(url).host;
    const controller = new AbortController();
    controllers.push(controller);
    if (!progress.host || progress.phase === 'waiting') progress = { host, bytes: 0, phase: 'waiting' };
    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body,
      signal: controller.signal,
    });
    if (!response.ok) throw new Error(`${host} said ${response.status}${response.status === 429 ? ' (too many requests, wait a minute)' : response.status === 504 ? ' (too busy)' : ''}`);
    progress = { host, bytes: 0, phase: 'reading' };
    // The first server to start sending wins; stop the others.
    for (const other of controllers) if (other !== controller) other.abort();
    const reader = response.body.getReader();
    const chunks = [];
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      progress.bytes += value.length;
    }
    const text = await new Blob(chunks).text();
    const data = JSON.parse(text);
    if (!Array.isArray(data.elements)) throw new Error(`${host} sent no map data`);
    if (data.remark && data.elements.length === 0) throw new Error(`${host}: ${data.remark.slice(0, 120)}`);
    return data;
  }

  try {
    return await new Promise((resolve, reject) => {
      let pending = 0;
      let next = 0;
      let finished = false;
      const launch = () => {
        if (finished || next >= OSM.overpass.length) return;
        const url = OSM.overpass[next++];
        pending++;
        attempt(url).then(
          (data) => {
            if (finished) return;
            finished = true;
            resolve(data);
          },
          (error) => {
            pending--;
            if (error.name !== 'AbortError') {
              console.error('Road Paint download:', url, error);
              errors.push(error.message);
            }
            if (finished) return;
            if (next < OSM.overpass.length) launch();
            else if (pending === 0) {
              finished = true;
              reject(new Error(errors.join('; ') || 'No map server answered'));
            }
          }
        );
      };
      launch();
      // A quiet server gets company after 20 and 45 seconds.
      setTimeout(() => progress.phase === 'waiting' && launch(), 20000);
      setTimeout(() => progress.phase === 'waiting' && launch(), 45000);
      setTimeout(() => {
        if (finished || progress.phase !== 'waiting') return;
        finished = true;
        for (const c of controllers) c.abort();
        reject(new Error(`no server answered in 3 minutes${errors.length ? ` (${errors.join('; ')})` : ''}. Try a smaller square`));
      }, 180000);
    });
  } finally {
    clearInterval(timer);
  }
}

// .osm files saved from openstreetmap.org (Export) or JOSM.
function parseOsmXml(text) {
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  if (doc.querySelector('parsererror')) throw new Error('That file is not valid OSM XML');
  const tagsOf = (el) => {
    const tags = {};
    for (const t of el.getElementsByTagName('tag')) tags[t.getAttribute('k')] = t.getAttribute('v');
    return tags;
  };
  const elements = [];
  const nodePos = new Map();
  for (const n of doc.getElementsByTagName('node')) {
    const id = Number(n.getAttribute('id'));
    const lat = Number(n.getAttribute('lat'));
    const lon = Number(n.getAttribute('lon'));
    nodePos.set(id, { lat, lon });
    elements.push({ type: 'node', id, lat, lon, tags: tagsOf(n) });
  }
  const wayGeom = new Map();
  for (const w of doc.getElementsByTagName('way')) {
    const id = Number(w.getAttribute('id'));
    const nodes = Array.from(w.getElementsByTagName('nd')).map((nd) => Number(nd.getAttribute('ref')));
    const geometry = nodes.map((ref) => nodePos.get(ref) ?? null);
    wayGeom.set(id, geometry);
    elements.push({ type: 'way', id, nodes, geometry, tags: tagsOf(w) });
  }
  for (const r of doc.getElementsByTagName('relation')) {
    const members = Array.from(r.getElementsByTagName('member')).map((m) => {
      const ref = Number(m.getAttribute('ref'));
      const type = m.getAttribute('type');
      return { type, ref, role: m.getAttribute('role'), geometry: type === 'way' ? (wayGeom.get(ref) ?? null) : null };
    });
    elements.push({ type: 'relation', id: Number(r.getAttribute('id')), members, tags: tagsOf(r) });
  }
  let center = null;
  const bounds = doc.getElementsByTagName('bounds')[0];
  if (bounds) {
    const s = Number(bounds.getAttribute('minlat'));
    const n = Number(bounds.getAttribute('maxlat'));
    const w = Number(bounds.getAttribute('minlon'));
    const e = Number(bounds.getAttribute('maxlon'));
    center = { lat: (s + n) / 2, lon: (w + e) / 2, size: Math.min((n - s) * M_PER_DEG_LAT, (e - w) * metersPerDegLon((s + n) / 2)) };
  }
  return { elements, center };
}

// Square that best fits the data when a file brings no bounds of its own.
function dataSelection(data) {
  let s = Infinity;
  let n = -Infinity;
  let w = Infinity;
  let e = -Infinity;
  for (const el of data.elements) {
    if (el.type !== 'node' || el.tags?.place) continue;
    s = Math.min(s, el.lat);
    n = Math.max(n, el.lat);
    w = Math.min(w, el.lon);
    e = Math.max(e, el.lon);
  }
  if (!Number.isFinite(s)) {
    for (const el of data.elements) {
      for (const g of el.geometry ?? []) {
        if (!g) continue;
        s = Math.min(s, g.lat);
        n = Math.max(n, g.lat);
        w = Math.min(w, g.lon);
        e = Math.max(e, g.lon);
      }
    }
  }
  if (!Number.isFinite(s)) return null;
  const lat = (s + n) / 2;
  const size = Math.min((n - s) * M_PER_DEG_LAT, (e - w) * metersPerDegLon(lat));
  return { lat, lon: (w + e) / 2, size: clamp(size, OSM.minSize, OSM.maxSize) };
}

// ----- tag mapping -------------------------------------------------------------

function osmRoadType(tags) {
  const h = tags.highway;
  const lanes = Number.parseInt(tags.lanes, 10) || 0;
  let key = null;
  if (h === 'motorway' || h === 'trunk') key = 'highway';
  else if (h === 'motorway_link' || h === 'trunk_link') key = 'freeway';
  else if (h === 'primary') key = lanes >= 4 ? 'boulevard' : 'large';
  else if (h === 'secondary') key = lanes >= 4 ? 'boulevard' : 'large';
  else if (h === 'primary_link' || h === 'secondary_link') key = 'medium';
  else if (h === 'tertiary' || h === 'tertiary_link') key = 'medium';
  else if (h === 'residential' || h === 'unclassified' || h === 'living_street' || h === 'road') key = 'small';
  else if (h === 'service') {
    if (/parking_aisle|driveway|drive-through/.test(tags.service ?? '')) return null;
    key = 'alley';
  }
  if (!key) return null;
  if (tags.area === 'yes' || tags.access === 'no') return null;
  if (lanes >= 6 && key !== 'highway') key = 'boulevard';
  return key;
}

function osmOneway(tags) {
  const o = tags.oneway;
  if (o === 'no') return 0;
  if (o === '-1' || o === 'reverse') return -1;
  if (o === 'yes' || o === '1' || o === 'true') return 1;
  if (tags.junction === 'roundabout' || tags.junction === 'circular') return 1;
  if (tags.highway === 'motorway' || tags.highway === 'motorway_link') return 1;
  return 0;
}

// One carriageway of a split road is narrower than the whole road.
const ONEWAY_NARROWER = { highway: 'freeway', boulevard: 'large', large: 'medium' };

function osmRailType(tags) {
  const r = tags.railway;
  if (/yard|siding|spur|crossover/.test(tags.service ?? '')) return null;
  if (r === 'subway') return 'metro';
  if (r === 'rail' || r === 'light_rail' || r === 'narrow_gauge' || r === 'monorail') return 'rail';
  return null;
}

const CSS_COLOR_CACHE = new Map();
function cssColor(text, fallback) {
  if (!text) return fallback;
  if (CSS_COLOR_CACHE.has(text)) return CSS_COLOR_CACHE.get(text) ?? fallback;
  const ctx = document.createElement('canvas').getContext('2d');
  ctx.fillStyle = '#010203';
  ctx.fillStyle = text.trim();
  const v = ctx.fillStyle;
  const out = v === '#010203' && text.trim() !== '#010203' ? null : v.startsWith('#') ? Number.parseInt(v.slice(1), 16) : null;
  CSS_COLOR_CACHE.set(text, out);
  return out ?? fallback;
}

const CIVIC_BUILDINGS = {
  church: 'church',
  cathedral: 'church',
  chapel: 'church',

  shrine: 'church',

};

const AMENITY_CIVIC = {
  place_of_worship: 'church',
  school: 'school',

  college: 'university',
  hospital: 'hospital',
