const DEFAULT_SETTINGS = {
  colorMode: 2,
  res: 2,
  shadows: 'hand',
  cityWindow: true,
  dither: true,
  jitter: true,
  affine: true,
  fog: true,
  stretch: true,
  sound: true,
  dayNight: true,
};

function loadSettings() {
  try {
    const saved = JSON.parse(safeStorageGet(STORAGE.settings) ?? 'null');
    return { ...DEFAULT_SETTINGS, ...(saved ?? {}) };
  } catch {
    return { ...DEFAULT_SETTINGS };
  }
}

function showError(message) {
  const el = document.getElementById('error');
  if (el) {
    el.textContent = message;
    el.hidden = false;
  }
}

function initSplash() {
  const splash = document.getElementById('splash');
  if (!splash) return;

  const AUTO_DISMISS_MS = 1200;
  let dismissed = false;
  let autoTimer = null;

  function dismiss() {
    if (dismissed) return;
    dismissed = true;
    clearTimeout(autoTimer);
    splash.classList.add('splash-hide');
    window.removeEventListener('keydown', dismiss);
    setTimeout(() => splash.remove(), 400);
  }

  autoTimer = setTimeout(dismiss, AUTO_DISMISS_MS);
  splash.addEventListener('click', dismiss);
  window.addEventListener('keydown', dismiss);
}

function buildStarterCity(network) {
  const free = (x, z) => ({ kind: 'free', x, z });
  const add = (points, typeKey, color) => {
    const first = points[0];
    const last = points[points.length - 1];
    const startSnap = network.findSnap(first.x, first.z, 1);
    const endSnap = network.findSnap(last.x, last.z, 1);
    network.insertRoad(points, {
      type: ROAD_TYPES[typeKey],
      color,
      startSnap: startSnap.kind === 'free' ? free(first.x, first.z) : startSnap,
      endSnap: endSnap.kind === 'free' ? free(last.x, last.z) : endSnap,
    });
  };

  // The avenue becomes a country road out to the highway from Notepad Springs.
  add([{ x: -170, z: 10 }, { x: 170, z: 10 }], 'large', 0xffff00);
  add([{ x: 170, z: 10 }, { x: WORLD.half - 15, z: 10 }], 'small', 0xffffff);
  add([{ x: 10, z: -130 }, { x: 10, z: 120 }], 'medium', 0xffffff);
  add(quadraticBezierPoints({ x: -90, z: 10 }, { x: -90, z: -80 }, { x: 10, z: -80 }), 'medium', 0xff0000);
  add([{ x: 90, z: 10 }, { x: 90, z: 90 }], 'small', 0x00ffff);
  network.addRoundabout(10, 10, { type: ROAD_TYPES.medium, color: 0xffffff });
}

// The sun's shadow map. Only things on layer 0 cast; everything lit by the
// retro shader receives, drawn as boiling pencil hatching.
function createSunShadows(renderer, scene) {
  const size = 2048;
  const depthTexture = new THREE.DepthTexture(size, size);
  const rt = new THREE.WebGLRenderTarget(size, size, { depthTexture, depthBuffer: true });
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 1, 900);
  camera.layers.set(0);
  const material = createShadowDepthMaterial();
  const matrix = new THREE.Matrix4();

  RETRO_UNIFORMS.uShadowMap.value = depthTexture;

  return {
    render(view, time) {
      const half = clamp(view.dist * 1.25, 70, 700);
      const texel = (half * 2) / size;
      const tx = Math.round(view.x / texel) * texel;
      const tz = Math.round(view.z / texel) * texel;
      const sun = RETRO_UNIFORMS.uSunDir.value;
      camera.left = -half;
      camera.right = half;
      camera.top = half;
      camera.bottom = -half;
      camera.near = 100;
      camera.far = 1100;
      camera.updateProjectionMatrix();
      camera.position.set(tx + sun.x * 600, sun.y * 600, tz + sun.z * 600);
      camera.lookAt(tx, 0, tz);
      camera.updateMatrixWorld();

      scene.overrideMaterial = material;
      renderer.setRenderTarget(rt);
      renderer.clear();
      renderer.render(scene, camera);
      scene.overrideMaterial = null;

      matrix.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
      RETRO_UNIFORMS.uShadowMatrix.value.copy(matrix);
      // Redraw the hatching about six times a second.
      RETRO_UNIFORMS.uBoil.value = Math.floor(time * 6) % 64;
    },
  };
}

function start() {
  initSplash();

  let settings = loadSettings();
  initTextures();

  const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
  renderer.setPixelRatio(1);
  renderer.info.autoReset = false;
  renderer.domElement.id = 'game';
  document.body.appendChild(renderer.domElement);

  const target = new THREE.WebGLRenderTarget(640, 480, {
    minFilter: THREE.NearestFilter,
    magFilter: THREE.NearestFilter,
    depthBuffer: true,
    stencilBuffer: true,
  });
  const palette = createPalettePass();

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(CAMERA.fov, 4 / 3, 2, SKY.radius * 1.5);
  camera.layers.enable(NO_SHADOW_LAYER);
  const events = createEvents();

  const sky = buildSkyDome();
  scene.add(sky.mesh);
  scene.add(buildGround());
  let fence = buildPlayAreaBorder();
  scene.add(fence);
  const scenery = createScenery(scene);
  const network = createRoadNetwork(scene, { scenery });
  const rails = createRoadNetwork(scene, { scenery, kind: 'rail' });
  const networks = { road: network, rail: rails };
  const preview = createRoadPreview(scene);
  const traffic = createTraffic(scene, network, scenery, events);
  const city = createCity({ scene, network, rails, traffic, scenery, events });
  const mapLayer = createMapLayer(scene, scenery);
  const trains = createTrains(scene, rails, events);
  const shadows = createSunShadows(renderer, scene);
  const rig = createCameraRig(camera);
  const sound = createSound();
  const tooltip = createTooltip();

  const brush = { color: DEFAULT_PAINT, size: 'medium', tool: 'line', oneway: false, height: 0 };
  const skyState = { color: SKY.top };
  const daylight = { night: 0, dusk: 0, lastSky: '' };
  let speed = 1;
  let lastSpeed = 1;
  let coolUntil = 0;
  let screenshotRequested = false;

  function setSky(color) {
    skyState.color = color;
    const top = new THREE.Color(color);
    const horizon = top.clone().lerp(new THREE.Color(0xffffff), 0.55);
    sky.setColors(top.getHex(), horizon.getHex());
    RETRO_UNIFORMS.uFogColor.value.copy(horizon);
    daylight.lastSky = '';
  }
  setSky(SKY.top);

  // ----- history + persistence ------------------------------------------------

  const history = { stack: [], index: -1 };
  let saveTimer = null;

  // Undo history holds roads and tracks; the saved city also keeps buildings.
  function snapshot() {
    return JSON.stringify({ roads: network.serialize(), rails: rails.serialize() });
  }

  function saveCity() {
    safeStorageSet(
      STORAGE.city,
      JSON.stringify({ v: 3, roads: network.serialize(), rails: rails.serialize(), city: city.serialize(), map: mapLayer.serialize() })
    );
  }

  function loadCity(json) {
    const data = JSON.parse(json);
    if (data && (data.v === 2 || data.v === 3)) {
      network.load(data.roads);
      rails.load(data.rails ?? null);
      scenery.restore();
      city.load(data.city);
      mapLayer.load(data.map ?? null, network);
      trains.reset(mapLayer.data?.stations ?? []);
    } else {
      network.load(data);
      rails.clear();
      city.reset();
    }
  }

  function commit() {
    history.stack = history.stack.slice(0, history.index + 1);
    history.stack.push(snapshot());
    if (history.stack.length > 60) history.stack.shift();
    history.index = history.stack.length - 1;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveCity, 400);
  }

  function restore(json) {
    tools.cancel();
    traffic.clear();
    const data = JSON.parse(json);
    network.load(data.roads);
    rails.load(data.rails);
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveCity, 400);
  }

  function undo() {
    if (history.index <= 0) {
      sound.error();
      return;
    }
    history.index--;
    restore(history.stack[history.index]);
    sound.click();
  }

  function redo() {
    if (history.index >= history.stack.length - 1) {
      sound.error();
      return;
    }
    history.index++;
    restore(history.stack[history.index]);
    sound.click();
  }

  // ----- UI -----------------------------------------------------------------

  const statusBar = buildStatusBar();

  const tools = createTools({
    networks,
    preview,
    traffic,
    rig,
    brush,
    sound,
    tooltip,
    onCommit: commit,
    onStatus: (text) => statusBar.setHelp(text),
    onPickColor(color) {
      brush.color = color;
      setTool(previousTool);
      paintWindow.sync();
    },
    onInspect: (p, mode) => inspector.handle(p, mode),
  });

  let previousTool = 'line';
  function setTool(id) {
    if (id !== 'picker' && id !== brush.tool) previousTool = brush.tool === 'picker' ? previousTool : brush.tool;
    if (id === 'picker' && brush.tool !== 'picker') previousTool = brush.tool;
    brush.tool = id;
    tools.set(id);
    renderer.domElement.dataset.tool = id;
    paintWindow?.sync();
  }

  const paintWindow = buildPaintWindow({
    brush,
    sky: skyState,
    onTool(id) {
      setTool(id);
      sound.click();
    },
    onSize(size) {
      setSize(size);
      sound.click();
    },
    onOneway() {
      toggleOneway();
      sound.click();
    },
    onHeight(delta) {
      stepHeight(delta);
      sound.click();
    },
    onColor(color) {
      brush.color = color;
      paintWindow.sync();
    },
    onSky(color) {
      setSky(color);
      paintWindow.sync();
    },
    onMenu: runAction,
  });

  // Metro brushes start underground; switching back returns to the ground.
  function setSize(size) {
    const before = ROAD_TYPES[brush.size];
    const after = ROAD_TYPES[size];
    if (!after) return;
    if (before.defaultHeight !== undefined && brush.height === before.defaultHeight) brush.height = 0;
    if (after.defaultHeight !== undefined && brush.height === 0) brush.height = after.defaultHeight;
    brush.size = size;
    paintWindow.sync();
    statusBar.setHelp(`${after.name}${brush.height ? `, ${heightLabel(brush.height)}` : ''}${brush.oneway && after.kind === 'road' ? ', one-way' : ''}`);
  }

  function toggleOneway() {
    brush.oneway = !brush.oneway;
    paintWindow.sync();
    statusBar.setHelp(brush.oneway ? 'One-way roads: they run the way you draw them.' : 'Two-way roads.');
  }

  function stepHeight(delta) {
    let i = HEIGHT_LEVELS.indexOf(brush.height);
    if (i === -1) i = HEIGHT_LEVELS.indexOf(0);
    brush.height = HEIGHT_LEVELS[clamp(i + delta, 0, HEIGHT_LEVELS.length - 1)];
    paintWindow.sync();
    statusBar.setHelp(`Height: ${heightLabel(brush.height)}. Roads only join others at about the same height.`);
  }

  function refreshChecks() {
    paintWindow.setChecks({
      pause: speed === 0,
      sound: settings.sound,
      cityWindow: settings.cityWindow,
      debug: debug.visible,
      stats: !!statsWindow,
      night: settings.dayNight,
    });
  }

  function setSpeed(value) {
    if (value > 0) lastSpeed = value;
    speed = value;
    refreshChecks();
  }

  const cityPanel = buildCityPanel({
    onSpeed(value) {
      setSpeed(value);
      sound.click();
    },
    onFace: () => runAction('pause'),
  });
  const balloons = createBalloons();
  const debug = createDebugOverlay();

  // ----- What's This?, following cars and statistics -----------------------------

  let followed = null;
  const vehicleCard = buildVehicleCard({
    onNext: () => followNext(),
    onStop: () => stopFollowing(),
    onChase: () => {
      if (followed) followCar(followed, !rig.chase);
    },
  });

  function followCar(car, chase = rig.chase) {
    followed = car;
    rig.setFollow(() => (traffic.cars.has(car) ? car : null), { chase });
    vehicleCard.show(car, city.describeTrip(car.trip), rig.chase);
    statusBar.setHelp('Following a car. Tab: next car, V: chase cam, Esc or drag the map to stop.');
  }

  function stopFollowing() {
    if (rig.following) rig.setFollow(null);
    followed = null;
    vehicleCard.hide();
  }
  rig.hooks.unfollow = () => {
    // The car reached its destination or the map was moved.
    followed = null;
    vehicleCard.hide();
  };

  // Next car: prefers ones on real trips, closest to the view first.
  function followNext() {
    let best = null;
    let bestScore = Infinity;
    for (const car of traffic.cars) {
      if (car === followed || car.dying) continue;
      const d = Math.hypot(car.x - rig.state.x, car.z - rig.state.z) + (car.trip ? 0 : 400) + Math.random() * 60;
      if (d < bestScore) {
        bestScore = d;
        best = car;
      }
    }
    if (best) followCar(best);
    else sound.error();
  }

  const inspector = createInspector({
    city,
    traffic,
    tooltip,
    pickRoad: (p) => tools.pickAny(p),
    onFollow: (car) => followCar(car),
  });

  let statsWindow = null;
  function toggleStats() {
    if (statsWindow) {
      statsWindow.close();
      return;
    }
    statsWindow = openStatisticsWindow({
      city,
      traffic,
      network,
      rails,
      onClose: () => {
        statsWindow = null;
        refreshChecks();
      },
    });
    refreshChecks();
  }

  // ----- day and night -------------------------------------------------------------

  const LIGHT = {
    dir: RETRO_UNIFORMS.uSunDir.value.clone(),
    sun: RETRO_UNIFORMS.uSunColor.value.clone(),
    sky: RETRO_UNIFORMS.uSkyAmb.value.clone(),
    ground: RETRO_UNIFORMS.uGroundAmb.value.clone(),
    moon: new THREE.Color(0.16, 0.18, 0.3),
    nightSky: new THREE.Color(0.13, 0.15, 0.26),
    nightGround: new THREE.Color(0.06, 0.06, 0.09),
    dusk: new THREE.Color(0.95, 0.52, 0.3),
    nightTop: new THREE.Color(0x0a0e2a),
    nightHorizon: new THREE.Color(0x1c2448),
    duskHorizon: new THREE.Color(0xf09060),
  };

  function applyDaylight() {
    const h = city.hour;
    let night = 0;
    let dusk = 0;
    if (settings.dayNight) {
      if (h < 5 || h >= 21) night = 1;
      else if (h < 7) night = 1 - smooth01((h - 5) / 2);
      else if (h >= 19) night = smooth01((h - 19) / 2);
      dusk = Math.max(0, 1 - Math.abs(h - 6.3) / 1.3, 1 - Math.abs(h - 19.7) / 1.3);
    }
    daylight.night = night;
    daylight.dusk = dusk;
    const u = RETRO_UNIFORMS;
    if (settings.dayNight && night < 1) {
      // The sun rises in the east (+x) and sets in the west.
      const a = clamp((h - 6) / 14, 0, 1) * Math.PI;
      u.uSunDir.value.set(Math.cos(a) * 0.85, Math.max(0.28, Math.sin(a)), 0.38).normalize();
    } else {
      u.uSunDir.value.copy(settings.dayNight ? new THREE.Vector3(0.3, 0.85, -0.35).normalize() : LIGHT.dir);
    }
    u.uSunColor.value.copy(LIGHT.sun).lerp(LIGHT.dusk, dusk * 0.6).lerp(LIGHT.moon, night);
    u.uSkyAmb.value.copy(LIGHT.sky).lerp(LIGHT.nightSky, night);
    u.uGroundAmb.value.copy(LIGHT.ground).lerp(LIGHT.nightGround, night);
    u.uNight.value = smooth01((night - 0.15) / 0.6);

    const top = new THREE.Color(skyState.color);
    const horizon = top.clone().lerp(new THREE.Color(0xffffff), 0.55).lerp(LIGHT.duskHorizon, dusk * 0.7);
    top.lerp(LIGHT.nightTop, night);
    horizon.lerp(LIGHT.nightHorizon, night);
    const key = `${top.getHexString()}${horizon.getHexString()}`;
    if (key !== daylight.lastSky) {
      daylight.lastSky = key;
      sky.setColors(top.getHex(), horizon.getHex());
      u.uFogColor.value.copy(horizon);
    }
  }

  function openDisplayProperties() {
    const before = { ...settings };
    const dialog = openDialog({
      id: 'display-properties',
      title: 'Display Properties',
      width: 340,
      body: displayPropertiesBody(settings),
    });
    const el = dialog.el;
    const resLabel = el.querySelector('#dp-res-label');
    const colorbar = el.querySelector('#dp-colorbar');

    function syncLabels() {
      const res = RENDER_SIZES[settings.res];
      resLabel.textContent = `${target.width} by ${target.height} pixels (${res.label})`;
      colorbar.dataset.mode = String(settings.colorMode);
    }

    el.querySelector('#dp-colors').addEventListener('change', (event) => {
      settings.colorMode = Number(event.target.value);
      applySettings();
      syncLabels();
    });
    el.querySelector('#dp-res').addEventListener('input', (event) => {
      settings.res = Number(event.target.value);
      applySettings();
      syncLabels();
    });
    el.querySelector('#dp-shadows').addEventListener('change', (event) => {
      settings.shadows = event.target.value;
      applySettings();
    });
    for (const box of el.querySelectorAll('[data-setting]')) {
      box.addEventListener('change', () => {
        settings[box.dataset.setting] = box.checked;
        applySettings();
      });
    }
    el.querySelector('[data-dp="ok"]').addEventListener('click', () => {
      applySettings();
      dialog.close();
    });
    el.querySelector('[data-dp="apply"]').addEventListener('click', applySettings);
    el.querySelector('[data-dp="cancel"]').addEventListener('click', () => {
      settings = before;
      applySettings();
      dialog.close();
    });
    syncLabels();
  }

  function openSimpleDialog(id, title, body, width) {
    const dialog = openDialog({ id, title, body, width });
    dialog.el.querySelector('[data-close-btn]')?.addEventListener('click', dialog.close);
  }

  function runAction(action) {
    sound.click();
    switch (action) {
      case 'new':
      case 'clear':
        tools.cancel();
        traffic.clear();
        network.clear();
        rails.clear();
        mapLayer.clear();
        trains.reset([]);
        scenery.restore();
        city.reset();
        commit();
        break;
      case 'osm':
        tools.cancel();
        openOsmWindow({ onImport: importMap, initial: mapLayer.data?.sel ?? null });
        break;
      case 'open': {
        const saved = safeStorageGet(STORAGE.city);
        if (saved) {
          tools.cancel();
          traffic.clear();
          loadCity(saved);
          commit();
        } else {
          sound.error();
        }
        break;
      }
      case 'save':
        saveCity();
        statusBar.setHelp('City saved.');
        break;
      case 'picture':
        screenshotRequested = true;
        break;
      case 'undo':
        undo();
        break;
      case 'redo':
        redo();
        break;
      case 'display':
        openDisplayProperties();
        break;
      case 'reset-view':
        rig.reset();
        break;
      case 'pause':
        setSpeed(speed === 0 ? lastSpeed : 0);
        break;
      case 'city-window':
        settings.cityWindow = !settings.cityWindow;
        applySettings();
        break;
      case 'stats':
        toggleStats();
        break;
      case 'night':
        settings.dayNight = !settings.dayNight;
        applySettings();
        break;
      case 'debug':
        debug.toggle();
        refreshChecks();
        break;
      case 'sound':
        settings.sound = !settings.sound;
        applySettings();
        break;
      case 'controls':
        openSimpleDialog('help-topics', 'Road Paint Help', CONTROLS_HTML, 420);
        break;
      case 'about':
        openSimpleDialog('about-dialog', 'About Road Paint', ABOUT_HTML, 300);
        break;
      default:
        break;
    }
  }

  const KEY_TOOLS = {
    p: 'pencil',
    l: 'line',
    c: 'curve',
    u: 'roundabout',
    g: 'replace',
    x: 'eraser',
    b: 'fill',
    k: 'picker',
    i: 'inspect',
    h: 'hand',
    m: 'magnifier',
  };
  const KEY_SIZES = {};
  Object.values(ROAD_TYPES)
    .filter((type) => !type.hidden)
    .forEach((type, i) => {
      KEY_SIZES[i + 1] = type.key;
    });

  function onShortcut(key) {
    if (key === 'ctrl+z') return undo(), true;
    if (key === 'ctrl+y') return redo(), true;
    if (key === 'ctrl+s') return runAction('save'), true;
    if (key === 'ctrl+o') return runAction('open'), true;
    if (key === 'ctrl+n') return runAction('new'), true;
    if (key === 'ctrl+m') return runAction('osm'), true;
    if (key.startsWith('ctrl+')) return false;
    if (KEY_TOOLS[key]) {
      setTool(KEY_TOOLS[key]);
      return true;
    }
    if (KEY_SIZES[key]) {
      setSize(KEY_SIZES[key]);
      return true;
    }
    if (key === 'o') return toggleOneway(), true;
    if (key === 'pageup' || key === ']') return stepHeight(1), true;
    if (key === 'pagedown' || key === '[') return stepHeight(-1), true;
    if (key === ' ') return runAction('pause'), true;
    if (key === '`') return runAction('debug'), true;
    if (key === ',' || key === '.') {
      const order = [0, 1, 2, 4];
      const i = clamp(order.indexOf(speed) + (key === '.' ? 1 : -1), 0, order.length - 1);
      setSpeed(order[i]);
      return true;
    }
    if (key === 'home') return rig.reset(), true;
    if (key === 'f1') return runAction('controls'), true;
    if (key === 'f2') return runAction('stats'), true;
    if (key === 'tab') return followNext(), true;
    if (key === 'v' && followed) return followCar(followed, !rig.chase), true;
    return false;
  }

  const input = createInput({
    canvas: renderer.domElement,
    camera,
    rig,
    getTool: () => tools.current,
    onCancel: () => {
      if (followed) stopFollowing();
      tools.cancel();
    },
    onShortcut,
  });

  // ----- display settings ---------------------------------------------------

  const dockedQuery = window.matchMedia('(max-width: 640px) and (orientation: portrait)');

  function layout() {
    const docked = dockedQuery.matches;
    const availW = window.innerWidth;
    let availH = Math.max(1, window.innerHeight - statusBar.el.offsetHeight);
    // Phones keep the game above the docked Paint window and fill the space.
    if (docked) availH = Math.max(120, paintWindow.el.getBoundingClientRect().top - 4);
    const res = RENDER_SIZES[settings.res] ?? RENDER_SIZES[2];
    const h = res.h;
    const w = settings.stretch || docked ? Math.max(1, Math.round((h * availW) / availH)) : Math.round((h * 4) / 3);

    renderer.setSize(w, h, false);
    target.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();

    // Higher qualities keep the 480-line look of the jitter, dither and
    // pencil hatching; they just get sharper edges.
    const quality = h / 480;
    RETRO_UNIFORMS.uSnap.value.set(w / 2, h / 2).divideScalar(Math.max(1, quality));
    RETRO_UNIFORMS.uPixel.value = Math.max(1, Math.round(quality));
    RETRO_UNIFORMS.uHatchScale.value = Math.max(1, quality);

    const scale = Math.min(availW / w, availH / h);
    const cssW = Math.round(w * scale);
    const cssH = Math.round(h * scale);
    const style = renderer.domElement.style;
    style.width = `${cssW}px`;
    style.height = `${cssH}px`;
    style.left = `${Math.round((availW - cssW) / 2)}px`;
    style.top = `${docked ? 0 : Math.round((availH - cssH) / 2)}px`;
    style.imageRendering = w >= cssW * window.devicePixelRatio ? 'auto' : '';
    paintWindow.reflow();
    cityPanel.reflow();
  }

  function applySettings() {
    palette.material.uniforms.uMode.value = settings.colorMode;
    palette.material.uniforms.uDither.value = settings.dither ? 1 : 0;
    RETRO_UNIFORMS.uSnapOn.value = settings.jitter ? 1 : 0;
    RETRO_UNIFORMS.uAffine.value = settings.affine ? 1 : 0;
    RETRO_UNIFORMS.uFogOn.value = settings.fog ? 1 : 0;
    if (!SHADOW_MODES.some((mode) => mode.key === settings.shadows)) settings.shadows = 'hand';
    RETRO_UNIFORMS.uShadowOn.value = settings.shadows === 'hand' ? 1 : 0;
    scenery.setBlobsVisible(settings.shadows === 'blob');
    traffic.setBlobsVisible(settings.shadows === 'blob');
    cityPanel.el.classList.toggle('city-hidden', !settings.cityWindow);
    sound.enabled = settings.sound;
    layout();
    refreshChecks();
    safeStorageSet(STORAGE.settings, JSON.stringify(settings));
  }

  applySettings();
  window.addEventListener('resize', layout, { passive: true });
  new ResizeObserver(() => {
    if (dockedQuery.matches) layout();
  }).observe(paintWindow.el);
  window.visualViewport?.addEventListener('resize', layout, { passive: true });
  window.addEventListener('pointerdown', () => sound.unlock(), { once: true });
  window.addEventListener('keydown', () => sound.unlock(), { once: true });

  traffic.hooks.honk = (x, z) => {
    if (Math.random() > 0.3) return;
    const d = Math.hypot(x - rig.state.x, z - rig.state.z) + rig.state.dist * 0.5;
    const volume = clamp(1 - d / 300, 0, 1);
    if (volume > 0.05) sound.honk(volume);
  };

  function soundNear(x, z, play) {
    const d = Math.hypot(x - rig.state.x, z - rig.state.z) + rig.state.dist * 0.5;
    const volume = clamp(1 - d / 300, 0, 1);
    if (volume > 0.05) play(volume);
  }

  events.on('notify', (note) => {
    balloons.show(note);
    sound.chime();
  });
  events.on('milestone', (m) => {
    if (m.pop > 0) coolUntil = performance.now() + 4000;
  });
  // Imported maps bring their own highways out of town.
  events.on('towns:changed', () => {
    scene.remove(fence);
    fence.geometry.dispose();
    fence = buildPlayAreaBorder();
    scene.add(fence);
  });
  events.on('building:spawned', (b) => soundNear(b.x, b.z, (v) => sound.pop(v)));
  events.on('building:demolished', (b) => soundNear(b.x, b.z, () => sound.bulldoze()));

  // ----- city -----------------------------------------------------------------

  const saved = safeStorageGet(STORAGE.city);
  let loaded = false;
  if (saved) {
    try {
      loadCity(saved);
      loaded = true;
    } catch {
      network.clear();
      city.reset();
    }
  }
  if (!loaded) {
    buildStarterCity(network);
    city.seed(6);
  }
  commit();
  setTool('line');
  statusBar.setHelp(tools.current.hint);

  // A fresh city from OpenStreetMap data (see convertOsm).
  function importMap(result) {
    tools.cancel();
    stopFollowing();
    traffic.clear();
    network.clear();
    rails.clear();
    mapLayer.clear();
    scenery.restore();
    scenery.clearSquare(result.sel.size / 2 + 10);
    const graph = (g) => ({
      nodes: g.nodes,
      segs: g.segs.map((seg) => ({ ...seg, type: ROAD_TYPES[seg.typeKey] })),
      islands: [],
    });
    network.importGraph({ ...graph(result.roads), islands: result.islands }, { clearScenery: false });
    rails.importGraph(graph(result.rails), { clearScenery: false });
    city.importMap({
      buildings: result.buildings,
      towns: result.towns.length ? result.towns : OUTSIDE_TOWNS,
      spawning: !!result.grow,
      name: result.name,
    });
    mapLayer.build(
      { sel: result.sel, areas: result.areas, trees: result.trees, stations: result.stations },
      network
    );
    trains.reset(result.stations);
    history.stack = [];
    history.index = -1;
    commit();
    saveCity();
    rig.reset();
    rig.goal.x = 0;
    rig.goal.z = 0;
    rig.goal.dist = Math.min(CAMERA.maxDist, result.sel.size * 0.45);
    rig.goal.pitch = 0.75;
    statusBar.setHelp(
      `Imported ${result.name ?? 'the map'}: ${result.roads.segs.length} roads, ${result.buildings.length} buildings, ${result.towns.length} roads out of town.`
    );
  }

  // ----- loop -----------------------------------------------------------------

  const TICK = 1 / 60;
  let lastTime = performance.now();
  let statusTimer = 0;
  let saveClock = 0;
  let tickAccumulator = 0;
  let fps = 60;
  let tickMs = 0;
  let statsSlow = 0;

  function savePicture() {
    renderer.domElement.toBlob((blob) => {
      if (!blob) return;
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'roadpaint.png';
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });
  }

  function frame() {
    if (document.hidden) {
      lastTime = performance.now();
      return;
    }
    const now = performance.now();
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;

    input.update(dt);
    rig.update(dt);
    sky.mesh.position.copy(camera.position);
    RETRO_UNIFORMS.uFogNear.value = rig.state.dist * 1.4 + 220;
    RETRO_UNIFORMS.uFogFar.value = RETRO_UNIFORMS.uFogNear.value + 1100;

    scenery.update(dt);

    // Fixed-rate simulation so game rules behave the same at any frame rate.
    const simStart = performance.now();
    tickAccumulator += dt * speed;
    let ticks = 0;
    const maxTicks = speed * 4 + 2;
    while (tickAccumulator >= TICK && ticks < maxTicks) {
      traffic.step(TICK);
      trains.step(TICK);
      city.step(TICK);
      tickAccumulator -= TICK;
      ticks++;
    }
    if (ticks >= maxTicks) tickAccumulator = 0;
    tickMs = lerp(tickMs, performance.now() - simStart, 0.1);
    fps = lerp(fps, 1 / Math.max(dt, 1e-3), 0.05);

    traffic.render();
    trains.render();
    city.update(dt, now / 1000);
    applyDaylight();

    renderer.info.reset();
    if (settings.shadows === 'hand') shadows.render(rig.state, now / 1000);

    renderer.setRenderTarget(target);
    renderer.render(scene, camera);
    renderer.setRenderTarget(null);
    palette.material.uniforms.tDiffuse.value = target.texture;
    renderer.render(palette.scene, palette.camera);

    if (screenshotRequested) {
      screenshotRequested = false;
      savePicture();
    }

    saveClock += dt;
    if (saveClock > 20) {
      saveClock = 0;
      saveCity();
    }

    statusTimer -= dt;
    if (statusTimer <= 0) {
      statusTimer = 0.25;
      const st = city.stats();
      statusBar.setStats({
        ground: input.ground,
        cars: traffic.count,
        length: network.totalLength(),
        trips: st.trips,
        inbound: st.inbound,
        outbound: st.outbound,
      });
      let mood = 'happy';
      if (speed === 0) mood = 'sleep';
      else if (now < coolUntil) mood = 'cool';
      else if (st.unconnected > 0) mood = 'worried';
      cityPanel.update({ carCount: traffic.count, population: st.population, mood, speed, dayNumber: `${st.day}  ${st.clock}` });
      if (followed && traffic.cars.has(followed)) vehicleCard.show(followed, city.describeTrip(followed.trip), rig.chase);
      statsSlow = (statsSlow + 1) % 2;
      if (statsWindow && statsSlow === 0) statsWindow.update();
      if (statsSlow === 0) inspector.update();
      debug.set(
        [
          `fps        ${fps.toFixed(0)}`,
          `sim        ${tickMs.toFixed(2)} ms  x${speed}`,
          `render     ${target.width}x${target.height}  ${renderer.info.render.calls} calls  ${renderer.info.render.triangles} tris`,
          `cars       ${traffic.count} (${traffic.tripCount} on trips)`,
          `buildings  ${st.buildings} (${st.houses} homes, ${st.businesses} business, ${st.civic} civic)`,
          `unlinked   ${st.unconnected}`,
          `people     ${st.population}`,
          `roads      ${network.segments.size} segs  ${network.nodes.size} nodes  v${network.version}  ${network.meshCount} meshes`,
          `rails      ${rails.segments.size} segs  ${rails.nodes.size} nodes  ${rails.meshCount} meshes  ${trains.trains.length} trains  ${trains.stations.length} stations`,
          `trips      ${st.trips} done  in ${st.inbound}  out ${st.outbound}`,
          `day        ${st.day}  t=${city.state.time.toFixed(0)}s`,
        ].join('\n')
      );
    }
  }

  window.addEventListener('pagehide', saveCity);
  renderer.setAnimationLoop(frame);
  window.roadPaint = {
    types: ROAD_TYPES,
    textures: TEXTURES,
    camera,
    canvas: renderer.domElement,
    // Screen position of a world point, for tests and tutorials.
    project(x, y, z) {
      const v = new THREE.Vector3(x, y, z).project(camera);
      const rect = renderer.domElement.getBoundingClientRect();
      return [rect.left + ((v.x + 1) / 2) * rect.width, rect.top + ((1 - v.y) / 2) * rect.height];
    },
    scene,
    network,
    rails,
    traffic,
    trains,
    city,
    events,
    rig,
    brush,
    tools,
    settings: () => settings,
    runAction,
    setTool,
    setSpeed,
    setSize,
    stepHeight,
    toggleOneway,
    // Imports Overpass-style JSON directly (tests, or data from elsewhere).
    importOsmData(data, sel, opts = {}) {
      const result = convertOsm(data, sel, opts);
      result.name = opts.name ?? null;
      result.grow = !!opts.grow;
      importMap(result);
      return { roads: result.roads.segs.length, rails: result.rails.segs.length, buildings: result.buildings.length, towns: result.towns.map((t) => t.name), areas: result.areas.length, trees: result.trees.length };
    },
    openOsm: () => runAction('osm'),
    convertOsm,
    followCar,
    followNext,
    stopFollowing,
    toggleStats,
  };
}

try {
  start();
} catch (error) {
  console.error(error);
  showError(`Road Paint could not start: ${error.message}`);
}

  </script>
</body>
</html>
